# KronoQR — configuracion de gitleaks (doc 02 §9.2, RS-10).
#
# Extiende el conjunto de reglas por defecto de gitleaks (patrones de claves de
# proveedores conocidos, tokens JWT, claves privadas, etc.) y anade una
# allowlist MINIMA, cada entrada con su motivo.
#
#   make secrets-scan
#   gitleaks git --config .gitleaks.toml -v .
#
# Regla de admision de la allowlist, la misma que la de infra/docker/.trivyignore.yaml:
# solo entra lo que se ha comprobado UNO A UNO que no es un secreto real. Nunca
# una ruta entera "por si acaso": eso convertiria la allowlist en un agujero
# donde esconder el proximo secreto de verdad. Por el mismo motivo, esta
# allowlist NO perdona rutas (`backend/tests/.*`, `docs/api/openapi.yaml`, ...)
# sino el VALOR EXACTO de cada uno de los falsos positivos (17 de la auditoria
# mas el señuelo TOTP de la tarea 2.1): un secreto real
# que alguien pegara por error en cualquiera de esos ficheros seguiria
# detectandose, porque su valor no coincidiria con ninguno de los de abajo
# (hallazgo IMPORTANTE 4 de la auditoria; la version anterior de este fichero
# perdonaba la ruta entera, que es justo el agujero que esta version cierra).
#
# `regexTarget = "secret"`: cada regex de abajo se compara solo contra el
# SECRETO capturado por la regla que disparo (no contra la linea completa ni
# contra el contexto), asi que el valor exacto basta —no hace falta reproducir
# comillas, nombres de variable o el resto de la linea—.
#
# Estado tras el analisis del historico completo (75 commits,
# `gitleaks git --config .gitleaks.toml -v .`, y tambien sin allowlist para
# extraer el valor exacto de cada hallazgo): 17 hallazgos, los 17 de la regla
# por defecto `generic-api-key`, los 17 falsos positivos. Ninguno es una clave,
# un token o una contraseña real: identificadores de prueba con forma de
# UUID/hex, dos hashes SHA-256 de ejemplo en la documentacion del contrato, y
# el nombre de una variable de `.env.example` capturado por el hueco que deja
# la variable anterior, vacia a proposito (ver la ultima entrada). Verificado
# de nuevo tras este cambio: `make secrets-scan` sigue en 0.

title = "KronoQR"

[extend]
useDefault = true

# ---------------------------------------------------------------------------
# Regla propia: la clave PRIVADA de emision de licencias (tarea 5.3, RS-08)
# ---------------------------------------------------------------------------
#
# POR QUE HACE FALTA UNA REGLA PROPIA. Una clave privada ed25519 en hexadecimal
# son 128 caracteres de [0-9a-f] y nada mas: no lleva cabecera PEM, ni prefijo,
# ni nombre de proveedor, asi que **ninguna regla por defecto de gitleaks la
# reconoce**. Es exactamente la forma que tendria si alguien la pegara "solo
# para probar" en un fichero de configuracion, en una prueba o en un README.
#
# Y es la peor fuga posible de este producto: quien tenga esa clave puede emitir
# licencias validas para CUALQUIER cliente, con cualquier plan y cualquier
# vigencia (ADR-018). El emisor vive fuera del arbol desplegable
# (`tools/license-issuer/`) y la recibe por variable de entorno; esta regla es la
# red que impide que acabe versionada de todos modos.
#
# Las pruebas no la disparan: generan su par en cada ejecucion con
# `sodium_crypto_sign_keypair()` y no escriben ninguno en disco.
# `LicenseIssuerRoundTripTest` comprueba lo mismo desde el otro lado, sobre los
# ficheros concretos donde alguien tendria la tentacion de pegarla.
[[rules]]
  id = "kronoqr-license-signing-key"
  description = "Clave privada ed25519 de emision de licencias (128 hex). Nunca en el repositorio (§7.7, RS-08)"
  regex = '''\b[0-9a-fA-F]{128}\b'''
  keywords = []

[allowlist]
  description = "Falsos positivos confirmados uno a uno (ver cabecera): valor EXACTO del secreto, nunca una ruta entera"
  regexTarget = "secret"

  regexes = [
    # 1) backend/tests/Feature/Identity/CredentialCardLayoutTest.php: UUID de
    #    prueba escrito a mano, deliberadamente TRUNCADO (le falta el ultimo
    #    digito hexadecimal) porque el propio test lo completa concatenando
    #    `.$i` en cada iteracion para generar UUID distintos. No es una
    #    credencial: no viaja a ningun entorno real ni identifica nada.
    '''^0199f0c2-1f4a-7c3e-9b21-4d5e6f7a8b9$''',

    # 2) frontend-admin/tests/unit/support/fixtures.ts: UUID v7 de prueba
    #    escrito a mano como identificador de una credencial de ejemplo.
    '''^0199f0d1-2a5b-7d4f-8c32-5e6f7a8b9c01$''',

    # 3) frontend-kiosk/tests/unit/{credentialPayload.spec.ts,rosterCache.spec.ts}:
    #    token de 22 caracteres de un payload QR de ejemplo (`FH1.a3.<token>.<sig>`),
    #    escrito a mano para las pruebas del parser. No firma nada real: la
    #    clave HMAC que validaria la firma no existe fuera del servidor.
    '''^7QK2mXpR9vLdN4tZbYcF1w$''',

    # 4) y 5) docs/api/openapi.yaml: los `token_hash` de los ejemplos del
    #    contrato son SHA-256 de cadenas literales de muestra ("hello" y
    #    "world", verificado a mano), puestos ahi para que el ejemplo del
    #    esquema tenga la longitud correcta de un hash real. redocly los valida
    #    como ejemplos de documentacion, no como secretos.
    '''^6b86b273ff34fce19d6b804eff5a3f5747ada4eaa22f1d49c01e52ddb7875b4b$''',
    '''^d4735e3a265e16eee03f59718b9b5d03019c07d8b6c51f90da3a666eec13ab35$''',

    # 6) .env.example, historico del bloque de rotacion de la clave QR con
    #    solape (tarea 2.12, §5.3, RF-QR-07). `QR_SIGNING_KEY_CURRENT=` esta
    #    VACIA a proposito -- install.sh la genera en el servidor del cliente,
    #    §7.7 -- y en el commit 816f655e la regla `generic-api-key` de gitleaks
    #    unio esa linea vacia con el NOMBRE de la variable siguiente
    #    (`QR_SIGNING_KEY_PREVIOUS_ID=a2`, el identificador de dos caracteres
    #    de la clave anterior, no un secreto) porque una sigue a otra sin nada
    #    en medio. No es una clave: es el nombre de una variable, capturado por
    #    el hueco que deja la vacia.
    '''^QR_SIGNING_KEY_PREVIOUS_ID=a2$''',

    # 18) backend/app/Modules/Identity/Application/UseCase/VerifyTwoFactorHandler.php:
    #    `DECOY_SECRET`, el secreto SEÑUELO del rechazo de tiempo constante del
    #    codigo TOTP (revision de seguridad de la tarea 2.1, hallazgo BAJO-10).
    #    No esta asignado a ninguna cuenta ni lo tiene ningun autenticador: es
    #    base32 valido de la longitud del producto para que la rama «sin TOTP
    #    activo» pague las mismas franjas y los mismos HMAC que la rama «codigo
    #    equivocado». Publico por diseño, como `DECOY_HASH` en el PIN; quien lo
    #    conozca no obtiene nada. Fijado por TwoFactorRejectionSymmetryTest.
    '''^K5CVGRKUKZLE6TCPKZDVSVKGKZLE6TCP$''',

    # 19) backend/tests/Integration/Product/LicenseActivationTest.php: la
    #    cadena `KQL1.manipulada.aqui` que la prueba escribe en `license.signed_key`
    #    para comprobar que una fila corrompida a mano deja la licencia en
    #    `unverifiable` sin tumbar nada (tarea 5.3). No es una clave: ni la
    #    carga ni la firma son base64url validos y ninguna clave publica la
    #    verificaria.
    '''^KQL1\.manipulada\.aqui$''',

    # 20) docs/api/openapi.yaml: `key_fingerprint` de los ejemplos de
    #    `GET /api/v1/license`. Es una huella (SHA-256 truncado a 12 hex) de una
    #    clave de EJEMPLO, y aunque fuera la de una clave real no permitiria
    #    reconstruirla: existe para confirmar por telefono que la clave activada
    #    es la enviada (tarea 5.3).
    '''^4b1e9c07a2d8$''',

    # 21) docs/api/openapi.yaml: `signed_key` del ejemplo de
    #    `POST /api/v1/license/activate`. Carga `{"license_id":"9f2c4a1b7e0d3f65"}`
    #    y firma `foobar` en base64url: no lleva cliente, plan ni vigencia, no
    #    esta firmada por ninguna clave y el verificador la rechaza como
    #    `Malformed`. Esta ahi para que el ejemplo tenga la forma `KQL1.<carga>.<firma>`.
    '''^KQL1\.eyJsaWNlbnNlX2lkIjoiOWYyYzRhMWI3ZTBkM2Y2NSJ9\.Zm9vYmFy$''',
  ]
