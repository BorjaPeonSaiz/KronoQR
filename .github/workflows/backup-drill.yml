# KronoQR — simulacro de restauracion de copia (RNF-D-05, RQ-09, RF-PR-04).
#
# Ejecuta el ciclo COMPLETO contra PostgreSQL 17 de verdad: crea datos con
# relaciones, hace la copia cifrada, la verifica, la restaura en un contenedor
# LIMPIO y comprueba integridad referencial y conteos. Si algo de la cadena se
# rompe —un cambio en backup.sh, una version de pg_dump que ya no lee el
# volcado— se sabe aqui y no el dia de la restauracion.
#
# CUANDO se ejecuta, y por que asi:
#
#   · TRIMESTRAL (dia 1 de enero, abril, julio y octubre). Es la cadencia que
#     exige RNF-D-05. Este workflow demuestra que EL PROCEDIMIENTO funciona;
#     que funcionan las copias de un cliente concreto lo demuestra la entrada
#     de cron de su servidor (docs/runbooks/restaurar-backup.md §7). Hacen
#     falta las dos: el fabricante no tiene acceso a la instalacion del cliente
#     (ADR-020) y no puede ensayar sobre sus datos.
#   · En cada cambio de los scripts de copia. Un simulacro que solo corre cada
#     tres meses convierte cualquier error en un hallazgo de dentro de tres
#     meses.
#   · A mano, cuando alguien quiera comprobarlo.
#
# El nucleo del ciclo (copia cifrada -> restauracion en contenedor limpio, y la
# negativa de una copia alterada) lo ejecuta ademas, en cada push, la prueba
# `backend/tests/Restore/RestoreCycleTest.php` desde el job `restore-cycle` de
# `ci.yml`: es la que lee la matriz de trazabilidad (T3, RNF-D-05). Este
# workflow sigue siendo el simulacro COMPLETO (WAL, pitr, senales, roles).
#
# NO se ejecuta en cada push: son ~3 minutos y no aporta nada a un cambio de
# frontend. Por eso vive fuera del pipeline de `ci.yml` y de su presupuesto de
# 15 minutos para las etapas 1-3 (doc 02 §10.1, medido).

name: Simulacro de restauracion de copia

on:
  schedule:
    # 04:00 UTC del dia 1 de cada trimestre.
    - cron: "0 4 1 1,4,7,10 *"
    # Lunes 02:30 UTC: la medida del RTO CON VOLUMEN (job `volumen`, V21-5-DV-3, V21-6-DV-2).
    # Fuera de las ramas a proposito: genera 3,65 M de filas y tarda; en cada push no aporta nada.
    - cron: "30 2 * * 1"
  workflow_dispatch:
    inputs:
      volumen:
        description: "Ejecuta tambien la medida del RTO con volumen (3,65 M de filas; el job `volumen`). Por omision solo corre el lunes por la noche."
        type: boolean
        required: false
        default: false
      bitflip_seed:
        description: "Semilla de las pruebas de «un bit cambiado» (V5-DV-01), para repetir un fallo: la imprime el paso «Semilla de los bits cambiados». Vacio = aleatoria."
        required: false
        default: ""
  push:
    paths:
      - "infra/scripts/**"
      - "infra/docker/postgres/**"
      - ".github/workflows/backup-drill.yml"

permissions:
  contents: read

concurrency:
  group: backup-drill-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulacro:
    name: "Copia cifrada, verificada y restaurada en contenedor limpio"
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    # El lunes por la noche solo corre `volumen`; el simulacro completo, en cada cambio de los
    # scripts, el trimestre y a mano.
    if: github.event_name != 'schedule' || github.event.schedule == '0 4 1 1,4,7,10 *'

    env:
      # Claves de usar y tirar para un servidor que vive tres minutos en un
      # runner efimero. NO son secretos del producto: los del cliente los
      # genera install.sh en su servidor y no los conoce nadie mas (§7.7).
      BACKUP_ENCRYPTION_KEY: simulacro_local_ci_clave_de_cifrado
      BACKUP_PATH: /tmp/kronoqr-backups
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_DATABASE: fichaje
      # El rol de ARRANQUE del cluster (POSTGRES_USER, superusuario), que es el
      # que necesita este job: crea tablas, fuerza `pg_switch_wal()` y vuelca.
      # Tiene que llamarse como el rol de migracion y NO `fichaje_app`:
      # initdb.d/02-application-roles.sh se niega a inicializar un cluster
      # cuyo superusuario sea el rol de la aplicacion (regla dura 6, ADR-033)
      # y el contenedor muere antes de escuchar por TCP. Fue la causa de que
      # este workflow fallara en todas las ramas desde la tarea 1.14.
      DB_USERNAME: fichaje_migrator
      DB_PASSWORD: simulacro_local_ci
      # AUD-1: las copias se hacen con el rol de SOLO LECTURA, no con el de
      # migracion (superusuario). Sin PGPASSWORD a nivel de job a proposito:
      # backup-common.sh da prioridad a PGUSER/PGPASSWORD sobre BACKUP_DB_*, y un
      # PGPASSWORD global haria que la copia siguiera usando al migrador sin que
      # nadie lo notara. Los pasos que necesitan al migrador (sembrar, consultar
      # el archivador) ponen ellos su PGPASSWORD.
      BACKUP_DB_USERNAME: fichaje_backup
      BACKUP_DB_PASSWORD: simulacro_backup_ci

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Semilla de los bits cambiados (V5-DV-01)
        # Las pruebas de «un bit cambiado» sortean la posicion del bit (.github/scripts/flip-bit.sh)
        # en lugar de escribir una constante en un sitio fijo. La semilla se imprime aqui y en
        # cada alteracion para poder repetir un fallo: `gh workflow run backup-drill.yml -f
        # bitflip_seed=<semilla>`.
        env:
          SEMILLA_PEDIDA: ${{ inputs.bitflip_seed }}
        run: |
          semilla="${SEMILLA_PEDIDA:-$(( RANDOM * 32768 + RANDOM ))}"
          [[ "$semilla" =~ ^[0-9]+$ ]] || { echo "::error::bitflip_seed debe ser un entero."; exit 1; }
          echo "KQ_BITFLIP_SEED=${semilla}" >>"$GITHUB_ENV"
          echo "Semilla de los bits cambiados: ${semilla}"
          echo "Semilla de los bits cambiados: \`${semilla}\`" >>"$GITHUB_STEP_SUMMARY"

      - uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      - uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0
        # Exporta ACTIONS_RUNTIME_TOKEN y ACTIONS_CACHE_URL para `--cache-to type=gha` (ver ci.yml).

      - name: Cliente de PostgreSQL 17
        # La version mayor tiene que coincidir con la del servidor: un pg_dump
        # 16 se niega a volcar un servidor 17, y ese fallo hay que verlo aqui y
        # no en el servidor de un hotel.
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" |
            sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client-17
          pg_dump --version

      - name: Servidor PostgreSQL 17 con archivado de WAL
        # La imagen del producto, no la oficial: asi se prueba tambien el
        # archivado de WAL y el pg_hba declarativo que hacen posible el RPO de
        # 15 min (RNF-D-02). `make build-ci-images` (por defecto IMAGES=postgres,
        # sin cache): la misma orden que usan ci.yml (jobs `unit` y `security`),
        # en un solo objetivo (IMPORTANTE 10 de la auditoria) para que las tres
        # invocaciones no puedan divergir sin que nadie lo note.
        run: |
          # La de la APLICACION tambien (V5-DV-02): con ella se verifica la cadena de `audit_log` de la base
          # restaurada, con el mismo comando que la verificacion diaria. Misma cache que ci.yml (scope app-ci).
          make build-ci-images IMAGES="postgres app" BUILDX_CACHE=gha
          # ADR-049: PostgreSQL recibe la SUBCLAVE del WAL, derivada de la maestra con la
          # misma funcion que usan install.sh y update.sh. Es una clave de usar y tirar; se
          # enmascara igualmente en el log. El archivo de WAL va al anfitrion (propiedad del
          # uid 70 de postgres) para que el simulacro pitr lo monte en solo lectura.
          mkdir -p "$BACKUP_PATH"
          sudo install -d -o 70 -g 70 -m 0750 "$BACKUP_PATH/wal"
          BACKUP_WAL_KEY="$(bash infra/scripts/backup.sh derive-wal-key --print)"
          echo "::add-mask::${BACKUP_WAL_KEY}"
          echo "BACKUP_WAL_KEY=${BACKUP_WAL_KEY}" >>"$GITHUB_ENV"
          export BACKUP_WAL_KEY
          docker run -d --name kronoqr-pg \
            -e POSTGRES_DB="$DB_DATABASE" \
            -e POSTGRES_USER="$DB_USERNAME" \
            -e POSTGRES_PASSWORD="$DB_PASSWORD" \
            -e DB_BACKUP_USERNAME="$BACKUP_DB_USERNAME" \
            -e DB_BACKUP_PASSWORD="$BACKUP_DB_PASSWORD" \
            -e KRONOQR_WAL_ARCHIVE_DIR=/var/backups/fichaje/wal \
            -e BACKUP_WAL_KEY \
            -v "$BACKUP_PATH/wal:/var/backups/fichaje/wal" \
            -p 5432:5432 \
            kronoqr/postgres:ci \
            postgres -c timezone=UTC -c log_timezone=UTC -c jit=off \
              -c hba_file=/etc/kronoqr/pg_hba.conf \
              -c wal_level=replica -c archive_mode=on -c archive_timeout=60 \
              -c "archive_command=/usr/local/bin/kronoqr-archive-wal %p %f" \
              -c max_slot_wal_keep_size=5GB
          # `-h 127.0.0.1` a proposito: sin `-h`, pg_isready habla por el socket
          # Unix y responde "listo" durante el servidor TEMPORAL que initdb
          # levanta para ejecutar initdb.d (solo escucha en el socket). El
          # siguiente paso entra por TCP justo cuando ese servidor se apaga y
          # recibe "server closed the connection unexpectedly". Por TCP solo
          # contesta el servidor definitivo. Y si no arranca, los logs del
          # contenedor son lo unico que explica por que: se vuelcan y se falla
          # aqui, no dos pasos mas tarde con un "connection refused" mudo.
          for i in $(seq 1 45); do
            if docker exec kronoqr-pg pg_isready -h 127.0.0.1 -U "$DB_USERNAME" -d "$DB_DATABASE" >/dev/null 2>&1; then
              echo "Servidor listo en $((i * 2)) s"; exit 0
            fi
            sleep 2
          done
          echo "::error title=PostgreSQL no arranco::pg_isready por TCP sigue fallando tras 90 s."
          docker logs kronoqr-pg | tail -80
          exit 1

      - name: Datos con relaciones y casos limite
        env:
          PGPASSWORD: ${{ env.DB_PASSWORD }}
        # Turno nocturno que cruza medianoche y turno en el cambio de hora: si
        # una copia se los comiera, el registro legal quedaria mal y los
        # conteos por tabla lo dirian.
        run: |
          psql -h "$DB_HOST" -U "$DB_USERNAME" -d "$DB_DATABASE" -v ON_ERROR_STOP=1 <<'SQL'
          CREATE TABLE sites (id int PRIMARY KEY, code text NOT NULL);
          CREATE TABLE employees (
            id int PRIMARY KEY,
            site_id int NOT NULL REFERENCES sites(id),
            employee_code text NOT NULL UNIQUE
          );
          CREATE TABLE shift_entries (
            id int PRIMARY KEY,
            employee_id int NOT NULL REFERENCES employees(id),
            started_at timestamptz NOT NULL,
            ended_at timestamptz
          );
          INSERT INTO sites VALUES (1, 'HOTEL-A'), (2, 'HOTEL-B');
          INSERT INTO employees SELECT g, 1 + (g % 2), 'EMP-' || g FROM generate_series(1, 500) g;
          INSERT INTO shift_entries SELECT g, 1 + (g % 500),
                 timestamptz '2026-01-15 22:00:00+00' - (g || ' hours')::interval,
                 timestamptz '2026-01-16 06:00:00+00' - (g || ' hours')::interval
          FROM generate_series(1, 5000) g;
          -- Turno que cruza el cambio de hora (RN-05, ADR-006).
          INSERT INTO shift_entries VALUES (99999, 1, '2026-03-29 01:30:00+01', '2026-03-29 09:00:00+02');
          -- audit_log es una tabla PARTICIONADA por anyo: el rol de copias tiene que
          -- leer tambien las particiones que se creen despues (pg_read_all_data).
          CREATE TABLE audit_log (id bigint NOT NULL, at timestamptz NOT NULL, action text NOT NULL) PARTITION BY RANGE (at);
          CREATE TABLE audit_log_2026 PARTITION OF audit_log FOR VALUES FROM ('2026-01-01') TO ('2027-01-01');
          INSERT INTO audit_log SELECT g, '2026-05-01'::timestamptz + (g || ' minutes')::interval, 'clock.in' FROM generate_series(1, 200) g;
          SELECT pg_switch_wal();
          SQL

      - name: El rol de copias es de SOLO LECTURA y aun asi copia (AUD-1)
        env:
          PGPASSWORD: ${{ env.DB_PASSWORD }}
        run: |
          set -euo pipefail
          q() { psql -h "$DB_HOST" -U "$DB_USERNAME" -d "$DB_DATABASE" -Atc "$1"; }
          test "$(q "SELECT rolsuper OR rolcreatedb OR rolcreaterole FROM pg_roles WHERE rolname = '$BACKUP_DB_USERNAME'")" = "f"
          test "$(q "SELECT rolreplication FROM pg_roles WHERE rolname = '$BACKUP_DB_USERNAME'")" = "t"
          # Una particion nueva DESPUES de aprovisionar el rol: se copia igual.
          q "CREATE TABLE audit_log_2027 PARTITION OF audit_log FOR VALUES FROM ('2027-01-01') TO ('2028-01-01')"
          q "INSERT INTO audit_log VALUES (9001, '2027-02-01', 'clock.out')"
          # No puede escribir, ni crear, ni tocar audit_log, ni crear bases.
          w() { PGPASSWORD="$BACKUP_DB_PASSWORD" psql -h "$DB_HOST" -U "$BACKUP_DB_USERNAME" -d "$DB_DATABASE" -Atc "$1"; }
          for sql in "UPDATE audit_log SET action = 'x'" "DELETE FROM audit_log" "INSERT INTO shift_entries VALUES (1, 1, now(), now())" "CREATE TABLE intruso (x int)" "CREATE DATABASE intruso"; do
            if w "$sql" >/dev/null 2>&1; then echo "::error::El rol de copias ha podido ejecutar: $sql"; exit 1; fi
          done
          # Lee todo, particiones incluidas.
          test "$(w "SELECT count(*) FROM audit_log")" = "201"
          # A3-06. Su UNICA pertenencia es pg_read_all_data, y por tanto no puede
          # escribir en el registro ni en los fichajes (ni por privilegio directo ni
          # heredado).
          pertenencias() { q "SELECT coalesce(string_agg(g.rolname, ',' ORDER BY g.rolname), '') FROM pg_auth_members am JOIN pg_roles g ON g.oid = am.roleid JOIN pg_roles m ON m.oid = am.member WHERE m.rolname = '$BACKUP_DB_USERNAME'"; }
          test "$(pertenencias)" = "pg_read_all_data"
          escribe() { q "SELECT has_table_privilege('$BACKUP_DB_USERNAME', 'audit_log', 'UPDATE') OR has_table_privilege('$BACKUP_DB_USERNAME', 'audit_log', 'DELETE') OR has_table_privilege('$BACKUP_DB_USERNAME', 'shift_entries', 'UPDATE')"; }
          test "$(escribe)" = "f"
          # Una pertenencia ganada por el camino (pg_write_all_data daria UPDATE en
          # todo) se RETIRA al volver a aprovisionar el rol, que es lo que hace
          # update.sh: la contrasena entra por la entrada estandar, como en produccion.
          # WITH INHERIT TRUE para que la pertenencia sea efectiva (un rol NOINHERIT no
          # hereda por defecto, aunque `SET ROLE pg_write_all_data` seguiria siendo posible:
          # razon de mas para retirar CUALQUIER pertenencia, no solo las que heredan).
          q "GRANT pg_write_all_data TO $BACKUP_DB_USERNAME WITH INHERIT TRUE"
          test "$(escribe)" = "t" || { echo "::error::El montaje de la prueba es invalido: pg_write_all_data no da escritura."; exit 1; }
          printf '%s\n' "$BACKUP_DB_PASSWORD" | docker exec -i kronoqr-pg /docker-entrypoint-initdb.d/03-backup-role.sh --password-stdin
          test "$(pertenencias)" = "pg_read_all_data" || { echo "::error::El aprovisionamiento no ha retirado una pertenencia de mas: $(pertenencias)"; exit 1; }
          test "$(escribe)" = "f"
          # A3-05. COMPORTAMIENTO REAL, medido y no supuesto: `pg_read_all_data` da
          # SELECT sobre TODAS las tablas, catalogos restringidos incluidos, asi que
          # el rol de copias PUEDE leer `pg_authid` (y con ella los verificadores de
          # contrasena de los demas roles). Lo aceptado y documentado (03-backup-role.sh,
          # rotacion-secretos.md) es que sean SCRAM-SHA-256, que no se pueden usar
          # para autenticarse sin romperlos por fuerza bruta. Un verificador MD5 seria
          # otra cosa (equivale a la contrasena), y eso si tiene que romper el simulacro.
          test "$(w "SELECT count(*) > 0 FROM pg_authid")" = "t" || { echo "::error::El rol de copias ya no puede leer pg_authid: el comportamiento documentado ha cambiado, actualiza 03-backup-role.sh y rotacion-secretos.md."; exit 1; }
          test "$(w "SELECT count(*) FROM pg_authid WHERE rolpassword IS NOT NULL AND rolpassword NOT LIKE 'SCRAM-SHA-256\$%'")" = "0" || { echo "::error::Hay un verificador de contrasena que no es SCRAM-SHA-256."; exit 1; }
          # El tope de WAL retenido por un slot esta puesto (compose.prod.yaml).
          test "$(q "SHOW max_slot_wal_keep_size")" = "5GB"
          echo "fichaje_backup: lee todo, no escribe nada y solo pertenece a pg_read_all_data."

      - name: Copia cifrada y verificada
        run: |
          mkdir -p "$BACKUP_PATH"
          bash infra/scripts/backup.sh run --mode dump
          # La particion creada DESPUES del rol esta en el volcado. La copia se abre con las
          # mismas funciones que usa backup.sh (KQE1: se verifica el MAC y despues se descifra).
          copia="$(ls "$BACKUP_PATH"/daily/*.dump.enc | tail -n 1)"
          bash -c '. infra/scripts/lib/backup-common.sh; load_backup_config; require_encryption_key; d="$(mktemp -d)"; kqe_open "$1" "$d" dump "$(basename "$1" .dump.enc)" && kqe_decrypt_copy | pg_restore --list' _ "$copia" |
            grep -q 'TABLE DATA public audit_log_2027' ||
            { echo '::error::La particion de audit_log creada despues del rol no esta en la copia.'; exit 1; }

      - name: Copia FISICA (pg_basebackup) con el rol de solo lectura
        run: |
          bash infra/scripts/backup.sh run --mode base
          ls -l "$BACKUP_PATH"/base/*.tar.gz.enc
          head -n 1 "$(ls "$BACKUP_PATH"/base/*.tar.gz.enc | tail -n 1)" | grep -q '^KQE1 kind=base '

      - name: La copia esta CIFRADA y AUTENTICADA (RL-12, R5-DV-04)
        # Que no se pueda leer sin la clave no es una opinion: se comprueba.
        run: |
          copia="$(ls "$BACKUP_PATH"/daily/*.dump.enc | tail -n 1)"
          head -c 4 "$copia" | grep -q "KQE1" || { echo "::error::La copia no tiene cabecera KQE1."; exit 1; }
          if grep -qa "PGDMP" "$copia"; then echo "::error::La copia contiene la cabecera del volcado EN CLARO."; exit 1; fi
          if grep -qa "employee_code" "$copia"; then echo "::error::Se leen nombres de columna en claro dentro de la copia."; exit 1; fi
          if BACKUP_ENCRYPTION_KEY=clave_que_no_es bash infra/scripts/backup.sh verify >/dev/null 2>&1; then
            echo "::error::La copia se ha verificado con una clave equivocada."; exit 1
          fi
          echo "Copia cifrada: ilegible sin la clave, y la clave equivocada no la abre."

      - name: R5-DV-02 — el WAL archivado esta CIFRADO y sin clave el archivado FALLA
        # El hallazgo, invertido: antes `gunzip | strings | grep -c "scan_id|employee|kiosk"` daba
        # 2088 sobre un segmento archivado. Ahora el segmento no empieza por 1f8b, no se
        # descomprime y no deja ver nada; y sin clave (o con la de desarrollo) el archivado
        # devuelve 1 y PostgreSQL conserva el WAL, en vez de escribir un solo segmento en claro.
        env:
          PGPASSWORD: ${{ env.DB_PASSWORD }}
        run: |
          set -euo pipefail
          q() { psql -h "$DB_HOST" -U "$DB_USERNAME" -d "$DB_DATABASE" -Atqc "$1"; }
          q "CREATE TABLE IF NOT EXISTS ci_wal_probe(id serial primary key, scan_id text, employee text, kiosk text)"
          q "INSERT INTO ci_wal_probe(scan_id, employee, kiosk) SELECT 'scan_id-' || g, 'employee-' || g, 'kiosk-' || g FROM generate_series(1, 3000) g" >/dev/null
          q "SELECT pg_switch_wal()" >/dev/null
          sleep 2
          q "SELECT pg_switch_wal()" >/dev/null
          for _ in $(seq 1 30); do
            [ "$(sudo sh -c "ls '$BACKUP_PATH'/wal/*.gz.enc 2>/dev/null | wc -l")" -ge 2 ] && break
            sleep 2
          done
          [ "$(sudo sh -c "ls '$BACKUP_PATH'/wal/*.gz.enc | wc -l")" -ge 2 ] || { echo "::error::PostgreSQL no archiva segmentos."; exit 1; }
          [ "$(sudo sh -c "ls '$BACKUP_PATH'/wal/*.gz 2>/dev/null | wc -l")" = "0" ] || { echo "::error::Hay segmentos .gz EN CLARO en el archivo de WAL."; exit 1; }
          nuevo="$(sudo sh -c "ls -t '$BACKUP_PATH'/wal/*.gz.enc | head -n 1")"
          [ "$(sudo head -c 2 "$nuevo" | od -An -tx1 | tr -d ' \n')" != "1f8b" ] || { echo "::error::El segmento archivado es un gzip legible."; exit 1; }
          if sudo gunzip -c "$nuevo" >/dev/null 2>&1; then echo "::error::El segmento se descomprime sin la clave."; exit 1; fi
          coincidencias="$(sudo sh -c "cat '$BACKUP_PATH'/wal/*.gz.enc | strings | grep -c -E 'scan_id|employee|kiosk' || true")"
          [ "$coincidencias" = "0" ] || { echo "::error::El archivo de WAL deja ver $coincidencias coincidencias de scan_id|employee|kiosk."; exit 1; }
          # Sin clave, o con la de desarrollo: el archivado FALLA (exit 1) y no escribe nada.
          docker exec kronoqr-pg sh -c 'head -c 4096 /dev/urandom > /tmp/seg-ci'
          if docker exec -e BACKUP_WAL_KEY= kronoqr-pg kronoqr-archive-wal /tmp/seg-ci 0000000100000000000000FD; then
            echo "::error::El archivado ha funcionado SIN clave."; exit 1
          fi
          if docker exec -e BACKUP_WAL_KEY=4deec0e109388ff8c0ed3ca348abba952eef5a59c6e87906f052e8453eff69ec kronoqr-pg kronoqr-archive-wal /tmp/seg-ci 0000000100000000000000FD; then
            echo "::error::El archivado ha funcionado con la clave de desarrollo."; exit 1
          fi
          sudo test ! -e "$BACKUP_PATH/wal/0000000100000000000000FD.gz.enc"
          echo "WAL cifrado y autenticado; sin clave no se archiva."

      - name: Archivado de WAL en marcha (RPO <= 15 min)
        run: |
          sleep 5
          PGPASSWORD="$DB_PASSWORD" psql -h "$DB_HOST" -U "$DB_USERNAME" -d "$DB_DATABASE" -Atc \
            "SELECT CASE WHEN archived_count > 0 THEN 'ok' ELSE 'mal' END FROM pg_stat_archiver" |
            grep -qx ok || { echo "::error::El archivado de WAL no funciona: sin el no hay RPO de 15 minutos."; exit 1; }

      - name: R5-DV-01 — la metrica del RPO la publica wal-metrics.sh con el rol de solo lectura
        # Sin pg_monitor ni privilegios nuevos (C17): pg_stat_archiver, pg_current_wal_insert_lsn y
        # pg_settings son publicos. Y la exposicion vuelve a 0 tras archivar.
        # Sin PGPASSWORD a nivel de paso: backup-common.sh da prioridad a PGPASSWORD sobre
        # BACKUP_DB_PASSWORD, y el exportador conectaria como fichaje_backup con la
        # contrasena del migrador (lo que paso en la CI del 03-10-2026). El exportador va
        # con las credenciales del rol de copias, como lo lanza el scheduler; la
        # comprobacion de pertenencias, con las del migrador.
        run: |
          set -euo pipefail
          PGPASSWORD="$BACKUP_DB_PASSWORD" bash infra/scripts/wal-metrics.sh
          m="$BACKUP_PATH/metrics/kronoqr_wal.prom"
          grep -q '^kronoqr_wal_archive_timeout_seconds 60$' "$m"
          grep -q '^kronoqr_wal_archive_failing 0$' "$m"
          grep -q '^kronoqr_wal_exporter_last_run_timestamp_seconds ' "$m"
          [ "$(PGPASSWORD="$DB_PASSWORD" psql -h "$DB_HOST" -U "$DB_USERNAME" -d "$DB_DATABASE" -Atc "SELECT count(*) FROM pg_auth_members am JOIN pg_roles r ON r.oid = am.roleid JOIN pg_roles u ON u.oid = am.member WHERE u.rolname = 'fichaje_backup' AND r.rolname = 'pg_monitor'")" = "0" ]
          echo "kronoqr_wal.prom publicado con el rol fichaje_backup, sin pg_monitor."

      - name: Idempotencia — dos copias seguidas no corrompen la anterior
        run: |
          anterior="$(ls "$BACKUP_PATH"/daily/*.dump.enc | tail -n 1)"
          huella="$(sha256sum "$anterior" | cut -d' ' -f1)"
          sleep 1
          bash infra/scripts/backup.sh run --mode dump
          [ "$huella" = "$(sha256sum "$anterior" | cut -d' ' -f1)" ] ||
            { echo "::error::La segunda copia ha modificado la anterior."; exit 1; }
          bash infra/scripts/backup.sh verify --file "$anterior"

      - name: Fallo seguro — el sistema queda como estaba
        run: |
          antes="$(sha256sum "$BACKUP_PATH"/daily/*.dump.enc | sha256sum)"
          codigo=0
          BACKUP_DUMP_COMMAND=false bash infra/scripts/backup.sh run || codigo=$?
          [ "$codigo" -ne 0 ] || { echo "::error::Una copia fallida ha devuelto exito."; exit 1; }
          [ "$antes" = "$(sha256sum "$BACKUP_PATH"/daily/*.dump.enc | sha256sum)" ] ||
            { echo "::error::Un fallo a mitad ha alterado las copias existentes."; exit 1; }
          [ -z "$(find "$BACKUP_PATH" -name '*.part')" ] ||
            { echo "::error::Ha quedado un fichero a medias en el destino."; exit 1; }
          grep -q '^kronoqr_backup_last_result{type="dump"} 0$' "$BACKUP_PATH"/metrics/kronoqr_backup_run.prom ||
            { echo "::error::El fallo no se ha publicado como metrica: la alerta no se enteraria."; exit 1; }
          bash infra/scripts/backup.sh run --mode dump

      - name: A3-03 — backup.sh se niega a copiar con un rol privilegiado
        # Que nada dependa de que el .env este bien: con el rol de MIGRACION
        # (superusuario) la copia se niega, sale con el codigo propio (7), no escribe
        # nada nuevo y publica la copia como fallida para que suene la alerta.
        run: |
          set -euo pipefail
          antes="$(sha256sum "$BACKUP_PATH"/daily/*.dump.enc | sha256sum)"
          codigo=0
          PGUSER="$DB_USERNAME" PGPASSWORD="$DB_PASSWORD" bash infra/scripts/backup.sh run --mode dump || codigo=$?
          [ "$codigo" -eq 7 ] || { echo "::error::Con el rol de migracion la copia debia salir con 7 y salio con $codigo."; exit 1; }
          [ "$antes" = "$(sha256sum "$BACKUP_PATH"/daily/*.dump.enc | sha256sum)" ] ||
            { echo "::error::La copia rechazada ha escrito o alterado ficheros."; exit 1; }
          grep -q '^kronoqr_backup_last_result{type="dump"} 0$' "$BACKUP_PATH"/metrics/kronoqr_backup_run.prom ||
            { echo "::error::El rechazo no se ha publicado como copia fallida: la alerta no sonaria."; exit 1; }
          # Con el rol de solo lectura vuelve a funcionar (y deja la metrica en verde).
          bash infra/scripts/backup.sh run --mode dump
          grep -q '^kronoqr_backup_last_result{type="dump"} 1$' "$BACKUP_PATH"/metrics/kronoqr_backup_run.prom

      - name: A3-05 — un slot de replicacion parado se ve en la metrica
        # `fichaje_backup` tiene REPLICATION y puede crear un slot. La copia lo
        # detecta y lo publica cada minuto (wal-metrics.sh; antes, al terminar la copia diaria) para
        # la alerta SlotDeReplicacionParado; al retirarlo, vuelve a 0.
        run: |
          set -euo pipefail
          w() { PGPASSWORD="$BACKUP_DB_PASSWORD" psql -h "$DB_HOST" -U "$BACKUP_DB_USERNAME" -d "$DB_DATABASE" -Atc "$1"; }
          metrica() { bash infra/scripts/wal-metrics.sh >/dev/null; grep '^kronoqr_wal_replication_slots_inactive ' "$BACKUP_PATH"/metrics/kronoqr_wal.prom | cut -d' ' -f2; }
          test "$(metrica)" = "0"
          w "SELECT pg_create_physical_replication_slot('kq_slot_de_prueba')" >/dev/null
          sleep 1
          test "$(metrica)" = "1" || { echo "::error::Un slot de replicacion parado no aparece en la metrica."; exit 1; }
          w "SELECT pg_drop_replication_slot('kq_slot_de_prueba')" >/dev/null
          sleep 1
          test "$(metrica)" = "0"

      - name: A3-01 — restore.sh y el simulacro no dejan que una copia toque los roles
        # Un volcado MANIPULADO con `ALTER ROLE fichaje_app SUPERUSER` dentro: pg_restore
        # corre como superusuario y lo ejecutaria. Tiene que salir con 7, sin intercambiar
        # las bases, y dejar los roles como estaban. Y una copia buena, no dar falso positivo.
        env:
          PGHOST: ${{ env.DB_HOST }}
          PGPORT: ${{ env.DB_PORT }}
          PGUSER: ${{ env.DB_USERNAME }}
          PGPASSWORD: ${{ env.DB_PASSWORD }}
        run: |
          set -euo pipefail
          q() { psql -d postgres -Atqc "$1"; }
          es_super() { q "SELECT rolsuper FROM pg_roles WHERE rolname = 'fichaje_app'"; }
          test "$(es_super)" = "f"
          q "DROP DATABASE IF EXISTS fichaje_destino" >/dev/null
          q "CREATE DATABASE fichaje_destino" >/dev/null

          for sentencia in "ALTER ROLE fichaje_app SUPERUSER;" "GRANT pg_write_all_data TO fichaje_app;" "CREATE ROLE kq_intruso SUPERUSER LOGIN;"; do
            bash .github/scripts/forge-role-escalation-dump.sh /tmp/manipulada.dump "$sentencia"
            # El atacante de A3-01 tiene la clave del scheduler: la copia manipulada esta bien
            # SELLADA (KQE1, su .sha256 y su manifiesto autenticado), y es la guarda de roles la que
            # tiene que pararla.
            bash .github/scripts/forge-sealed-copy.sh /tmp/manipulada.dump "$BACKUP_PATH" kronoqr-29990101T000000Z
            codigo=0
            bash infra/scripts/restore.sh --file "$BACKUP_PATH/daily/kronoqr-29990101T000000Z.dump.enc" --database fichaje_destino --yes || codigo=$?
            [ "$codigo" -eq 7 ] || { echo "::error::restore.sh con «$sentencia» debia salir con 7 y salio con $codigo."; exit 1; }
            test "$(es_super)" = "f" || { echo "::error::«$sentencia» ha dejado a fichaje_app superusuario."; exit 1; }
            test "$(q "SELECT count(*) FROM pg_roles WHERE rolname = 'kq_intruso'")" = "0" || { echo "::error::El rol creado por la copia sigue en el cluster."; exit 1; }
            test "$(q "SELECT count(*) FROM pg_auth_members am JOIN pg_roles m ON m.oid = am.member WHERE m.rolname = 'fichaje_app'")" = "0" ||
              { echo "::error::fichaje_app conserva una pertenencia ganada con la copia."; exit 1; }
            test "$(q "SELECT count(*) FROM pg_database WHERE datname LIKE 'fichaje_destino_restore_%'")" = "0" ||
              { echo "::error::Ha quedado la base de trabajo de la restauracion rechazada."; exit 1; }
          done

          # El simulacro en modo `database` corre pg_restore contra un cluster real: lo mismo.
          codigo=0
          bash infra/scripts/restore-drill.sh --skip-audit-chain --mode database --file "$BACKUP_PATH/daily/kronoqr-29990101T000000Z.dump.enc" || codigo=$?
          [ "$codigo" -eq 7 ] || { echo "::error::El simulacro modo database con una copia manipulada debia salir con 7 y salio con $codigo."; exit 1; }
          test "$(es_super)" = "f"

          rm -f "$BACKUP_PATH"/daily/kronoqr-29990101T000000Z.*
          # Sin falso positivo: una copia buena, en modo database, pasa.
          bash infra/scripts/restore-drill.sh --skip-audit-chain --mode database
          q "DROP DATABASE IF EXISTS fichaje_destino" >/dev/null

      - name: V6-PL-03 — un SIGTERM a restore.sh deja SIEMPRE una base de produccion
        # restore.sh atrapa INT, TERM y HUP. Con un cluster real y la copia buena:
        #   (a) SIGTERM DENTRO de la ventana critica (entre los dos ALTER DATABASE ...
        #       RENAME): se difiere, el intercambio termina y el script sale con 143
        #       diciendo que la restauracion SI se ha completado.
        #   (b) SIGTERM FUERA (durante pg_restore): se elimina la base de trabajo y
        #       la de destino sigue exactamente como estaba.
        # Para mantener abierta la ventana sin tocar el script se antepone al PATH un
        # `psql`/`pg_restore` que esperan unos segundos y delegan en los de verdad.
        env:
          PGHOST: ${{ env.DB_HOST }}
          PGPORT: ${{ env.DB_PORT }}
          PGUSER: ${{ env.DB_USERNAME }}
          PGPASSWORD: ${{ env.DB_PASSWORD }}
          # Un rol que no existe en el cluster: restore.sh solo comprueba los privilegios
          # del rol de la aplicacion cuando existe, y el superusuario de este job no
          # cumple "no puede tocar audit_log".
          DB_USERNAME: fichaje_sin_rol_de_aplicacion
        run: |
          set -euo pipefail
          q() { psql -d postgres -Atqc "$1"; }
          en_destino() { psql -d fichaje_destino -Atqc "$1"; }
          copia="$(ls "$BACKUP_PATH"/daily/*.dump.enc | tail -n 1)"
          real_dir="$(dirname "$(command -v psql)")"
          mkdir -p /tmp/stub-senal
          cat >/tmp/stub-senal/pausa.sh <<'STUB'
          #!/bin/sh
          nombre="$(basename "$0")"
          case "${nombre}:${KQ_STUB_PAUSA:-}:$*" in
            psql:renombrado:*"RENAME TO"*)
              : >"${KQ_STUB_BANDERA}"
              sleep "${KQ_STUB_SEGUNDOS:-6}"
              ;;
            pg_restore:restauracion:*--dbname*)
              # pg_restore YA CONECTADO a la base nueva (como en la fase post-data): una
              # sesion que sigue viva cuando llega la senal y que un DROP sin FORCE no
              # podria eliminar.
              base="${*#*--dbname=}"
              base="${base%% *}"
              "${KQ_STUB_REAL_DIR}/psql" -d "${base}" -Atqc "SELECT pg_sleep(120)" >/dev/null 2>&1 &
              sleep 2
              : >"${KQ_STUB_BANDERA}"
              sleep "${KQ_STUB_SEGUNDOS:-6}"
              ;;
          esac
          exec "${KQ_STUB_REAL_DIR}/${nombre}" "$@"
          STUB
          chmod +x /tmp/stub-senal/pausa.sh
          ln -sf pausa.sh /tmp/stub-senal/psql
          ln -sf pausa.sh /tmp/stub-senal/pg_restore

          # Lanza restore.sh con la pausa pedida, espera a que este DENTRO de ella, manda
          # SIGTERM al `bash` del script y devuelve su codigo de salida en $codigo.
          restaurar_y_cortar() {
            local pausa="$1" log="$2" pid
            rm -f /tmp/kq-bandera
            PATH="/tmp/stub-senal:$PATH" KQ_STUB_PAUSA="$pausa" KQ_STUB_BANDERA=/tmp/kq-bandera \
              KQ_STUB_REAL_DIR="$real_dir" KQ_STUB_SEGUNDOS=6 \
              bash infra/scripts/restore.sh --file "$copia" --database fichaje_destino --yes >"$log" 2>&1 &
            pid=$!
            for _ in $(seq 1 240); do
              [ -e /tmp/kq-bandera ] && break
              kill -0 "$pid" 2>/dev/null || break
              sleep 0.5
            done
            [ -e /tmp/kq-bandera ] || { cat "$log"; echo "::error::restore.sh no llego a la pausa «$pausa»: la prueba no prueba nada."; exit 1; }
            kill -TERM "$pid"
            codigo=0
            wait "$pid" || codigo=$?
            cat "$log"
          }

          limpiar() {
            local base
            for base in $(q "SELECT datname FROM pg_database WHERE datname = 'fichaje_destino' OR datname LIKE 'fichaje_destino_%'"); do
              q "DROP DATABASE \"$base\"" >/dev/null
            done
          }

          # (a) DENTRO de la ventana critica.
          limpiar
          q "CREATE DATABASE fichaje_destino" >/dev/null
          en_destino "CREATE TABLE marca_previa (x int)" >/dev/null
          restaurar_y_cortar renombrado /tmp/senal-ventana.log
          [ "$codigo" -eq 8 ] || { echo "::error::SIGTERM dentro de la ventana debia salir con 8 (restaurada pero interrumpida) y salio con $codigo."; exit 1; }
          grep -q 'Restauracion COMPLETADA antes de atender la senal TERM' /tmp/senal-ventana.log
          test "$(q "SELECT count(*) FROM pg_database WHERE datname = 'fichaje_destino'")" = "1" ||
            { echo "::error::Tras la senal no hay base de produccion."; exit 1; }
          test "$(q "SELECT count(*) FROM pg_database WHERE datname LIKE 'fichaje_destino\_restore\_%'")" = "0" ||
            { echo "::error::Ha quedado la base de trabajo."; exit 1; }
          test "$(q "SELECT count(*) FROM pg_database WHERE datname LIKE 'fichaje_destino\_pre\_restore\_%'")" = "1" ||
            { echo "::error::El intercambio no se completo: falta la base anterior apartada."; exit 1; }
          test "$(en_destino "SELECT count(*) FROM employees")" = "500" ||
            { echo "::error::La base de produccion no es la restaurada."; exit 1; }
          test "$(en_destino "SELECT count(*) FROM pg_class WHERE relname = 'marca_previa'")" = "0"

          # (b) FUERA de la ventana: durante pg_restore.
          q "DROP DATABASE IF EXISTS fichaje_destino" >/dev/null
          for base in $(q "SELECT datname FROM pg_database WHERE datname LIKE 'fichaje_destino\_%'"); do
            q "DROP DATABASE \"$base\"" >/dev/null
          done
          q "CREATE DATABASE fichaje_destino" >/dev/null
          en_destino "CREATE TABLE marca_previa (x int)" >/dev/null
          restaurar_y_cortar restauracion /tmp/senal-fuera.log
          [ "$codigo" -eq 143 ] || { echo "::error::SIGTERM durante pg_restore debia salir con 143 y salio con $codigo."; exit 1; }
          test "$(q "SELECT count(*) FROM pg_database WHERE datname = 'fichaje_destino'")" = "1"
          test "$(q "SELECT count(*) FROM pg_database WHERE datname LIKE 'fichaje_destino\_%'")" = "0" ||
            { echo "::error::Ha quedado una base de trabajo o apartada tras interrumpir pg_restore."; exit 1; }
          test "$(en_destino "SELECT count(*) FROM pg_class WHERE relname = 'marca_previa'")" = "1" ||
            { echo "::error::La base de destino ha cambiado aunque no se llego a intercambiar."; exit 1; }
          test "$(en_destino "SELECT count(*) FROM pg_class WHERE relname = 'employees'")" = "0"
          grep -q 'sigue como estaba' /tmp/senal-fuera.log

          limpiar

      - name: SIMULACRO — restaurar en contenedor limpio y validar (RNF-D-05)
        run: bash infra/scripts/restore-drill.sh --skip-audit-chain --timeout 120

      - name: El simulacro detecta una copia que NO restaura
        # Una comprobacion que nunca ha fallado no demuestra nada: aqui se le
        # da una copia corrupta y se exige que la rechace.
        run: |
          cp "$(cat "$BACKUP_PATH"/daily/LATEST | sed "s|^|$BACKUP_PATH/daily/|")" /tmp/copia-buena.enc
          copia="$BACKUP_PATH/daily/$(cat "$BACKUP_PATH"/daily/LATEST)"
          printf 'basura' | dd of="$copia" bs=1 seek=200 conv=notrunc status=none
          if bash infra/scripts/restore-drill.sh --skip-audit-chain --timeout 120 >/dev/null 2>&1; then
            echo "::error::El simulacro ha dado por buena una copia corrupta."; exit 1
          fi
          cp /tmp/copia-buena.enc "$copia"
          echo "El simulacro rechaza una copia corrupta."

      - name: V5-DV-02 — la cadena de audit_log se verifica sobre la base restaurada; una fila alterada hace fallar el simulacro
        # El simulacro comprobaba claves ajenas y conteos, pero «cero es cero» pide que lo primero tras
        # restaurar sea la cadena de hash. Aqui la base es REAL (migraciones de la aplicacion y asientos
        # escritos por ella, no una tabla de mentira), la copia se restaura en el contenedor limpio de
        # siempre y el comando que verifica es el de la comprobacion diaria. Y el caso negativo: una fila
        # de audit_log alterada por SQL directo ANTES de la copia —la posicion del cambio la elige la
        # semilla de los bits— tiene que hacer fallar el simulacro con 6 y decir que fila.
        env:
          PGHOST: ${{ env.DB_HOST }}
          PGPORT: ${{ env.DB_PORT }}
          PGUSER: ${{ env.DB_USERNAME }}
          PGPASSWORD: ${{ env.DB_PASSWORD }}
        run: |
          set -euo pipefail
          q() { psql -d postgres -Atqc "$1"; }
          en_cadena() { psql -d fichaje_chain -Atqc "$1"; }
          APP_KEY="base64:$(openssl rand -base64 32)"
          export APP_KEY
          export DB_MIGRATION_USERNAME="$DB_USERNAME" DB_MIGRATION_PASSWORD="$DB_PASSWORD"
          aplicacion() {
            docker run --rm --network host --entrypoint "$1" \
              -e APP_ENV=production -e APP_KEY -e LOG_CHANNEL=stderr -e CACHE_STORE=array -e SESSION_DRIVER=array \
              -e QUEUE_CONNECTION=sync -e DB_CONNECTION=pgsql_migrator -e DB_HOST -e DB_PORT \
              -e DB_DATABASE=fichaje_chain -e DB_MIGRATION_USERNAME -e DB_MIGRATION_PASSWORD \
              kronoqr/app:ci "${@:2}"
          }
          q "DROP DATABASE IF EXISTS fichaje_chain" >/dev/null
          q "CREATE DATABASE fichaje_chain" >/dev/null
          aplicacion php artisan migrate --force >/dev/null
          # Doce asientos de verdad, escritos por la aplicacion (cadena encadenada por ella).
          aplicacion sh -c 'for i in $(seq 1 12); do php artisan compliance:record-system-event system.restored_from_backup --data="{\"backup_file\":\"kronoqr-20260101T000000Z.dump.enc\",\"backup_taken_at\":\"2026-01-01T00:00:00Z\",\"failed_step\":\"manual_restore\",\"reason\":\"manual_restore\",\"from_version\":\"2.3.0\",\"to_version\":\"2.3.0\",\"report_id\":\"drill-ci-$i\"}" >/dev/null || exit 1; done'
          filas="$(en_cadena "SELECT count(*) FROM audit_log")"
          [ "$filas" -ge 12 ] || { echo "::error::La aplicacion solo ha escrito $filas asientos."; exit 1; }
          aplicacion php artisan compliance:verify-audit-chain | grep -q 'Cadena integra' ||
            { echo "::error::La cadena de origen ya no es integra: el montaje de la prueba es invalido."; exit 1; }
          copia_con_cadena() {
            DB_DATABASE=fichaje_chain PGUSER="$BACKUP_DB_USERNAME" PGPASSWORD="$BACKUP_DB_PASSWORD" bash infra/scripts/backup.sh run --mode dump >/dev/null
            cat "$BACKUP_PATH"/daily/LATEST
          }
          ultimo_informe() { ls -t "$BACKUP_PATH"/reports/drill-*.log | head -n 1; }

          # a) cadena integra -> el simulacro pasa y lo dice
          buena="$(copia_con_cadena)"
          bash infra/scripts/restore-drill.sh --php-image kronoqr/app:ci --timeout 120
          grep -q 'Cadena de auditoria: correcta' "$(ultimo_informe)" ||
            { echo "::error::El informe del simulacro no dice que la cadena se haya verificado."; exit 1; }

          # a2) --mode database con la imagen, SIN --skip-audit-chain (la misma verificacion en la rama
          #     database: el usuario del cluster es el migrador del job y el verificador usa --network host)
          bash infra/scripts/restore-drill.sh --mode database --php-image kronoqr/app:ci --file "$BACKUP_PATH/daily/$buena"
          grep -q 'Cadena de auditoria: correcta' "$(ultimo_informe)" ||
            { echo "::error::El simulacro en modo database no verifico la cadena."; exit 1; }
          grep -q '^kronoqr_backup_restore_drill_audit_chain_verified 1$' "$BACKUP_PATH"/metrics/kronoqr_backup_drill.prom ||
            { echo "::error::Un simulacro con la cadena verificada no publica audit_chain_verified 1."; exit 1; }

          # a3) «no se ha podido verificar» NO es «rotura»: una imagen sin artisan hace fallar el simulacro
          #     con 6, pero el informe no habla de rotura de la cadena ni manda al runbook de integridad
          codigo=0
          bash infra/scripts/restore-drill.sh --php-image kronoqr/postgres:ci --file "$BACKUP_PATH/daily/$buena" --timeout 120 || codigo=$?
          [ "$codigo" -eq 6 ] || { echo "::error::Con una imagen sin artisan el simulacro debia fallar (6) y salio con $codigo."; exit 1; }
          grep -q 'Cadena de auditoria: NO VERIFICADA' "$(ultimo_informe)" ||
            { echo "::error::El informe no distingue «no se ha podido verificar» de una rotura."; exit 1; }
          if grep -q 'ROTURA' "$(ultimo_informe)"; then
            echo "::error::Una cadena que no se ha podido verificar se ha informado como ROTURA."; exit 1
          fi

          # a4) --skip-audit-chain se RECHAZA sobre una base con la cadena de verdad (hash y prev_hash)
          codigo=0
          bash infra/scripts/restore-drill.sh --skip-audit-chain --file "$BACKUP_PATH/daily/$buena" --timeout 120 || codigo=$?
          [ "$codigo" -eq 6 ] || { echo "::error::--skip-audit-chain sobre una base con cadena debia rechazarse (6) y salio con $codigo."; exit 1; }
          grep -q 'rechazada porque audit_log tiene cadena' "$(ultimo_informe)" ||
            { echo "::error::El informe no dice que --skip-audit-chain se rechazo."; exit 1; }

          # b) una fila alterada por SQL directo, elegida por la semilla -> el simulacro falla con 6
          objetivo=$(( KQ_BITFLIP_SEED % filas + 1 ))
          id="$(en_cadena "SELECT id FROM audit_log ORDER BY id OFFSET $((objetivo - 1)) LIMIT 1")"
          echo "Fila alterada: audit_log #${id} (semilla ${KQ_BITFLIP_SEED})"
          en_cadena "UPDATE audit_log SET payload = payload || '{\"alterado\":1}'::jsonb WHERE id = ${id}" >/dev/null
          sleep 1
          copia_con_cadena >/dev/null
          codigo=0
          bash infra/scripts/restore-drill.sh --php-image kronoqr/app:ci --timeout 120 || codigo=$?
          [ "$codigo" -eq 6 ] || { echo "::error::Con audit_log #${id} alterada el simulacro debia fallar (6) y salio con $codigo."; exit 1; }
          grep -q "audit_log #${id} · content_altered" "$(ultimo_informe)" ||
            { echo "::error::El informe no nombra la fila alterada (#${id})."; exit 1; }
          grep -q '^kronoqr_backup_restore_drill_last_result 0$' "$BACKUP_PATH"/metrics/kronoqr_backup_drill.prom ||
            { echo "::error::El fallo de la cadena no se ha publicado como simulacro fallido: la alerta no sonaria."; exit 1; }

          # b2) ademas una fila BORRADA a mitad de la cadena: la siguiente ya no encadena con la anterior
          del_off=$(( (objetivo - 1 + 3) % (filas - 2) ))
          del_id="$(en_cadena "SELECT id FROM audit_log ORDER BY id OFFSET ${del_off} LIMIT 1")"
          sig_id="$(en_cadena "SELECT id FROM audit_log ORDER BY id OFFSET $((del_off + 1)) LIMIT 1")"
          echo "Fila borrada: audit_log #${del_id}; la que ya no encadena es #${sig_id}"
          en_cadena "DELETE FROM audit_log WHERE id = ${del_id}" >/dev/null
          sleep 1
          copia_con_cadena >/dev/null
          codigo=0
          bash infra/scripts/restore-drill.sh --php-image kronoqr/app:ci --timeout 120 || codigo=$?
          [ "$codigo" -eq 6 ] || { echo "::error::Con audit_log #${del_id} borrada el simulacro debia fallar (6) y salio con $codigo."; exit 1; }
          grep -q "audit_log #${sig_id} · broken_link" "$(ultimo_informe)" ||
            { echo "::error::El informe no nombra el eslabon roto (#${sig_id}, broken_link)."; exit 1; }

          # c) la copia buena anterior sigue pasando (el simulacro vuelve a verde y deja la metrica en 1)
          bash infra/scripts/restore-drill.sh --php-image kronoqr/app:ci --file "$BACKUP_PATH/daily/$buena" --timeout 120
          q "DROP DATABASE IF EXISTS fichaje_chain" >/dev/null
          echo "La cadena de audit_log se verifica tras restaurar y una fila alterada (#${id}) falla el simulacro."

      - name: R5-DV-04 — un bit cambiado, un .sha256 borrado, una copia renombrada o un manifiesto alterado NO restauran
        # Antes: AES-CBC no autentica y un bit cambiado daba exit=0; el .sha256 era OPCIONAL, asi que
        # borrarlo y modificar el .enc pasaba. Ahora todo eso sale con 6 y la base no se toca. Y el gancho
        # TOCTOU (KQE_TEST_HOOK_AFTER_VERIFY) cambia un bit del ORIGEN despues de verificar: la
        # restauracion usa la copia ya verificada o falla, nunca aplica un volcado alterado.
        env:
          PGHOST: ${{ env.DB_HOST }}
          PGPORT: ${{ env.DB_PORT }}
          PGUSER: ${{ env.DB_USERNAME }}
          PGPASSWORD: ${{ env.DB_PASSWORD }}
        run: |
          set -euo pipefail
          q() { psql -d postgres -Atqc "$1"; }
          # La copia, con el rol de copias: el PGUSER del paso es el migrador (para psql y
          # restore.sh) y backup.sh lo rechazaria con 7 (AUD-1), como comprueba A3-02.
          PGUSER="$BACKUP_DB_USERNAME" PGPASSWORD="$BACKUP_DB_PASSWORD" bash infra/scripts/backup.sh run --mode dump >/dev/null
          copia="$BACKUP_PATH/daily/$(cat "$BACKUP_PATH"/daily/LATEST)"
          nombre="$(basename "$copia" .dump.enc)"
          cp -p "$copia" /tmp/buena.enc
          cp -p "$BACKUP_PATH/daily/$nombre.manifest.json" /tmp/buena.manifest.json
          dry() { bash infra/scripts/restore.sh --database fichaje_dry --dry-run "$@" >/dev/null 2>&1; }
          esperar6() {
            codigo=0; dry "$@" || codigo=$?
            [ "$codigo" -eq 6 ] || { echo "::error::$DESC debia salir con 6 y salio con $codigo."; exit 1; }
          }
          dry --file "$copia" || { echo "::error::La copia buena no pasa el dry-run."; exit 1; }
          # a) un bit cambiado en la cabecera, el cuerpo y la cola, en una posicion SORTEADA con la semilla
          #    (V5-DV-01): el byte se lee y se cambia su bit, asi que el fichero CAMBIA siempre (antes se
          #    escribia una `Z` fija y, si el byte ya era `Z`, la prueba esperaba 6 y recibia 0).
          for region in header body trailer; do
            cp -p /tmp/buena.enc "$copia"
            bash .github/scripts/flip-bit.sh "$copia" "$region" "$KQ_BITFLIP_SEED"
            cmp -s /tmp/buena.enc "$copia" && { echo "::error::flip-bit no ha cambiado el fichero (region $region, semilla $KQ_BITFLIP_SEED)."; exit 1; }
            DESC="Un bit cambiado en la region $region (semilla $KQ_BITFLIP_SEED)"; esperar6 --file "$copia"
          done
          cp -p /tmp/buena.enc "$copia"
          # b) el .sha256 borrado y el .enc modificado (el ataque del hallazgo)
          mv "$copia.sha256" /tmp/buena.sha256
          bash .github/scripts/flip-bit.sh "$copia" body "$KQ_BITFLIP_SEED"
          DESC=".sha256 borrado + .enc modificado"; esperar6 --file "$copia"
          cp -p /tmp/buena.enc "$copia"
          DESC="Sin .sha256"; esperar6 --file "$copia"
          mv /tmp/buena.sha256 "$copia.sha256"
          # c) renombrada: la cabecera dice otro nombre
          cp -p "$copia" "$BACKUP_PATH/daily/kronoqr-20240101T000000Z.dump.enc"
          cp -p "$copia.sha256" "$BACKUP_PATH/daily/kronoqr-20240101T000000Z.dump.enc.sha256"
          cp -p /tmp/buena.manifest.json "$BACKUP_PATH/daily/kronoqr-20240101T000000Z.manifest.json"
          cp -p "$BACKUP_PATH/daily/$nombre.manifest.mac" "$BACKUP_PATH/daily/kronoqr-20240101T000000Z.manifest.mac"
          DESC="Una copia renombrada"; esperar6 --file "$BACKUP_PATH/daily/kronoqr-20240101T000000Z.dump.enc"
          rm -f "$BACKUP_PATH"/daily/kronoqr-20240101T000000Z.*
          # d) manifiesto alterado, y sin su MAC
          echo ' ' >>"$BACKUP_PATH/daily/$nombre.manifest.json"
          DESC="Un manifiesto alterado"; esperar6 --file "$copia"
          cp -p /tmp/buena.manifest.json "$BACKUP_PATH/daily/$nombre.manifest.json"
          mv "$BACKUP_PATH/daily/$nombre.manifest.mac" /tmp/buena.manifest.mac
          DESC="Sin el MAC del manifiesto"; esperar6 --file "$copia"
          mv /tmp/buena.manifest.mac "$BACKUP_PATH/daily/$nombre.manifest.mac"
          dry --file "$copia" || { echo "::error::La copia restaurada a su estado original ya no pasa."; exit 1; }
          # e) TOCTOU: el gancho cambia un bit del origen justo DESPUES de verificar. El simulacro en
          #    modo database (que si pasa en este cluster) tiene que COMPLETARSE con la copia ya
          #    verificada: si leyera otra vez del origen, pg_restore se encontraria un volcado alterado.
          cat >/tmp/gancho.sh <<'HOOK'
          #!/bin/sh
          # El mismo flip-bit.sh que el resto de pruebas (GITHUB_WORKSPACE y KQ_BITFLIP_SEED vienen del entorno del job).
          exec bash "${GITHUB_WORKSPACE}/.github/scripts/flip-bit.sh" "$1" body "${KQ_BITFLIP_SEED}"
          HOOK
          chmod +x /tmp/gancho.sh
          codigo=0
          KQE_TEST_HOOK_AFTER_VERIFY=/tmp/gancho.sh bash infra/scripts/restore-drill.sh --skip-audit-chain --mode database --file "$copia" >/dev/null 2>&1 || codigo=$?
          [ "$codigo" -eq 0 ] || { echo "::error::Con el origen alterado DESPUES de verificar, el simulacro debia usar la copia ya verificada (0) y salio con $codigo."; exit 1; }
          # El origen SI quedo alterado por el gancho: ya no verifica.
          codigo=0; dry --file "$copia" || codigo=$?
          [ "$codigo" -eq 6 ] || { echo "::error::El gancho no altero el origen: la prueba TOCTOU no prueba nada."; exit 1; }
          cp -p /tmp/buena.enc "$copia"
          echo "Integridad autenticada: toda alteracion hace fallar la restauracion con 6."

      - name: R5-DV-02 / RNF-D-02 — copia fisica + WAL cifrado reconstruyen la base (restore-drill --mode pitr)
        # Lo que ninguna otra comprobacion ejercita: copia fisica + WAL archivado y CIFRADO, en un
        # contenedor limpio con la imagen de postgres del producto. Y los fallos que tienen que
        # DETENER la recuperacion (exit 200 del restore_command, FATAL), no promocionar con datos de
        # menos: un segmento intermedio ausente, un bit cambiado, un heredado sin la bandera.
        env:
          PGPASSWORD: ${{ env.DB_PASSWORD }}
        run: |
          set -euo pipefail
          q() { psql -h "$DB_HOST" -U "$DB_USERNAME" -d "$DB_DATABASE" -Atqc "$1"; }
          wal() { sudo sh -c "$1"; }
          drill() { bash infra/scripts/restore-drill.sh --mode pitr --image kronoqr/postgres:ci --wal-source "$BACKUP_PATH/wal" --timeout 150 "$@"; }
          # Una copia fisica NUEVA y WAL posterior a ella: tres segmentos como minimo. Con las
          # credenciales del rol de copias: el PGPASSWORD del paso es el del migrador (para psql).
          PGUSER="$BACKUP_DB_USERNAME" PGPASSWORD="$BACKUP_DB_PASSWORD" bash infra/scripts/backup.sh run --mode base >/dev/null
          for n in 1 2 3; do
            q "INSERT INTO ci_wal_probe(scan_id, employee, kiosk) SELECT 'p$n-' || g, 'e-' || g, 'k-' || g FROM generate_series(1, 200) g" >/dev/null
            q "SELECT pg_switch_wal()" >/dev/null
            sleep 2
          done
          sleep 8
          # a) camino feliz
          drill || { echo "::error::El simulacro pitr no pasa con copia fisica y WAL cifrado."; exit 1; }
          grep -q 'wal_integrity=authenticated' "$BACKUP_PATH"/reports/drill-*.log
          # b) segmento intermedio ausente con otro posterior: la recuperacion se DETIENE
          mapfile -t segs < <(wal "ls '$BACKUP_PATH'/wal/*.gz.enc" | grep -E '/[0-9A-F]{24}\.gz\.enc$' | sort)
          [ "${#segs[@]}" -ge 3 ]
          medio="${segs[$(( ${#segs[@]} - 2 ))]}"
          wal "mv '$medio' '/tmp/segmento-medio.keep'"
          codigo=0; drill >/dev/null 2>&1 || codigo=$?
          wal "mv '/tmp/segmento-medio.keep' '$medio'"
          [ "$codigo" -eq 6 ] || { echo "::error::Con un segmento intermedio ausente el simulacro debia fallar (6) y salio con $codigo: la recuperacion NO se ha detenido."; exit 1; }
          grep -q "aborted_at:$(basename "$medio" .gz.enc)" "$BACKUP_PATH"/reports/drill-*.log ||
            { echo "::error::El informe no dice en que segmento se aborto."; exit 1; }
          # c) un bit cambiado en un segmento
          wal "cp -p '$medio' /tmp/segmento-medio.keep"
          sudo -E bash .github/scripts/flip-bit.sh "$medio" body "$KQ_BITFLIP_SEED"
          codigo=0; drill >/dev/null 2>&1 || codigo=$?
          wal "cp -p /tmp/segmento-medio.keep '$medio'"
          [ "$codigo" -eq 6 ] || { echo "::error::Con un bit cambiado en un segmento el simulacro debia fallar (6) y salio con $codigo."; exit 1; }
          # d) un segmento heredado (.gz sin cifrar): solo con la bandera, y se cuenta
          bash -c '. infra/scripts/lib/backup-common.sh; load_backup_config; require_encryption_key; kq_wal_key_ensure; d="$(mktemp -d)"; n="$(basename "$1" .gz.enc)"; sudo cat "$1" > "$d/in"; kqe_open "$d/in" "$d" wal "$n" && kqe_decrypt_copy > /tmp/heredado.gz' _ "$medio"
          wal "rm -f '$medio' && cp /tmp/heredado.gz '$BACKUP_PATH/wal/$(basename "$medio" .gz.enc).gz' && chown 70:70 '$BACKUP_PATH/wal/$(basename "$medio" .gz.enc).gz'"
          codigo=0; drill >/dev/null 2>&1 || codigo=$?
          [ "$codigo" -eq 6 ] || { echo "::error::Un segmento heredado sin la bandera debia detener la recuperacion y salio con $codigo."; exit 1; }
          drill --accept-unauthenticated || { echo "::error::Con --accept-unauthenticated un segmento heredado debia reproducirse."; exit 1; }
          grep -q 'legacy_wal=1' "$BACKUP_PATH"/reports/drill-*.log
          wal "rm -f '$BACKUP_PATH/wal/$(basename "$medio" .gz.enc).gz' && cp -p /tmp/segmento-medio.keep '$medio'"
          drill || { echo "::error::El simulacro pitr no vuelve a pasar con el archivo restaurado."; exit 1; }
          echo "pitr: camino feliz, hueco, bit cambiado y heredado, como dice el ADR-049."

      - name: Informe del simulacro (evidencia de RNF-D-05 y RQ-09)
        if: always()
        run: |
          {
            echo "### Simulacro de restauracion"
            echo ""
            echo '```'
            cat "$BACKUP_PATH"/metrics/*.prom 2>/dev/null | grep -E '^kronoqr_' || echo "sin metricas"
            echo '```'
            echo ""
            echo "Informes: $(ls "$BACKUP_PATH"/reports/ 2>/dev/null | tr '\n' ' ')"
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Recoger los informes
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: simulacro-restauracion
          # Solo informes y metricas: nombres de tabla, numeros y marcas de
          # tiempo. Ni una copia, ni un dato personal (regla dura 21).
          path: |
            /tmp/kronoqr-backups/reports/
            /tmp/kronoqr-backups/metrics/
          retention-days: 90

      - name: Apagar el servidor de pruebas
        if: always()
        run: docker rm -fv kronoqr-pg >/dev/null 2>&1 || true

  #-----------------------------------------------------------------------------
  # RTO CON VOLUMEN (V21-5-DV-3, V21-6-DV-2). Semanal y a mano; nunca en una rama.
  #
  # El simulacro de arriba restaura 8 704 filas: demuestra que el PROCEDIMIENTO funciona, no que
  # el RTO de 4 h (RNF-D-02) quepa con los datos de un hotel de cuatro anos. Este job fabrica ese
  # volumen y MIDE tres cosas, cada una contra un umbral escrito:
  #
  #   · la COPIA logica (`backup.sh run --mode dump`), que es lo que tarda la ventana de 503 de una
  #     actualizacion (V21-6-DV-2: se media con la base casi vacia, 3 s);
  #   · la RESTAURACION en contenedor limpio (el simulacro menos la cadena), el grueso del RTO;
  #   · la VERIFICACION DE LA CADENA de audit_log sobre 1 M de asientos, que desde la 2.3.0 forma
  #     parte del simulacro y de la que depende que el registro restaurado sea fiable.
  #
  # LA BASE. El esquema es el REAL, migrado con `kronoqr/app:ci` (particiones de audit_log, indices,
  # disparadores, claves ajenas de la aplicacion), y `audit_log` lleva 1 M de asientos con la cadena
  # de hash valida (`.github/scripts/seed-audit-chain.php`, que usa la misma clase `AuditChain` que
  # escribe y verifica). Hasta ~3,9 M de filas se completan con cuatro tablas sinteticas (`vol_*`:
  # 500 empleados x 4 anos) que dan volumen y claves ajenas propias. La copia sale de esa base, asi
  # que los tiempos incluyen el esquema real y no solo tablas con una clave primaria.
  #
  # OJO, LA DURACION DEL SIMULACRO CAMBIA EN LA 2.3.0: `restore_drill_duration_seconds` incluye ahora
  # la verificacion de la cadena. «61 s con 3,65 M de filas» (2.2.0) era solo restaurar; el RTO se
  # mide como duration - audit_chain_seconds.
  #
  # UMBRALES (aceptados por el propietario el 22-10-2026, a revisar tras 3-4 ejecuciones; razon en
  # docs/runbooks/restaurar-backup.md §6.1):
  #   · restauracion <= RESTORE_VOLUME_MAX_SECONDS (600 s);
  #   · copia <= BACKUP_VOLUME_MAX_SECONDS (120 s);
  #   · cadena sobre 1 M de asientos <= CHAIN_VOLUME_MAX_SECONDS (600 s): la comprobacion diaria
  #     corre a las 04:05 y tiene que acabar con holgura antes del cambio de turno de las 06:00.
  # Ajustarlos es una decision del propietario del producto (RNF-D-02), no de quien los lee en rojo.
  #-----------------------------------------------------------------------------
  volumen:
    name: "RTO con volumen: copia, restauracion y cadena de 1 M de asientos"
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    if: (github.event_name == 'schedule' && github.event.schedule == '30 2 * * 1') || (github.event_name == 'workflow_dispatch' && inputs.volumen)

    env:
      BACKUP_ENCRYPTION_KEY: volumen_local_ci_clave_de_cifrado
      BACKUP_PATH: /tmp/kronoqr-backups
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_DATABASE: fichaje
      DB_USERNAME: fichaje_migrator
      DB_PASSWORD: volumen_local_ci
      BACKUP_DB_USERNAME: fichaje_backup
      BACKUP_DB_PASSWORD: volumen_backup_ci
      # Las imagenes del producto que el simulacro resuelve como en un servidor (V5-DV-03): la de
      # postgres de la instalacion para el contenedor limpio, sin Docker Hub.
      IMAGE_REGISTRY: kronoqr
      IMAGE_TAG: ci
      RESTORE_VOLUME_MAX_SECONDS: "600"
      BACKUP_VOLUME_MAX_SECONDS: "120"
      CHAIN_VOLUME_MAX_SECONDS: "600"
      AUDIT_ROWS: "1000000"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cliente de PostgreSQL 17
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" |
            sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client-17

      - uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      - uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0

      - name: PostgreSQL 17 del producto, con el rol de copias, y la imagen de la aplicacion
        run: |
          make build-ci-images IMAGES="postgres app" BUILDX_CACHE=gha
          mkdir -p "$BACKUP_PATH"
          docker run -d --name kronoqr-pg \
            -e POSTGRES_DB="$DB_DATABASE" \
            -e POSTGRES_USER="$DB_USERNAME" \
            -e POSTGRES_PASSWORD="$DB_PASSWORD" \
            -e DB_BACKUP_USERNAME="$BACKUP_DB_USERNAME" \
            -e DB_BACKUP_PASSWORD="$BACKUP_DB_PASSWORD" \
            -p 5432:5432 \
            kronoqr/postgres:ci \
            postgres -c timezone=UTC -c log_timezone=UTC -c jit=off \
              -c hba_file=/etc/kronoqr/pg_hba.conf
          for i in $(seq 1 45); do
            if docker exec kronoqr-pg pg_isready -h 127.0.0.1 -U "$DB_USERNAME" -d "$DB_DATABASE" >/dev/null 2>&1; then
              echo "Servidor listo en $((i * 2)) s"; exit 0
            fi
            sleep 2
          done
          echo "::error title=PostgreSQL no arranco::pg_isready por TCP sigue fallando tras 90 s."
          docker logs kronoqr-pg | tail -80
          exit 1

      - name: Esquema REAL de la aplicacion, 1 M de asientos con cadena valida y cuatro anos de datos de volumen
        env:
          PGPASSWORD: ${{ env.DB_PASSWORD }}
        run: |
          set -euo pipefail
          APP_KEY="base64:$(openssl rand -base64 32)"
          export APP_KEY DB_MIGRATION_USERNAME="$DB_USERNAME" DB_MIGRATION_PASSWORD="$DB_PASSWORD"
          aplicacion() {
            docker run --rm --network host -v "$PWD/.github/scripts:/ci:ro" --entrypoint "$1" \
              -e APP_ENV=production -e APP_KEY -e LOG_CHANNEL=stderr -e CACHE_STORE=array -e SESSION_DRIVER=array \
              -e QUEUE_CONNECTION=sync -e METRICS_TEXTFILE_ENABLED=false -e DB_CONNECTION=pgsql_migrator \
              -e DB_HOST -e DB_PORT -e DB_DATABASE -e DB_MIGRATION_USERNAME -e DB_MIGRATION_PASSWORD \
              kronoqr/app:ci "${@:2}"
          }
          aplicacion php artisan migrate --force >/dev/null
          aplicacion php /ci/seed-audit-chain.php "$AUDIT_ROWS"
          psql -h "$DB_HOST" -U "$DB_USERNAME" -d "$DB_DATABASE" -v ON_ERROR_STOP=1 <<'SQL'
          CREATE TABLE vol_employees (id int PRIMARY KEY, employee_code text NOT NULL UNIQUE);
          INSERT INTO vol_employees SELECT g, 'EMP-' || g FROM generate_series(1, 500) g;
          -- 500 personas x 1 460 dias = 730 000 jornadas, un tramo cada una.
          CREATE TABLE vol_shift_entries (
            id bigint PRIMARY KEY,
            employee_id int NOT NULL REFERENCES vol_employees(id),
            started_at timestamptz NOT NULL,
            ended_at timestamptz,
            source text NOT NULL
          );
          INSERT INTO vol_shift_entries
            SELECT g, 1 + (g % 500),
                   timestamptz '2022-10-01 06:00+00' + ((g / 500) || ' days')::interval,
                   timestamptz '2022-10-01 14:00+00' + ((g / 500) || ' days')::interval,
                   'kiosk'
            FROM generate_series(1, 730000) g;
          CREATE INDEX vol_shift_entries_employee_started ON vol_shift_entries (employee_id, started_at);
          -- Dos fichajes por tramo.
          CREATE TABLE vol_scan_events (
            id bigint PRIMARY KEY,
            scan_id uuid NOT NULL UNIQUE,
            employee_id int NOT NULL REFERENCES vol_employees(id),
            occurred_at timestamptz NOT NULL,
            recorded_at timestamptz NOT NULL,
            payload jsonb NOT NULL
          );
          INSERT INTO vol_scan_events
            SELECT g, gen_random_uuid(), 1 + (g % 500),
                   timestamptz '2022-10-01 06:00+00' + ((g / 1000) || ' days')::interval,
                   timestamptz '2022-10-01 06:00:02+00' + ((g / 1000) || ' days')::interval,
                   jsonb_build_object('kiosk', 1 + (g % 3), 'direction', CASE WHEN g % 2 = 0 THEN 'in' ELSE 'out' END)
            FROM generate_series(1, 1460000) g;
          CREATE INDEX vol_scan_events_employee_occurred ON vol_scan_events (employee_id, occurred_at);
          CREATE TABLE vol_daily_totals (
            employee_id int NOT NULL REFERENCES vol_employees(id),
            day date NOT NULL,
            minutes int NOT NULL,
            PRIMARY KEY (employee_id, day)
          );
          INSERT INTO vol_daily_totals
            SELECT e, date '2022-10-01' + d, 480 FROM generate_series(1, 500) e, generate_series(0, 1459) d;
          ANALYZE;
          SQL
          total="$(psql -h "$DB_HOST" -U "$DB_USERNAME" -d "$DB_DATABASE" -Atc "SELECT (SELECT count(*) FROM vol_employees) + (SELECT count(*) FROM vol_shift_entries) + (SELECT count(*) FROM vol_scan_events) + (SELECT count(*) FROM vol_daily_totals) + (SELECT count(*) FROM audit_log)")"
          tamano="$(psql -h "$DB_HOST" -U "$DB_USERNAME" -d "$DB_DATABASE" -Atc "SELECT pg_size_pretty(pg_database_size('$DB_DATABASE'))")"
          echo "FILAS_TOTAL=${total}" >>"$GITHUB_ENV"
          echo "BASE_TAMANO=${tamano}" >>"$GITHUB_ENV"
          echo "Filas: ${total}. Tamano de la base: ${tamano}."
          [ "$total" -ge 3600000 ] || { echo "::error::El volumen sembrado (${total} filas) no llega a los 3,6 M que dice el job."; exit 1; }

      - name: Medir la copia logica (la ventana de 503 de una actualizacion)
        run: |
          set -euo pipefail
          inicio="$(date +%s)"
          bash infra/scripts/backup.sh run --mode dump
          segundos=$(( $(date +%s) - inicio ))
          copia="$BACKUP_PATH/daily/$(cat "$BACKUP_PATH"/daily/LATEST)"
          echo "COPIA_SEGUNDOS=${segundos}" >>"$GITHUB_ENV"
          echo "COPIA_MB=$(( $(stat -c %s "$copia") / 1048576 ))" >>"$GITHUB_ENV"
          echo "Copia de ${FILAS_TOTAL} filas en ${segundos} s (umbral ${BACKUP_VOLUME_MAX_SECONDS} s)."
          [ "$segundos" -le "$BACKUP_VOLUME_MAX_SECONDS" ] ||
            { echo "::error::La copia con volumen tarda ${segundos} s y el umbral es ${BACKUP_VOLUME_MAX_SECONDS} s: la ventana de 503 de update.sh se alarga. Ver docs/runbooks/restaurar-backup.md §6.1."; exit 1; }

      - name: Medir la restauracion en contenedor limpio y la cadena de 1 M de asientos
        run: |
          set -euo pipefail
          # Sin --skip-audit-chain: la base lleva la cadena de verdad y el simulacro la verifica. Las
          # imagenes salen de IMAGE_REGISTRY/IMAGE_TAG (kronoqr/postgres:ci para el contenedor limpio).
          bash infra/scripts/restore-drill.sh --php-image kronoqr/app:ci --timeout 180
          m="$BACKUP_PATH/metrics/kronoqr_backup_drill.prom"
          total="$(sed -n 's/^kronoqr_backup_restore_drill_duration_seconds //p' "$m")"
          cadena="$(sed -n 's/^kronoqr_backup_restore_drill_audit_chain_seconds //p' "$m")"
          filas="$(sed -n 's/^kronoqr_backup_restore_drill_rows //p' "$m")"
          [[ "$total" =~ ^[0-9]+$ && "$cadena" =~ ^[0-9]+$ ]] || { echo "::error::No se han podido leer las duraciones del simulacro."; exit 1; }
          restauracion=$(( total - cadena ))
          echo "SIMULACRO_SEGUNDOS=${total}" >>"$GITHUB_ENV"
          echo "RESTAURACION_SEGUNDOS=${restauracion}" >>"$GITHUB_ENV"
          echo "CADENA_SEGUNDOS=${cadena}" >>"$GITHUB_ENV"
          echo "Simulacro de ${filas} filas: ${total} s en total = ${restauracion} s de restauracion + ${cadena} s de cadena."
          fallo=0
          if [ "$restauracion" -gt "$RESTORE_VOLUME_MAX_SECONDS" ]; then
            echo "::error::La restauracion con volumen tarda ${restauracion} s y el umbral es ${RESTORE_VOLUME_MAX_SECONDS} s: el RTO de 4 h (RNF-D-02) se estrecha. Ver docs/runbooks/restaurar-backup.md §6.1."
            fallo=1
          fi
          if [ "$cadena" -gt "$CHAIN_VOLUME_MAX_SECONDS" ]; then
            echo "::error::Verificar la cadena de ${AUDIT_ROWS} asientos tarda ${cadena} s y el umbral es ${CHAIN_VOLUME_MAX_SECONDS} s: la comprobacion diaria de las 04:05 se acerca al cambio de turno. Ver docs/runbooks/restaurar-backup.md §6.1."
            fallo=1
          fi
          [ "$fallo" -eq 0 ]

      - name: Resumen del RTO medido
        if: always()
        run: |
          {
            echo "### RTO con volumen"
            echo ""
            echo "| Medida | Valor | Umbral |"
            echo "| --- | --- | --- |"
            echo "| Filas | ${FILAS_TOTAL:-?} (${AUDIT_ROWS} de audit_log con cadena) | 3,6 M |"
            echo "| Tamano de la base | ${BASE_TAMANO:-?} | |"
            echo "| Copia logica | ${COPIA_SEGUNDOS:-?} s (${COPIA_MB:-?} MB) | ${BACKUP_VOLUME_MAX_SECONDS} s |"
            echo "| Restauracion en contenedor limpio | ${RESTAURACION_SEGUNDOS:-?} s | ${RESTORE_VOLUME_MAX_SECONDS} s |"
            echo "| Verificacion de la cadena | ${CADENA_SEGUNDOS:-?} s | ${CHAIN_VOLUME_MAX_SECONDS} s |"
            echo "| Simulacro completo | ${SIMULACRO_SEGUNDOS:-?} s | |"
            echo ""
            echo "RTO de RNF-D-02: 4 h. Umbrales y razon: docs/runbooks/restaurar-backup.md §6.1."
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Apagar el servidor de pruebas
        if: always()
        run: docker rm -fv kronoqr-pg >/dev/null 2>&1 || true
