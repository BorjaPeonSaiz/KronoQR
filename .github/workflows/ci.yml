# KronoQR — etapas 1-3 del pipeline (doc 02 §10.1).
#
#   ① Lint + Tipos            Pint · PHPStan 9 · ESLint · vue-tsc · ShellCheck   ~1 min
#                             + @redocly/cli sobre docs/api/openapi.yaml
#   ② Arquitectura            Deptrac · Pest Arch                                ~30 s
#   ③ Unitarias + Mutacion    Pest Unit · Contract · Feature · MSI >= 80 %       ~2 min
#
# Las tres se ejecutan en CADA push y tienen que devolver resultado en menos de
# 4 minutos en total. El limite no es estetico: una CI lenta se acaba ignorando,
# y una cadena de calidad que nadie mira no verifica nada.
#
# Lo que NO esta aqui, y por que:
#   ③b Trazabilidad   `qa:traceability --check`. Su comando lo crea la tarea 0.7.
#                     Su sitio es entre la etapa ③ y la ④; hay un hueco marcado
#                     al final de la etapa ③.
#   ④-⑧              Integracion, seguridad, frontend, E2E e instalacion limpia.
#                     Se ejecutan en pull request y antes de publicar version
#                     (§10.1), y quedan fuera de la tarea 0.4.
#
# Contract y Feature SI se ejecutan en cada push desde el cierre de la Fase 0,
# aunque el §10.1 las situe en la ④. Mientras la ④ no existiera, no las ejecutaba
# nadie, y `qa:traceability` cuenta sus etiquetas: un requisito podia figurar
# cubierto en la matriz por una prueba parada. Cuestan segundos y no necesitan
# base de datos. Integration sigue esperando a la ④ porque exige PostgreSQL.
#
# Secretos: ninguno. Este workflow no lee `secrets.*`, no escribe ficheros de
# entorno y no imprime variables. El unico token que aparece es `github.token`,
# efimero y de solo lectura (doc 02 §7.7).

name: CI

on:
  # Sin filtro de ramas: el §10.1 dice "en cada push", y una rama corta que no
  # se comprueba es una rama que llega a main sin comprobar.
  push:
  workflow_dispatch:

# Minimo imprescindible. Este workflow lee el codigo y no escribe nada.
permissions:
  contents: read

# Empujar dos veces seguidas no debe dejar dos ejecuciones compitiendo por los
# runners: la anterior ya no interesa a nadie.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Fuente de verdad de estas versiones: infra/docker/php/Dockerfile e
  # infra/docker/node/Dockerfile. Si cambian alli, cambian aqui.
  PHP_VERSION: "8.4"
  NODE_VERSION: "24"

jobs:
  #-----------------------------------------------------------------------------
  # ① Lint + Tipos — backend y scripts de shell
  #-----------------------------------------------------------------------------
  lint-backend:
    name: "① Lint + Tipos · backend"
    runs-on: ubuntu-24.04
    timeout-minutes: 6

    steps:
      - name: Marcar el inicio del job
        run: echo "JOB_START=$(date +%s)" >>"$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # El token de checkout no tiene por que quedarse en .git/config: nada
          # despues de este paso necesita empujar nada (doc 02 §7.7).
          persist-credentials: false

      - name: Fijar las versiones de ShellCheck y shfmt
        # Se leen del Makefile en vez de escribirlas otra vez aqui. Es el mismo
        # motivo por el que la CI llama a `make` y no a los binarios sueltos: si
        # el runner comprueba con otra version que el portatil, el umbral de "0
        # hallazgos" pasa a depender de quien ejecute.
        run: |
          # El filtro no sobra: `eval` de la salida de make ejecuta CUALQUIER
          # cosa que make imprima. Solo se evalua lo que tiene forma de
          # asignacion, para que un aviso del Makefile no acabe siendo una orden.
          eval "$(make -s tool-versions | grep -E '^[A-Z_]+=')"
          echo "Instalando shellcheck ${SHELLCHECK_VERSION} y shfmt ${SHFMT_VERSION}"
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" |
            tar -xJ -C /tmp
          sudo install -m 0755 "/tmp/shellcheck-${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/shellcheck
          curl -fsSL -o /tmp/shfmt "https://github.com/mvdan/sh/releases/download/${SHFMT_VERSION}/shfmt_${SHFMT_VERSION}_linux_amd64"
          sudo install -m 0755 /tmp/shfmt /usr/local/bin/shfmt
          shellcheck --version | head -n 2
          shfmt --version

      - uses: ./.github/actions/php-toolchain
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none

      # A partir de aqui, cada paso es una orden del Makefile. El Makefile detecta
      # CI=true —GitHub Actions la define sola— y ejecuta las herramientas
      # directamente sobre backend/ en lugar de dentro del contenedor. La orden y
      # el umbral se escriben una sola vez, en el Makefile o en el fichero de
      # configuracion de cada herramienta.

      # Marca el inicio de las comprobaciones, ya con el runner preparado. El
      # presupuesto del §10.1 mide las herramientas, no la descarga de PHP.
      - name: Marcar el inicio de las comprobaciones
        run: echo "TOOLS_START=$(date +%s)" >>"$GITHUB_ENV"

      - name: ShellCheck + shfmt -i 2 -d + robustez (0 hallazgos)
        run: make sh-lint

      - name: Pint + PHPStan nivel 9 (0 errores)
        run: make php-lint

      - name: Rector (informativo, no bloquea)
        run: make rector

      - name: Presupuesto de la etapa
        if: always()
        env:
          ETAPA: "① Lint + Tipos · backend"
          PRESUPUESTO: "60"
        run: |
          ahora=$(date +%s)
          comprobaciones=$((ahora - ${TOOLS_START:-$ahora}))
          total=$((ahora - ${JOB_START:-$ahora}))
          {
            echo "### ${ETAPA}"
            echo ""
            echo "| Comprobaciones | Presupuesto §10.1 | Job completo |"
            echo "|---|---|---|"
            echo "| ${comprobaciones} s | ${PRESUPUESTO} s | ${total} s |"
          } >>"$GITHUB_STEP_SUMMARY"
          if [ "$comprobaciones" -gt "$PRESUPUESTO" ]; then
            echo "::warning title=Presupuesto excedido::${ETAPA} ha tardado ${comprobaciones} s frente a los ${PRESUPUESTO} s del doc 02 §10.1."
          fi

  #-----------------------------------------------------------------------------
  # ① Lint + Tipos — frontends
  #
  # ESLint (con eslint-plugin-vue) y vue-tsc son parte de la etapa ① del §10.1,
  # pero los tres frontends no existen hasta la tarea 0.5: hoy solo tienen
  # src/.gitkeep y no hay package.json que instalar.
  #
  # La opcion facil era no escribir este job, o escribirlo de forma que pase
  # siempre. Las dos son peores que esta: un paso en verde que no ha comprobado
  # nada es una mentira que nadie revisa. Lo que hace este job es detectar la
  # ausencia, anunciarla como anotacion y en el resumen de la ejecucion, y
  # terminar. En cuanto la tarea 0.5 cree un package.json, el job empieza a
  # instalar, a pasar ESLint y a pasar vue-tsc sin tocar una linea de este
  # fichero.
  #
  # Contrato con la tarea 0.5: cada frontend expone en package.json los scripts
  # `lint` (ESLint) y `type-check` (vue-tsc --noEmit). Si no estan, este job
  # falla diciendo cual falta.
  #-----------------------------------------------------------------------------
  lint-frontend:
    name: "① Lint + Tipos · ${{ matrix.app }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        app: [frontend-kiosk, frontend-admin, frontend-portal]

    steps:
      - name: Marcar el inicio del job
        run: |
          echo "JOB_START=$(date +%s)" >>"$GITHUB_ENV"
          echo "TOOLS_START=$(date +%s)" >>"$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Comprobar si ${{ matrix.app }} ya existe
        id: detect
        run: |
          if [ -f "${{ matrix.app }}/package.json" ]; then
            echo "present=true" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          echo "present=false" >>"$GITHUB_OUTPUT"
          echo "::notice title=Etapa ① omitida en ${{ matrix.app }}::No hay package.json todavia (lo crea la tarea 0.5). ESLint y vue-tsc no se han ejecutado: este job NO ha comprobado nada de ${{ matrix.app }}."
          {
            echo "### ① ${{ matrix.app }} — OMITIDA"
            echo ""
            echo "No existe \`${{ matrix.app }}/package.json\`: el esqueleto del frontend llega en la"
            echo "tarea **0.5**. ESLint y \`vue-tsc\` **no se han ejecutado**, no es que hayan pasado."
            echo "Este job se activa solo en cuanto el fichero exista."
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Comprobar el contrato de scripts de package.json
        if: steps.detect.outputs.present == 'true'
        run: |
          faltan=""
          for script in lint type-check; do
            jq -e --arg s "$script" '.scripts[$s]' "${{ matrix.app }}/package.json" >/dev/null 2>&1 ||
              faltan="${faltan} ${script}"
          done
          if [ -n "$faltan" ]; then
            echo "::error title=Scripts que faltan en ${{ matrix.app }}::Anade a package.json los scripts:${faltan}. 'lint' ejecuta ESLint y 'type-check' ejecuta vue-tsc --noEmit (doc 02 §3.5 y §9.2)."
            exit 1
          fi

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.detect.outputs.present == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          # El lock de la RAIZ: desde ADR-036 el repositorio es un workspace de
          # npm y las aplicaciones no tienen lockfile propio (frontend-admin
          # nunca lo tuvo tras la migracion, y `npm ci --prefix` sin lockfile
          # falla en seco).
          cache-dependency-path: package-lock.json

      - name: Instalar dependencias
        if: steps.detect.outputs.present == 'true'
        # `npm ci` y no `npm install`: la CI instala lo que dice el lock, no lo
        # que resuelva hoy el registro. En la raiz del workspace: instala las
        # tres SPA y packages/web-kit con el unico arbol real (ADR-036).
        run: npm ci

      # El §3.5 exige que los tipos de la API se GENEREN del contrato y nunca se
      # escriban a mano, y hasta ahora esa fila no tenia herramienta detras: un
      # `schema.d.ts` retocado a mano, o simplemente olvidado tras cambiar el
      # contrato, compilaba igual de bien. Aqui se regenera y se exige que el
      # resultado sea identico a lo versionado. Si el contrato cambio y el
      # cliente no, salta aqui y no en la tablet de un hotel (ADR-013).
      - name: El cliente TypeScript esta regenerado desde el contrato
        if: steps.detect.outputs.present == 'true'
        env:
          CLIENTE: ${{ matrix.app }}/src/shared/api/schema.d.ts
        run: |
          npm run api:generate --prefix ${{ matrix.app }}
          if [ -n "$(git status --porcelain -- "$CLIENTE")" ]; then
            echo "::error title=Cliente de la API desincronizado en ${{ matrix.app }}::docs/api/openapi.yaml ha cambiado y ${CLIENTE} no. Ejecuta 'npm run api:generate --prefix ${{ matrix.app }}' y versiona el resultado."
            git --no-pager diff -- "$CLIENTE"
            exit 1
          fi

      - name: ESLint (0 desviaciones)
        if: steps.detect.outputs.present == 'true'
        run: npm run lint --prefix ${{ matrix.app }}

      - name: vue-tsc en modo estricto (0 errores)
        if: steps.detect.outputs.present == 'true'
        run: npm run type-check --prefix ${{ matrix.app }}

      - name: Presupuesto de la etapa
        if: always() && steps.detect.outputs.present == 'true'
        env:
          ETAPA: "① Lint + Tipos · frontend"
          PRESUPUESTO: "60"
        run: |
          ahora=$(date +%s)
          comprobaciones=$((ahora - ${TOOLS_START:-$ahora}))
          {
            echo "### ${ETAPA} · ${{ matrix.app }}"
            echo ""
            echo "| Comprobaciones | Presupuesto §10.1 |"
            echo "|---|---|"
            echo "| ${comprobaciones} s | ${PRESUPUESTO} s |"
          } >>"$GITHUB_STEP_SUMMARY"
          if [ "$comprobaciones" -gt "$PRESUPUESTO" ]; then
            echo "::warning title=Presupuesto excedido::${ETAPA} (${{ matrix.app }}) ha tardado ${comprobaciones} s frente a los ${PRESUPUESTO} s del doc 02 §10.1."
          fi

  #-----------------------------------------------------------------------------
  # ① Lint + Tipos — contrato de la API
  #
  # Job propio y no un paso mas del backend, por dos motivos. Uno: el contrato no
  # es del backend ni de ninguno de los tres frontends, es de los cuatro, y quien
  # reciba el fallo tiene que leer en el nombre del job que ha roto el contrato de
  # la API y no el estilo de un fichero PHP. Dos: necesita Node y no necesita PHP,
  # asi que compartirlo con `lint-backend` obligaria a instalar las dos cadenas en
  # el mismo runner para ejecutar 40 ms de comprobacion.
  #
  # `docs/api/openapi.yaml` es la fuente de verdad de la API (ADR-013) y se
  # modifica antes que el codigo. Sin esta etapa seria el unico artefacto que
  # manda en el repositorio sin nadie que lo compruebe.
  #-----------------------------------------------------------------------------
  contract:
    name: "① Lint + Tipos · contrato OpenAPI"
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      # La version de @redocly/cli la fija el Makefile, igual que las de
      # ShellCheck y shfmt: entre versiones cambian las reglas del preset
      # `recommended`, y el umbral de 0 problemas no puede depender de lo que
      # resuelva npx el dia de la ejecucion.
      - name: OpenAPI 3.1 valido (0 problemas)
        run: make api-lint

  #-----------------------------------------------------------------------------
  # ② Arquitectura
  #
  # Etapa separada a proposito, y no un paso mas de la ①. Lo que se juega aqui
  # son las reglas duras 1 y 2 de CLAUDE.md —el dominio no importa el framework y
  # no llama al reloj del sistema—, y quien reciba un fallo tiene que poder leer
  # en el nombre de la etapa que ha roto una frontera de arquitectura, no que se
  # ha dejado un espacio. Si un `use Illuminate\...` dentro de Domain/ rompiera la
  # etapa ①, las etapas estarian mal repartidas.
  #
  # Las dos herramientas son complementarias: Deptrac razona sobre imports y Pest
  # Arch ve lo que no aparece en ningun `use` —now(), time(), strtotime()—.
  #-----------------------------------------------------------------------------
  architecture:
    name: "② Arquitectura"
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    needs: [lint-backend, lint-frontend, contract]

    steps:
      - name: Marcar el inicio del job
        run: echo "JOB_START=$(date +%s)" >>"$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/php-toolchain
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none

      - name: Marcar el inicio de las comprobaciones
        run: echo "TOOLS_START=$(date +%s)" >>"$GITHUB_ENV"

      - name: Deptrac (0 violaciones de frontera)
        run: make deptrac

      - name: Pest Arch (reglas duras 1 y 2)
        run: make test-arch

      - name: Presupuesto de la etapa
        if: always()
        env:
          ETAPA: "② Arquitectura"
          PRESUPUESTO: "30"
        run: |
          ahora=$(date +%s)
          comprobaciones=$((ahora - ${TOOLS_START:-$ahora}))
          total=$((ahora - ${JOB_START:-$ahora}))
          {
            echo "### ${ETAPA}"
            echo ""
            echo "| Comprobaciones | Presupuesto §10.1 | Job completo |"
            echo "|---|---|---|"
            echo "| ${comprobaciones} s | ${PRESUPUESTO} s | ${total} s |"
          } >>"$GITHUB_STEP_SUMMARY"
          if [ "$comprobaciones" -gt "$PRESUPUESTO" ]; then
            echo "::warning title=Presupuesto excedido::${ETAPA} ha tardado ${comprobaciones} s frente a los ${PRESUPUESTO} s del doc 02 §10.1."
          fi

  #-----------------------------------------------------------------------------
  # ③ Unitarias + Mutacion
  #-----------------------------------------------------------------------------
  unit:
    name: "③ Unitarias + Mutacion"
    runs-on: ubuntu-24.04
    # 45 y no 8: la mutacion sola tarda ~25 min en la maquina de desarrollo.
    # Con 8, el job moria por timeout antes de terminar aunque todo pasara.
    timeout-minutes: 45
    needs: architecture

    env:
      # Credenciales de usar y tirar para servicios que viven lo que dura el
      # runner (mismo criterio que backup-drill.yml: NO son secretos del
      # producto, los del cliente los genera install.sh en su servidor).
      #
      # La APP_KEY es una clave estatica de pruebas: la suite no cifra nada
      # que sobreviva al runner. DB_CONNECTION es obligatorio porque el
      # default de config/database.php es sqlite y phpunit.xml no lo fuerza
      # (en desarrollo lo aporta el entorno del contenedor `app`).
      APP_KEY: "base64:a3Jvbm9xci1jaS1jbGF2ZS1kZS0zMi1ieXRlcyEhISE="
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_DATABASE: fichaje
      DB_USERNAME: fichaje_app
      DB_PASSWORD: ci_local_app
      DB_MIGRATION_USERNAME: fichaje_migrator
      DB_MIGRATION_PASSWORD: ci_local_migrator
      REDIS_HOST: 127.0.0.1

    steps:
      - name: Marcar el inicio del job
        run: echo "JOB_START=$(date +%s)" >>"$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: PostgreSQL 17 del producto y Redis 7
        # La imagen del producto y no la oficial, como en backup-drill.yml: sus
        # scripts de initdb crean los TRES roles (regla dura 6, ADR-033) y la
        # base `fichaje_test` que exige phpunit.xml. Sin ellos, RefreshDatabase
        # no puede migrar con el rol de migracion y la suite Feature entera
        # falla. POSTGRES_USER es el rol de migracion porque en un cluster
        # nuevo el rol de arranque ES el de migracion (02-application-roles.sh).
        #
        # Se arranca ANTES de instalar PHP para que el initdb corra en paralelo
        # con composer install; la espera de pg_isready va justo antes de la
        # primera suite que lo necesita.
        # `make build-ci-images` (por defecto IMAGES=postgres, sin cache): la
        # misma orden que usan el job `security` y backup-drill.yml, en un solo
        # objetivo (IMPORTANTE 10 de la auditoria) para que las tres no puedan
        # divergir sin que nadie lo note.
        run: |
          make build-ci-images
          docker run -d --name kronoqr-pg \
            -e POSTGRES_DB="$DB_DATABASE" \
            -e POSTGRES_USER="$DB_MIGRATION_USERNAME" \
            -e POSTGRES_PASSWORD="$DB_MIGRATION_PASSWORD" \
            -e DB_PASSWORD="$DB_PASSWORD" \
            -p 5432:5432 \
            kronoqr/postgres:ci \
            postgres -c timezone=UTC -c log_timezone=UTC \
              -c hba_file=/etc/kronoqr/pg_hba.conf
          docker run -d --name kronoqr-redis -p 6379:6379 redis:7-alpine

      - uses: ./.github/actions/php-toolchain
        with:
          php-version: ${{ env.PHP_VERSION }}
          # La mutacion necesita cobertura. Xdebug se instala apagado y lo
          # enciende el propio objetivo del Makefile con XDEBUG_MODE=coverage,
          # para que la suite unitaria no pague el precio.
          coverage: xdebug

      - name: Marcar el inicio de las comprobaciones
        run: echo "TOOLS_START=$(date +%s)" >>"$GITHUB_ENV"

      - name: Pest — suite unitaria (dominio puro, sin base de datos)
        run: make test-unit

      - name: Esperar a PostgreSQL
        # Recien aqui y no al arrancarlo: el initdb (extensiones, roles,
        # fichaje_test) corre en paralelo con composer install y la suite
        # unitaria, que no toca base de datos.
        #
        # `-h 127.0.0.1`: por el socket Unix tambien contesta el servidor
        # temporal de initdb (el que ejecuta initdb.d); por TCP solo el
        # definitivo. Mismo motivo que en backup-drill.yml.
        run: |
          for i in $(seq 1 30); do
            if docker exec kronoqr-pg pg_isready -h 127.0.0.1 -U "$DB_MIGRATION_USERNAME" -d "$DB_DATABASE" >/dev/null 2>&1; then
              echo "PostgreSQL listo en $((i * 2)) s"; exit 0
            fi
            sleep 2
          done
          echo "::error title=PostgreSQL no arranco::pg_isready sigue fallando tras 60 s."
          docker logs kronoqr-pg | tail -50
          exit 1

      - name: Pest — contrato OpenAPI y feature
        # Añadido al cerrar la Fase 0, cuando estas suites no tocaban base de
        # datos. La Fase 1 les dio esquema real (1.3) y Feature entera migra con
        # RefreshDatabase, asi que desde entonces necesitan el PostgreSQL del
        # paso de servicios de arriba — sin el, este job estuvo fallando en cada
        # push durante media fase sin que nadie mirase Actions (hallazgo de la
        # auditoria de cierre de la Fase 1).
        #
        # Siguen aqui y no en la etapa ④ (pull request, tarea 3.x) por la misma
        # razon de entonces: `qa:traceability` cuenta las etiquetas de estas
        # suites, y un requisito no puede figurar cubierto por una prueba que
        # ningun workflow ejecuta.
        run: make test-contract

      - name: Mutacion sobre Modules/*/Domain (MSI >= 80 %)
        # El umbral --min=80 vive en el Makefile, no aqui. Hoy este paso NO
        # ejecuta mutantes: el dominio se escribe en la tarea 1.1 y el MSI empieza
        # a exigirse en la 1.2. El objetivo lo dice por su cuenta y emite una
        # anotacion de GitHub cuando corre en la CI, para que quede en el resumen
        # de la ejecucion y no parezca una comprobacion que ha pasado.
        run: make mutate

      # --- etapa ③b · Trazabilidad y coherencia documental --------------------
      #
      # Los dos son BLOQUEANTES (§10.1, §9.6). Van juntos y aqui porque
      # comprueban lo mismo desde dos lados: que lo que los documentos dicen y
      # lo que el repositorio hace no han divergido.
      #
      # `--check` no escribe nada. La matriz se regenera con `make traceability`
      # desde el host, porque docs/ se monta de solo lectura en el contenedor.

      - name: Trazabilidad requisito → prueba (RQ-13)
        # Falla si un requisito de una fase YA EJECUTADA no tiene ninguna prueba
        # que lo referencie. El alcance sale de docs/requisitos.yaml filtrando
        # por el orden real de ejecucion (0 -> 1 -> 2 -> 5 -> 3 -> 4), asi que un
        # requisito de la Fase 3 no bloquea mientras se trabaja en la Fase 1.
        run: make traceability-check

      - name: Coherencia documental (RQ-12, RNF-M-04)
        # Falla si un ADR del §4 no tiene fichero, si un requisito no lo
        # construye ninguna tarea del plan, o si la fase de un requisito no
        # coincide con la de su tarea. Los seis hallazgos bloqueantes de la
        # auditoria previa fueron ese mismo fallo repetido, y los tres son
        # mecanicamente detectables: los encontro una persona leyendo seis
        # ficheros a la vez, que es justo lo que esto sustituye.
        run: make docs-consistency

      - name: Presupuesto de la etapa
        if: always()
        env:
          ETAPA: "③ Unitarias + Mutacion"
          PRESUPUESTO: "120"
        run: |
          ahora=$(date +%s)
          comprobaciones=$((ahora - ${TOOLS_START:-$ahora}))
          total=$((ahora - ${JOB_START:-$ahora}))
          {
            echo "### ${ETAPA}"
            echo ""
            echo "| Comprobaciones | Presupuesto §10.1 | Job completo |"
            echo "|---|---|---|"
            echo "| ${comprobaciones} s | ${PRESUPUESTO} s | ${total} s |"
          } >>"$GITHUB_STEP_SUMMARY"
          if [ "$comprobaciones" -gt "$PRESUPUESTO" ]; then
            echo "::warning title=Presupuesto excedido::${ETAPA} ha tardado ${comprobaciones} s frente a los ${PRESUPUESTO} s del doc 02 §10.1."
          fi

  #-----------------------------------------------------------------------------
  # Puerta de version — CHANGELOG (doc 02 §10.5)
  #
  # En cada push comprueba que el CHANGELOG existe y esta bien formado, que es
  # barato. Cuando el push es una etiqueta `vX.Y.Z`, ademas exige que esa version
  # tenga entrada con cambios: una version que se publica sin decir que cambia
  # deja al IT del hotel actualizando a ciegas, y el actualizador de la tarea 5.7
  # lee justamente este fichero.
  #
  # No depende de las otras etapas a proposito: es una comprobacion de metadatos y
  # no tiene por que esperar a nadie.
  #-----------------------------------------------------------------------------
  #-----------------------------------------------------------------------------
  # Analisis de dependencias y de codigo (RS-10)
  #
  # RS-10 exige «analisis de dependencias y de codigo en cada pull request;
  # ninguna vulnerabilidad critica o alta puede llegar a una version publicada»,
  # y es requisito de la Fase 0 en el Anexo A.
  #
  # El §10.1 lo situa en la etapa ⑤, que se ejecuta en pull request y queda
  # fuera del alcance de la tarea 0.4. Pero las herramientas ya existen y
  # engancharlas cuesta un job: diferirlo habria dejado un requisito de la Fase
  # 0 sin cumplir por comodidad, no por criterio. Se ejecuta en cada push, que
  # es mas estricto que lo que RS-10 pide, no menos.
  #
  # Cada control nuevo se ha probado EN LOCAL antes de decidir si bloquea (ver
  # el detalle en cada objetivo del Makefile): lo que hoy pasa limpio es
  # bloqueante desde el primer dia; lo que tiene hallazgos entra en modo
  # informe —`continue-on-error: true` mas el log como artefacto— con un TODO
  # fechado para revisarlo. Ninguna herramienta nueva trae su propia GitHub
  # Action: todas se invocan con el `make` correspondiente, igual que
  # `deps-audit-php`/`deps-audit-js`/`sast` de mas abajo, para que la orden y el
  # umbral sigan viviendo en un solo sitio (cabecera del Makefile).
  #
  # gitleaks NO usa la Action oficial `gitleaks/gitleaks-action`: su `action.yml`
  # esta bajo la licencia comercial de Gitleaks LLC y exige `GITLEAKS_LICENSE`
  # para organizaciones — un secreto que este repositorio no tiene y que nadie
  # ha pedido aprovisionar. El binario de gitleaks en si es MIT y gratuito:
  # `make secrets-scan` lo invoca igual que Semgrep y Trivy, sin licencia que
  # gestionar (TODO 2026-08-28: si en algun momento se paga la licencia, migrar
  # a la Action oficial da anotaciones en el diff del PR que este paso no da).
  #-----------------------------------------------------------------------------
  security:
    name: "Dependencias y SAST"
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # gitleaks recorre el HISTORICO completo (mas abajo), no solo el
          # arbol de trabajo: con el checkout superficial por defecto no veria
          # nada anterior al ultimo commit.
          fetch-depth: 0

      - uses: ./.github/actions/php-toolchain
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none

      - name: composer audit (0 vulnerabilidades)
        run: make deps-audit-php

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: npm audit del workspace (0 criticas ni altas)
        run: make deps-audit-js

      - name: Semgrep sobre las reglas propias (0 hallazgos de severidad alta)
        # Las reglas de .semgrep/ son las que ninguna otra herramienta puede
        # ver: la regla dura 2 en su forma `new DateTimeImmutable()` sin
        # instante, y las supresiones de PHPStan sin motivo escrito.
        run: make sast

      - name: Semgrep comunitario — PHP/JS/TS/OWASP (0 hallazgos, bloqueante)
        id: sast_community
        # BLOQUEANTE desde el 29-08-2026: los 9 hallazgos que tenia estan
        # triados (detalle en el objetivo del Makefile) y el umbral es 0. Un
        # hallazgo nuevo se corrige o se justifica con `# nosemgrep` y motivo
        # (docs/runbooks/triaje-hallazgos-seguridad.md); nunca se renueva un
        # plazo.
        #
        # Semgrep con `--error`: 0 sin hallazgos, 1 CON hallazgos, 2+ si la
        # herramienta no pudo terminar (config invalida, fallo al resolver
        # `p/php` y compania, etc.). El objetivo del Makefile absorbe el 1 (make
        # lo convertiria en 2, indistinguible de un fallo real) y silencia el eco
        # de la orden, que ensuciaba el JSON: aqui solo llega 0 o 2+. El `||` de la primera linea CAPTURA el
        # codigo sin que `-e` (activado por defecto en los pasos `run:` de
        # GitHub Actions) aborte el script -- si abortara ahi, jamas
        # llegariamos a distinguir 1 (informe) de 2+ (fallo real), que es
        # justo lo que faltaba: antes, `continue-on-error: true` trataba los
        # dos casos igual (IMPORTANTE 5 de la auditoria).
        run: |
          make sast-community SEMGREP_FORMAT=json >sast-community.json || status=$?
          status=${status:-0}
          jq -r '(.results // []) | group_by(.extra.severity) | map("\(.[0].extra.severity): \(length)") | .[]' \
            sast-community.json | tee sast-community.log
          total=$(jq -r '(.results // []) | length' sast-community.json 2>/dev/null || echo 0)
          {
            echo "### Semgrep comunitario — hallazgos por severidad (umbral: 0)"
            echo ""
            if [ -s sast-community.log ]; then
              echo '```'
              cat sast-community.log
              echo '```'
            else
              echo "0 hallazgos."
            fi
          } >>"$GITHUB_STEP_SUMMARY"
          [ "$status" -eq 0 ] || {
            echo "::error title=Semgrep comunitario ha fallado::codigo de salida ${status} (2+ significa que la herramienta no pudo terminar, no son hallazgos)."
            exit "$status"
          }
          [ "$total" -eq 0 ] || {
            jq -r '.results[] | "::error file=\(.path),line=\(.start.line),title=Semgrep \(.extra.severity)::\(.check_id)"' sast-community.json
            echo "::error title=Semgrep comunitario::${total} hallazgo(s). Corrige o justifica cada uno con '# nosemgrep' y su motivo (docs/runbooks/triaje-hallazgos-seguridad.md)."
            exit 1
          }

      - name: gitleaks sobre el historico completo (0 hallazgos, bloqueante)
        # BLOQUEANTE desde hoy: verificado en local sobre las 75 commits de
        # este repositorio, 0 hallazgos con la allowlist minima de
        # .gitleaks.toml (17 falsos positivos analizados uno a uno, ver el
        # fichero). Si esto rompe algun dia, NO se reescribe el historico para
        # arreglarlo: se reporta el commit y la ruta para que se decida
        # (§7.7).
        run: make secrets-scan

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        # A partir de aqui, Trivy necesita imagenes YA CONSTRUIDAS: la de
        # PostgreSQL (que el job `unit` tambien construye, en su propio
        # runner, sin compartir cache con este) y la de la aplicacion, que
        # NINGUN job construye todavia. `docker buildx` con la cache de
        # GitHub Actions evita que cada push reconstruya desde cero: solo
        # paga el precio completo la primera vez y cuando cambian las capas.

      - uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0
        # Sin esto, `docker buildx build --cache-to type=gha` desde un paso
        # `run:` suelto (no `docker/build-push-action`) no ve
        # `ACTIONS_RUNTIME_TOKEN`/`ACTIONS_CACHE_URL` y aborta con "failed to
        # configure gha cache exporter", tumbando el job entero porque el
        # paso no lleva `continue-on-error` (BLOQUEANTE 2 de la auditoria).
        # Esta accion exporta esas dos variables al entorno de los pasos
        # siguientes. Alternativa descartada: quitar `type=gha` y construir
        # sin cache -- se prueba en local que cuesta minutos extra en cada
        # push por las dos imagenes (PostgreSQL con extensiones y la app con
        # Chromium/Node), justo el tipo de coste que la cache de Actions
        # existe para evitar; instalar esta accion, fijada por SHA, es mas
        # barato que pagar esa reconstruccion en cada ejecucion.

      - name: Construir kronoqr/postgres:ci y kronoqr/app:ci (con cache de Actions)
        # `make build-ci-images` (IMPORTANTE 10 de la auditoria: la misma
        # orden que usan el job `unit` y backup-drill.yml, en un solo
        # objetivo). Aqui, y solo aqui, con BUILDX_CACHE=gha: es el unico job
        # que construye las DOS imagenes en cada push y el unico que tiene
        # justo encima el paso de `ghaction-github-runtime`.
        run: make build-ci-images IMAGES="postgres app" BUILDX_CACHE=gha

      - name: Trivy fs — dependencias, Dockerfiles y secretos del repo (bloqueante)
        id: trivy_fs
        # BLOQUEANTE desde el 29 de agosto de 2026: el unico hallazgo que
        # tenia (DS-0002, el Dockerfile de PostgreSQL sin `USER`) se corrigio
        # en la propia imagen, no con una excepcion. El TRIVY_EXIT_CODE por
        # defecto del Makefile (1) hace que Trivy devuelva 1 con hallazgos
        # HIGH/CRITICAL. El codigo se captura ANTES de escribir el resumen
        # para que el desglose por severidad llegue al resumen de la ejecucion
        # tambien cuando el paso falla: el JSON se escribe igual con o sin
        # hallazgos, y es lo primero que hay que leer al triar
        # (docs/runbooks/triaje-hallazgos-seguridad.md).
        run: |
          set +e
          make trivy-fs TRIVY_FORMAT=json >trivy-fs.json
          estado=$?
          set -e
          jq -r '
            [.Results[]? | (.Vulnerabilities // [])[], (.Misconfigurations // [])[], (.Secrets // [])[]]
            | group_by(.Severity) | map("\(.[0].Severity): \(length)") | .[]
          ' trivy-fs.json | tee trivy-fs.log
          {
            echo "### Trivy fs — hallazgos HIGH/CRITICAL por severidad (bloqueante)"
            echo ""
            if [ -s trivy-fs.log ]; then
              echo '```'
              cat trivy-fs.log
              echo '```'
            else
              echo "0 hallazgos."
            fi
          } >>"$GITHUB_STEP_SUMMARY"
          exit "$estado"

      - name: Trivy image — postgres:ci y app:ci (bloqueante)
        id: trivy_image
        # BLOQUEANTE desde el 29 de agosto de 2026. Los 21 HIGH que tenia
        # kronoqr/postgres:ci estaban todos en usr/local/bin/gosu (Go stdlib
        # de la imagen oficial), y la imagen ya no lleva ese binario: arranca
        # como `postgres` y no necesita bajar privilegios
        # (infra/docker/postgres/Dockerfile). infra/docker/.trivyignore.yaml
        # queda sin excepciones vigentes. Mismo tratamiento del codigo de
        # salida que en el paso anterior.
        run: |
          set +e
          make trivy-image TRIVY_FORMAT=json >trivy-image.json
          estado=$?
          set -e
          jq -s -r '
            [.[] | .Results[]? | (.Vulnerabilities // [])[], (.Misconfigurations // [])[], (.Secrets // [])[]]
            | group_by(.Severity) | map("\(.[0].Severity): \(length)") | .[]
          ' trivy-image.json | tee trivy-image.log
          {
            echo "### Trivy image — hallazgos HIGH/CRITICAL por severidad (bloqueante)"
            echo ""
            if [ -s trivy-image.log ]; then
              echo '```'
              cat trivy-image.log
              echo '```'
            else
              echo "0 hallazgos."
            fi
          } >>"$GITHUB_STEP_SUMMARY"
          exit "$estado"

      - name: SBOM CycloneDX
        run: make sbom

      - name: Subir los informes de seguridad y el SBOM
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: seguridad-informe-y-sbom
          path: |
            sast-community.log
            sast-community.json
            trivy-fs.log
            trivy-fs.json
            trivy-image.log
            trivy-image.json
            sbom/
          retention-days: 90
          if-no-files-found: warn

      # Desde el 29 de agosto de 2026 NINGUN paso de este job corre en modo
      # informe: gitleaks, Semgrep comunitario, Trivy fs y Trivy image son
      # bloqueantes. Si algun control tiene que volver a informe (una
      # herramienta nueva que aun no pasa limpia), la convencion es la de
      # infra/docker/.trivyignore.yaml -- fecha de caducidad obligatoria -- y
      # el mecanismo que la hacia cumplir era un ultimo paso `if: always()`
      # con una lista `nombre;AAAA-MM-DD` que fallaba pasada la fecha (MENOR
      # 13 de la auditoria; en el historial de git, commit `ci(security)`).
      # Recuperalo de ahi en vez de reinventarlo; el runbook
      # docs/runbooks/triaje-hallazgos-seguridad.md explica cuando procede.

  changelog:
    name: "Puerta de version · CHANGELOG"
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # El generador necesita el historico completo para clasificar los
          # commits desde la ultima etiqueta.
          fetch-depth: 0
          persist-credentials: false

      - name: Formato del CHANGELOG
        run: make changelog-check

      - name: La version etiquetada tiene entrada
        if: startsWith(github.ref, 'refs/tags/v')
        run: make changelog-check VERSION="${GITHUB_REF_NAME#v}"
