# KronoQR — pipeline completo (doc 02 §10.1).
#
#   ① Lint + Tipos            Pint · PHPStan 9 · ESLint · vue-tsc · ShellCheck   ~2-3,5 min (backend)
#                             + @redocly/cli sobre docs/api/openapi.yaml
#   ② Arquitectura            Deptrac · Pest Arch                                ~50 s
#   ③ Unitarias + Mutacion    Pest Unit · Contract · Feature · MSI >= 80 % sobre ~4-10 min
#                             el CONJUNTO de ficheros de Domain que el cambio toca
#                             (`make mutate-changed`, frente a `origin/main` en toda
#                             rama y en `workflow_dispatch`);
#                             la completa (`make mutate`, MSI global) es el job
#                             `mutation`, al final del fichero, junto a `coverage`:
#                             nocturna y en `workflow_dispatch`
#   ③b Trazabilidad           qa:traceability --check · docs:consistency --check (dentro del job ③, al final)
#   ④ Integracion             Pest --testsuite=Integration con PostgreSQL real   ~10-15 min
#                             (invariantes SQL, MigrationsRoundTripTest, los caminos
#                             de install.sh/update.sh que no necesitan Docker ni root)
#   ⑤ Seguridad               composer/npm audit · Semgrep propio + comunitario ·
#                             gitleaks · Trivy fs/image · SBOM                   ~2 min
#   ⑥ Frontend unitarias      Vitest de los CUATRO paquetes del workspace
#                             (packages/web-kit + las tres SPA)                  ~2 min
#   ⑦ E2E                     Playwright + camara simulada + axe                 ~5 min
#   ⑧ Instalacion limpia      `clean-install`, desde la tarea 5.4. Levanta el producto
#                             entero en un runner virgen con el instalador y comprueba
#                             los cuatro escenarios de RQ-11. No corre en cada push
#                             -cuesta entre 6 y 18 minutos-: corre en `main`, en cada
#                             etiqueta `vX.Y.Z` y a mano con «Run workflow».
#   ⑧b Actualizacion          `update`, desde la tarea 5.7: instala la version anterior
#                             (el `main` previo hasta que exista la primera etiqueta con
#                             instalador), la actualiza con update.sh, comprueba la
#                             idempotencia y la VUELTA ATRAS con un fallo inyectado, y
#                             restaura la copia previa en limpio. Mismos disparadores
#                             que la ⑧; 45-60 min en frio.
#
# POR QUE TODO EN CADA PUSH, Y NO "④-⑦ en pull request" COMO DICE EL §10.1. Este
# repositorio no dispara en `pull_request` (mira el `on:` de mas abajo: solo
# `push` y `workflow_dispatch`), y una etapa que solo corre en un evento que
# nadie emite no corre nunca. Cada etapa que el §10.1 sitúa "en pull request"
# corre aqui en cada push -mas estricto, no menos-, el mismo criterio que ya se
# aplico a Contract y Feature (parte de la etapa ④) desde el cierre de la Fase
# 0, y a la etapa ⑤ (seguridad) desde la misma fecha.
#
# Las etapas ①-④ y ⑥-⑦ tienen que devolver resultado en un tiempo razonable en
# cada push: una CI lenta se acaba ignorando, y una cadena de calidad que nadie
# mira no verifica nada. Los presupuestos de cada etapa son los del §10.1;
# cada job los comprueba con una anotacion `::warning`, no con un fallo duro
# -son un termometro, no una puerta mas-.
#
# PRESUPUESTO DE ①-③ (R1-DV-01, 02-10-2026): menos de 15 minutos de reloj en un
# push normal, medidos desde que arranca el run hasta que termina ③. Medido en
# tres pushes a `main` del 01-10-2026 (runs 36838676776, 36878835101 y
# 36903163493): 8,9, 14,4 y 8,2 min de extremo a extremo, con ① backend 2:10-
# 3:28, ② 0:46-0:57 y ③ 3:41-10:06 -la ruta critica es ① -> ② -> ③ porque cada
# una espera a la anterior-. El "menos de 4 minutos" que decia el §10.1 no se
# cumplio en NINGUNA medicion (solo ① backend tarda mas de 2) y se sustituyo
# por lo medido. La CI completa de un push (hasta ④, la mas lenta) termina en
# 15-19 min. Si ① -> ③ pasa de 15 min, se mide y se arregla, no se sube.
#
# LA PUERTA DE COBERTURA (RNF-M-01: dominio >= 90 %, global >= 75 %, doc 02
# §9.2) NO ES NINGUNA DE LAS OCHO ETAPAS NUMERADAS. `make coverage` instrumenta
# con Xdebug la suite ENTERA -Unit, Integration, Feature y Contract juntas, no
# solo Unit- y tarda ~15 minutos medidos en este mismo runner (job `coverage`,
# al final del fichero): casi lo que suman las etapas ①-④. Correr eso en cada
# push duplicaria, con Xdebug encendido, un trabajo que la etapa ③ ya paga sin
# el, y por el mismo motivo que la etapa ⑧ no corre en cada push. Se ejecuta de
# noche (`schedule`) y a mano (`workflow_dispatch`), nunca en un push normal.
#
# LA MUTACION COMPLETA (RQ-10: MSI >= 80 % sobre Modules/*/Domain, doc 02 §9.2)
# TAMPOCO CORRE ENTERA EN CADA PUSH, desde el 24-09-2026. `make mutate` sobre
# el dominio completo tarda 37-57 min medidos: eso no cabe en las etapas ①-③.
# La etapa ③ muta SOLO los ficheros de `Modules/*/Domain` que el cambio toca
# (`make mutate-changed`, dentro del job `unit`) y exige el 80 % sobre el
# CONJUNTO de esos ficheros (Pest da una sola nota por ejecucion, no una por
# fichero): frente a `origin/main` en cualquier rama y en `workflow_dispatch`
# -asi el check «③» del mismo SHA dice lo mismo en los dos eventos-, y frente
# al `before` del push solo en `main` (R6-DV-01/02: antes el disparo manual solo
# miraba el MSI global y esta puerta no se evaluaba hasta entrar en `main`). La
# pasada COMPLETA, MSI global, es el job
# `mutation`, al final del fichero junto a `coverage` -mismo `if`, nocturna y
# a mano- porque `unit` no puede alojarla: no se ejecuta en `schedule` (ver
# mas abajo). El umbral `--min=80` no cambia en ningun caso: lo unico que
# cambia es cuantos ficheros mide cada pasada.
#
# ⑦ E2E sustituye al marcador `.github/workflows/e2e.yml` (retirado, no
# reemplazado por un workflow separado): el patron de este repositorio es UN
# workflow con un job por etapa, no una composicion de workflows con
# `workflow_call`, y ⑦ no es distinta de ⑤ o de ⑧ en eso.
#
# Secretos: ninguno. Este workflow no lee `secrets.*`, no escribe ficheros de
# entorno y no imprime variables. El unico token que aparece es `github.token`,
# efimero y de solo lectura (doc 02 §7.7).

name: CI

on:
  # Sin filtro de ramas: el §10.1 dice "en cada push", y una rama corta que no
  # se comprueba es una rama que llega a main sin comprobar.
  push:
  workflow_dispatch:
    inputs:
      apk_index_stamp:
        description: "Fuerza el refresco de la capa de paquetes Alpine de las imagenes (runbook triaje-hallazgos-seguridad.md, punto 1): un valor nuevo, p. ej. la salida de `date -u +%s`, reconstruye la capa aunque el dia no haya cambiado. Vacio = sello diario de make."
        required: false
        default: ""
  schedule:
    # Dispara SOLO los jobs nocturnos: `coverage`, `mutation` y
    # `secrets-history` (ver sus comentarios). Todos los demas de este fichero
    # llevan `if: github.event_name != 'schedule'` -o la variante que ya tenian
    # `clean-install`/`update`, que sin la exclusion explicita habrian
    # arrastrado el pipeline entero, y `install`/`update` con el, cada noche. Hora fuera del horario de trabajo habitual
    # del equipo (España, UTC+1/+2).
    - cron: "17 3 * * *"

# Minimo imprescindible. Este workflow lee el codigo y no escribe nada.
permissions:
  contents: read

# Empujar dos veces seguidas no debe dejar dos ejecuciones compitiendo por los
# runners: la anterior ya no interesa a nadie.
#
# El grupo incluye el TIPO de evento (R6-DV-01, 02-10-2026): `push`,
# `workflow_dispatch` y `schedule` cubren cosas distintas -el disparo manual
# corre la mutacion y la cobertura completas; el push, no; el `schedule`, solo
# esas dos- y con un grupo comun un run cancelaba a otro que cubria algo que el
# no cubria (el disparo manual cancelaba al push; el `schedule` de las 03:17
# cancelo el push de `main` cuando solo le quedaba ④). Asi cada run solo
# cancela a uno MAS ANTIGUO DEL MISMO TIPO. Coste: un push y un disparo manual
# sobre la misma rama corren a la vez.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  # Fuente de verdad de estas versiones: infra/docker/php/Dockerfile e
  # infra/docker/node/Dockerfile. Si cambian alli, cambian aqui.
  PHP_VERSION: "8.4"
  NODE_VERSION: "24"

jobs:
  #-----------------------------------------------------------------------------
  # ① Lint + Tipos — backend y scripts de shell
  #-----------------------------------------------------------------------------
  lint-backend:
    name: "① Lint + Tipos · backend"
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    # El `schedule` nocturno solo existe para los jobs nocturnos: `coverage`,
    # `mutation` y `secrets-history` (ver cabecera).
    # Sin esto, la entrada de cron dispararia el pipeline entero cada noche.
    if: github.event_name != 'schedule'

    steps:
      - name: Marcar el inicio del job
        run: echo "JOB_START=$(date +%s)" >>"$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # El token de checkout no tiene por que quedarse en .git/config: nada
          # despues de este paso necesita empujar nada (doc 02 §7.7).
          persist-credentials: false

      - name: Fijar las versiones de ShellCheck y shfmt
        # Se leen del Makefile en vez de escribirlas otra vez aqui. Es el mismo
        # motivo por el que la CI llama a `make` y no a los binarios sueltos: si
        # el runner comprueba con otra version que el portatil, el umbral de "0
        # hallazgos" pasa a depender de quien ejecute.
        run: |
          # El filtro no sobra: `eval` de la salida de make ejecuta CUALQUIER
          # cosa que make imprima. Solo se evalua lo que tiene forma de
          # asignacion, para que un aviso del Makefile no acabe siendo una orden.
          eval "$(make -s tool-versions | grep -E '^[A-Z_]+=')"
          echo "Instalando shellcheck ${SHELLCHECK_VERSION} y shfmt ${SHFMT_VERSION}"
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" |
            tar -xJ -C /tmp
          sudo install -m 0755 "/tmp/shellcheck-${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/shellcheck
          curl -fsSL -o /tmp/shfmt "https://github.com/mvdan/sh/releases/download/${SHFMT_VERSION}/shfmt_${SHFMT_VERSION}_linux_amd64"
          sudo install -m 0755 /tmp/shfmt /usr/local/bin/shfmt
          shellcheck --version | head -n 2
          shfmt --version

      - uses: ./.github/actions/php-toolchain
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none

      # A partir de aqui, cada paso es una orden del Makefile. El Makefile detecta
      # CI=true —GitHub Actions la define sola— y ejecuta las herramientas
      # directamente sobre backend/ en lugar de dentro del contenedor. La orden y
      # el umbral se escriben una sola vez, en el Makefile o en el fichero de
      # configuracion de cada herramienta.

      # Marca el inicio de las comprobaciones, ya con el runner preparado. El
      # presupuesto del §10.1 mide las herramientas, no la descarga de PHP.
      - name: Marcar el inicio de las comprobaciones
        run: echo "TOOLS_START=$(date +%s)" >>"$GITHUB_ENV"

      - name: ShellCheck + shfmt -i 2 -d + robustez (0 hallazgos)
        run: make sh-lint

      - name: Pint + PHPStan nivel 9 (0 errores)
        run: make php-lint

      - name: Rector (informativo, no bloquea)
        run: make rector

      - name: Presupuesto de la etapa
        if: always()
        env:
          ETAPA: "① Lint + Tipos · backend"
          PRESUPUESTO: "60"
        run: |
          ahora=$(date +%s)
          comprobaciones=$((ahora - ${TOOLS_START:-$ahora}))
          total=$((ahora - ${JOB_START:-$ahora}))
          {
            echo "### ${ETAPA}"
            echo ""
            echo "| Comprobaciones | Presupuesto §10.1 | Job completo |"
            echo "|---|---|---|"
            echo "| ${comprobaciones} s | ${PRESUPUESTO} s | ${total} s |"
          } >>"$GITHUB_STEP_SUMMARY"
          if [ "$comprobaciones" -gt "$PRESUPUESTO" ]; then
            echo "::warning title=Presupuesto excedido::${ETAPA} ha tardado ${comprobaciones} s frente a los ${PRESUPUESTO} s del doc 02 §10.1."
          fi

  #-----------------------------------------------------------------------------
  # ① Lint + Tipos — frontends
  #
  # ESLint (con eslint-plugin-vue) y vue-tsc son parte de la etapa ① del §10.1,
  # pero los tres frontends no existen hasta la tarea 0.5: hoy solo tienen
  # src/.gitkeep y no hay package.json que instalar.
  #
  # La opcion facil era no escribir este job, o escribirlo de forma que pase
  # siempre. Las dos son peores que esta: un paso en verde que no ha comprobado
  # nada es una mentira que nadie revisa. Lo que hace este job es detectar la
  # ausencia, anunciarla como anotacion y en el resumen de la ejecucion, y
  # terminar. En cuanto la tarea 0.5 cree un package.json, el job empieza a
  # instalar, a pasar ESLint y a pasar vue-tsc sin tocar una linea de este
  # fichero.
  #
  # Contrato con la tarea 0.5: cada frontend expone en package.json los scripts
  # `lint` (ESLint) y `type-check` (vue-tsc --noEmit). Si no estan, este job
  # falla diciendo cual falta.
  #-----------------------------------------------------------------------------
  lint-frontend:
    name: "① Lint + Tipos · ${{ matrix.app }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    # Ver el comentario de `lint-backend`: el `schedule` es solo para los jobs nocturnos.
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        app: [frontend-kiosk, frontend-admin, frontend-portal]

    steps:
      - name: Marcar el inicio del job
        run: |
          echo "JOB_START=$(date +%s)" >>"$GITHUB_ENV"
          echo "TOOLS_START=$(date +%s)" >>"$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Comprobar si ${{ matrix.app }} ya existe
        id: detect
        run: |
          if [ -f "${{ matrix.app }}/package.json" ]; then
            echo "present=true" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          echo "present=false" >>"$GITHUB_OUTPUT"
          echo "::notice title=Etapa ① omitida en ${{ matrix.app }}::No hay package.json todavia (lo crea la tarea 0.5). ESLint y vue-tsc no se han ejecutado: este job NO ha comprobado nada de ${{ matrix.app }}."
          {
            echo "### ① ${{ matrix.app }} — OMITIDA"
            echo ""
            echo "No existe \`${{ matrix.app }}/package.json\`: el esqueleto del frontend llega en la"
            echo "tarea **0.5**. ESLint y \`vue-tsc\` **no se han ejecutado**, no es que hayan pasado."
            echo "Este job se activa solo en cuanto el fichero exista."
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Comprobar el contrato de scripts de package.json
        if: steps.detect.outputs.present == 'true'
        run: |
          faltan=""
          for script in lint type-check; do
            jq -e --arg s "$script" '.scripts[$s]' "${{ matrix.app }}/package.json" >/dev/null 2>&1 ||
              faltan="${faltan} ${script}"
          done
          if [ -n "$faltan" ]; then
            echo "::error title=Scripts que faltan en ${{ matrix.app }}::Anade a package.json los scripts:${faltan}. 'lint' ejecuta ESLint y 'type-check' ejecuta vue-tsc --noEmit (doc 02 §3.5 y §9.2)."
            exit 1
          fi

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.detect.outputs.present == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          # El lock de la RAIZ: desde ADR-036 el repositorio es un workspace de
          # npm y las aplicaciones no tienen lockfile propio (frontend-admin
          # nunca lo tuvo tras la migracion, y `npm ci --prefix` sin lockfile
          # falla en seco).
          cache-dependency-path: package-lock.json

      - name: Instalar dependencias
        if: steps.detect.outputs.present == 'true'
        # `npm ci` y no `npm install`: la CI instala lo que dice el lock, no lo
        # que resuelva hoy el registro. En la raiz del workspace: instala las
        # tres SPA y packages/web-kit con el unico arbol real (ADR-036).
        run: npm ci

      # El §3.5 exige que los tipos de la API se GENEREN del contrato y nunca se
      # escriban a mano, y hasta ahora esa fila no tenia herramienta detras: un
      # `schema.d.ts` retocado a mano, o simplemente olvidado tras cambiar el
      # contrato, compilaba igual de bien. Aqui se regenera y se exige que el
      # resultado sea identico a lo versionado. Si el contrato cambio y el
      # cliente no, salta aqui y no en la tablet de un hotel (ADR-013).
      - name: El cliente TypeScript esta regenerado desde el contrato
        if: steps.detect.outputs.present == 'true'
        env:
          CLIENTE: ${{ matrix.app }}/src/shared/api/schema.d.ts
        run: |
          npm run api:generate --prefix ${{ matrix.app }}
          if [ -n "$(git status --porcelain -- "$CLIENTE")" ]; then
            echo "::error title=Cliente de la API desincronizado en ${{ matrix.app }}::docs/api/openapi.yaml ha cambiado y ${CLIENTE} no. Ejecuta 'npm run api:generate --prefix ${{ matrix.app }}' y versiona el resultado."
            git --no-pager diff -- "$CLIENTE"
            exit 1
          fi

      - name: ESLint (0 desviaciones)
        if: steps.detect.outputs.present == 'true'
        run: npm run lint --prefix ${{ matrix.app }}

      - name: vue-tsc en modo estricto (0 errores)
        if: steps.detect.outputs.present == 'true'
        run: npm run type-check --prefix ${{ matrix.app }}

      - name: Presupuesto de la etapa
        if: always() && steps.detect.outputs.present == 'true'
        env:
          ETAPA: "① Lint + Tipos · frontend"
          PRESUPUESTO: "60"
        run: |
          ahora=$(date +%s)
          comprobaciones=$((ahora - ${TOOLS_START:-$ahora}))
          {
            echo "### ${ETAPA} · ${{ matrix.app }}"
            echo ""
            echo "| Comprobaciones | Presupuesto §10.1 |"
            echo "|---|---|"
            echo "| ${comprobaciones} s | ${PRESUPUESTO} s |"
          } >>"$GITHUB_STEP_SUMMARY"
          if [ "$comprobaciones" -gt "$PRESUPUESTO" ]; then
            echo "::warning title=Presupuesto excedido::${ETAPA} (${{ matrix.app }}) ha tardado ${comprobaciones} s frente a los ${PRESUPUESTO} s del doc 02 §10.1."
          fi

  #-----------------------------------------------------------------------------
  # ① Lint + Tipos — contrato de la API
  #
  # Job propio y no un paso mas del backend, por dos motivos. Uno: el contrato no
  # es del backend ni de ninguno de los tres frontends, es de los cuatro, y quien
  # reciba el fallo tiene que leer en el nombre del job que ha roto el contrato de
  # la API y no el estilo de un fichero PHP. Dos: necesita Node y no necesita PHP,
  # asi que compartirlo con `lint-backend` obligaria a instalar las dos cadenas en
  # el mismo runner para ejecutar 40 ms de comprobacion.
  #
  # `docs/api/openapi.yaml` es la fuente de verdad de la API (ADR-013) y se
  # modifica antes que el codigo. Sin esta etapa seria el unico artefacto que
  # manda en el repositorio sin nadie que lo compruebe.
  #-----------------------------------------------------------------------------
  contract:
    name: "① Lint + Tipos · contrato OpenAPI"
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # Ver el comentario de `lint-backend`: el `schedule` es solo para los jobs nocturnos.
    if: github.event_name != 'schedule'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      # La version de @redocly/cli la fija el Makefile, igual que las de
      # ShellCheck y shfmt: entre versiones cambian las reglas del preset
      # `recommended`, y el umbral de 0 problemas no puede depender de lo que
      # resuelva npx el dia de la ejecucion.
      - name: OpenAPI 3.1 valido (0 problemas)
        run: make api-lint

  #-----------------------------------------------------------------------------
  # ② Arquitectura
  #
  # Etapa separada a proposito, y no un paso mas de la ①. Lo que se juega aqui
  # son las reglas duras 1 y 2 de CLAUDE.md —el dominio no importa el framework y
  # no llama al reloj del sistema—, y quien reciba un fallo tiene que poder leer
  # en el nombre de la etapa que ha roto una frontera de arquitectura, no que se
  # ha dejado un espacio. Si un `use Illuminate\...` dentro de Domain/ rompiera la
  # etapa ①, las etapas estarian mal repartidas.
  #
  # Las dos herramientas son complementarias: Deptrac razona sobre imports y Pest
  # Arch ve lo que no aparece en ningun `use` —now(), time(), strtotime()—.
  #-----------------------------------------------------------------------------
  architecture:
    name: "② Arquitectura"
    runs-on: ubuntu-24.04
    # 6 min no bastaba desde la tarea 3.2: promtool y amtool se descargan de
    # cero en un runner limpio (nunca cacheados, a diferencia de ShellCheck y
    # shfmt en ①), y `docker run` con esas dos imagenes mas Deptrac y Pest Arch
    # necesitan margen. Medido en local con las imagenes ya en cache: 11 s; en
    # el runner, con la descarga incluida, el presupuesto de abajo lo refleja.
    timeout-minutes: 10
    needs: [lint-backend, lint-frontend, contract]

    steps:
      - name: Marcar el inicio del job
        run: echo "JOB_START=$(date +%s)" >>"$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/php-toolchain
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none

      - name: Marcar el inicio de las comprobaciones
        run: echo "TOOLS_START=$(date +%s)" >>"$GITHUB_ENV"

      - name: Deptrac (0 violaciones de frontera)
        run: make deptrac

      - name: Pest Arch (reglas duras 1 y 2)
        run: make test-arch

      # Tarea 3.2: promtool check/test rules y amtool check-config sobre la
      # plantilla RENDERIZADA de Alertmanager (ObservabilityToolingTest exige
      # este paso literal). Las imagenes son las mismas que fija
      # compose.prod.yaml: la herramienta que valida la regla aqui es la misma
      # que despues la evalua en produccion.
      - name: Reglas de Prometheus, pruebas de umbral y Alertmanager (0 errores)
        run: make observability-check

      - name: Presupuesto de la etapa
        if: always()
        env:
          ETAPA: "② Arquitectura"
          # 30 s no cubria las dos descargas de imagen que anadio la tarea 3.2
          # (promtool y amtool no se cachean en este job, a diferencia de
          # ShellCheck/shfmt en ①): 90 s deja margen realista sin dejar de
          # avisar si el paso empieza a irse de verdad.
          PRESUPUESTO: "90"
        run: |
          ahora=$(date +%s)
          comprobaciones=$((ahora - ${TOOLS_START:-$ahora}))
          total=$((ahora - ${JOB_START:-$ahora}))
          {
            echo "### ${ETAPA}"
            echo ""
            echo "| Comprobaciones | Presupuesto §10.1 | Job completo |"
            echo "|---|---|---|"
            echo "| ${comprobaciones} s | ${PRESUPUESTO} s | ${total} s |"
          } >>"$GITHUB_STEP_SUMMARY"
          if [ "$comprobaciones" -gt "$PRESUPUESTO" ]; then
            echo "::warning title=Presupuesto excedido::${ETAPA} ha tardado ${comprobaciones} s frente a los ${PRESUPUESTO} s del doc 02 §10.1."
          fi

  #-----------------------------------------------------------------------------
  # ③ Unitarias + Mutacion
  #-----------------------------------------------------------------------------
  unit:
    name: "③ Unitarias + Mutacion"
    runs-on: ubuntu-24.04
    # 90 (R6-DV-08). Con la mutacion completa aqui el job tardo hasta 57,2 min
    # de los 60 que tenia: un runner algo mas lento lo mataba por tiempo con
    # todo en verde. Desde el 02-10-2026 este job solo muta lo que la rama
    # cambia (`make mutate-changed`; la completa vive en el job `mutation`):
    # lo normal son 4-15 min. El tope de 90 cubre el PEOR caso razonable, una
    # rama que toca casi todo el dominio y paga la mutacion entera (37-57 min
    # medidos) mas el resto del job, con el doble de margen. Medidas de los
    # ultimos runs manuales verdes: 39, 57 y 57 min (con la completa aqui).
    timeout-minutes: 90
    needs: architecture

    env:
      # Credenciales de usar y tirar para servicios que viven lo que dura el
      # runner (mismo criterio que backup-drill.yml: NO son secretos del
      # producto, los del cliente los genera install.sh en su servidor).
      #
      # La APP_KEY es una clave estatica de pruebas: la suite no cifra nada
      # que sobreviva al runner. DB_CONNECTION es obligatorio porque el
      # default de config/database.php es sqlite y phpunit.xml no lo fuerza
      # (en desarrollo lo aporta el entorno del contenedor `app`).
      APP_KEY: "base64:a3Jvbm9xci1jaS1jbGF2ZS1kZS0zMi1ieXRlcyEhISE="
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_DATABASE: fichaje
      DB_USERNAME: fichaje_app
      DB_PASSWORD: ci_local_app
      DB_MIGRATION_USERNAME: fichaje_migrator
      DB_MIGRATION_PASSWORD: ci_local_migrator
      REDIS_HOST: 127.0.0.1

    steps:
      - name: Marcar el inicio del job
        run: echo "JOB_START=$(date +%s)" >>"$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # fetch-depth completo (no el superficial por defecto): `make
          # mutate-changed` necesita `origin/main` alcanzable para calcular
          # que ha cambiado cuando el push no trae un `github.event.before`
          # utilizable (rama nueva, primer commit). Mismo motivo que en el
          # job `security` (gitleaks) y en `update`.
          fetch-depth: 0
          persist-credentials: false

      - name: PostgreSQL 17 del producto y Redis 7
        # La imagen del producto y no la oficial, como en backup-drill.yml: sus
        # scripts de initdb crean los TRES roles (regla dura 6, ADR-033) y la
        # base `fichaje_test` que exige phpunit.xml. Sin ellos, RefreshDatabase
        # no puede migrar con el rol de migracion y la suite Feature entera
        # falla. POSTGRES_USER es el rol de migracion porque en un cluster
        # nuevo el rol de arranque ES el de migracion (02-application-roles.sh).
        #
        # Se arranca ANTES de instalar PHP para que el initdb corra en paralelo
        # con composer install; la espera de pg_isready va justo antes de la
        # primera suite que lo necesita.
        # `make build-ci-images` (por defecto IMAGES=postgres, sin cache): la
        # misma orden que usan el job `security` y backup-drill.yml, en un solo
        # objetivo (IMPORTANTE 10 de la auditoria) para que las tres no puedan
        # divergir sin que nadie lo note.
        run: |
          make build-ci-images
          docker run -d --name kronoqr-pg \
            -e POSTGRES_DB="$DB_DATABASE" \
            -e POSTGRES_USER="$DB_MIGRATION_USERNAME" \
            -e POSTGRES_PASSWORD="$DB_MIGRATION_PASSWORD" \
            -e DB_PASSWORD="$DB_PASSWORD" \
            -p 5432:5432 \
            kronoqr/postgres:ci \
            postgres -c timezone=UTC -c log_timezone=UTC \
              -c hba_file=/etc/kronoqr/pg_hba.conf
          docker run -d --name kronoqr-redis -p 6379:6379 redis:7-alpine

      - uses: ./.github/actions/php-toolchain
        with:
          php-version: ${{ env.PHP_VERSION }}
          # La mutacion necesita cobertura. Xdebug se instala apagado y lo
          # enciende el propio objetivo del Makefile con XDEBUG_MODE=coverage,
          # para que la suite unitaria no pague el precio.
          coverage: xdebug

      - name: Marcar el inicio de las comprobaciones
        run: echo "TOOLS_START=$(date +%s)" >>"$GITHUB_ENV"

      - name: Pest — suite unitaria (dominio puro, sin base de datos)
        # UNIT_MAX_SKIPPED=0 (R6-DV-07): la suite unitaria no tiene ninguna
        # omision conocida (0 de 2772-2849 pruebas en los runs medidos); si una
        # prueba pasa a `skipped`, el paso falla en vez de contar como cobertura.
        run: make test-unit UNIT_MAX_SKIPPED=0

      - name: Esperar a PostgreSQL
        # Recien aqui y no al arrancarlo: el initdb (extensiones, roles,
        # fichaje_test) corre en paralelo con composer install y la suite
        # unitaria, que no toca base de datos.
        #
        # `-h 127.0.0.1`: por el socket Unix tambien contesta el servidor
        # temporal de initdb (el que ejecuta initdb.d); por TCP solo el
        # definitivo. Mismo motivo que en backup-drill.yml.
        run: |
          for i in $(seq 1 30); do
            if docker exec kronoqr-pg pg_isready -h 127.0.0.1 -U "$DB_MIGRATION_USERNAME" -d "$DB_DATABASE" >/dev/null 2>&1; then
              echo "PostgreSQL listo en $((i * 2)) s"; exit 0
            fi
            sleep 2
          done
          echo "::error title=PostgreSQL no arranco::pg_isready sigue fallando tras 60 s."
          docker logs kronoqr-pg | tail -50
          exit 1

      - name: Pest — contrato OpenAPI y feature
        # Añadido al cerrar la Fase 0, cuando estas suites no tocaban base de
        # datos. La Fase 1 les dio esquema real (1.3) y Feature entera migra con
        # RefreshDatabase, asi que desde entonces necesitan el PostgreSQL del
        # paso de servicios de arriba — sin el, este job estuvo fallando en cada
        # push durante media fase sin que nadie mirase Actions (hallazgo de la
        # auditoria de cierre de la Fase 1).
        #
        # Siguen aqui y no en el job `integration` (mas abajo, la etapa ④ real)
        # por la misma razon de entonces: `qa:traceability` cuenta las
        # etiquetas de estas suites, y un requisito no puede figurar cubierto
        # por una prueba que ningun workflow ejecuta. Ademas son baratas -no
        # necesitan mas que este mismo PostgreSQL- y separarlas solo anadiria
        # el coste de arrancar otro runner.
        # CONTRACT_MAX_SKIPPED=0: igual que la unitaria (0 de 2283-2313 omitidas).
        run: make test-contract CONTRACT_MAX_SKIPPED=0

      - name: "Mutacion sobre el Domain que el cambio toca (MSI >= 80 % sobre ese conjunto): en push y en el disparo manual"
        # El umbral --min=80 vive en el Makefile, no aqui, y se aplica ENTERO
        # sobre el CONJUNTO de ficheros de `Modules/*/Domain` que el cambio toca
        # (`make mutate-changed`, comentario largo junto al objetivo en el
        # Makefile). OJO: es una nota para el conjunto, no una por fichero; un
        # fichero flojo puede quedar tapado por otros del mismo cambio.
        #
        # Decision (24-09-2026): la mutacion COMPLETA tardaba 37-57 min
        # medidos en este runner y no cabe en las etapas ①-③. Por eso este
        # paso muta SOLO lo que el cambio toca.
        #
        # LA BASE DEL DIFF ES LA MISMA EN PUSH Y EN DISPARO MANUAL
        # (02-10-2026): `origin/main` (merge-base, `git diff origin/main...HEAD`)
        # en cualquier rama. Push y disparo manual publican el MISMO check
        # «③ Unitarias + Mutacion» sobre el mismo SHA; si uno mirara el ultimo
        # push y el otro toda la rama, podrian discrepar. Solo en un push a
        # `main` la base es `github.event.before` (si es un commit valido y
        # alcanzable): para un merge commit es el diff de la rama integrada.
        #
        # Correccion (02-10-2026, R6-DV-01/02, R2-QB-01): `workflow_dispatch`
        # -el disparo manual que se hace siempre antes de abrir una PR-
        # corria la mutacion completa, que solo mira el MSI GLOBAL, y ademas
        # cancelaba el run del `push`, el unico que aplicaba esta puerta. Asi
        # no se evaluaba antes del merge y fallaba al entrar en `main`.
        # En `main` -o en una rama sin ficheros de dominio cambiados- el diff
        # sale vacio y el paso termina en verde sin mutar nada.
        #
        # La pasada GLOBAL (MSI >= 80 % sobre todo el dominio) sigue existiendo
        # y se ejecuta tambien en el disparo manual y cada noche, pero en el
        # job `mutation`, al final del fichero: ya corria alli en paralelo
        # con este, y repetirla aqui duplicaba 40-55 min de ③ sin cambiar el
        # veredicto (③ llego a tardar 57 min de 60).
        #
        # La NOCHE no esta aqui. El job `unit` no se ejecuta en `schedule`
        # -depende de `architecture`, que depende de jobs con
        # `if: github.event_name != 'schedule'`, y un `needs` que no corre
        # deja sin correr tambien al que depende de el-.
        #
        # Si `Modules/*/Domain` no existe todavia (Fase 0, antes de la tarea
        # 1.1), `make mutate-changed` lo dice por su cuenta y termina en verde
        # sin mutar nada.
        env:
          EVENT_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          base="origin/main"
          if [ "${GITHUB_EVENT_NAME}" = "push" ] &&
            [ "${GITHUB_REF}" = "refs/heads/main" ] &&
            [ -n "${EVENT_BEFORE}" ] &&
            [ "${EVENT_BEFORE}" != "0000000000000000000000000000000000000000" ] &&
            git cat-file -e "${EVENT_BEFORE}^{commit}" 2>/dev/null; then
            base="${EVENT_BEFORE}"
          fi
          make mutate-changed MUTATE_BASE="${base}"

      # --- etapa ③b · Trazabilidad y coherencia documental --------------------
      #
      # Los dos son BLOQUEANTES (§10.1, §9.6). Van juntos y aqui porque
      # comprueban lo mismo desde dos lados: que lo que los documentos dicen y
      # lo que el repositorio hace no han divergido.
      #
      # `--check` no escribe nada. La matriz se regenera con `make traceability`
      # desde el host, porque docs/ se monta de solo lectura en el contenedor.

      - name: Trazabilidad requisito → prueba (RQ-13)
        # Falla si un requisito de una fase YA EJECUTADA no tiene ninguna prueba
        # que lo referencie. El alcance sale de docs/requisitos.yaml filtrando
        # por el orden real de ejecucion (0 -> 1 -> 2 -> 5 -> 3 -> 4), asi que un
        # requisito de la Fase 3 no bloquea mientras se trabaja en la Fase 1.
        run: make traceability-check

      - name: Coherencia documental (RQ-12, RNF-M-04)
        # Falla si un ADR del §4 no tiene fichero, si un requisito no lo
        # construye ninguna tarea del plan, o si la fase de un requisito no
        # coincide con la de su tarea. Los seis hallazgos bloqueantes de la
        # auditoria previa fueron ese mismo fallo repetido, y los tres son
        # mecanicamente detectables: los encontro una persona leyendo seis
        # ficheros a la vez, que es justo lo que esto sustituye.
        run: make docs-consistency

      - name: Presupuesto de la etapa
        if: always()
        env:
          ETAPA: "③ Unitarias + Mutacion"
          PRESUPUESTO: "120"
        run: |
          ahora=$(date +%s)
          comprobaciones=$((ahora - ${TOOLS_START:-$ahora}))
          total=$((ahora - ${JOB_START:-$ahora}))
          {
            echo "### ${ETAPA}"
            echo ""
            echo "| Comprobaciones | Presupuesto §10.1 | Job completo |"
            echo "|---|---|---|"
            echo "| ${comprobaciones} s | ${PRESUPUESTO} s | ${total} s |"
          } >>"$GITHUB_STEP_SUMMARY"
          if [ "$comprobaciones" -gt "$PRESUPUESTO" ]; then
            echo "::warning title=Presupuesto excedido::${ETAPA} ha tardado ${comprobaciones} s frente a los ${PRESUPUESTO} s del doc 02 §10.1."
          fi

  #-----------------------------------------------------------------------------
  # ④ Integracion (doc 02 §10.1, §9.2)
  #
  # Repositorios y esquema contra PostgreSQL REAL: invariantes SQL (lo que una
  # regla de negocio delega en un CHECK/EXCLUDE de la base, no en el dominio),
  # `MigrationsRoundTripTest` (deshace y reaplica TODAS las migraciones con
  # `CommittedDatabase`: por eso corre SOLA en este job, nunca junto a otra
  # suite en el mismo proceso) e `InstallScriptTest`/`UpdateScriptTest` — los
  # caminos de `install.sh`/`update.sh` que NO necesitan Docker ni root:
  # comprobacion de requisitos, codigos de salida, tratamiento del `.env`. La
  # instalacion y la actualizacion COMPLETAS las prueba la etapa ⑧/⑧b, porque
  # exigen una maquina Linux con Docker y las imagenes de entrega.
  #
  # El §10.1 sitúa esta etapa "en pull request"; este repositorio no dispara en
  # `pull_request` (cabecera del fichero), asi que corre en cada push, igual
  # que Contract y Feature (job `unit`) desde el cierre de la Fase 0.
  #
  # PostgreSQL y Redis: la MISMA imagen y los MISMOS roles que el job `unit`
  # (kronoqr/postgres:ci, roles de aplicacion y de migracion) — no la imagen
  # oficial de PostgreSQL, que no trae los tres roles de la regla dura 6 ni la
  # base `fichaje_test`. Cada job de la CI arranca su PROPIO contenedor: no hay
  # nada que compartir con `unit`, cada runner es una maquina aislada.
  #-----------------------------------------------------------------------------
  integration:
    name: "④ Integracion"
    runs-on: ubuntu-24.04
    # 30 (R6-DV-08): duraba 10,4-14,6 min de los 15 anteriores y un runner
    # lento lo mataba con la suite en verde; ahora ademas ejecuta de verdad las
    # 5 pruebas de sellado de PDF con Chrome. 30 es el doble de lo medido.
    timeout-minutes: 30
    needs: architecture

    env:
      APP_KEY: "base64:a3Jvbm9xci1jaS1jbGF2ZS1kZS0zMi1ieXRlcyEhISE="
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_DATABASE: fichaje
      DB_USERNAME: fichaje_app
      DB_PASSWORD: ci_local_app
      DB_MIGRATION_USERNAME: fichaje_migrator
      DB_MIGRATION_PASSWORD: ci_local_migrator
      REDIS_HOST: 127.0.0.1

    steps:
      - name: Marcar el inicio del job
        run: echo "JOB_START=$(date +%s)" >>"$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: PostgreSQL 17 del producto y Redis 7
        run: |
          make build-ci-images
          docker run -d --name kronoqr-pg \
            -e POSTGRES_DB="$DB_DATABASE" \
            -e POSTGRES_USER="$DB_MIGRATION_USERNAME" \
            -e POSTGRES_PASSWORD="$DB_MIGRATION_PASSWORD" \
            -e DB_PASSWORD="$DB_PASSWORD" \
            -p 5432:5432 \
            kronoqr/postgres:ci \
            postgres -c timezone=UTC -c log_timezone=UTC \
              -c hba_file=/etc/kronoqr/pg_hba.conf
          docker run -d --name kronoqr-redis -p 6379:6379 redis:7-alpine

      - uses: ./.github/actions/php-toolchain
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none

      - name: Marcar el inicio de las comprobaciones
        run: echo "TOOLS_START=$(date +%s)" >>"$GITHUB_ENV"

      - name: Esperar a PostgreSQL
        run: |
          for i in $(seq 1 30); do
            if docker exec kronoqr-pg pg_isready -h 127.0.0.1 -U "$DB_MIGRATION_USERNAME" -d "$DB_DATABASE" >/dev/null 2>&1; then
              echo "PostgreSQL listo en $((i * 2)) s"; exit 0
            fi
            sleep 2
          done
          echo "::error title=PostgreSQL no arranco::pg_isready sigue fallando tras 60 s."
          docker logs kronoqr-pg | tail -50
          exit 1

      - name: Chrome para Browsershot (los PDF de una cara y el sello del informe se prueban con el motor real)
        # La imagen del producto instala puppeteer global y usa el Chromium de la
        # distribucion; en el runner el `chromium-browser` de Ubuntu es un
        # envoltorio de snap que no arranca, asi que puppeteer trae su propio
        # Chrome. La accion lo instala, COMPRUEBA que arranca y exporta las
        # variables de laravel-pdf (R6-DV-07: la receta anterior dejaba una ruta
        # inexistente y 5 pruebas saltaban en silencio en cada run).
        uses: ./.github/actions/chrome-for-pdf

      - name: Pest — suite de Integracion (PostgreSQL real; MigrationsRoundTripTest sola en este job)
        # INTEGRATION_MAX_SKIPPED: puerta contra las omisiones silenciosas
        # (R6-DV-07). Hoy hay exactamente 19 pruebas que esta suite omite
        # SIEMPRE en el runner: las de `FpmPoolRenderTest`, que necesitan
        # `php-fpm` y el entrypoint de la imagen `kronoqr/app` (no existen en
        # el runner). Las 5 de sellado de PDF YA NO se omiten: las ejecuta el
        # Chrome de la accion de arriba. Si el numero de omitidas SUBE -una
        # prueba nueva con `->skip(...)`, o Chrome que deja de arrancar- el
        # paso falla; si BAJA (alguien lleva las 19 de FPM a un job con la
        # imagen), se baja este numero en el mismo cambio. Ver el objetivo
        # `test-integration` del Makefile.
        run: make test-integration INTEGRATION_MAX_SKIPPED=19

      - name: Presupuesto de la etapa
        if: always()
        env:
          ETAPA: "④ Integracion"
          PRESUPUESTO: "180"
        run: |
          ahora=$(date +%s)
          comprobaciones=$((ahora - ${TOOLS_START:-$ahora}))
          total=$((ahora - ${JOB_START:-$ahora}))
          {
            echo "### ${ETAPA}"
            echo ""
            echo "| Comprobaciones | Presupuesto §10.1 | Job completo |"
            echo "|---|---|---|"
            echo "| ${comprobaciones} s | ${PRESUPUESTO} s | ${total} s |"
          } >>"$GITHUB_STEP_SUMMARY"
          if [ "$comprobaciones" -gt "$PRESUPUESTO" ]; then
            echo "::warning title=Presupuesto excedido::${ETAPA} ha tardado ${comprobaciones} s frente a los ${PRESUPUESTO} s del doc 02 §10.1."
          fi

  #-----------------------------------------------------------------------------
  # Puerta de version — CHANGELOG (doc 02 §10.5)
  #
  # En cada push comprueba que el CHANGELOG existe y esta bien formado, que es
  # barato. Cuando el push es una etiqueta `vX.Y.Z`, ademas exige que esa version
  # tenga entrada con cambios: una version que se publica sin decir que cambia
  # deja al IT del hotel actualizando a ciegas, y el actualizador de la tarea 5.7
  # lee justamente este fichero.
  #
  # No depende de las otras etapas a proposito: es una comprobacion de metadatos y
  # no tiene por que esperar a nadie.
  #-----------------------------------------------------------------------------
  #-----------------------------------------------------------------------------
  # Analisis de dependencias y de codigo (RS-10)
  #
  # RS-10 exige «analisis de dependencias y de codigo en cada pull request;
  # ninguna vulnerabilidad critica o alta puede llegar a una version publicada»,
  # y es requisito de la Fase 0 en el Anexo A.
  #
  # El §10.1 lo situa en la etapa ⑤, que se ejecuta en pull request y queda
  # fuera del alcance de la tarea 0.4. Pero las herramientas ya existen y
  # engancharlas cuesta un job: diferirlo habria dejado un requisito de la Fase
  # 0 sin cumplir por comodidad, no por criterio. Se ejecuta en cada push, que
  # es mas estricto que lo que RS-10 pide, no menos.
  #
  # Cada control nuevo se ha probado EN LOCAL antes de decidir si bloquea (ver
  # el detalle en cada objetivo del Makefile): lo que hoy pasa limpio es
  # bloqueante desde el primer dia; lo que tiene hallazgos entra en modo
  # informe —`continue-on-error: true` mas el log como artefacto— con un TODO
  # fechado para revisarlo. Ninguna herramienta nueva trae su propia GitHub
  # Action: todas se invocan con el `make` correspondiente, igual que
  # `deps-audit-php`/`deps-audit-js`/`sast` de mas abajo, para que la orden y el
  # umbral sigan viviendo en un solo sitio (cabecera del Makefile).
  #
  # gitleaks NO usa la Action oficial `gitleaks/gitleaks-action`: su `action.yml`
  # esta bajo la licencia comercial de Gitleaks LLC y exige `GITLEAKS_LICENSE`
  # para organizaciones — un secreto que este repositorio no tiene y que nadie
  # ha pedido aprovisionar. El binario de gitleaks en si es MIT y gratuito:
  # `make secrets-scan` lo invoca igual que Semgrep y Trivy, sin licencia que
  # gestionar (TODO 2026-08-28: si en algun momento se paga la licencia, migrar
  # a la Action oficial da anotaciones en el diff del PR que este paso no da).
  #-----------------------------------------------------------------------------
  security:
    name: "Dependencias y SAST"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Ver el comentario de `lint-backend`: el `schedule` es solo para los jobs nocturnos.
    if: github.event_name != 'schedule'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # gitleaks recorre el HISTORICO completo (mas abajo), no solo el
          # arbol de trabajo: con el checkout superficial por defecto no veria
          # nada anterior al ultimo commit.
          fetch-depth: 0

      - uses: ./.github/actions/php-toolchain
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none

      - name: composer audit (0 vulnerabilidades)
        run: make deps-audit-php

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: npm audit del workspace (0 criticas ni altas en produccion; desarrollo informa)
        run: make deps-audit-js

      - name: Semgrep sobre las reglas propias (0 hallazgos de severidad alta)
        # Las reglas de .semgrep/ son las que ninguna otra herramienta puede
        # ver: la regla dura 2 en su forma `new DateTimeImmutable()` sin
        # instante, y las supresiones de PHPStan sin motivo escrito.
        run: make sast

      - name: Semgrep comunitario — PHP/JS/TS/OWASP (0 hallazgos, bloqueante)
        id: sast_community
        # BLOQUEANTE desde el 29-08-2026: los 9 hallazgos que tenia estan
        # triados (detalle en el objetivo del Makefile) y el umbral es 0. Un
        # hallazgo nuevo se corrige o se justifica con `# nosemgrep` y motivo
        # (docs/runbooks/triaje-hallazgos-seguridad.md); nunca se renueva un
        # plazo.
        #
        # Semgrep con `--error`: 0 sin hallazgos, 1 CON hallazgos, 2+ si la
        # herramienta no pudo terminar (config invalida, fallo al resolver
        # `p/php` y compania, etc.). El objetivo del Makefile absorbe el 1 (make
        # lo convertiria en 2, indistinguible de un fallo real) y silencia el eco
        # de la orden, que ensuciaba el JSON: aqui solo llega 0 o 2+. El `||` de la primera linea CAPTURA el
        # codigo sin que `-e` (activado por defecto en los pasos `run:` de
        # GitHub Actions) aborte el script -- si abortara ahi, jamas
        # llegariamos a distinguir 1 (informe) de 2+ (fallo real), que es
        # justo lo que faltaba: antes, `continue-on-error: true` trataba los
        # dos casos igual (IMPORTANTE 5 de la auditoria).
        run: |
          make sast-community SEMGREP_FORMAT=json >sast-community.json || status=$?
          status=${status:-0}
          jq -r '(.results // []) | group_by(.extra.severity) | map("\(.[0].extra.severity): \(length)") | .[]' \
            sast-community.json | tee sast-community.log
          total=$(jq -r '(.results // []) | length' sast-community.json 2>/dev/null || echo 0)
          {
            echo "### Semgrep comunitario — hallazgos por severidad (umbral: 0)"
            echo ""
            if [ -s sast-community.log ]; then
              echo '```'
              cat sast-community.log
              echo '```'
            else
              echo "0 hallazgos."
            fi
          } >>"$GITHUB_STEP_SUMMARY"
          [ "$status" -eq 0 ] || {
            echo "::error title=Semgrep comunitario ha fallado::codigo de salida ${status} (2+ significa que la herramienta no pudo terminar, no son hallazgos)."
            exit "$status"
          }
          [ "$total" -eq 0 ] || {
            jq -r '.results[] | "::error file=\(.path),line=\(.start.line),title=Semgrep \(.extra.severity)::\(.check_id)"' sast-community.json
            echo "::error title=Semgrep comunitario::${total} hallazgo(s). Corrige o justifica cada uno con '# nosemgrep' y su motivo (docs/runbooks/triaje-hallazgos-seguridad.md)."
            exit 1
          }

      - name: gitleaks sobre el historico alcanzable desde este commit (0 hallazgos, bloqueante)
        # BLOQUEANTE desde hoy: verificado en local sobre las 75 commits de
        # este repositorio, 0 hallazgos con la allowlist minima de
        # .gitleaks.toml (17 falsos positivos analizados uno a uno, ver el
        # fichero). Si esto rompe algun dia, NO se reescribe el historico para
        # arreglarlo: se reporta el commit y la ruta para que se decida
        # (§7.7).
        #
        # SCOPE=head (R6-DV-03, 02-10-2026): el checkout trae TODAS las ramas
        # (`fetch-depth: 0`) y gitleaks, sin acotar, recorria todas las
        # referencias: un valor de prueba en una rama sin integrar ponia en
        # rojo `main` y todas las demas ramas (ocurrio con las PR #103 y
        # #104). Aqui se escanea solo lo alcanzable desde el commit de este
        # run, que es lo que este cambio puede introducir o arrastrar. El
        # barrido de TODAS las referencias lo hace el job `secrets-history`,
        # nocturno, donde un hallazgo avisa pero no bloquea a nadie.
        run: make secrets-scan SECRETS_SCAN_SCOPE=head

      - uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0
        # A partir de aqui, Trivy necesita imagenes YA CONSTRUIDAS: la de
        # PostgreSQL (que el job `unit` tambien construye, en su propio
        # runner, sin compartir cache con este) y la de la aplicacion, que
        # NINGUN job construye todavia. `docker buildx` con la cache de
        # GitHub Actions evita que cada push reconstruya desde cero: solo
        # paga el precio completo la primera vez y cuando cambian las capas.

      - uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0
        # Sin esto, `docker buildx build --cache-to type=gha` desde un paso
        # `run:` suelto (no `docker/build-push-action`) no ve
        # `ACTIONS_RUNTIME_TOKEN`/`ACTIONS_CACHE_URL` y aborta con "failed to
        # configure gha cache exporter", tumbando el job entero porque el
        # paso no lleva `continue-on-error` (BLOQUEANTE 2 de la auditoria).
        # Esta accion exporta esas dos variables al entorno de los pasos
        # siguientes. Alternativa descartada: quitar `type=gha` y construir
        # sin cache -- se prueba en local que cuesta minutos extra en cada
        # push por las dos imagenes (PostgreSQL con extensiones y la app con
        # Chromium/Node), justo el tipo de coste que la cache de Actions
        # existe para evitar; instalar esta accion, fijada por SHA, es mas
        # barato que pagar esa reconstruccion en cada ejecucion.

      - name: Construir kronoqr/postgres:ci y kronoqr/app:ci (con cache de Actions)
        # `make build-ci-images` (IMPORTANTE 10 de la auditoria: la misma
        # orden que usan el job `unit` y backup-drill.yml, en un solo
        # objetivo). Aqui, y solo aqui, con BUILDX_CACHE=gha: es el unico job
        # que construye las DOS imagenes en cada push y el unico que tiene
        # justo encima el paso de `ghaction-github-runtime`.
        env:
          APK_INDEX_STAMP_OVERRIDE: ${{ inputs.apk_index_stamp }}
        run: make build-ci-images IMAGES="postgres app" BUILDX_CACHE=gha ${APK_INDEX_STAMP_OVERRIDE:+APK_INDEX_STAMP=$APK_INDEX_STAMP_OVERRIDE}

      - name: Trivy fs — dependencias, Dockerfiles y secretos del repo (bloqueante)
        id: trivy_fs
        # BLOQUEANTE desde el 29 de agosto de 2026: el unico hallazgo que
        # tenia (DS-0002, el Dockerfile de PostgreSQL sin `USER`) se corrigio
        # en la propia imagen, no con una excepcion. El TRIVY_EXIT_CODE por
        # defecto del Makefile (1) hace que Trivy devuelva 1 con hallazgos
        # HIGH/CRITICAL. El codigo se captura ANTES de escribir el resumen
        # para que el desglose por severidad llegue al resumen de la ejecucion
        # tambien cuando el paso falla: el JSON se escribe igual con o sin
        # hallazgos, y es lo primero que hay que leer al triar
        # (docs/runbooks/triaje-hallazgos-seguridad.md).
        run: |
          set +e
          make trivy-fs TRIVY_FORMAT=json >trivy-fs.json
          estado=$?
          set -e
          jq -r '
            [.Results[]? | (.Vulnerabilities // [])[], (.Misconfigurations // [])[], (.Secrets // [])[]]
            | group_by(.Severity) | map("\(.[0].Severity): \(length)") | .[]
          ' trivy-fs.json | tee trivy-fs.log
          {
            echo "### Trivy fs — hallazgos HIGH/CRITICAL por severidad (bloqueante)"
            echo ""
            if [ -s trivy-fs.log ]; then
              echo '```'
              cat trivy-fs.log
              echo '```'
            else
              echo "0 hallazgos."
            fi
          } >>"$GITHUB_STEP_SUMMARY"
          exit "$estado"

      - name: Trivy image — postgres:ci y app:ci (bloqueante)
        id: trivy_image
        # BLOQUEANTE desde el 29 de agosto de 2026. Los 21 HIGH que tenia
        # kronoqr/postgres:ci estaban todos en usr/local/bin/gosu (Go stdlib
        # de la imagen oficial), y la imagen ya no lleva ese binario: arranca
        # como `postgres` y no necesita bajar privilegios
        # (infra/docker/postgres/Dockerfile). infra/docker/.trivyignore.yaml
        # queda sin excepciones vigentes. Mismo tratamiento del codigo de
        # salida que en el paso anterior.
        run: |
          set +e
          make trivy-image TRIVY_IMAGES="kronoqr/postgres:ci kronoqr/app:ci" TRIVY_FORMAT=json >trivy-image.json
          estado=$?
          set -e
          jq -s -r '
            [.[] | .Results[]? | (.Vulnerabilities // [])[], (.Misconfigurations // [])[], (.Secrets // [])[]]
            | group_by(.Severity) | map("\(.[0].Severity): \(length)") | .[]
          ' trivy-image.json | tee trivy-image.log
          {
            echo "### Trivy image — hallazgos HIGH/CRITICAL por severidad (bloqueante)"
            echo ""
            if [ -s trivy-image.log ]; then
              echo '```'
              cat trivy-image.log
              echo '```'
            else
              echo "0 hallazgos."
            fi
          } >>"$GITHUB_STEP_SUMMARY"
          exit "$estado"

      - name: SBOM CycloneDX
        run: make sbom

      - name: Subir los informes de seguridad y el SBOM
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: seguridad-informe-y-sbom
          path: |
            sast-community.log
            sast-community.json
            trivy-fs.log
            trivy-fs.json
            trivy-image.log
            trivy-image.json
            sbom/
          retention-days: 90
          if-no-files-found: warn

      # Desde el 29 de agosto de 2026 NINGUN paso de este job corre en modo
      # informe: gitleaks, Semgrep comunitario, Trivy fs y Trivy image son
      # bloqueantes. Si algun control tiene que volver a informe (una
      # herramienta nueva que aun no pasa limpia), la convencion es la de
      # infra/docker/.trivyignore.yaml -- fecha de caducidad obligatoria -- y
      # el mecanismo que la hacia cumplir era un ultimo paso `if: always()`
      # con una lista `nombre;AAAA-MM-DD` que fallaba pasada la fecha (MENOR
      # 13 de la auditoria; en el historial de git, commit `ci(security)`).
      # Recuperalo de ahi en vez de reinventarlo; el runbook
      # docs/runbooks/triaje-hallazgos-seguridad.md explica cuando procede.

  #-----------------------------------------------------------------------------
  # ⑥ Frontend unitarias (doc 02 §10.1, §9.2: Vitest + Vue Test Utils, >= 70 %)
  #
  # Los CUATRO paquetes del workspace, no solo las tres SPA: `packages/web-kit`
  # tiene su propia suite (solo logica pura en `src/**/*.ts`; los cinco
  # componentes `.vue` los ejercitan las SPA que los consumen, ver el
  # comentario de `packages/web-kit/vitest.config.ts`).
  #
  # El umbral de cobertura NO se repite aqui: vive en `coverage.thresholds` de
  # cada `vitest.config.ts` (mismo criterio que Pint/PHPStan/Deptrac en el
  # Makefile — la orden y el umbral en un solo sitio). `vitest run --coverage`
  # FALLA solo si algun paquete no llega al 70 %, asi que el paso no necesita
  # parsear ningun informe.
  #
  # Independiente del resto (sin `needs`): son pruebas de Node puro, no
  # dependen de que el backend compile, y son de las mas baratas del pipeline.
  #-----------------------------------------------------------------------------
  frontend-unit:
    name: "⑥ Frontend unitarias · ${{ matrix.package }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Ver el comentario de `lint-backend`: el `schedule` es solo para los jobs nocturnos.
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        package: [packages/web-kit, frontend-admin, frontend-kiosk, frontend-portal]

    steps:
      - name: Marcar el inicio del job
        run: echo "JOB_START=$(date +%s)" >>"$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          # El lock de la RAIZ, mismo motivo que en `lint-frontend` (ADR-036).
          cache-dependency-path: package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Marcar el inicio de las comprobaciones
        run: echo "TOOLS_START=$(date +%s)" >>"$GITHUB_ENV"

      - name: Vitest --coverage (umbral en vitest.config.ts, §9.2)
        run: npm run test:unit --prefix ${{ matrix.package }}

      - name: Presupuesto de la etapa
        if: always()
        env:
          ETAPA: "⑥ Frontend unitarias"
          PRESUPUESTO: "120"
        run: |
          ahora=$(date +%s)
          comprobaciones=$((ahora - ${TOOLS_START:-$ahora}))
          {
            echo "### ${ETAPA} · ${{ matrix.package }}"
            echo ""
            echo "| Comprobaciones | Presupuesto §10.1 |"
            echo "|---|---|"
            echo "| ${comprobaciones} s | ${PRESUPUESTO} s |"
          } >>"$GITHUB_STEP_SUMMARY"
          if [ "$comprobaciones" -gt "$PRESUPUESTO" ]; then
            echo "::warning title=Presupuesto excedido::${ETAPA} (${{ matrix.package }}) ha tardado ${comprobaciones} s frente a los ${PRESUPUESTO} s del doc 02 §10.1."
          fi

  #-----------------------------------------------------------------------------
  # ⑦ E2E (doc 02 §10.1, §9.4: Playwright + camara simulada + axe)
  #
  # Sustituye al marcador `.github/workflows/e2e.yml`, retirado (ver la
  # cabecera de este fichero): el patron de este repositorio es un solo
  # workflow con un job por etapa, no una composicion de workflows separados
  # con `workflow_call` — ⑦ no es distinta de ⑤ o de ⑧ en eso.
  #
  # SIN BACKEND: cada SPA intercepta `/api/v1/*` con los dobles del contrato
  # (`tests/e2e/support/*.ts` de cada frontend, ver la cabecera de cada
  # `playwright.config.ts`); no hay PostgreSQL ni Redis en este job.
  #
  # SE PRUEBA EL BUILD, NO EL SERVIDOR DE DESARROLLO (mismo criterio que en
  # cada `playwright.config.ts`). El panel lo reconstruye su propio
  # `webServer` en cada ejecucion; el quiosco NO —su `webServer` solo hace
  # `vite preview` sobre un `dist/` que ya tiene que existir—. Construir aqui,
  # de forma explicita y uniforme para las tres SPA, evita que la unica que
  # construye sola (el panel) sea la unica prueba real y las otras dos corran
  # contra un `dist/` que nadie genero en un runner limpio.
  #
  # CONTRATO CON QUIEN ESCRIBE EL E2E DEL PORTAL: `frontend-portal` tiene que
  # traer `playwright.config.ts` y el script `test:e2e` en su `package.json`.
  # El paso "Comprobar el contrato" falla con un mensaje claro si falta, en vez
  # de que el job entero muera con un `npm error Missing script`.
  #-----------------------------------------------------------------------------
  e2e:
    name: "⑦ E2E · ${{ matrix.app }}"
    runs-on: ubuntu-24.04
    # Generoso en frio: instalar Chromium con sus dependencias del sistema y
    # construir la SPA antes de los propios escenarios.
    timeout-minutes: 20
    needs: lint-frontend
    strategy:
      fail-fast: false
      matrix:
        app: [frontend-admin, frontend-kiosk, frontend-portal]

    steps:
      - name: Marcar el inicio del job
        run: echo "JOB_START=$(date +%s)" >>"$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Comprobar el contrato de scripts de package.json
        run: |
          jq -e '.scripts["test:e2e"]' "${{ matrix.app }}/package.json" >/dev/null 2>&1 || {
            echo "::error title=Falta test:e2e en ${{ matrix.app }}::Anade el script test:e2e (playwright test) a ${{ matrix.app }}/package.json y su playwright.config.ts."
            exit 1
          }

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Cache de los navegadores de Playwright
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Instalar Chromium (con dependencias del sistema)
        run: npx playwright install --with-deps chromium

      - name: Marcar el inicio de las comprobaciones
        run: echo "TOOLS_START=$(date +%s)" >>"$GITHUB_ENV"

      - name: Construir la aplicacion (dist real, no el servidor de desarrollo)
        run: npm run build --prefix ${{ matrix.app }}

      - name: Playwright (camara simulada en el quiosco; axe en el panel)
        # El reporter (github + list) lo elige cada playwright.config.ts segun
        # `process.env.CI`, que GitHub Actions define solo: no hace falta
        # repetirlo aqui con --reporter.
        run: npm run test:e2e --prefix ${{ matrix.app }}

      - name: Presupuesto de la etapa
        if: always()
        env:
          ETAPA: "⑦ E2E"
          PRESUPUESTO: "300"
        run: |
          ahora=$(date +%s)
          comprobaciones=$((ahora - ${TOOLS_START:-$ahora}))
          {
            echo "### ${ETAPA} · ${{ matrix.app }}"
            echo ""
            echo "| Comprobaciones | Presupuesto §10.1 |"
            echo "|---|---|"
            echo "| ${comprobaciones} s | ${PRESUPUESTO} s |"
          } >>"$GITHUB_STEP_SUMMARY"
          if [ "$comprobaciones" -gt "$PRESUPUESTO" ]; then
            echo "::warning title=Presupuesto excedido::${ETAPA} (${{ matrix.app }}) ha tardado ${comprobaciones} s frente a los ${PRESUPUESTO} s del doc 02 §10.1."
          fi

      - name: Subir los artefactos de Playwright SOLO si algo ha fallado
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-${{ matrix.app }}
          path: ${{ matrix.app }}/test-results/
          retention-days: 14
          if-no-files-found: warn

  changelog:
    name: "Puerta de version · CHANGELOG"
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # Ver el comentario de `lint-backend`: el `schedule` es solo para los jobs nocturnos.
    if: github.event_name != 'schedule'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # El generador necesita el historico completo para clasificar los
          # commits desde la ultima etiqueta.
          fetch-depth: 0
          persist-credentials: false

      - name: Formato del CHANGELOG
        run: make changelog-check

      - name: La version etiquetada tiene entrada
        if: startsWith(github.ref, 'refs/tags/v')
        run: make changelog-check VERSION="${GITHUB_REF_NAME#v}"

  #-----------------------------------------------------------------------------
  # ⑧ Instalacion limpia (doc 02 §10.1, RQ-11 · RF-PD-02)
  #-----------------------------------------------------------------------------
  # LO QUE ESTA ETAPA COMPRUEBA, Y POR QUE NO LO PUEDE COMPROBAR NADA MAS.
  #
  # El instalador es el unico artefacto del producto que se ejecuta UNA vez, en
  # una maquina a la que el fabricante no tiene acceso, delante de alguien que no
  # conoce el sistema. No hay segunda oportunidad ni forma de entrar a
  # arreglarlo. Una prueba unitaria puede afirmar que el script llama a Docker;
  # solo una maquina virgen puede afirmar que el sistema queda EN MARCHA.
  #
  # Cuatro escenarios, y el orden importa:
  #
  #   A  --check-only sobre la maquina virgen: fase 1 en verde, sin escribir.
  #   B  Fallo seguro: puerto ocupado a proposito -> salida 2 y NADA escrito. Va
  #      ANTES de instalar, que es cuando de verdad se puede comprobar que no ha
  #      escrito nada: despues, cualquier resto seria ambiguo.
  #   C  Instalacion completa siguiendo SOLO la guia -> salida 0, /health y
  #      /ready respondiendo, las tres SPA servidas y el esquema aplicado sin un
  #      solo dato de demostracion.
  #   D  Segunda ejecucion sobre la instalacion buena -> salida 3, y la
  #      instalacion SIGUE EN PIE despues (idempotencia: re-ejecutar no rompe).
  #   E  Fallo DENTRO de la fase 4 -> salida 4, vuelta atras COMPLETA (sin
  #      contenedores, sin volumenes, sin directorios, .env byte a byte igual) y
  #      reintento posible. Va entre B y C porque deja la maquina limpia.
  #   F  El camino POR DEFECTO: la observabilidad encendida, levantada de verdad
  #      sobre la instalacion de C.
  #
  # LOS ESCENARIOS A-E INSTALAN CON LA OBSERVABILIDAD APAGADA y el F la
  # enciende sobre la instalacion ya en pie. Se hace en dos tiempos porque los
  # cinco servicios del perfil son imagenes publicas de terceros (~690 MiB) sin
  # una linea de codigo de KronoQR: repetir su descarga en cada instalacion de
  # la etapa anadiria minutos y el limite de descargas anonimas de Docker Hub a
  # una puerta que tiene que ser fiable. Encenderlo UNA vez, al final, cubre lo
  # que de verdad faltaba —que el camino por defecto del cliente arranca— sin
  # pagarlo tres veces.
  #
  # CUANDO SE EJECUTA. El §10.1 la situa «antes de publicar una version», no en
  # cada push, y cuesta entre 6 y 18 minutos: ponerla en cada push convertiria
  # una CI de 15 minutos en una que nadie espera, que es como se acaba ignorando
  # una cadena de calidad entera.
  #
  #   · etiqueta `vX.Y.Z`  -> la publicacion de una version no sale sin esto
  #   · push a `main`      -> lo que se fusiona queda comprobado el mismo dia
  #   · «Run workflow»     -> a mano, sobre cualquier rama, que es como se pide
  #                           evidencia mientras se trabaja una rama de fase
  clean-install:
    name: "⑧ Instalacion limpia"
    runs-on: ubuntu-24.04
    # Generoso a proposito: construye tres imagenes -una de ellas compila las
    # tres SPA con `npm ci`-, levanta la pila DOS veces (el escenario E la tira
    # entera) y descarga las cinco imagenes de observabilidad. Estimacion en
    # frio, sin cache de Actions: 20-30 min. Con cache: 10-15.
    timeout-minutes: 50
    # `github.ref == 'refs/heads/main'` es CIERTO tambien en un evento
    # `schedule` (dispara contra la rama por defecto): sin la exclusion
    # explicita, la entrada de cron de `coverage` habria arrastrado esta etapa
    # de 6-18 minutos cada noche sin que nadie lo hubiera pedido.
    if: >-
      github.event_name != 'schedule'
      && (
        github.event_name == 'workflow_dispatch'
        || startsWith(github.ref, 'refs/tags/v')
        || github.ref == 'refs/heads/main'
      )

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0
      - uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0

      - name: "Puerta de release: la clave publica del fabricante esta puesta"
        # Solo cuando se publica una version de verdad. Una imagen de ENTREGA
        # construida sin la clave publica rechaza la licencia recien pagada del
        # cliente con motivo `no_public_key`, y el sintoma apunta al sitio
        # equivocado: el hotel llamaria pidiendo otra clave cuando lo que hay
        # que rehacer es la imagen (tarea 5.3, hallazgo I3).
        #
        # NO se ejecuta en `main` ni a mano: ahi estas imagenes son de PRUEBA y
        # deben poder llevarla vacia, porque la suite genera su propio par en
        # cada ejecucion y jamas usa uno fijo del repositorio (§7.7, RS-08).
        if: startsWith(github.ref, 'refs/tags/v')
        run: make release-gate

      - name: Construir las tres imagenes de entrega
        env:
          APK_INDEX_STAMP_OVERRIDE: ${{ inputs.apk_index_stamp }}
        run: make build-ci-images IMAGES="postgres app nginx" BUILDX_CACHE=gha ${APK_INDEX_STAMP_OVERRIDE:+APK_INDEX_STAMP=$APK_INDEX_STAMP_OVERRIDE}

      - name: El borde sirve las tres SPA (comprobacion de 30 s, antes de instalar nada)
        # ADELANTA EL HALLAZGO, no lo duplica. Los escenarios C y siguientes ya
        # piden estas rutas, pero tardan entre 20 y 30 minutos en llegar ahi: un
        # 403 por una directiva `index` que falta -lo que rompio la cuarta
        # ejecucion de esta etapa- no merece esperar todo el ciclo. Arranca la
        # imagen sola, sin base de datos y sin aplicacion, y pide las cuatro
        # rutas que definen si el borde sirve lo que tiene que servir.
        #
        # Es la misma orden que se ejecuta en local con `make nginx-smoke`, que
        # es lo que esta etapa no puede ofrecer: aqui no se puede depurar.
        run: make nginx-smoke

      - name: Etiquetarlas como las nombra compose.prod.yaml
        # El instalador fija IMAGE_TAG desde el fichero VERSION, y el fichero de
        # compose compone <IMAGE_REGISTRY>/<php|nginx|postgres>:<IMAGE_TAG>. Se
        # reetiquetan aqui, en el runner, para que el escenario C ejercite el
        # camino REAL del instalador -incluida su rama de "las imagenes ya estan
        # en el disco, no hay nada que descargar", que es la que usa un cliente
        # sin salida a internet- sin publicar nada en ningun registro.
        run: |
          version="$(cat VERSION)"
          docker tag kronoqr/app:ci      "kronoqr/php:${version}"
          docker tag kronoqr/postgres:ci "kronoqr/postgres:${version}"
          docker tag kronoqr/nginx:ci    "kronoqr/nginx:${version}"

      - name: Armar el paquete de entrega con lo mismo que recibe el cliente
        # §11.6.1. Se copia a un directorio aparte y se instala DESDE AHI: si el
        # instalador dependiera de algo que solo existe en el repositorio, aqui
        # se veria. La lista de lo que entra vive en infra/scripts/package.sh
        # desde la tarea 5.7, porque la necesitan dos jobs y tres paquetes.
        # `tools/` NO entra: es del fabricante y firma licencias (§7.7, RS-08),
        # y aunque package.sh ya lo comprueba, aqui se vuelve a afirmar: es la
        # clase de cosa que se comprueba dos veces.
        run: |
          set -euo pipefail
          bash infra/scripts/package.sh paquete
          test -x paquete/install.sh
          test -x paquete/update.sh
          test -x paquete/doctor.sh
          test -f paquete/versions.txt
          test ! -e paquete/tools
          ls -la paquete

      - name: Ningun enlace de la documentacion entregada apunta fuera del paquete
        # El cliente no tiene el repositorio: un enlace relativo a algo que no
        # viaja en el paquete es un 404 en el peor momento, que es cuando
        # alguien sigue la guia con una incidencia delante.
        run: bash infra/scripts/check-package-links.sh paquete


      - name: Rellenar lo marcado [CLIENTE], como haria el IT del hotel
        # Un certificado de verdad en el directorio de certificados: el borde se
        # niega a arrancar sin el y ese camino tiene que quedar ejercitado.
        #
        # Y con VALORES PROPIOS, no los de la plantilla. Desde la revision de la
        # 5.4, la fase 1 compara `APP_URL` y las tres redes contra `.env.example`
        # y se niega a instalar si siguen con el ejemplo: con
        # `APP_URL=https://localhost` el sistema arranca, todo pasa —la
        # verificacion sondea 127.0.0.1— y ningun quiosco puede llegar a el.
        # Si la etapa se rellenara con la plantilla, probaria justo el camino
        # que el producto rechaza.
        #
        # Lo hace .github/scripts/prepare-package-env.sh (tarea 5.7): el mismo
        # relleno lo necesitan el escenario E y los paquetes del job de
        # actualizacion, y cuatro copias del mismo `sed` acabarian diciendo
        # cosas distintas. El porque del certificado con propietario 101 esta
        # en la cabecera de ese script.
        run: bash .github/scripts/prepare-package-env.sh paquete


      - name: El compose es valido tambien con la observabilidad encendida
        run: |
          set -euo pipefail
          cd paquete
          servicios="$(IMAGE_TAG="$(cat VERSION)" DB_PASSWORD=x DB_MIGRATION_PASSWORD=x \
            GRAFANA_ADMIN_PASSWORD=x COMPOSE_PROFILES=observability \
            docker compose -f docker-compose.yml config --services | sort | tr '\n' ' ')"
          echo "servicios: ${servicios}"
          test "${servicios}" = "alertmanager app blackbox-exporter grafana horizon loki nginx node-exporter postgres prometheus redis reverb scheduler tempo "

      - name: "A · --check-only en la maquina virgen: fase 1 verde y nada escrito"
        run: |
          set -euo pipefail
          cd paquete
          sudo ./install.sh --check-only
          test -z "$(docker ps -aq --filter label=com.docker.compose.project=kronoqr)"
          grep -q '^APP_KEY=$' .env

      - name: "B · Fallo seguro: puerto 443 ocupado, salida 2 y maquina intacta"
        run: |
          set -euo pipefail
          cd paquete
          # Un proceso cualquiera escuchando donde el producto quiere publicar.
          sudo python3 -m http.server 443 --bind 0.0.0.0 >/dev/null 2>&1 &
          ocupante=$!
          for _ in $(seq 1 20); do
            ss -ltnH 'sport = :443' | grep -q . && break
            sleep 0.5
          done

          set +e
          sudo ./install.sh >salida-b.log 2>&1
          codigo=$?
          set -e
          sudo kill "${ocupante}" || true

          cat salida-b.log
          test "${codigo}" -eq 2 || { echo "Se esperaba salida 2 y fue ${codigo}"; exit 1; }
          # El mensaje tiene que decir QUE HACER, no solo que falla (§3.5).
          grep -q 'Que hacer' salida-b.log
          grep -q 'sport = :443' salida-b.log
          # Y NADA escrito: ni contenedores, ni volumenes, ni secretos, ni
          # directorios de datos.
          test -z "$(docker ps -aq --filter label=com.docker.compose.project=kronoqr)"
          test -z "$(docker volume ls -q --filter name=^kronoqr_)"
          grep -q '^APP_KEY=$'   .env
          grep -q '^IMAGE_TAG=$' .env
          test ! -d /var/backups/fichaje
      - name: "E · Fallo dentro de la fase 4: vuelta atras COMPLETA, salida 4"
        # LOS DOS BLOQUEANTES DE LA REVISION, EN UN SOLO ESCENARIO.
        #
        # (1) Sin `trap ... ERR`, un fallo no capturado despues de empezar a
        #     escribir mataba el script con su codigo crudo: sin vuelta atras,
        #     con el .env a medias y con `.env.kronoqr-pre-install` huerfano. El
        #     reintento salia 3 —«ya hay secretos generados»— sin un solo
        #     contenedor levantado: un callejon sin salida.
        # (2) Las acciones de deshacer usaban `rmdir`, y `${BACKUP_PATH}/wal` es
        #     un bind mount donde PostgreSQL archiva desde el primer segundo:
        #     `rmdir` fallaba sobre un directorio no vacio y CUALQUIER fallo de
        #     la fase 4 acababa en 5 («intervencion manual») en vez de 4,
        #     contradiciendo al propio mensaje del instalador.
        #
        # Como se fuerza el fallo sin tocar el instalador: se rompe la migracion
        # con una credencial de migracion que la base no conoce. El esquema no
        # se aplica, la fase 4 llama a la vuelta atras, y lo que se exige es que
        # la maquina quede LIMPIA y el codigo sea 4.
        run: |
          set -euo pipefail
          # `sudo cp -a`: los certificados son del uid 101 y la clave es 0400,
          # asi que el usuario del runner no puede copiarlos ni conservar su
          # propietario. Se copia con privilegios y se devuelve el resto del
          # arbol al runner, dejando `certs/` como estaba: es el estado que la
          # fase 1 exige y el que este escenario tiene que ejercitar.
          sudo rm -rf paquete-e && sudo cp -a paquete paquete-e
          sudo chown -R "$(id -u):$(id -g)" paquete-e
          # El mismo relleno que el escenario C, con otro destino de copias y
          # otros puertos para no chocar con la instalacion que ya esta en pie.
          bash .github/scripts/prepare-package-env.sh paquete-e \
            --backup-path /var/backups/fichaje-e --http-port 8081 --https-port 8444
          cd paquete-e
          # LA ROTURA: la aplicacion no encuentra la base. postgres y redis
          # arrancan sanos —la fase 4 los espera y los da por buenos— y el fallo
          # ocurre en las MIGRACIONES, que es el punto donde ya hay
          # contenedores, volumenes y directorios creados por esta ejecucion.
          # Es justo el estado en el que la vuelta atras tiene algo que deshacer.
          sed -i -e 's@^DB_HOST=.*@DB_HOST=una-base-que-no-existe@' .env
          cp .env .env.antes

          set +e
          sudo ./install.sh >salida-e.log 2>&1
          codigo=$?
          set -e
          tail -40 salida-e.log

          test "${codigo}" -eq 4 || { echo "Se esperaba salida 4 (vuelta atras completada) y fue ${codigo}"; exit 1; }
          grep -q 'Deshaciendo' salida-e.log
          grep -q 'Vuelta atras completada' salida-e.log

          # Vuelta atras COMPLETA quiere decir esto, no una frase:
          test -z "$(docker ps -aq --filter label=com.docker.compose.project=kronoqr)"
          test -z "$(docker volume ls -q --filter name=^kronoqr_)"
          test ! -d /var/backups/fichaje-e
          # El .env vuelve a ser BYTE A BYTE el del cliente, y la copia previa
          # no queda huerfana.
          sudo cmp .env.antes .env
          test ! -e .env.kronoqr-pre-install

      - name: "E · Y despues del fallo se puede reintentar sin callejon sin salida"
        # Es la mitad que faltaba: que la vuelta atras deje el servidor en un
        # estado desde el que el IT del hotel PUEDE volver a ejecutar. Con el
        # .env a medias, el reintento salia 3 y no habia forma de avanzar.
        run: |
          set -euo pipefail
          cd paquete-e
          sed -i -e 's@^DB_HOST=.*@DB_HOST=postgres@' .env
          set +e
          sudo ./install.sh --check-only >reintento-e.log 2>&1
          codigo=$?
          set -e
          tail -10 reintento-e.log
          test "${codigo}" -eq 0 || { echo "El reintento deberia salir 0 y salio ${codigo}"; exit 1; }


      - name: "J · Interrumpido en la fase 4 (SIGTERM): vuelta atras COMPLETA, salida 4"
        # R6-PL-01. Un corte de SSH (SIGHUP), un `kill` (SIGTERM) o Ctrl+C
        # (SIGINT) a mitad de la fase 4 dejaban el .env con secretos, los
        # contenedores y los volumenes, y el reintento salia 3: el mismo
        # callejon sin salida que el escenario E cerro para los errores. Desde
        # entonces install.sh arma INT, TERM y HUP junto con el ERR de la fase 3.
        #
        # Se interrumpe con SIGTERM porque es la unica de las tres que se puede
        # mandar de forma fiable a un proceso en segundo plano: bash IGNORA
        # SIGINT en lo que lanza con `&` desde un guion, y SIGHUP sigue el mismo
        # camino de codigo que SIGTERM (lo cubre, sin Docker y con HUP incluido,
        # backend/tests/Integration/Install/InstallInterruptionTest.php).
        # Se manda al `bash ./install.sh` y no a `sudo`: es el proceso que
        # tiene los traps. Sus subshells tienen la misma linea de
        # ordenes y tambien la reciben, que es justo el caso que la guarda de
        # BASHPID tiene que aguantar sin deshacer dos veces.
        #
        # Va DETRAS de E y DELANTE de C, como E: usa el mismo proyecto de
        # Compose (`kronoqr`) y tiene que dejar el runner como lo encontro.
        run: |
          set -euo pipefail
          sudo rm -rf paquete-j && sudo cp -a paquete paquete-j
          sudo chown -R "$(id -u):$(id -g)" paquete-j
          bash .github/scripts/prepare-package-env.sh paquete-j \
            --backup-path /var/backups/fichaje-j --http-port 8082 --https-port 8445
          cd paquete-j
          cp .env .env.antes

          # Con traza (`bash -x` a un fichero aparte, fd 9): si el instalador
          # muriera antes de la fase 4 se imprime, filtrando las lineas con
          # secretos. La linea de ordenes del hijo pasa a ser `bash -x ./install.sh`.
          sudo bash -c 'exec 9>salida-j.trace; export BASH_XTRACEFD=9; exec bash -x ./install.sh' >salida-j.log 2>&1 &
          lanzador=$!

          # Espera por CONDICION: la fase 4 empezada Y contenedores del proyecto
          # creados, que es cuando la vuelta atras tiene algo que deshacer.
          en_fase_4=0
          for _ in $(seq 1 300); do
            if grep -q 'Fase 4 de 5' salida-j.log &&
              [ -n "$(docker ps -aq --filter label=com.docker.compose.project=kronoqr)" ]; then
              en_fase_4=1
              break
            fi
            # Vivo o no, por `ps` y no por `kill -0`: el lanzador es `sudo`, y
            # segun la version de la imagen del runner su uid real ya es root y
            # `kill -0` devuelve EPERM aunque siga vivo. Asi fallo el 07-10-2026
            # (imagen 20260901): el bucle se rendia en la primera vuelta y el
            # instalador terminaba entero sin senal. Un zombi (`Z`) ya salio.
            estado="$(ps -o stat= -p "${lanzador}" 2>/dev/null || true)"
            case "${estado}" in
              '' | Z*) break ;;
            esac
            sleep 1
          done
          if [ "${en_fase_4}" -ne 1 ]; then
            set +e
            wait "${lanzador}"
            codigo=$?
            set -e
            cat salida-j.log
            echo "--- traza (ultimas 60 lineas, sin secretos)"
            sudo grep -vE 'set_env_value|set_generated_secret|random_|_KEY|PASSWORD|SECRET' salida-j.trace | tail -60 || true
            echo "El instalador no llego a la fase 4 con contenedores creados (salio con ${codigo}): no hay nada que interrumpir."
            exit 1
          fi

          sudo pkill -TERM -f '^bash -x \./install\.sh'

          set +e
          wait "${lanzador}"
          codigo=$?
          set -e
          tail -40 salida-j.log

          if grep -q 'instalado y verificado' salida-j.log; then
            echo "La instalacion termino antes de la senal: el escenario no ha probado nada."
            exit 1
          fi
          test "${codigo}" -eq 4 || { echo "Se esperaba salida 4 (vuelta atras completada) y fue ${codigo}"; exit 1; }
          grep -q 'senal TERM' salida-j.log
          grep -q 'tmux' salida-j.log
          grep -q 'Vuelta atras completada' salida-j.log

          # Lo mismo que exige E: maquina limpia y .env byte a byte el del cliente.
          test -z "$(docker ps -aq --filter label=com.docker.compose.project=kronoqr)"
          test -z "$(docker volume ls -q --filter name=^kronoqr_)"
          test ! -d /var/backups/fichaje-j
          sudo cmp .env.antes .env
          test ! -e .env.kronoqr-pre-install

      - name: "J · Y el reintento no sale 3"
        # `--check-only` solo ejecuta la fase 1, asi que las TRES senales de la
        # fase 2 («instalacion previa», salida 3) se comprueban una a una: sin
        # contenedores, sin volumenes y sin APP_KEY en el .env. Con las tres
        # ausentes y la fase 1 en verde, un `./install.sh` de verdad pasaria.
        run: |
          set -euo pipefail
          cd paquete-j
          test -z "$(docker ps -aq --filter label=com.docker.compose.project=kronoqr)"
          test -z "$(docker volume ls -q --filter name=^kronoqr_)"
          grep -q '^APP_KEY=$' .env
          set +e
          sudo ./install.sh --check-only >reintento-j.log 2>&1
          codigo=$?
          set -e
          tail -10 reintento-j.log
          test "${codigo}" -eq 0 || { echo "El reintento deberia salir 0 y salio ${codigo}"; exit 1; }

      - name: "C · Instalacion limpia siguiendo solo la guia"
        run: |
          set -euo pipefail
          cd paquete
          sudo ./install.sh | tee salida-c.log
          # Lo que la guia promete que se ve al terminar.
          grep -q 'instalado y verificado' salida-c.log
          grep -q 'SIGUIENTE PASO'         salida-c.log
          # NINGUN SECRETO EN LA SALIDA (§3.5, RS-08). Se comprueba contra los
          # valores que el instalador acaba de escribir en el .env, que es la
          # unica forma honesta de hacerlo: buscar "algo que parezca una clave"
          # daria verde con cualquier fuga real.
          for clave in APP_KEY QR_SIGNING_KEY_CURRENT BACKUP_ENCRYPTION_KEY \
                       REVERB_APP_SECRET DB_PASSWORD DB_MIGRATION_PASSWORD BACKUP_DB_PASSWORD \
                       IDENTITY_PIN_SEALING_SECRET_KEY GRAFANA_ADMIN_PASSWORD BACKUP_WAL_KEY; do
            valor="$(sudo sed -n "s/^${clave}=//p" .env | head -1)"
            test -n "${valor}"
            if grep -qF -- "${valor}" salida-c.log; then
              echo "FUGA: el valor de ${clave} aparece en la salida del instalador."
              exit 1
            fi
          done
          # Permisos del .env (§7.7) y del archivo de WAL (uid de PostgreSQL).
          test "$(sudo stat -c '%a' .env)" = "600"
          test "$(sudo stat -c '%u:%g:%a' /var/backups/fichaje/wal)" = "70:70:750"
          # ADR-045: informes de retencion junto a las copias, con el uid de la
          # aplicacion, y el volumen de ficheros generados creado por Compose.
          test "$(sudo stat -c '%u:%g:%a' /var/backups/fichaje/reports/retention)" = "1000:1000:750"
          # ADR-049 / A3-R2: la raiz de las copias se monta en solo lectura y cada subdirectorio
          # se monta aparte con create_host_path: false, asi que el instalador los crea TODOS
          # con el uid de la aplicacion. La clave del WAL se DERIVA de la maestra y esta en el .env.
          for d in daily base metrics reports; do
            test "$(sudo stat -c '%u:%g:%a' "/var/backups/fichaje/${d}")" = "1000:1000:750"
          done
          sudo grep -Eq '^BACKUP_WAL_KEY=[0-9a-f]{64}$' .env
          test -n "$(docker volume ls -q --filter name=^kronoqr_app-storage$)"

      - name: "C · Las dos sondas responden lo que dice el contrato"
        run: |
          set -euo pipefail
          curl -fsS -k https://127.0.0.1/api/v1/health | tee health.json
          curl -fsS -k https://127.0.0.1/api/v1/ready  | tee ready.json
          # La version que informa la sonda es la que se instalo, no `latest`.
          grep -qF "$(cat VERSION)" health.json

      - name: "C · Las tres SPA se sirven, y el portal solo desde su red"
        run: |
          set -euo pipefail
          curl -fsS -k https://127.0.0.1/admin/ | grep -qi '<!doctype html'
          curl -fsS -k https://127.0.0.1/kiosk/ | grep -qi '<!doctype html'
          # El portal, NO: la peticion llega desde el anfitrion, fuera de
          # PORTAL_INTERNAL_CIDR (RF-ID-08). Un 403 aqui es el resultado bueno.
          codigo="$(curl -s -k -o /dev/null -w '%{http_code}' https://127.0.0.1/portal/)"
          test "${codigo}" = "403" || { echo "El portal respondio ${codigo}, se esperaba 403"; exit 1; }

      - name: "C · Cero datos de demostracion, y los catalogos de producto puestos"
        run: |
          set -euo pipefail
          cd paquete
          consulta() {
            sudo docker compose --env-file .env -f docker-compose.yml exec -T postgres \
              psql -U fichaje_migrator -d fichaje -Atqc "$1"
          }
          # El perfil de convenio y los catalogos SI: los siembran las
          # migraciones, son dato de producto (regla dura 14).
          test "$(consulta 'SELECT count(*) FROM compliance_profiles')" -ge 1
          test "$(consulta 'SELECT count(*) FROM roles')" -ge 1
          # Personas, fichajes y cuentas: NI UNO. El instalador no crea usuarios
          # y no siembra demostracion.
          test "$(consulta 'SELECT count(*) FROM employees')"     -eq 0
          test "$(consulta 'SELECT count(*) FROM shift_entries')" -eq 0
          test "$(consulta 'SELECT count(*) FROM users')"         -eq 0
          # AUD-1: las copias se hacen con un rol PROPIO de solo lectura, distinto
          # del migrador, y el planificador (que las lanza) lleva ese, no el otro.
          test "$(consulta "SELECT rolsuper OR rolcreatedb OR rolcreaterole FROM pg_roles WHERE rolname = 'fichaje_backup'")" = "f"
          test "$(consulta "SELECT rolreplication FROM pg_roles WHERE rolname = 'fichaje_backup'")" = "t"
          # A3-06: la unica pertenencia del rol de copias es pg_read_all_data (una
          # anterior, p. ej. pg_write_all_data, se retira al provisionarlo) y no puede
          # escribir en el registro ni en los fichajes.
          test "$(consulta "SELECT string_agg(g.rolname, ',' ORDER BY g.rolname) FROM pg_auth_members am JOIN pg_roles g ON g.oid = am.roleid JOIN pg_roles m ON m.oid = am.member WHERE m.rolname = 'fichaje_backup'")" = "pg_read_all_data"
          test "$(consulta "SELECT has_table_privilege('fichaje_backup', 'audit_log', 'UPDATE') OR has_table_privilege('fichaje_backup', 'audit_log', 'DELETE') OR has_table_privilege('fichaje_backup', 'shift_entries', 'UPDATE')")" = "f"
          test "$(sudo docker compose --env-file .env -f docker-compose.yml exec -T scheduler printenv BACKUP_DB_USERNAME)" = "fichaje_backup"
          test "$(sudo sed -n 's/^BACKUP_DB_PASSWORD=//p' .env)" != "$(sudo sed -n 's/^DB_MIGRATION_PASSWORD=//p' .env)"
          # AUD-1 / PIN-10: NINGUN contenedor de runtime (app, horizon, reverb,
          # scheduler, nginx) tiene la contrasena del migrador ni la de
          # mantenimiento; solo scheduler tiene la clave de cifrado y las
          # credenciales de copia; app recibe toda la configuracion no privilegiada.
          bash ../.github/scripts/assert-runtime-env.sh .env docker-compose.yml

      - name: "C · La comprobacion de runtime falla ante cada incumplimiento (prueba de la prueba)"
        # A3-10. assert-runtime-env.sh dio falsos negativos (un alias en app, un .env con
        # comillas y nota). Una comprobacion de seguridad que nunca ha fallado no demuestra
        # nada: aqui se le hace cada trampa a una pila de juguete y tiene que fallar.
        run: bash .github/scripts/assert-runtime-env-selftest.sh

      - name: "D · Segunda ejecucion: salida 3, y la instalacion sigue en pie"
        run: |
          set -euo pipefail
          cd paquete
          set +e
          sudo ./install.sh >salida-d.log 2>&1
          codigo=$?
          set -e
          cat salida-d.log
          test "${codigo}" -eq 3 || { echo "Se esperaba salida 3 y fue ${codigo}"; exit 1; }
          grep -q 'update.sh'            salida-d.log
          grep -q 'No se ha tocado nada' salida-d.log
          # Idempotencia de verdad: despues de la segunda ejecucion el sistema
          # sigue respondiendo. Un instalador que "no rompe nada" pero deja el
          # servicio caido no es idempotente.
          curl -fsS -k https://127.0.0.1/api/v1/ready >/dev/null
      - name: "F · El camino de serie: la observabilidad encendida, de verdad"
        # POR QUE ESTE PASO EXISTE. Los escenarios anteriores instalan con
        # `COMPOSE_PROFILES=` vacio, y el cliente recibe `observability`: el
        # camino POR DEFECTO —el que van a tener veinte instalaciones de veinte
        # hoteles— no se levantaba nunca de extremo a extremo. Comprobar el
        # fichero de compose con `config` demuestra que el perfil existe, no que
        # arranque.
        #
        # Aqui se enciende el perfil sobre la instalacion que ya esta en pie, que
        # es ademas la operacion real que hara un cliente que lo apago y se
        # arrepiente. Cuesta la descarga de las cinco imagenes publicas (~690 MiB,
        # medido) y no otra migracion. La INSTALACION con el perfil encendido desde
        # el principio, tal como la deja la guia, es el escenario G de mas abajo
        # (I4, 2.2.0).
        #
        # La descarga va aparte y con reintento a proposito: asi un limite de
        # Docker Hub se distingue de un perfil mal escrito, en vez de aparecer
        # como «la observabilidad no arranca».
        run: |
          set -euo pipefail
          cd paquete
          # `sudo env` y no `VAR=x sudo -E`: con env_reset en sudoers -lo normal-
          # `-E` puede rechazarse por politica y las variables se perderian en
          # silencio. El .env es 0600 de root, asi que el sudo si hace falta.
          imagenes="$(sudo env COMPOSE_PROFILES=observability \
            docker compose -f docker-compose.yml --env-file .env config --images |
            grep -Ev '^kronoqr/')"
          echo "${imagenes}"
          for imagen in ${imagenes}; do
            for intento in 1 2 3; do
              docker pull --quiet "${imagen}" >/dev/null && break
              if [ "${intento}" -eq 3 ]; then
                echo "No se ha podido descargar ${imagen} tras 3 intentos."
                echo "Esto es un problema de acceso al registro publico, NO del perfil."
                exit 1
              fi
              sleep 10
            done
          done

      - name: "F · Los cinco servicios del perfil quedan en pie"
        run: |
          set -euo pipefail
          cd paquete
          sudo sed -i 's|^COMPOSE_PROFILES=.*|COMPOSE_PROFILES=observability|' .env
          sudo docker compose --env-file .env -f docker-compose.yml up -d
          for servicio in prometheus node-exporter alertmanager grafana loki; do
            for _ in $(seq 1 30); do
              estado="$(sudo docker compose --env-file .env -f docker-compose.yml ps \
                --format '{{.Service}} {{.State}}' | awk -v s="${servicio}" '$1 == s {print $2}')"
              [ "${estado}" = "running" ] && break
              sleep 2
            done
            test "${estado}" = "running" || {
              echo "${servicio} no esta en marcha (${estado:-ausente})"
              sudo docker compose --env-file .env -f docker-compose.yml logs --tail 40 "${servicio}"
              exit 1
            }
            echo "${servicio}: ${estado}"
          done
          # Y el fichaje sigue en pie despues de encender el perfil: es lo que
          # de verdad importa de esta operacion.
          curl -fsS -k https://127.0.0.1/api/v1/ready >/dev/null
          # node-exporter tiene que poder LEER el arbol de copias: es de donde
          # salen las metricas que avisan de que la copia de anoche fallo.
          sudo docker compose --env-file .env -f docker-compose.yml exec -T node-exporter \
            ls /var/backups/metrics >/dev/null

      - name: "G · Segunda pasada: el procedimiento LITERAL de la guia, con la observabilidad encendida"
        # I4 (2.2.0). Los escenarios A-F rellenan el `.env` con otros valores y
        # APAGAN la observabilidad (prepare-package-env.sh, modo por defecto): el
        # camino que sigue un cliente, que es copiar `.env.example`, poner lo de
        # su bloque «Lo minimo que hay que rellenar» y dejar el resto como viene,
        # no se ejecutaba NUNCA. Asi paso I1 —el instalador rechazaba el unico
        # valor de METRICS_ALLOW_CIDR que deja a Prometheus leer /metrics— con la
        # etapa en verde, y la guia decia que este procedimiento «esta probado en
        # cada publicacion».
        #
        # Aqui se retira la instalacion de C-F (misma maquina, mismos puertos) y se
        # instala otra DESDE UN PAQUETE NUEVO con `--literal`: `METRICS_ALLOW_CIDR`
        # de serie y `COMPOSE_PROFILES=observability`. Lo que se exige despues es lo
        # que la guia promete: instalado y verificado, `doctor.sh` sin fallos y
        # `/metrics` raspado por Prometheus.
        #
        # Las imagenes de observabilidad ya estan en el runner (las descarga el
        # escenario F): esto no anade descargas.
        run: |
          set -euo pipefail
          sudo docker compose --env-file paquete/.env -f paquete/docker-compose.yml \
            --profile '*' down -v --remove-orphans
          sudo rm -rf /var/backups/fichaje
          test -z "$(docker ps -aq --filter label=com.docker.compose.project=kronoqr)"
          test -z "$(docker volume ls -q --filter name=^kronoqr_)"

          bash infra/scripts/package.sh paquete-g
          bash .github/scripts/prepare-package-env.sh paquete-g --literal
          cd paquete-g
          # Lo que la guia deja como viene, tal como viene.
          grep -q '^COMPOSE_PROFILES=observability' .env
          grep -q '^METRICS_ALLOW_CIDR=172.29.0.20/32' .env

          sudo ./install.sh | tee salida-g.log
          grep -q 'instalado y verificado' salida-g.log

      - name: "G · doctor.sh sale sin fallos (avisos si, fallos no)"
        run: |
          set -euo pipefail
          cd paquete-g
          # Sale 0 con avisos y 6 con algun fallo. Los avisos esperados de un
          # paquete recien instalado —correo de desarrollo, sin destinatarios de
          # alerta, portal fuera de la red del runner— no son fallos.
          sudo ./doctor.sh | tee doctor-g.log

      - name: "G · Prometheus raspa /metrics: el target kronoqr-api esta up"
        # `up == 1` exige un 200 de /metrics a traves de nginx, asi que un
        # METRICS_ALLOW_CIDR que no cubra a Prometheus (403) deja `up == 0`. Es
        # exactamente el fallo de I1. Se espera por condicion, no por `sleep`: el
        # primer raspado tarda lo que tarde el intervalo.
        run: |
          set -euo pipefail
          cd paquete-g
          consulta='http://127.0.0.1:9090/api/v1/query?query=up%7Bjob%3D%22kronoqr-api%22%7D'
          respuesta=""
          for _ in $(seq 1 40); do
            respuesta="$(sudo docker compose --env-file .env -f docker-compose.yml exec -T prometheus \
              wget -qO- "${consulta}" || true)"
            if grep -qE '\[[0-9.]+,"1"\]' <<<"${respuesta}"; then
              echo "kronoqr-api: up"
              exit 0
            fi
            sleep 5
          done
          echo "Prometheus no consigue raspar /metrics tras 200 s. Respuesta: ${respuesta}"
          sudo docker compose --env-file .env -f docker-compose.yml exec -T prometheus \
            wget -qO- 'http://127.0.0.1:9090/api/v1/targets' || true
          exit 1

      - name: "H · Ficheros generados: genera horizon, descarga app, purga scheduler (ADR-045)"
        # R3-PL-01, BLOQUEANTE DE LA 2.2.0. app, horizon y scheduler son tres
        # contenedores de la misma imagen y, hasta el volumen `app-storage`, cada
        # uno tenia su propio storage/app: la exportacion integra pedida desde el
        # panel la escribia horizon y app respondia 404. Ninguna prueba de Pest
        # puede verlo (un solo proceso), asi que se recorre aqui, sobre la
        # instalacion de G: exportacion pedida por la API como la pide el panel
        # (admin con 2FA) y descargada con su huella; recreacion de los tres;
        # informe de retencion leido en el anfitrion y la consulta de
        # operacion.md §3.1 tal cual; un ZIP borrado a mano (asiento
        # file_missing y metrica); caducidad (la purga de scheduler lo borra);
        # `kill` de horizon a mitad (el .work-<uuid> queda y la purga lo
        # retira); doctor.sh en verde y storage/app app:app 700 en la imagen.
        #
        # Los plazos se acortan, no se esperan: el detalle esta en la cabecera
        # del script. Medido en docker-in-docker: 70-80 s.
        env:
          KQ_E2E_APP_IMAGE: kronoqr/app:ci
        run: bash .github/scripts/generated-files-e2e.sh paquete-g

      - name: "I · Copias: WAL cifrado, copia autenticada, RPO continuo y montajes de BACKUP_PATH (ADR-049)"
        # R5-DV-02, R5-DV-04, R5-DV-01 y A3-R2 (bloque 20). Lo que solo se ve en la instalacion
        # que deja el instalador: PostgreSQL archiva CIFRADO con la clave que le llega por el
        # .env y falla cerrado sin ella; la raiz de BACKUP_PATH es de solo lectura para el
        # runtime (la matriz entera, `horizon` incluido); un bit cambiado, un `.sha256` borrado,
        # una copia renombrada o un manifiesto alterado NO restauran; parar el archivado se ve
        # en la metrica en menos de 2 minutos SIN esperar a ninguna copia (con el rol real
        # fichaje_backup, sin pg_monitor); doctor.sh falla con una clave del WAL que no deriva
        # de la maestra; y la clave no sale del contenedor de postgres. El detalle, en la
        # cabecera del script.
        run: bash .github/scripts/backup-wal-e2e.sh clean paquete-g

      - name: "K · Redis parado: el fichaje y las sondas responden en tiempo acotado (R3-CH-01)"
        # Mide en Linux lo que R3-CH-01 midio en Docker Desktop (bloque 22). Con `redis`
        # PARADO (sin eliminar: su nombre sale del DNS de la red) hace dos rondas de /health,
        # /ready y POST /scan/pin, y falla si la segunda supera 3 s o si el fichaje responde
        # 5xx. Arranca redis de nuevo al terminar, pase lo que pase. Va despues de G, H e I,
        # que dependen del estado de Redis. El detalle, en la cabecera del script.
        run: bash .github/scripts/chaos-redis-probe.sh paquete-g

      - name: Trivy sobre la imagen de borde recien construida (bloqueante)
        # Por `make`, como TODAS las demas invocaciones de Trivy del
        # repositorio. Este paso llamaba al binario `trivy` a pelo y el runner
        # no lo tiene: `command not found`, exit 127. Era el unico sitio del
        # arbol que se saltaba la regla de «una sola via por herramienta», y
        # fue el unico que se rompio por eso.
        run: make trivy-image TRIVY_IMAGES="kronoqr/nginx:ci"

      - name: Diagnostico si algo ha fallado
        if: failure()
        # Los dos paquetes: el de la instalacion buena y el del escenario de
        # fallo seguro. Cual de los dos existe depende de donde se haya roto.
        run: |
          for dir in paquete paquete-e paquete-j paquete-g; do
            [ -d "${dir}" ] || continue
            echo "=============== ${dir} ==============="
            [ -f "${dir}/.env" ] || continue
            sudo docker compose --env-file "${dir}/.env" -f "${dir}/docker-compose.yml" ps || true
            sudo docker compose --env-file "${dir}/.env" -f "${dir}/docker-compose.yml" logs --tail 80 || true
          done
          echo "=============== estado global ==============="
          docker ps -a --filter label=com.docker.compose.project=kronoqr || true
          docker volume ls --filter name=^kronoqr_ || true


      - name: Subir las salidas del instalador
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: instalacion-limpia
          # TODAS las salidas, no solo la del escenario B. La primera ejecucion
          # de esta etapa fallo en E y el artefacto solo traia `salida-b.log`:
          # hubo que reproducir el fallo a ciegas en local. Un diagnostico que
          # necesita una segunda ronda de informacion es exactamente lo que este
          # producto no se puede permitir.
          #
          # El .env NO se sube: lleva los secretos que el instalador acaba de
          # generar. Solo las salidas, que el escenario C comprueba libres de
          # secretos valor a valor.
          path: |
            paquete/salida-b.log
            paquete/salida-c.log
            paquete/salida-d.log
            paquete-e/salida-e.log
            paquete-e/reintento-e.log
            paquete-j/salida-j.log
            paquete-j/reintento-j.log
            paquete-g/salida-g.log
            paquete-g/doctor-g.log
          retention-days: 14
          if-no-files-found: warn

  update:
    name: "⑧b Actualizacion desde la version anterior"
    runs-on: ubuntu-24.04
    # Dos juegos de imagenes (la version anterior y esta), una instalacion, una
    # actualizacion, una reinstalacion y una actualizacion con vuelta atras
    # que espera 3 minutos a un borde que nunca arranca. En frio, 45-60 min.
    timeout-minutes: 90
    # Ver el comentario de `clean-install`: sin excluir `schedule` a proposito,
    # la entrada de cron de `coverage` habria arrastrado esta etapa de 45-60
    # minutos cada noche.
    if: >-
      github.event_name != 'schedule'
      && (
        github.event_name == 'workflow_dispatch'
        || startsWith(github.ref, 'refs/tags/v')
        || github.ref == 'refs/heads/main'
      )

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0
      - uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0

      - name: Resolver cual es la version anterior instalable
        # RQ-11 pide «actualizacion desde la version anterior». La matriz del
        # §11.6.5 dice que esa version es una ETIQUETA publicada, pero la
        # primera etiqueta con instalador todavia no existe: v2.0.0 es anterior
        # a la tarea 5.4. Hasta que exista, la version anterior es el `main`
        # previo a este commit, que es ademas lo que cada integracion en main
        # deberia poder actualizar. Cuando VERSION no ha cambiado (el caso
        # normal entre dos integraciones), el paquete nuevo recibe una version
        # SINTETICA —siguiente parche con sufijo -ci— para que haya salto que
        # probar: el actualizador no es distinto por eso, y el numero no se
        # publica en ninguna parte.
        #
        # Si la version anterior no tiene instalador, el job lo dice y termina
        # en verde: no hay nada real que probar y fingirlo seria peor.
        id: anterior
        env:
          EVENT_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          ref=""
          if [ "${GITHUB_EVENT_NAME}" = "push" ] && [ -n "${EVENT_BEFORE}" ] &&
            [ "${EVENT_BEFORE}" != "0000000000000000000000000000000000000000" ] &&
            git cat-file -e "${EVENT_BEFORE}^{commit}" 2>/dev/null; then
            ref="${EVENT_BEFORE}"
          fi
          if [ -z "${ref}" ]; then
            git fetch --no-tags origin main >/dev/null 2>&1 || true
            ref="$(git rev-parse origin/main 2>/dev/null || true)"
          fi
          if [ -z "${ref}" ] || ! git cat-file -e "${ref}:infra/scripts/install.sh" 2>/dev/null; then
            echo "::notice title=Sin version anterior instalable::El commit anterior (${ref:-desconocido}) no lleva install.sh; no hay actualizacion real que probar."
            echo "skip=true" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          old_version="$(git show "${ref}:VERSION" | head -n 1 | tr -d '[:space:]')"
          new_version="$(head -n 1 VERSION | tr -d '[:space:]')"
          synthetic=false
          open_cycle=false
          if [ "${old_version}" = "${new_version}" ]; then
            IFS=. read -r major minor patch <<<"${new_version%%-*}"
            new_version="${major}.${minor}.$((patch + 1))-ci"
            synthetic=true
            # CICLO ABIERTO: si `infra/versions.txt` acaba en una linea `V *` de
            # una version POSTERIOR a la instalada (p. ej. `2.2.0 *` mientras
            # VERSION sigue en 2.1.0), el paquete nuevo ES esa version: congelar
            # su `*` y anadir una sintetica detras deja la matriz desordenada
            # (frontera igual a la de la version anterior) y update.sh la
            # rechaza. Se conserva la linea abierta tal cual.
            abierta="$(sed -n -E 's/^([^ #]+) \*$/\1/p' infra/versions.txt | tail -n 1)"
            if [ -n "${abierta}" ] && [ "${abierta}" != "${old_version}" ]; then
              new_version="${abierta}"
              open_cycle=true
            fi
          fi
          echo "Version anterior: ${old_version} (${ref}) -> version de destino: ${new_version} (sintetica: ${synthetic})"
          {
            echo "skip=false"
            echo "ref=${ref}"
            echo "old_version=${old_version}"
            echo "new_version=${new_version}"
            echo "synthetic=${synthetic}"
            echo "open_cycle=${open_cycle}"
          } >>"$GITHUB_OUTPUT"

      - name: Arbol de la version anterior
        if: steps.anterior.outputs.skip != 'true'
        run: git worktree add --detach anterior "${{ steps.anterior.outputs.ref }}"

      - name: Construir las imagenes de la version anterior
        env:
          APK_INDEX_STAMP_OVERRIDE: ${{ inputs.apk_index_stamp }}
        if: steps.anterior.outputs.skip != 'true'
        # Con SU Makefile y SU arbol: son las imagenes que ese cliente tiene en
        # el disco. Se etiquetan como las nombra su compose y se hace ANTES de
        # construir las nuevas, porque `build-ci-images` reutiliza los tags :ci.
        run: |
          set -euo pipefail
          old="${{ steps.anterior.outputs.old_version }}"
          make -C anterior build-ci-images IMAGES="postgres app nginx" BUILDX_CACHE=gha APP_VERSION="${old}" ${APK_INDEX_STAMP_OVERRIDE:+APK_INDEX_STAMP=$APK_INDEX_STAMP_OVERRIDE}
          docker tag kronoqr/app:ci      "kronoqr/php:${old}"
          docker tag kronoqr/postgres:ci "kronoqr/postgres:${old}"
          docker tag kronoqr/nginx:ci    "kronoqr/nginx:${old}"

      - name: Construir las imagenes de esta version
        env:
          APK_INDEX_STAMP_OVERRIDE: ${{ inputs.apk_index_stamp }}
        if: steps.anterior.outputs.skip != 'true'
        run: |
          set -euo pipefail
          new="${{ steps.anterior.outputs.new_version }}"
          make build-ci-images IMAGES="postgres app nginx" BUILDX_CACHE=gha APP_VERSION="${new}" ${APK_INDEX_STAMP_OVERRIDE:+APK_INDEX_STAMP=$APK_INDEX_STAMP_OVERRIDE}
          docker tag kronoqr/app:ci      "kronoqr/php:${new}"
          docker tag kronoqr/postgres:ci "kronoqr/postgres:${new}"
          docker tag kronoqr/nginx:ci    "kronoqr/nginx:${new}"

      - name: Armar los dos paquetes de entrega
        if: steps.anterior.outputs.skip != 'true'
        # El anterior con SU package.sh si ya lo tiene; si no, con la lista que
        # ese arbol llevaba inline en su ci.yml (5.4-5.6). El nuevo, con el de
        # este arbol. Con version sintetica, la matriz del paquete nuevo la
        # incorpora: la linea `*` se congela a la ultima migracion real y se
        # anade la sintetica, exactamente como haria un `chore(release)`.
        run: |
          set -euo pipefail
          old="${{ steps.anterior.outputs.old_version }}"
          new="${{ steps.anterior.outputs.new_version }}"
          if [ -f anterior/infra/scripts/package.sh ]; then
            bash anterior/infra/scripts/package.sh paquete-anterior
          else
            mkdir -p paquete-anterior/certs paquete-anterior/docs
            cp anterior/infra/compose.prod.yaml  paquete-anterior/docker-compose.yml
            cp anterior/.env.example             paquete-anterior/.env.example
            cp anterior/VERSION                  paquete-anterior/VERSION
            cp anterior/infra/scripts/install.sh anterior/infra/scripts/backup.sh \
               anterior/infra/scripts/restore.sh anterior/infra/scripts/restore-drill.sh paquete-anterior/
            cp -r anterior/infra/scripts/lib     paquete-anterior/lib
            cp -r anterior/infra/observability   paquete-anterior/observability
            cp -r anterior/docs/cliente          paquete-anterior/docs/cliente
            cp -r anterior/docs/runbooks         paquete-anterior/docs/runbooks
            chmod +x paquete-anterior/*.sh
          fi
          bash infra/scripts/package.sh paquete-nuevo
          if [ "${{ steps.anterior.outputs.synthetic }}" = "true" ]; then
            printf '%s\n' "${new}" >paquete-nuevo/VERSION
          fi
          if [ "${{ steps.anterior.outputs.synthetic }}" = "true" ] &&
            [ "${{ steps.anterior.outputs.open_cycle }}" != "true" ]; then
            # LA FRONTERA ES LA ULTIMA MIGRACION DEL ARBOL ANTERIOR, no del nuevo:
            # es lo que esa version instalada tiene, y lo que un `chore(release)`
            # real habria congelado. Con la del arbol nuevo, toda migracion
            # añadida desde la etiqueta quedaria atribuida a la version ya
            # instalada y update.sh se negaria —bien— a adivinar (primera vez que
            # se vio: tarea 5.9, con dos migraciones nuevas; 5.7 y 5.8 no traian
            # ninguna).
            ultima="$(ls anterior/backend/database/migrations | sed -n 's/\.php$//p' | sort | tail -n 1)"
            sed -i "s/^\([0-9][^ ]*\) \*$/\1 ${ultima}/" paquete-nuevo/versions.txt
            printf '%s *\n' "${new}" >>paquete-nuevo/versions.txt
          fi
          echo "--- versions.txt del paquete nuevo ---"
          grep -v '^#' paquete-nuevo/versions.txt | grep .
          # La matriz tiene que decir que el salto esta soportado, o el
          # escenario no prueba lo que dice probar.
          bash paquete-nuevo/update.sh --supported-sources | grep -qx "${old}"
          bash paquete-nuevo/update.sh --chain "${old}"
          test ! -e paquete-nuevo/.env
          test ! -e paquete-anterior/tools
          test ! -e paquete-nuevo/tools

      - name: Rellenar el paquete anterior como haria el IT del hotel
        if: steps.anterior.outputs.skip != 'true'
        # SOLO el anterior: el nuevo se queda sin .env y sin certificado, que
        # es como llega, y es update.sh quien los copia de la instalacion.
        #
        # Y con una clave de licencia INVALIDA a proposito: la actualizacion
        # tiene que completarse igual (RF-PD-05, RF-PD-10, regla dura 15). Una
        # licencia que no verifica no puede dejar a un cliente sin correcciones
        # de seguridad sobre su registro legal.
        run: |
          set -euo pipefail
          bash .github/scripts/prepare-package-env.sh paquete-anterior
          sed -i 's|^LICENSE_KEY=.*|LICENSE_KEY=KQL1.no-es-una-licencia.firma-invalida|' paquete-anterior/.env
          grep -q '^LICENSE_KEY=KQL1' paquete-anterior/.env

      - name: Instalar la version anterior
        if: steps.anterior.outputs.skip != 'true'
        run: |
          set -euo pipefail
          old="${{ steps.anterior.outputs.old_version }}"
          cd paquete-anterior
          sudo ./install.sh | tee salida-instalacion.log
          grep -q 'instalado y verificado' salida-instalacion.log
          curl -fsS -k https://127.0.0.1/api/v1/health | tee ../health-antes.json
          grep -qF "\"version\":\"${old}\"" ../health-antes.json

      - name: Datos que tienen que sobrevivir a la actualizacion
        if: steps.anterior.outputs.skip != 'true'
        # Una cuenta de gestion, creada por consola, deja fila en users y
        # asientos en audit_log: es lo minimo que hace significativos los
        # conteos y la verificacion de la cadena antes y despues.
        run: |
          set -euo pipefail
          compose() { sudo docker compose --env-file paquete-anterior/.env -f paquete-anterior/docker-compose.yml "$@"; }
          printf 'Semilla-CI-2026-Actualizacion!\n' | compose exec -T app php artisan identity:create-user \
            --name='Semilla CI' --email=semilla@kronoqr.ci.local --role=admin
          consulta() { compose exec -T postgres psql -U fichaje_migrator -d fichaje -Atqc "$1"; }
          {
            echo "users=$(consulta 'SELECT count(*) FROM users')"
            echo "audit_log=$(consulta 'SELECT count(*) FROM audit_log')"
          } | tee conteos-antes.txt
          grep -q '^users=1$' conteos-antes.txt
          compose exec -T app php artisan compliance:verify-audit-chain

      - name: "Informes de retencion de la version anterior, con trampas, para el rescate de U1 (ADR-045)"
        if: steps.anterior.outputs.skip != 'true'
        # Hasta la 2.1.0 vivian dentro del contenedor y una actualizacion los
        # borraba. Se siembran en el `scheduler` anterior dos validos, un enlace,
        # otro nombre y uno anidado, y en BACKUP_PATH/reports/retention un enlace
        # plantado desde `app` hacia un fichero de root (F1). Lo que se exige
        # esta en la cabecera de .github/scripts/retention-rescue-e2e.sh.
        run: bash .github/scripts/retention-rescue-e2e.sh seed paquete-anterior

      - name: "Segmentos de WAL en claro de la version anterior, para cifrarlos en sitio al actualizar (ADR-049)"
        if: steps.anterior.outputs.skip != 'true'
        # La 2.1.0 archivaba el WAL SIN CIFRAR. Se dejan >= 3 segmentos `.gz` y se anotan sus
        # fechas: tras actualizar no puede quedar ninguno en claro (<= 120 s) y cada uno tiene
        # que conservar su mtime. Si la version anterior ya archivase cifrado, la semilla se
        # salta (no hay nada heredado que migrar).
        run: bash .github/scripts/backup-wal-e2e.sh upgrade-seed paquete-anterior

      - name: "U1 · Actualizar: salida 0, version nueva, datos intactos e informe en el servidor"
        if: steps.anterior.outputs.skip != 'true'
        run: |
          set -euo pipefail
          new="${{ steps.anterior.outputs.new_version }}"
          cd paquete-nuevo
          sudo ./update.sh | tee salida-u1.log
          cd ..
          grep -q 'actualizado y verificado' paquete-nuevo/salida-u1.log
          grep -q "PUNTO DE CONTROL ${new}" paquete-nuevo/salida-u1.log
          grep -q 'Copia previa verificada' paquete-nuevo/salida-u1.log
          grep -q 'Cadena de auditoria integra DESPUES' paquete-nuevo/salida-u1.log
          curl -fsS -k https://127.0.0.1/api/v1/health | tee health-despues.json
          grep -qF "\"version\":\"${new}\"" health-despues.json
          curl -fsS -k https://127.0.0.1/api/v1/ready >/dev/null
          # El mantenimiento se ha retirado: una ruta de gestion responde 401
          # (sin sesion), no 503.
          codigo="$(curl -s -k -o /dev/null -w '%{http_code}' -H 'Accept: application/json' https://127.0.0.1/api/v1/auth/me)"
          test "${codigo}" = "401" || { echo "Se esperaba 401 tras actualizar y fue ${codigo}"; exit 1; }
          consulta() { sudo docker compose --env-file paquete-nuevo/.env -f paquete-nuevo/docker-compose.yml exec -T postgres psql -U fichaje_migrator -d fichaje -Atqc "$1"; }
          {
            echo "users=$(consulta 'SELECT count(*) FROM users')"
            echo "audit_log=$(consulta 'SELECT count(*) FROM audit_log')"
          } | tee conteos-despues.txt
          # Los usuarios no cambian; audit_log crece EXACTAMENTE en uno: el asiento
          # system.updated que el paso 5 escribe desde el cierre de la Fase 5.
          test "$(grep '^users=' conteos-antes.txt)" = "$(grep '^users=' conteos-despues.txt)"
          # AUD-1: la actualizacion desde una 2.1.0 (copias con el migrador) crea el
          # rol de solo lectura y reescribe BACKUP_DB_* en el .env NUEVO.
          test "$(consulta "SELECT rolsuper OR rolcreatedb OR rolcreaterole FROM pg_roles WHERE rolname = 'fichaje_backup'")" = "f"
          sudo grep -qx 'BACKUP_DB_USERNAME=fichaje_backup' paquete-nuevo/.env
          # A3-06: la unica pertenencia del rol de copias es pg_read_all_data (una
          # anterior, p. ej. pg_write_all_data, se retira al provisionarlo) y no puede
          # escribir en el registro ni en los fichajes.
          test "$(consulta "SELECT string_agg(g.rolname, ',' ORDER BY g.rolname) FROM pg_auth_members am JOIN pg_roles g ON g.oid = am.roleid JOIN pg_roles m ON m.oid = am.member WHERE m.rolname = 'fichaje_backup'")" = "pg_read_all_data"
          test "$(consulta "SELECT has_table_privilege('fichaje_backup', 'audit_log', 'UPDATE') OR has_table_privilege('fichaje_backup', 'audit_log', 'DELETE') OR has_table_privilege('fichaje_backup', 'shift_entries', 'UPDATE')")" = "f"
          test "$(sudo sed -n 's/^BACKUP_DB_PASSWORD=//p' paquete-nuevo/.env)" != "$(sudo sed -n 's/^DB_MIGRATION_PASSWORD=//p' paquete-nuevo/.env)"
          test "$(sudo docker compose --env-file paquete-nuevo/.env -f paquete-nuevo/docker-compose.yml exec -T scheduler printenv BACKUP_DB_USERNAME)" = "fichaje_backup"
          # Y tras actualizar DESDE UNA 2.1.0 (que llevaba el .env entero en todos los
          # contenedores) los cinco runtime ya no tienen credenciales privilegiadas.
          bash .github/scripts/assert-runtime-env.sh paquete-nuevo/.env paquete-nuevo/docker-compose.yml
          antes="$(sed -n 's/^audit_log=//p' conteos-antes.txt)"; despues="$(sed -n 's/^audit_log=//p' conteos-despues.txt)"
          test "$despues" -eq "$((antes + 1))" || { echo "audit_log paso de ${antes} a ${despues}: se esperaba exactamente un asiento system.updated mas"; exit 1; }
          consulta "SELECT action FROM audit_log ORDER BY id DESC LIMIT 1" | grep -qx 'system.updated'
          # Ninguna migracion pendiente, y el informe donde dice la guia.
          sudo docker compose --env-file paquete-nuevo/.env -f paquete-nuevo/docker-compose.yml \
            run --rm --no-deps -T migrate php artisan migrate:status --database=pgsql_migrator --pending=1
          # El directorio de informes es 0750 del uid de la aplicacion: el comodin
          # lo expande root, no la shell del runner (que no puede listarlo).
          sudo ls -la /var/backups/fichaje/reports/
          sudo sh -c 'ls /var/backups/fichaje/reports/update-*.log'
          # El .env viajo al paquete nuevo con sus permisos y la etiqueta nueva;
          # el certificado, con su propietario.
          test "$(sudo stat -c '%a' paquete-nuevo/.env)" = "600"
          sudo grep -q "^IMAGE_TAG=${new}$" paquete-nuevo/.env
          test "$(sudo stat -c '%u' paquete-nuevo/certs/tls.key)" = "101"

      - name: "U1 · Rescate de los informes de retencion: solo los validos, 0640, sin seguir enlaces"
        if: steps.anterior.outputs.skip != 'true'
        # `docker compose cp` de verdad sobre el `scheduler` PARADO de la version
        # anterior. Medido en docker-in-docker (2.1.0 -> 2.2.0): instalar,
        # sembrar y actualizar, 2 min 20 s; la comprobacion, 1 s.
        #
        # El servicio del que salen depende de la version anterior. En la 2.1.0
        # cada contenedor tenia su propio `storage/app` y el informe sembrado
        # en `scheduler` solo se ve ahi. Desde la 2.2.0 (ADR-045) `storage/app`
        # es un volumen compartido: `update.sh` recorre `app`, `horizon` y
        # `scheduler`, lo encuentra en el primero y ya no lo repite. Exigir
        # «de scheduler» puso en rojo esta etapa en cuanto la version anterior
        # fue una con el volumen; lo que importa es que se rescate, de donde sea.
        run: |
          set -euo pipefail
          grep -Eq 'Informes de retencion de (app|horizon|scheduler)' paquete-nuevo/salida-u1.log
          bash .github/scripts/retention-rescue-e2e.sh check paquete-nuevo

      - name: "U1 · WAL heredado cifrado en sitio, copia de la 2.1.0 con bandera explicita, restore_command y candado (ADR-049)"
        if: steps.anterior.outputs.skip != 'true'
        # En <= 120 s no queda ningun `.gz` en claro y cada heredado conserva su fecha; `restore.sh`
        # sobre una copia de la 2.1.0 sale 6 sin `--accept-unauthenticated` y pasa con ella y su
        # `.sha256`; `kronoqr-restore-wal` devuelve 200 ante un heredado sin bandera o un hueco y 1
        # solo en el final real; el candado de la actualizacion no queda en BACKUP_PATH ni en
        # /var/log/kronoqr; y los montajes son los de la matriz.
        run: bash .github/scripts/backup-wal-e2e.sh upgrade-check paquete-nuevo

      - name: "U1 · Ningun secreto en la salida, el informe ni el detalle"
        if: steps.anterior.outputs.skip != 'true'
        # Valor a valor, contra el .env recien escrito (.github/scripts/assert-no-secrets.sh).
        # El informe se publica en BACKUP_PATH/reports como uid 1000 (lo lee el paquete
        # de diagnostico). El detalle tecnico NO esta ahi: vive solo en
        # /var/log/kronoqr, root:root 0600, fuera del alcance del runtime (puede
        # llevar datos personales). Los comodines los expande root.
        run: |
          set -euo pipefail
          mapfile -t informes < <(sudo sh -c 'ls /var/backups/fichaje/reports/update-*.log')
          mapfile -t detalles < <(sudo sh -c 'ls /var/log/kronoqr/update-*.detalle.log')
          test "${#informes[@]}" -ge 1
          test "${#detalles[@]}" -ge 1
          # Tambien la copia local del informe que queda junto al detalle.
          mapfile -t locales < <(sudo sh -c 'ls /var/log/kronoqr/update-*.log')
          bash .github/scripts/assert-no-secrets.sh paquete-nuevo/.env paquete-nuevo/salida-u1.log "${informes[@]}" "${locales[@]}"
          for fichero in "${informes[@]}"; do
            test "$(sudo stat -c '%u:%a' "${fichero}")" = "1000:640"
          done
          for fichero in "${locales[@]}"; do
            test "$(sudo stat -c '%u:%a' "${fichero}")" = "0:600"
          done
          test "$(sudo stat -c '%u:%a' /var/log/kronoqr)" = "0:700"
          # Y NINGUN detalle en el directorio que escribe el runtime.
          test -z "$(sudo sh -c 'ls /var/backups/fichaje/reports/*.detalle.log 2>/dev/null')"

      - name: "U2 · Segunda ejecucion: salida 3 y el sistema sigue en pie"
        if: steps.anterior.outputs.skip != 'true'
        run: |
          set -euo pipefail
          cd paquete-nuevo
          set +e
          sudo ./update.sh >salida-u2.log 2>&1
          codigo=$?
          set -e
          cat salida-u2.log
          test "${codigo}" -eq 3 || { echo "Se esperaba salida 3 y fue ${codigo}"; exit 1; }
          grep -q 'YA esta en la version' salida-u2.log
          curl -fsS -k https://127.0.0.1/api/v1/ready >/dev/null

      - name: "U3 · Vuelta atras: fallo inyectado al arrancar la version nueva, salida 4 y conteos intactos"
        if: steps.anterior.outputs.skip != 'true'
        # Se vuelve a la version anterior desde cero (instalacion limpia) y se
        # rompe la imagen del borde de la version nueva: una imagen que termina
        # nada mas arrancar. Las migraciones se aplican, la aplicacion nueva
        # pasa su verificacion interna, y al publicar el borde este no llega a
        # estar en pie: es el fallo del paso 5 que RF-PD-10 exige deshacer solo.
        run: |
          set -euo pipefail
          old="${{ steps.anterior.outputs.old_version }}"
          new="${{ steps.anterior.outputs.new_version }}"
          sudo docker compose --env-file paquete-nuevo/.env -f paquete-nuevo/docker-compose.yml down -v --remove-orphans
          sudo rm -rf /var/backups/fichaje /var/log/kronoqr
          sudo rm -f paquete-nuevo/.env
          sudo rm -rf paquete-nuevo/certs
          mkdir -p paquete-nuevo/certs
          bash .github/scripts/prepare-package-env.sh paquete-anterior
          (cd paquete-anterior && sudo ./install.sh >salida-reinstalacion.log 2>&1) || { tail -40 paquete-anterior/salida-reinstalacion.log; exit 1; }
          compose() { sudo docker compose --env-file paquete-anterior/.env -f paquete-anterior/docker-compose.yml "$@"; }
          printf 'Semilla-CI-2026-Actualizacion!\n' | compose exec -T app php artisan identity:create-user \
            --name='Semilla CI' --email=semilla@kronoqr.ci.local --role=admin
          consulta() { compose exec -T postgres psql -U fichaje_migrator -d fichaje -Atqc "$1"; }
          {
            echo "users=$(consulta 'SELECT count(*) FROM users')"
            echo "audit_log=$(consulta 'SELECT count(*) FROM audit_log')"
          } | tee conteos-antes-u3.txt

          docker tag "kronoqr/nginx:${new}" "kronoqr/nginx:${new}-sana"
          docker pull --quiet alpine:3.20 >/dev/null
          docker tag alpine:3.20 "kronoqr/nginx:${new}"

          # AUD-1: el .env de la version anterior es el de la vuelta atras y NO se
          # toca (el paso del rol de copias solo escribe el del paquete nuevo).
          env_antes="$(sudo md5sum < paquete-anterior/.env)"

          cd paquete-nuevo
          set +e
          sudo ./update.sh >salida-u3.log 2>&1
          codigo=$?
          set -e
          cd ..
          tail -60 paquete-nuevo/salida-u3.log
          test "${codigo}" -eq 4 || { echo "Se esperaba salida 4 (vuelta atras completada) y fue ${codigo}"; exit 1; }
          grep -q "PUNTO DE CONTROL ${new}" paquete-nuevo/salida-u3.log
          grep -q 'VUELTA ATRAS COMPLETADA' paquete-nuevo/salida-u3.log
          curl -fsS -k https://127.0.0.1/api/v1/health | tee health-u3.json
          grep -qF "\"version\":\"${old}\"" health-u3.json
          test "$(sudo md5sum < paquete-anterior/.env)" = "${env_antes}" || { echo 'La actualizacion fallida ha tocado el .env de la version anterior'; exit 1; }
          curl -fsS -k https://127.0.0.1/api/v1/ready >/dev/null
          {
            echo "users=$(consulta 'SELECT count(*) FROM users')"
            echo "audit_log=$(consulta 'SELECT count(*) FROM audit_log')"
          } | tee conteos-despues-u3.txt
          # Datos intactos tras la vuelta atras. Y el asiento system.restored_from_backup
          # sobre la cadena restaurada (cierre de la Fase 5, regla dura 6) SOLO si la
          # version que queda en pie conoce la accion: un verificador anterior revienta
          # con una accion fuera de su catalogo, asi que update.sh no lo escribe y lo
          # deja en el informe. Con la 2.1.0 como version anterior es la segunda rama;
          # al publicar la siguiente, la primera. Las dos se exigen, no se toleran.
          test "$(grep '^users=' conteos-antes-u3.txt)" = "$(grep '^users=' conteos-despues-u3.txt)"
          antes="$(sed -n 's/^audit_log=//p' conteos-antes-u3.txt)"; despues="$(sed -n 's/^audit_log=//p' conteos-despues-u3.txt)"
          # LA MISMA pregunta que hace update.sh y CON LA MISMA FUNCION
          # (infra/scripts/lib/app-commands.sh). Habia dos copias de la misma
          # tuberia contra `grep -q`, y esa tuberia responde NO cuando la
          # respuesta es SI: `grep -q` cierra el tubo al encontrar la linea y el
          # cliente de Docker, que aun esta volcando el catalogo, termina con 1.
          # Las dos copias no tienen por que equivocarse a la vez, asi que este
          # paso pasaba o fallaba segun a cual le tocara (35697335929 en verde,
          # 35700735466 en rojo, con el mismo codigo de la version anterior).
          # Si la funcion sale con 2 -no se ha podido preguntar- el paso falla:
          # no hay respuesta valida, y tolerarlo devolveria la no-determinacion.
          # shellcheck source=infra/scripts/lib/app-commands.sh
          . infra/scripts/lib/app-commands.sh
          # La biblioteca fija IFS (doc 02 3.5: un fichero que se carga con `.` se
          # lo impone a quien lo carga); el resto del paso sigue con el de bash.
          unset IFS
          conoce=0
          kq_app_knows_command compose compliance:record-system-event || conoce=$?
          test "${conoce}" -ne 2 || { echo "No se ha podido preguntar a la version anterior si conoce compliance:record-system-event: ${KQ_APP_COMMAND_ERROR}"; exit 1; }
          if [ "${conoce}" -eq 0 ]; then
            test "$despues" -eq "$((antes + 1))" || { echo "audit_log paso de ${antes} a ${despues}: se esperaba exactamente un asiento system.restored_from_backup mas"; exit 1; }
            consulta "SELECT action FROM audit_log ORDER BY id DESC LIMIT 1" | grep -qx 'system.restored_from_backup'
          else
            test "$despues" -eq "$antes" || { echo "audit_log paso de ${antes} a ${despues}: la version anterior no conoce system.restored_from_backup y no debia escribirse nada"; exit 1; }
            grep -q "NO escrito: la version restaurada" paquete-nuevo/salida-u3.log
          fi
          compose exec -T app php artisan compliance:verify-audit-chain
          sudo sh -c "grep -l 'Vuelta atras' /var/backups/fichaje/reports/update-*.log"

      - name: "U3 · Ningun secreto en la salida ni en los informes de la vuelta atras"
        if: steps.anterior.outputs.skip != 'true'
        # El camino que vuelca `compose ps`, logs y la salida de restore.sh es
        # este, no el de exito: es el que hay que revisar.
        run: |
          set -euo pipefail
          mapfile -t informes < <(sudo sh -c 'ls /var/backups/fichaje/reports/update-*.log /var/log/kronoqr/update-*.log')
          bash .github/scripts/assert-no-secrets.sh paquete-anterior/.env paquete-nuevo/salida-u3.log "${informes[@]}"

      - name: "U3 · Y tras la vuelta atras se puede reintentar: salida 0"
        if: steps.anterior.outputs.skip != 'true'
        run: |
          set -euo pipefail
          new="${{ steps.anterior.outputs.new_version }}"
          docker tag "kronoqr/nginx:${new}-sana" "kronoqr/nginx:${new}"
          cd paquete-nuevo
          sudo ./update.sh >salida-u3b.log 2>&1 || { tail -60 salida-u3b.log; exit 1; }
          grep -q 'actualizado y verificado' salida-u3b.log
          curl -fsS -k https://127.0.0.1/api/v1/health | grep -qF "\"version\":\"${new}\""

      - name: "U4 · La copia previa de la actualizacion se restaura en una base limpia (RF-PR-04, RQ-09)"
        if: steps.anterior.outputs.skip != 'true'
        # La copia previa la hace la version ANTERIOR antes de actualizar: mientras esa version
        # sea la 2.1.0 es un volcado sin autenticar y solo se restaura con la bandera explicita,
        # que tambien acepta una copia KQE1 (ADR-049 §4). Cuando la version minima de origen sea
        # >= 2.2.0 la bandera sobra y se retira (R6-DV-10).
        run: |
          set -euo pipefail
          sudo docker compose --env-file paquete-nuevo/.env -f paquete-nuevo/docker-compose.yml \
            run --rm --no-deps -T restore bash /opt/kronoqr/scripts/restore-drill.sh --mode database --accept-unauthenticated

      - name: Diagnostico si algo ha fallado
        if: failure() && steps.anterior.outputs.skip != 'true'
        run: |
          for dir in paquete-anterior paquete-nuevo; do
            [ -f "${dir}/.env" ] || continue
            echo "=============== ${dir} ==============="
            sudo docker compose --env-file "${dir}/.env" -f "${dir}/docker-compose.yml" ps -a || true
            sudo docker compose --env-file "${dir}/.env" -f "${dir}/docker-compose.yml" logs --tail 80 app nginx postgres || true
          done
          echo "=============== informes ==============="
          sudo sh -c 'for f in /var/backups/fichaje/reports/update-*.log /var/log/kronoqr/update-*.log; do echo "--- $f"; cat "$f"; done' || true

      - name: Subir las salidas del actualizador
        if: always() && steps.anterior.outputs.skip != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: actualizacion
          # Sin ningun .env: llevan los secretos de la instalacion de prueba.
          # Las salidas se comprueban libres de secretos valor a valor.
          path: |
            paquete-anterior/salida-instalacion.log
            paquete-anterior/salida-reinstalacion.log
            paquete-nuevo/salida-u1.log
            paquete-nuevo/salida-u2.log
            paquete-nuevo/salida-u3.log
            paquete-nuevo/salida-u3b.log
          retention-days: 14
          if-no-files-found: warn

  #-----------------------------------------------------------------------------
  # Cobertura — RNF-M-01: dominio >= 90 %, global >= 75 % (doc 02 §9.2)
  #
  # NO es una de las ocho etapas numeradas del §10.1: es una puerta de calidad
  # aparte, y su coste no encaja en el presupuesto de ninguna de ellas.
  # `make coverage` instrumenta con Xdebug la suite ENTERA —Unit, Integration,
  # Feature y Contract juntas, no solo Unit— porque el umbral de dominio se
  # mide sobre el mismo informe Clover que el umbral global (`tools/coverage-
  # gate.php` acota el segundo del primero, no repite la ejecucion). Medido en
  # este runner (09-09-2026): ~15 minutos, memoria de PHP en 3G
  # (`COVERAGE_MEMORY_LIMIT` del Makefile — con el 1G de costumbre, Xdebug
  # agota la memoria a mitad de la suite).
  #
  # Correr esto en cada push habria duplicado, con Xdebug encendido, un trabajo
  # que la etapa ③ ya paga sin el —Xdebug con cobertura es varias veces mas
  # lento que ejecutar la misma suite sin instrumentar—, y por el mismo motivo
  # que la etapa ⑧ no corre en cada push: una CI que nadie espera se acaba
  # ignorando. Por eso es un job propio, nocturno (`schedule`) y a mano
  # (`workflow_dispatch`); el `if` de abajo es lo unico que lo distingue de un
  # job normal —nunca corre en un `push`—, y todos los demas jobs de este
  # fichero llevan la guarda simetrica (`!= 'schedule'`, ver `lint-backend`)
  # para que la entrada de cron no arrastre el pipeline entero cada noche.
  #
  # PostgreSQL y Redis: la misma imagen y los mismos roles que los jobs `unit`
  # e `integration` — la suite completa toca Feature e Integration, que
  # necesitan base de datos real.
  #-----------------------------------------------------------------------------
  coverage:
    name: "Cobertura (RNF-M-01, nocturna)"
    runs-on: ubuntu-24.04
    # 50 (R6-DV-08): medido 16-25 min de los 30 anteriores, y la cobertura con
    # Xdebug es de los pasos que mas varian entre runners.
    timeout-minutes: 50
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    env:
      APP_KEY: "base64:a3Jvbm9xci1jaS1jbGF2ZS1kZS0zMi1ieXRlcyEhISE="
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_DATABASE: fichaje
      DB_USERNAME: fichaje_app
      DB_PASSWORD: ci_local_app
      DB_MIGRATION_USERNAME: fichaje_migrator
      DB_MIGRATION_PASSWORD: ci_local_migrator
      REDIS_HOST: 127.0.0.1

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: PostgreSQL 17 del producto y Redis 7
        run: |
          make build-ci-images
          docker run -d --name kronoqr-pg \
            -e POSTGRES_DB="$DB_DATABASE" \
            -e POSTGRES_USER="$DB_MIGRATION_USERNAME" \
            -e POSTGRES_PASSWORD="$DB_MIGRATION_PASSWORD" \
            -e DB_PASSWORD="$DB_PASSWORD" \
            -p 5432:5432 \
            kronoqr/postgres:ci \
            postgres -c timezone=UTC -c log_timezone=UTC \
              -c hba_file=/etc/kronoqr/pg_hba.conf
          docker run -d --name kronoqr-redis -p 6379:6379 redis:7-alpine

      - uses: ./.github/actions/php-toolchain
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: xdebug

      - name: Esperar a PostgreSQL
        run: |
          for i in $(seq 1 30); do
            if docker exec kronoqr-pg pg_isready -h 127.0.0.1 -U "$DB_MIGRATION_USERNAME" -d "$DB_DATABASE" >/dev/null 2>&1; then
              echo "PostgreSQL listo en $((i * 2)) s"; exit 0
            fi
            sleep 2
          done
          echo "::error title=PostgreSQL no arranco::pg_isready sigue fallando tras 60 s."
          docker logs kronoqr-pg | tail -50
          exit 1

      - name: Chrome para Browsershot (la suite completa incluye los PDF con motor real)
        # Misma accion que el job de integracion (ver alli).
        uses: ./.github/actions/chrome-for-pdf

      - name: Cobertura — dominio >= 90 %, global >= 75 % (doc 02 §9.2)
        run: make coverage

      - name: Resumen
        if: always()
        run: |
          {
            echo "### Cobertura (RNF-M-01)"
            echo ""
            echo "Umbrales: dominio >= 90 %, global >= 75 %. Detalle linea a linea en el"
            echo "log de \`make coverage\` de este mismo job."
          } >>"$GITHUB_STEP_SUMMARY"

  #-----------------------------------------------------------------------------
  # Mutacion completa — RQ-10: MSI >= 80 % sobre Modules/*/Domain (doc 02 §9.2)
  #
  # Por que esto no vive dentro del job `unit`. `unit` NO se ejecuta en
  # `schedule`: depende (transitivamente, via `architecture`) de jobs con
  # `if: github.event_name != 'schedule'`, y un `needs` que no corre deja sin
  # correr tambien al que depende de el. La mutacion completa nocturna
  # necesita, por tanto, un job propio con el `if` de abajo -el mismo que
  # `coverage`, justo encima-, no un paso mas dentro de `unit`.
  #
  # Por que esto no vive DENTRO del job `coverage` de encima, aunque comparten
  # `if`. `make mutate` no toca base de datos -muta y ejecuta unicamente la
  # suite `Unit`, igual que el paso equivalente del job `unit`- asi que
  # arrastrarlo al job `coverage` habria pagado el arranque de PostgreSQL,
  # Redis y Puppeteer (varios minutos) para un paso que no los usa. Un job
  # aparte, mas ligero, corre en paralelo al de cobertura sin ese coste.
  #
  # En `push` y en `workflow_dispatch`, el job `unit` muta lo que el cambio
  # toca y aplica el 80 % a CADA fichero (`make mutate-changed`); este job es
  # la pasada GLOBAL (MSI >= 80 % sobre todo el dominio) y es la unica que
  # corre completa, de noche y en el disparo manual. Hasta el 02-10-2026 el
  # job `unit` repetia la completa en el disparo manual; se quito (R6-DV-01/02:
  # era un duplicado de 40-55 min que ademas no aplicaba el 80 % sobre lo que el cambio toca).
  #
  # timeout-minutes 90 y no 60 (R6-DV-08): 26, 49 y 53 min medidos en los
  # ultimos runs manuales verdes; con 60 un runner un 15 % mas lento lo mataba
  # por tiempo con el dominio entero en verde.
  #-----------------------------------------------------------------------------
  mutation:
    name: "Mutacion completa (RQ-10, nocturna)"
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/php-toolchain
        with:
          php-version: ${{ env.PHP_VERSION }}
          # Mismo motivo que en el job `unit`: la mutacion necesita cobertura,
          # y el propio objetivo del Makefile la enciende solo para su proceso
          # con XDEBUG_MODE=coverage.
          coverage: xdebug

      - name: Mutacion COMPLETA sobre Modules/*/Domain (MSI >= 80 %)
        # Sin base de datos: `make mutate` ejecuta solo la suite `Unit`.
        run: make mutate

      - name: Resumen
        if: always()
        run: |
          {
            echo "### Mutacion completa (RQ-10)"
            echo ""
            echo "MSI >= 80 % sobre Modules/*/Domain. En cada *push* solo se muta lo"
            echo "que ese push cambia (\`make mutate-changed\`, job \`unit\`); esta es la"
            echo "pasada completa, nocturna y del disparo manual."
          } >>"$GITHUB_STEP_SUMMARY"

  #-----------------------------------------------------------------------------
  # gitleaks sobre TODAS las referencias (nocturno)
  #
  # El job `security` escanea solo el historico alcanzable desde el commit del
  # run (R6-DV-03): una rama ajena con un falso positivo ya no pone en rojo
  # `main` ni las demas ramas. Este job conserva el barrido de todo lo que
  # tiene el repositorio -ramas sin integrar incluidas, que es donde un secreto
  # pegado por descuido se queda sin que nadie lo mire-. Corre solo en
  # `schedule`: en push y en el disparo manual ya lo cubre `security`.
  #
  # Un hallazgo aqui deja en rojo el run NOCTURNO, no el de nadie: el camino es
  # el de §7.7 (se reporta commit y ruta; el historico no se reescribe sin
  # decidirlo).
  #-----------------------------------------------------------------------------
  secrets-history:
    name: "gitleaks sobre todas las referencias (nocturno)"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    if: github.event_name == 'schedule'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: gitleaks sobre todas las referencias (0 hallazgos)
        run: make secrets-scan SECRETS_SCAN_SCOPE=all
