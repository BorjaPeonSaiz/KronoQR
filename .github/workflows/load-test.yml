# KronoQR — prueba de carga k6 sobre las imagenes de entrega (RQ-08): regresion
# de RNF-P-02, RNF-P-06 y RNF-P-08 frente a la linea base del runner, NO su
# umbral (V21-5-QA-02; el umbral se juzga en hardware de referencia).
#
# POR QUE UN WORKFLOW PROPIO Y NO `ci.yml` NI `release.yml` (decision 12 de la
# ficha 3.6, plan 06). Las etapas ①-③ de `ci.yml` tienen que seguir por debajo
# de 15 minutos (doc 02 §10.1, medido): una CI lenta se acaba ignorando, y el pipeline
# de ese fichero no tiene etapa de carga. `release.yml` publica de verdad
# (plan de implementacion 08): esto no publica nada, solo MIDE.
#
# QUE MIDE. `load-tests/k6/scan-peak.js` (siete escenarios: fichajes validos con
# la rampa del cambio de turno, fichajes por PIN, reenvios idempotentes,
# rechazos de firma/desconocidos/revocados, el irreconciliable de RN-18, lotes
# y la vista de cumplimiento) contra las TRES IMAGENES DE ENTREGA, instaladas desde
# el paquete del §11.6.1 con el instalador real -no contra la imagen de
# desarrollo, y no contra el arbol del repositorio-, exactamente como hace el
# job `clean-install` (etapa ⑧) de `ci.yml`. El umbral que fija el doc 02 §9.2
# —RNF-P-06, 50 fichajes/s con p95 < 150 ms— NO se juzga aqui (ver abajo): este
# runner no puede ni ofrecer ni sostener 50/s, y un «OK RNF-P-06» suyo no mide
# capacidad (V21-5-QA-02). El fichaje por PIN tiene presupuesto propio,
# RNF-P-08 (p95 < 400 ms, p99 < 800 ms, cifras estimadas): paga un bcrypt de
# coste 12 que no se rebaja (decision del propietario, 15-10-2026), y tampoco
# se juzga aqui.
#
# TRES DESENLACES Y NO DOS (V21-5-QA-01). Verde, rojo y «no fiable». El tercero
# sale cuando el runner iba mas de 3 veces mas lento que en la linea base
# (`DEGRADED_MACHINE_RATIO` de aggregate.js), cuando la pasada no es comparable
# con ella o cuando falta medida: ni verde ni rojo, repetir la pasada. El job
# no sale verde con un «no fiable» —seria un verde que no se ha ganado—, pero la
# anotacion y el resumen del job dicen «NO FIABLE» y no «rojo».
#
# EL RUNNER PUBLICO NO ES EL HARDWARE DE REFERENCIA. GitHub da 4 vCPU/16 GB a
# este workflow; el numero que vale para decirle a un cliente que su servidor
# aguanta el cambio de turno es el que se mide en el hardware Linux de
# referencia del doc 02 §11.6.2 (4 nucleos/8 GB), no el de este runner. Lo que
# SI es bloqueante aqui es que la prueba no empeore y que el camino de carga
# —Nginx, PHP-FPM, PostgreSQL con los ajustes de la tarea 3.6— siga siendo el
# mismo que se entrega.
#
# CUANDO CORRE. A mano (`workflow_dispatch`, con `instances`/`duration`
# propios) y en cada etiqueta `vX.Y.0` -una version MENOR o MAYOR-, como
# red de seguridad si alguien etiqueta una sin haberla corrido antes: el
# procedimiento de publicacion del plan 08 la ejecuta a mano antes de
# etiquetar, y esto es lo que impide que una menor o una mayor sin la carga
# verificada pase desapercibida (bloque 22, R5-QA-01: antes solo `v*.0.0`, y
# una menor puede traer cambios de rendimiento; los parches `vX.Y.Z` no
# la lanzan). Nunca en cada push: cuesta demasiado y nadie la espera
# ahi (mismo criterio que la etapa ⑧ de `ci.yml`).
#
# Secretos: ninguno. Igual que `ci.yml`, no lee `secrets.*` y no escribe
# ficheros de entorno con datos reales: el `.env` del paquete se rellena con
# los mismos valores de relleno de `.github/scripts/prepare-package-env.sh`.

name: Prueba de carga

on:
  workflow_dispatch:
    inputs:
      instances:
        description: "Instancias de k6 (una IP de origen cada una, 6 fichajes/s por instancia). 3 es el perfil del runner (18/s, ~60 % de su capacidad medida: todo es medible) y es el de load-tests/k6/baseline.json: con otro valor el veredicto sale «no comparable». 10 (60/s, por encima de los 50 de RNF-P-06) solo tiene sentido en hardware de referencia, donde se usa `make load-test`."
        required: false
        default: "3"
      duration:
        description: "Duracion de la meseta del pico (p. ej. 120s, 5m), sin contar los 30 s de subida y de bajada. 120s es la de baseline.json."
        required: false
        default: "120s"
      fpm_max_children:
        description: "PHP_FPM_MAX_CHILDREN del paquete instalado. Vacio = tal cual se instala (20, el servidor minimo del §11.6.2); 40 es el perfil recomendado de 4 nucleos/8 GB, que es la clase del runner."
        required: false
        default: ""
      app_ref:
        description: "Medir OTRA version (etiqueta, rama o commit, p. ej. v2.2.0) con el guion de carga de esta rama. Vacio = la aplicacion de esta misma rama. Sirve para comparar dos versiones con la misma carga, que es lo unico comparable."
        required: false
        default: ""
  push:
    tags:
      - "v*.*.0"

permissions:
  contents: read

concurrency:
  # `app_ref` en el grupo: medir la rama y medir v2.2.0 con el guion de la rama
  # son dos pasadas distintas desde la MISMA ref, y sin esto la segunda cancela
  # la primera.
  group: load-test-${{ github.ref }}-${{ inputs.app_ref || 'self' }}
  cancel-in-progress: true

jobs:
  load-test:
    name: "Carga k6 sobre el paquete de entrega"
    runs-on: ubuntu-24.04
    # Generoso a proposito: construye tres imagenes, instala el paquete
    # completo (mismo coste que el escenario C de `clean-install`) y sostiene
    # la carga durante `duration` (mas un minuto de rampa) en siete escenarios a
    # la vez. Con INSTANCES=3 y DURATION=120s, medido en el bloque 15: unos
    # 7 min con la cache de capas; con `app_ref` se construye sin ella y tarda
    # mas.
    timeout-minutes: 50

    env:
      # LOS MISMOS VALORES QUE `load-tests/k6/baseline.json` (R5-QA-02). En una
      # etiqueta no hay `inputs`, y hasta la 2.2.0 aqui ponia '8': 48 fichajes/s
      # contra un runner que sostiene ~29 y una linea base de 3 instancias, asi
      # que la red de seguridad de cada version salia «no fiable» por
      # construccion. 3 instancias (18/s) es lo que el runner aguanta con todo
      # medible —RQ-03 y RS-03 con muestras—, y es lo que la linea base usa. Si
      # alguna vez cambia uno, cambia el otro: el paso «Parametros frente a la
      # linea base» compara los cuatro parametros de la carga antes de
      # construir nada.
      INSTANCES: ${{ github.event.inputs.instances || '3' }}
      DURATION: ${{ github.event.inputs.duration || '120s' }}
      # La forma de la carga (K6-2 y K6-3), escrita aqui aunque coincida con la
      # de serie de run.sh: es lo que el paso previo compara con baseline.json,
      # y un valor que solo existe dentro de run.sh no se puede comparar antes.
      RAMP_SECONDS: "30"
      PIN_PERIOD_SECONDS: "4"

    steps:
      - name: "app_ref: una version publicada o un commit de main, nada mas"
        # Seguridad (revision del bloque 15). `app_ref` decide QUE CODIGO se
        # construye y se ejecuta en este job. Solo valen dos formas: una
        # etiqueta de version (vX.Y.Z) o un SHA completo, y en los dos casos se
        # exige despues que el commit sea antecesor de origin/main. Una rama
        # cualquiera, un SHA de una bifurcacion o un nombre con caracteres raros
        # no pasan de aqui.
        if: inputs.app_ref != ''
        env:
          APP_REF: ${{ inputs.app_ref }}
        run: |
          set -euo pipefail
          # [[ =~ ]] y no grep: grep casa linea a linea, y un valor con salto de
          # linea pasaria por su primera linea.
          if ! [[ "${APP_REF}" =~ ^(v[0-9]+\.[0-9]+\.[0-9]+|[0-9a-f]{40})$ ]]; then
            echo "::error title=app_ref no valido::app_ref tiene que ser una etiqueta vX.Y.Z o un SHA completo de 40 caracteres de un commit de main."
            exit 1
          fi

      # DOS ARBOLES CUANDO SE PIDE `app_ref`. El de la raiz es la APLICACION que
      # se construye, empaqueta e instala; el guion de carga (`load-tests/k6/`)
      # es SIEMPRE el de este commit. Medir v2.2.0 con su propio guion daria una
      # cifra de otra carga —sin rampa y sin PIN— que no se puede comparar con
      # la de hoy; medirla con el de hoy si. Con `app_ref` la historia entera
      # (fetch-depth 0): la necesita la comprobacion de antecesor de main.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.app_ref || github.sha }}
          fetch-depth: ${{ inputs.app_ref != '' && '0' || '1' }}
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: inputs.app_ref != ''
        with:
          path: .harness
          persist-credentials: false

      - name: El guion de carga de este commit sobre la aplicacion de app_ref
        id: shas
        env:
          APP_REF: ${{ inputs.app_ref }}
          HARNESS_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -n "${APP_REF}" ]; then
            app_sha="$(git rev-parse HEAD)"
            if ! git merge-base --is-ancestor "${app_sha}" origin/main; then
              echo "::error title=app_ref fuera de main::${APP_REF} (${app_sha}) no es antecesor de origin/main: solo se mide codigo que ya esta en main."
              exit 1
            fi
            rm -rf load-tests/k6
            cp -R .harness/load-tests/k6 load-tests/k6
            rm -rf .harness
            echo "Aplicacion de ${APP_REF} (${app_sha}) medida con load-tests/k6 de ${HARNESS_SHA}."
          fi
          echo "app=$(git rev-parse HEAD)" >>"${GITHUB_OUTPUT}"
          echo "harness=${HARNESS_SHA}" >>"${GITHUB_OUTPUT}"

      - name: Parametros frente a la linea base
        # Barato y antes de construir nada. Valida DURATION, INSTANCES y la forma
        # de la carga con el MISMO analizador que run.sh (parameters.sh: un
        # valor con forma de expresion no llega a ninguna cuenta de bash) y los
        # compara con baseline.json. Si alguno no coincide, el agregado dira
        # «no comparable» y no juzgara RNF-P-02, RNF-P-06 ni RNF-P-08: se avisa aqui para
        # que nadie espere veinte minutos a enterarse. Un parametro mal escrito
        # SI falla; uno distinto de la linea base no, porque medir con otros
        # parametros a proposito es legitimo (p. ej. para regenerarla).
        run: |
          set -euo pipefail
          . load-tests/k6/parameters.sh
          for nombre in INSTANCES RAMP_SECONDS PIN_PERIOD_SECONDS; do
            if ! k6_is_count "${!nombre}"; then
              echo "::error title=${nombre} no valido::${nombre}=${!nombre} no es un entero sin signo."
              exit 1
            fi
          done
          if ! duration_seconds="$(k6_seconds_of "${DURATION}")"; then
            echo "::error title=DURATION no valida::DURATION=${DURATION} no es una duracion de k6 (120, 120s, 2m, 1h o 500ms)."
            exit 1
          fi
          esta="$(printf '%d %d %d %d' "$((10#${INSTANCES}))" "${duration_seconds}" "$((10#${RAMP_SECONDS}))" "$((10#${PIN_PERIOD_SECONDS}))")"
          base="$(jq -r '[.instances, .duration_seconds, .ramp_seconds, .pin_period_seconds] | map(if . == null then "n/d" else tostring end) | join(" ")' load-tests/k6/baseline.json)"
          echo "Instancias, meseta (s), rampa (s) y periodo del PIN (s). Esta pasada: ${esta}. Linea base: ${base}."
          if [ "${esta}" != "${base}" ]; then
            echo "::warning title=Linea base no comparable::Esta pasada (${esta}) no usa los parametros de baseline.json (${base}), en el orden instancias, meseta, rampa y periodo del PIN: RNF-P-02, RNF-P-06 y RNF-P-08 saldran «no comparable»."
          fi

      - uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      # LA CACHE DE CAPAS SOLO PARA EL CODIGO DE ESTE COMMIT. La cache `gha` es
      # compartida por ambito con los demas workflows del repositorio, incluido
      # release.yml. Con `app_ref` se construye otra version: ni se expone el
      # runtime de la cache ni se le pasa BUILDX_CACHE=gha, asi que esa
      # construccion no lee ni escribe capas que despues pudiera reutilizar una
      # publicacion (revision de seguridad del bloque 15). Tarda mas; es el
      # precio.
      - uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0
        if: inputs.app_ref == ''

      - name: Construir las tres imagenes de entrega
        env:
          BUILD_CACHE: ${{ inputs.app_ref == '' && 'gha' || '' }}
        run: make build-ci-images IMAGES="postgres app nginx" BUILDX_CACHE="${BUILD_CACHE}"

      - name: "Pool de PHP-FPM contra la imagen real: lo que la etapa de Integracion no puede cubrir"
        # La etapa ④ de `ci.yml` instala PHP directamente en el runner
        # (`.github/actions/php-toolchain`): sin `php-fpm` ni
        # `/usr/local/etc/php-fpm.d/www.conf` ahi, las siete pruebas
        # funcionales de `FpmPoolRenderTest.php` se SALTAN (`hayFpmDeVerdad()`
        # es falso). Aqui SI esta la imagen real recien construida: un paso de
        # segundos que ejerce el mismo camino -`PHP_FPM_MAX_CHILDREN=40` y un
        # valor invalido- y cubre justo el fallo de arranque real que la tarea
        # 3.6 encontro y corrigio (`render_fpm_pool` devolviendo una ruta
        # corrompida por la salida de `php-fpm -t`).
        run: |
          set -euo pipefail
          echo "--- PHP_FPM_MAX_CHILDREN=40 (recomendado): tiene que rendir y validar con php-fpm -t ---"
          docker run --rm --entrypoint bash -e PHP_FPM_MAX_CHILDREN=40 kronoqr/app:ci -c \
            '. /usr/local/bin/kronoqr-entrypoint; render_fpm_pool >/dev/null'

          echo "--- PHP_FPM_MAX_CHILDREN=abc (invalido): tiene que salir 2 con Que hacer ---"
          set +e
          docker run --rm --entrypoint bash -e PHP_FPM_MAX_CHILDREN=abc kronoqr/app:ci -c \
            '. /usr/local/bin/kronoqr-entrypoint; render_fpm_pool' >render-invalido.log 2>&1
          codigo=$?
          set -e
          cat render-invalido.log
          test "${codigo}" -eq 2 || { echo "Se esperaba salida 2 y fue ${codigo}"; exit 1; }
          grep -q 'Que hacer' render-invalido.log

      # Los cuatro pasos siguientes -etiquetar, armar el paquete, rellenar
      # [CLIENTE] e instalar- son la MISMA secuencia que el escenario C del
      # job `clean-install` de `ci.yml` (etapa ⑧): mide las imagenes que se
      # instalarian de verdad, no las de desarrollo. Se repiten aqui en vez de
      # factorizarse en un script compartido para no arriesgar el
      # comportamiento ya verificado de esa etapa; la logica que SI se saco a
      # un script porque la necesitan varios jobs a la vez —el relleno de
      # [CLIENTE]— ya vive en `.github/scripts/prepare-package-env.sh`.
      - name: Etiquetar las imagenes como las nombra compose.prod.yaml
        run: |
          set -euo pipefail
          version="$(cat VERSION)"
          docker tag kronoqr/app:ci      "kronoqr/php:${version}"
          docker tag kronoqr/postgres:ci "kronoqr/postgres:${version}"
          docker tag kronoqr/nginx:ci    "kronoqr/nginx:${version}"

      - name: Armar el paquete de entrega
        run: |
          set -euo pipefail
          bash infra/scripts/package.sh paquete
          test -x paquete/install.sh

      - name: Rellenar lo marcado [CLIENTE], como haria el IT del hotel
        run: bash .github/scripts/prepare-package-env.sh paquete

      - name: Instalar desde el paquete
        run: |
          set -euo pipefail
          cd paquete
          sudo ./install.sh | tee salida-instalacion.log
          grep -q 'instalado y verificado' salida-instalacion.log
          curl -fsS -k https://127.0.0.1/api/v1/ready >/dev/null

      - name: "La pila del runner es de pruebas: APP_ENV=staging y KIOSK_VLAN_CIDR real"
        # DOS AJUSTES AL .env DEL PAQUETE, y los dos despues de instalar.
        #
        # (1) APP_ENV=staging. `install.sh` exige APP_ENV=production para
        # instalar (fase 1, `f_app_env`): asi es como se instala en un
        # cliente, y asi se mide aqui. Pero el aprovisionamiento de la carga
        # SE NIEGA a correr con `isProduction()` -crea empleados, tarjetas y
        # quioscos de prueba, y esa guarda no se debilita ni con la
        # confirmacion explicita (3.6, bloqueante de la revision de
        # seguridad)-, y la primera ejecucion real de este workflow cayo
        # justo ahi. La pila del runner es de pruebas de verdad, asi que se
        # declara como tal DESPUES de instalar: ningun camino del producto
        # consulta `isProduction()` (comprobado: solo lo hace el
        # aprovisionamiento de k6), de modo que la medida es la misma.
        #
        # (2) KIOSK_VLAN_CIDR. Los contenedores de k6 se unen a la misma
        # red docker que nginx (`kronoqr-app`, nombre fijo tanto en
        # compose.dev.yaml como en compose.prod.yaml), y esa es exactamente la
        # situacion del doc 02 §7.1: todos los quioscos de un hotel salen por
        # la misma IP. `prepare-package-env.sh` deja KIOSK_VLAN_CIDR con un
        # valor de relleno (10.92.0.0/24) que NO tiene por que coincidir con
        # la subred que Docker asigno de verdad a `kronoqr-app` -al contrario
        # que en desarrollo, compose.prod.yaml no fija una subred con IPAM-.
        # Sin que coincidan, Nginx aplicaria a k6 la zona de 30 r/m pensada
        # para internet y la medida saldria tres ordenes de magnitud por
        # debajo de RNF-P-06 antes de que la aplicacion llegara a sudar (el
        # mismo aviso del paso 5 de la ficha de esta tarea).
        env:
          FPM_MAX_CHILDREN: ${{ inputs.fpm_max_children }}
        run: |
          set -euo pipefail
          cd paquete
          subred="$(docker network inspect kronoqr-app --format '{{ (index .IPAM.Config 0).Subnet }}')"
          echo "Subred real de kronoqr-app: ${subred}"
          sudo sed -i "s|^KIOSK_VLAN_CIDR=.*|KIOSK_VLAN_CIDR=${subred}|" .env
          sudo sed -i 's|^APP_ENV=.*|APP_ENV=staging|' .env
          grep -q '^APP_ENV=staging$' .env
          # (3) Pool de PHP-FPM, solo si quien lanza el workflow lo pide: sirve
          # para medir el mismo runner con el perfil recomendado del §11.6.2
          # (40) frente al minimo con el que se instala (20). El valor se
          # escribe en el .env del paquete y lo rinde el entrypoint al recrear
          # `app`; el aprovisionamiento lo deja anotado en summary.json.
          if [ -n "${FPM_MAX_CHILDREN}" ]; then
            if grep -q '^PHP_FPM_MAX_CHILDREN=' .env; then
              sudo sed -i "s|^PHP_FPM_MAX_CHILDREN=.*|PHP_FPM_MAX_CHILDREN=${FPM_MAX_CHILDREN}|" .env
            else
              echo "PHP_FPM_MAX_CHILDREN=${FPM_MAX_CHILDREN}" | sudo tee -a .env >/dev/null
            fi
            grep -q "^PHP_FPM_MAX_CHILDREN=${FPM_MAX_CHILDREN}$" .env
          fi
          # `restart` no basta: relanza el proceso existente sin releer
          # env_file. `up -d --wait` recrea los servicios con el .env de disco
          # y espera a que su healthcheck pase antes de seguir (hasta 300 s: desde
          # el bloque 9 de la 2.3.0 horizon, scheduler y reverb tambien lo tienen). Los cuatro
          # roles PHP se recrean para que ninguno se quede con el APP_ENV
          # anterior; nginx, por el CIDR.
          sudo docker compose --env-file .env -f docker-compose.yml up -d --wait --wait-timeout 300 app horizon scheduler reverb nginx
          curl -fsS -k https://127.0.0.1/api/v1/ready >/dev/null

      - name: "paquete/.env legible por el runner, sin sudo (lo necesita run.sh)"
        # `install.sh` deja `.env` en `root:root 0600` (§7.7, RS-08: el `.env`
        # del cliente no lo lee cualquiera). El paso siguiente invoca `make
        # load-test` SIN `sudo` a proposito -un `sudo make load-test` perderia
        # `node` del PATH, que `run.sh` necesita para `aggregate.js`-, y el
        # cliente `docker compose` del runner resuelve `--env-file` en SU
        # PROPIO proceso, no en el demonio: sin poder leer el fichero, falla
        # antes de arrancar nada. Se cede la PROPIEDAD al usuario del runner
        # -que ya esta en el grupo docker- y se CONSERVA el modo 0600: sigue
        # sin ser legible por nadie mas.
        #
        # Ningun otro fichero que `run.sh` necesite queda de root:
        # `docker-compose.yml` lo escribe `package.sh` como el propio runner
        # (nunca con sudo) y `.results/` lo crea `run.sh` con `mkdir -p`, sin
        # sudo tampoco.
        run: sudo chown "$(id -u):$(id -g)" paquete/.env

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: "Carga k6: regresion frente a la linea base del runner (RQ-08; el umbral de RNF-P-06 no se juzga aqui)"
        # El veredicto de load-tests/k6/run.sh ES el del job: sin
        # continue-on-error, un veredicto rojo o una medida no fiable rompen
        # este paso. Lo que se captura es solo QUE veredicto fue, para decirlo
        # con su nombre: `make` sale con 2 ante cualquier fallo de la receta, asi
        # que el codigo de salida no distingue un rojo de un «no fiable», y
        # run.sh lo deja escrito en `.results/verdict.txt` (V21-5-QA-01). La
        # subida de resultados, mas abajo, lleva `if: always()` justo para que
        # nada se pierda.
        #
        # Las variables K6_* de abajo son la interfaz que describe la
        # ficha de la tarea 3.6 para `load-tests/k6/run.sh` (aprovisionamiento
        # de verdad, TLS del paquete instalado, la zona de Nginx a contar en
        # el log, y la procedencia de la medida para la linea base). No pasan
        # por `make load-test` -que solo reenvia INSTANCES/DURATION/
        # K6_COMPOSE_ARGS/NETWORK, decision 15- sino como variables de este
        # paso: `run.sh` las lee directamente del entorno, y las que aun no
        # existan las ignora sin fallar.
        env:
          K6_ACKNOWLEDGE_TEST_DATABASE: "yes"
          K6_INSECURE_TLS: "1"
          K6_EDGE_SERVICE: nginx
          # El runner no alcanza el umbral de RNF-P-02/06/08 (4 vCPU compartidas
          # entre el servidor y los generadores: ~29 fichajes/s con p95 de
          # decenas de segundos), asi que aqui esos tres requisitos se juzgan
          # contra la linea base del propio runner (load-tests/k6/baseline.json:
          # p95 en unidades de velocidad de la maquina <= +25 % y en ms <= 3x,
          # para la tarjeta y para el PIN; tramos/s >= -20 %), no contra el
          # umbral, que se mide en
          # el hardware de referencia con `make load-test` (decision 19, ficha
          # 3.6). Contrato, RQ-03, RS-03, verificacion posterior y regla 21
          # siguen bloqueando; con el runner mas de 3x mas lento que en la linea
          # base, lo que depende de la maquina (las latencias, la tasa y la
          # separacion de RS-03 en ms) da «no fiable» en vez de rojo (V21-5-QA-01).
          K6_LATENCY_VERDICT: baseline
          # La aplicacion medida y el guion con el que se midio: distintos solo
          # con `app_ref`. Los dos viajan a summary.json.
          K6_GIT_SHA: ${{ steps.shas.outputs.app }}
          K6_HARNESS_SHA: ${{ steps.shas.outputs.harness }}
          K6_RUNNER: "github-${{ runner.os }}-${{ runner.arch }}"
        run: |
          estado=0
          make load-test \
            INSTANCES="${INSTANCES}" \
            DURATION="${DURATION}" \
            NETWORK=kronoqr-app \
            K6_COMPOSE_ARGS="--env-file paquete/.env -f paquete/docker-compose.yml" || estado=$?
          resultados=load-tests/k6/.results
          veredicto="$(cat "${resultados}/verdict.txt" 2>/dev/null || echo sin_veredicto)"
          lentitud="$(jq -r '.machine.slowdown // "n/d"' "${resultados}/summary.json" 2>/dev/null || echo n/d)"
          if [ "${estado}" -eq 0 ]; then
            mensaje="Verde frente a la linea base del runner. El umbral de RNF-P-06 (50 fichajes/s) no se juzga aqui: se mide con make load-test en hardware de referencia."
          else
            case "${veredicto}" in
            rojo) titulo="Carga en rojo"; mensaje="Regresion frente a la linea base o fallo de integridad: el detalle esta en la salida de run.sh y en summary.json." ;;
            no_fiable_runner_degradado) titulo="Carga NO FIABLE (runner degradado)"; mensaje="El runner iba ${lentitud} veces mas lento que en la linea base (maximo 3x): no es un rojo ni un verde. Repite la pasada." ;;
            no_comparable) titulo="Carga NO FIABLE (no comparable)"; mensaje="La pasada no usa los parametros de baseline.json: no se compara. Mide con los mismos o regenera la linea base." ;;
            no_fiable) titulo="Carga NO FIABLE (sin datos suficientes)"; mensaje="Hay requisitos sin muestras suficientes para juzgarlos. Repite la pasada." ;;
            *) titulo="Carga sin veredicto"; mensaje="run.sh termino sin dejar veredicto (salida ${estado}): mira su salida." ;;
            esac
            echo "::error title=${titulo}::${mensaje}"
          fi
          printf '### Prueba de carga\n\n%s\n' "${mensaje}" >>"${GITHUB_STEP_SUMMARY}"
          exit "${estado}"

      - name: Resultados de la carga (CSV, logs y summary.json)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: load-test-results
          # .results/ es un directorio OCULTO (el nombre empieza por `.`):
          # actions/upload-artifact v4 lo excluye por defecto y subiria un
          # artefacto vacio sin avisar. `path` explicito -no
          # `load-tests/k6/` a secas- para no arrastrar `.fixtures/` (el
          # aprovisionamiento de tarjetas y credenciales de la carga).
          path: load-tests/k6/.results
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
