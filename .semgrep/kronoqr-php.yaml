# Reglas propias de Semgrep para el backend — doc 02 §9.2 (SAST, umbral: 0
# hallazgos de severidad alta) y §3.5.
#
# Aqui solo vive lo que ninguna otra herramienta de la cadena puede ver. Todo lo
# que Pint, PHPStan, Deptrac o Rector detectan se queda en su herramienta: una
# regla duplicada en dos sitios acaba divergiendo y nadie sabe cual manda.
#
#   make sast
#   semgrep --config .semgrep --error

rules:
  # --------------------------------------------------------------------------
  # Regla dura 2: nunca now(), time(), Carbon::now() ni new DateTime() en el
  # dominio. Se inyecta el puerto Clock (ADR-021).
  #
  # Por que Semgrep y no Deptrac: Deptrac ve *imports*, y aqui el import es
  # legitimo. `DateTimeImmutable` se importa en el dominio para tipar un
  # parametro o un retorno —debe importarse—, y lo que delata la infraccion es
  # construirlo **sin instante**: `new DateTimeImmutable()` y
  # `new DateTimeImmutable('now')` leen el reloj del sistema. Ninguna regla de
  # imports ni de nombres de funcion encuentra esa forma.
  #
  # Por que acotada a Modules/*/Domain: Shared/Infrastructure/Adapter/SystemClock
  # es la unica construccion legitima de todo el backend —es precisamente el
  # adaptador que existe para que el dominio no lo haga—. Una regla global
  # naceria en rojo contra su propio diseno.
  #
  # Ademas de construirla vacia o con 'now' (H4): con un texto relativo al
  # momento actual —'today', 'midnight', 'tomorrow', '+1 day', una hora sin
  # fecha como '08:00'— y con date_create(), que es el mismo analizador. La
  # fecha civil se convierte con CivilDate::midnight(). La prueba de
  # arquitectura SystemClockTest vigila lo mismo, por tokens, tambien en
  # Application; esta regla es la segunda llave en el dominio.
  - id: kronoqr-domain-lee-el-reloj-del-sistema
    languages: [php]
    severity: ERROR
    message: >-
      Regla dura 2: este fichero de Domain construye una fecha con la hora del
      sistema. El dominio no pregunta la hora, la recibe ya resuelta: el caso de
      uso llama a Clock::now() (Shared\Application\Port\Clock, ADR-021) y le pasa
      el instante al agregado. Sin esto no se pueden probar DST ni los turnos que
      cruzan medianoche, que son la mitad del riesgo de este dominio. Una fecha
      civil YYYY-MM-DD se convierte con CivilDate::midnight().
    paths:
      include:
        - /backend/app/Modules/*/Domain/**
    pattern-either:
      - pattern: new DateTime()
      - pattern: new \DateTime()
      - pattern: new DateTimeImmutable()
      - pattern: new \DateTimeImmutable()
      - pattern: date_create(...)
      - pattern: \date_create(...)
      - pattern: date_create_immutable(...)
      - pattern: \date_create_immutable(...)
      - patterns:
          - pattern-either:
              - pattern: new DateTime($TEXT, ...)
              - pattern: new \DateTime($TEXT, ...)
              - pattern: new DateTimeImmutable($TEXT, ...)
              - pattern: new \DateTimeImmutable($TEXT, ...)
          # Un literal que se resuelve contra el momento actual.
          - metavariable-regex:
              metavariable: $TEXT
              regex: (?i)^['"]\s*(now|today|midnight|noon|tomorrow|yesterday|next\b|last\b|this\b|first\b|[+-]|\d{1,2}:\d{2})

  # `createFromFormat` SIN `!` rellena con el reloj del sistema todo lo que el
  # formato no nombra: con 'Y-m-d', la hora y los microsegundos del momento en
  # que se ejecuta (H4). Con `!` delante (o un `|` detras) lo pone a cero. Se
  # exceptuan los formatos que empiezan por `U`, que fijan el instante entero.
  # Solo se mira el formato escrito como literal: uno compuesto o una constante
  # no se pueden leer aqui (`'!'.UtcInstant::FORMAT` es la forma buena).
  - id: kronoqr-domain-createfromformat-sin-exclamacion
    languages: [php]
    severity: ERROR
    message: >-
      Regla dura 2: createFromFormat sin '!' al principio toma del reloj del
      sistema los campos que el formato no nombra (con 'Y-m-d', la hora y los
      microsegundos de ahora). Escribe '!Y-m-d' o usa CivilDate::midnight().
    paths:
      include:
        - /backend/app/Modules/*/Domain/**
    patterns:
      - pattern-either:
          - pattern: DateTime::createFromFormat($FORMAT, ...)
          - pattern: \DateTime::createFromFormat($FORMAT, ...)
          - pattern: DateTimeImmutable::createFromFormat($FORMAT, ...)
          - pattern: \DateTimeImmutable::createFromFormat($FORMAT, ...)
          - pattern: date_create_from_format($FORMAT, ...)
          - pattern: date_create_immutable_from_format($FORMAT, ...)
      - metavariable-regex:
          metavariable: $FORMAT
          regex: ^['"](?![!U])[^'"|]*['"]$

  # --------------------------------------------------------------------------
  # RNF-M-02: analisis estatico en el nivel maximo «sin errores suprimidos sin
  # justificar». PHPStan 2 ya exige el identificador del error tras
  # @phpstan-ignore, pero no puede exigir el motivo. Esto si.
  #
  # Forma valida:  @phpstan-ignore argument.type (La firma de X miente: ...)
  - id: kronoqr-phpstan-ignore-sin-justificacion
    languages: [generic]
    severity: ERROR
    message: >-
      Supresion de PHPStan sin motivo. RNF-M-02 exige que cada @phpstan-ignore
      lleve su justificacion en el propio comentario, entre parentesis y despues
      del identificador del error:
      @phpstan-ignore identificador.del.error (por que es inevitable aqui).
    paths:
      include:
        - /backend/**/*.php
    patterns:
      # `(\*/[ \t]*)?` para la supresion dentro de un comentario de bloque de
      # una linea, `/** @phpstan-ignore x */`: sin el, el `*/` impedia casar
      # el final de linea y la supresion sin motivo pasaba (V21-1-BE-1).
      - pattern-regex: '@phpstan-ignore(-next-line|-line)?[ \t]+[A-Za-z][A-Za-z0-9_.,: \t]*(\*/[ \t]*)?$'

  # `@phpstan-ignore-line` y `-next-line` no leen el identificador: lo que les
  # sigue es comentario y suprimen CUALQUIER error de la linea. Solo vale
  # `@phpstan-ignore <id> (motivo)`, que suprime ese error y ninguno mas.
  - id: kronoqr-phpstan-ignore-line
    languages: [generic]
    severity: ERROR
    message: >-
      @phpstan-ignore-line y @phpstan-ignore-next-line suprimen cualquier error
      de la linea aunque lleven identificador. Usa
      @phpstan-ignore identificador.del.error (motivo) en su lugar.
    paths:
      include:
        - /backend/**/*.php
    patterns:
      - pattern-regex: '@phpstan-ignore-(next-)?line\b'

  # --------------------------------------------------------------------------
  # Regla dura 21 y ADR-048 (H9 del dictamen de seguridad del bloque 19): nunca
  # nombres, correos ni telefonos en el CONTEXTO de una linea del log tecnico.
  #
  # Por que hace falta: `RedactPersonalDataProcessor` pasa el mensaje y las
  # excepciones por la lista blanca por palabra, pero los valores del contexto
  # solo por patrones (decision D3 de ADR-048: los escribe el codigo del
  # producto y el vocabulario estropearia rutas y clases). Un nombre sin
  # comillas no tiene patron. Esta regla es el control compensatorio: impide
  # que el codigo lo meta ahi. Las personas van por `employee_uuid`.
  - id: kronoqr-log-con-datos-de-persona
    languages: [php]
    severity: ERROR
    message: >-
      Regla dura 21: este log mete en su contexto un nombre, un correo o un
      telefono. El contexto del log tecnico solo pasa por patrones (ADR-048,
      D3) y un nombre no tiene patron. Identifica a la persona con
      `employee_uuid`, nunca con sus datos.
    paths:
      include:
        - /backend/app/**
    pattern-either:
      - patterns:
          - pattern-either:
              - pattern: Log::$METHOD($MSG, [..., $KEY => $VALUE, ...], ...)
              - pattern: $LOGGER->$METHOD($MSG, [..., $KEY => $VALUE, ...], ...)
              - pattern: $LOGGER->$METHOD($LEVEL, $MSG, [..., $KEY => $VALUE, ...], ...)
          - metavariable-regex:
              metavariable: $METHOD
              regex: ^(debug|info|notice|warning|error|critical|alert|emergency|log)$
          - metavariable-regex:
              metavariable: $KEY
              regex: ^['"](name|first_name|last_name|full_name|display_name|employee_name|user_name|email|phone|nombre|apellidos|correo|telefono)['"]$
      - patterns:
          - pattern-either:
              - pattern: Log::$METHOD($MSG, [..., $KEY => $OBJECT->$FIELD, ...], ...)
              - pattern: $LOGGER->$METHOD($MSG, [..., $KEY => $OBJECT->$FIELD, ...], ...)
              - pattern: $LOGGER->$METHOD($LEVEL, $MSG, [..., $KEY => $OBJECT->$FIELD, ...], ...)
          - metavariable-regex:
              metavariable: $METHOD
              regex: ^(debug|info|notice|warning|error|critical|alert|emergency|log)$
          - metavariable-regex:
              metavariable: $FIELD
              regex: ^(name|first_name|last_name|full_name|display_name|email|phone|firstName|lastName|fullName|displayName|resolvedByName)$
