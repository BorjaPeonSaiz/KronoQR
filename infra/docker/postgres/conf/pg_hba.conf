# KronoQR — reglas de acceso de PostgreSQL 17.
#
# Este fichero SUSTITUYE al pg_hba.conf que genera initdb. El servicio arranca
# con `-c hba_file=/etc/kronoqr/pg_hba.conf` (infra/compose.*.yaml), asi que
# las reglas de acceso a la base de datos son declarativas, viajan en la imagen
# y son IGUALES en todas las instalaciones (ADR-017, regla dura 13).
#
# El motivo concreto por el que existe: pg_basebackup necesita una conexion de
# REPLICACION, y el pg_hba que genera initdb solo la admite desde el propio
# equipo. Sin esta linea, la copia fisica —la unica que junto al WAL archivado
# sostiene el RPO de 15 minutos (RNF-D-02)— falla con "no pg_hba.conf entry for
# replication connection", y falla justo el dia de la instalacion, no el de la
# restauracion. Cambiar el fichero del volumen a mano habria dejado a cada
# cliente con una configuracion distinta y a las instalaciones existentes sin
# el cambio.
#
# A la base de datos NO se llega desde la red del hotel: el servicio no publica
# puerto (infra/compose.prod.yaml) y solo es alcanzable desde la red interna de
# Docker. Aun asi, todas las conexiones por TCP exigen contraseña con
# scram-sha-256; ni una linea `trust` por red.
#
# TYPE  DATABASE        USER            ADDRESS                 METHOD

# Socket local: procesos DENTRO de este contenedor. Es como entra el propio
# entrypoint de la imagen para crear la base la primera vez.
local   all             all                                     trust
local   replication     all                                     trust

# Red interna de contenedores: la aplicacion, las colas y el scheduler.
host    all             all             all                     scram-sha-256

# Copia FISICA (pg_basebackup) desde el contenedor que ejecuta backup.sh.
# Misma autenticacion que todo lo demas: contraseña, nunca trust.
host    replication     all             all                     scram-sha-256
