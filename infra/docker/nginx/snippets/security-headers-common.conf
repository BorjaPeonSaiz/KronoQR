# Cabeceras de seguridad comunes — doc 02 §7.2, literal. TODO MENOS la CSP.
#
# No se incluye directamente: lo hacen `security-headers.conf` (CSP estricta, la
# de todo el borde) y `security-headers-kiosk.conf` (la del quiosco, con
# 'wasm-unsafe-eval'). Asi las dos variantes no pueden divergir en nada que no
# sea la CSP, y QualityGatesTest lo comprueba.
#
# OJO: si alguna location anade su propio add_header, nginx DEJA DE HEREDAR las
# cabeceras de arriba. Antes de escribir un add_header en una location, repite
# el include entero.

add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# camera=(self) es IMPRESCINDIBLE: sin ella la PWA del quiosco no puede acceder
# al dispositivo de video y el fallo se diagnostica mal (§7.2). No se toca.
add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=()" always;

add_header Cross-Origin-Opener-Policy "same-origin" always;

# CORP same-origin (2.2.0, S2 del DAST): ningun otro origen puede incrustar
# recursos de la instalacion (assets, logotipos, PDF, QR). Es seguro porque las
# tres SPA, sus fuentes autoalojadas y las descargas se sirven del MISMO origen
# (la CSP `default-src 'self'` ya impide cargar nada externo). WebSocket y
# `fetch` same-origin no se ven afectados. Si un dia hubiera que servir un
# recurso a otro origen, se hace en esa `location` y se documenta, no aqui.
add_header Cross-Origin-Resource-Policy "same-origin" always;
