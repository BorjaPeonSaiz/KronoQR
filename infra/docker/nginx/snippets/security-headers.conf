# Cabeceras de seguridad — doc 02 §7.2, literal.
#
# Se incluye a nivel de server. OJO: si alguna location anade su propio
# add_header, nginx DEJA DE HEREDAR estas. Antes de escribir un add_header en
# una location, repite aqui el bloque entero o usa una variable.

add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

# img-src y media-src incluyen blob: porque el escaneo por camara los necesita.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' wss:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# camera=(self) es IMPRESCINDIBLE: sin ella la PWA del quiosco no puede acceder
# al dispositivo de video y el fallo se diagnostica mal (§7.2). No se toca.
add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=()" always;

add_header Cross-Origin-Opener-Policy "same-origin" always;
