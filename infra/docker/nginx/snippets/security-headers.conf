# Cabeceras de seguridad — doc 02 §7.2, literal.
#
# Se incluye a nivel de server. OJO: si alguna location anade su propio
# add_header, nginx DEJA DE HEREDAR estas. Antes de escribir un add_header en
# una location, repite aqui el bloque entero o usa una variable.

add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

# script-src lleva 'wasm-unsafe-eval' (PIN-01, 2.2.0): libsodium-wrappers, que sella el
# PIN del quiosco, compila WebAssembly al arrancar, y sin ese permiso el fichaje
# por PIN falla siempre en produccion. NO permite `eval` de JavaScript, y por
# eso NO se anade 'unsafe-eval'. Lo comprueba QualityGatesTest.
# img-src y media-src incluyen blob: porque el escaneo por camara los necesita.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' wss:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# camera=(self) es IMPRESCINDIBLE: sin ella la PWA del quiosco no puede acceder
# al dispositivo de video y el fallo se diagnostica mal (§7.2). No se toca.
add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=()" always;

add_header Cross-Origin-Opener-Policy "same-origin" always;

# CORP same-origin (2.2.0, S2 del DAST): ningun otro origen puede incrustar
# recursos de la instalacion (assets, logotipos, PDF, QR). Es seguro porque las
# tres SPA, sus fuentes autoalojadas y las descargas se sirven del MISMO origen
# (la CSP `default-src 'self'` ya impide cargar nada externo). WebSocket y
# `fetch` same-origin no se ven afectados. Si un dia hubiera que servir un
# recurso a otro origen, se hace en esa `location` y se documenta, no aqui.
add_header Cross-Origin-Resource-Policy "same-origin" always;
