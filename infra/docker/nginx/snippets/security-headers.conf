# Cabeceras de seguridad por defecto — doc 02 §7.2, literal.
#
# Es la variante ESTRICTA y la de todo el borde: servers de 80 y 443, API,
# paginas de error, panel de gestion y portal del empleado. La CSP no permite
# WebAssembly. Solo el quiosco la relaja, en `security-headers-kiosk.conf`.
#
# Se incluye a nivel de server. OJO: si alguna location anade su propio
# add_header, nginx DEJA DE HEREDAR estas. Antes de escribir un add_header en
# una location, repite aqui el include entero (y si la location es la del
# quiosco, el de `security-headers-kiosk.conf`, nunca este).

include /etc/nginx/snippets/security-headers-common.conf;

# script-src SIN 'wasm-unsafe-eval' (B18, 2.2.1): ni el panel ni el portal
# compilan WebAssembly. Solo el quiosco carga libsodium (sella el PIN en el
# cliente) y lo recibe de su propio snippet. Ni 'unsafe-eval' ni 'unsafe-inline'
# en ninguna variante. Si el portal o el panel llegaran a sellar en el cliente,
# se les da el snippet del quiosco en su location Y se cambia QualityGatesTest.
# img-src y media-src incluyen blob: porque el escaneo por camara los necesita.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' wss:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; manifest-src 'self'; object-src 'none'" always;
