# Cabeceras de seguridad del QUIOSCO — las de `security-headers.conf` mas
# 'wasm-unsafe-eval' en script-src. Solo lo incluye `location ^~ /kiosk/`
# (extra/spa.conf).
#
# POR QUE (PIN-01, 2.2.0): libsodium-wrappers, que sella el PIN del quiosco,
# compila WebAssembly al arrancar; sin ese permiso el fichaje por PIN falla
# siempre en produccion. NO permite `eval` de JavaScript, y por eso NO se anade
# 'unsafe-eval'. El panel y el portal no usan libsodium (B18, 2.2.1) y no lo
# reciben. Lo comprueba QualityGatesTest.
#
# El E2E del quiosco (pin-csp.spec.ts) lee ESTE fichero para servir las mismas
# cabeceras que Nginx; no se copia la CSP a mano en ningun otro sitio.

include /etc/nginx/snippets/security-headers-common.conf;

add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; manifest-src 'self'; object-src 'none'" always;
