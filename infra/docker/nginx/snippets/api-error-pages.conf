# Errores generados por NGINX en la API, como problem+json (F4a-2, CH4).
#
# Sin esto, un 413, un 429 o un 502 del borde salian en HTML y el quiosco
# recibia una pagina donde esperaba JSON. Solo aplica a lo que genera nginx
# (limit_req, tamano de cuerpo, PHP-FPM caido o lento): una respuesta que ya
# trae la aplicacion pasa tal cual (fastcgi_intercept_errors sigue en off).
#
# Se incluye DENTRO de cada `location` de la API, nunca en `server`: un
# `error_page` en una location sustituye al heredado, y /portal, /kiosk y
# /admin (HTML) no deben cambiar. Los cuerpos viven en
# api-error-locations.conf, incluido una vez a nivel de `server`.
error_page 404 @kronoqr_api_404;
error_page 405 @kronoqr_api_405;
error_page 413 @kronoqr_api_413;
error_page 429 @kronoqr_api_429;
error_page 502 @kronoqr_api_502;
error_page 503 @kronoqr_api_503;
error_page 504 @kronoqr_api_504;
