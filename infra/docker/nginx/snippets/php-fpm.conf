# Paso a PHP-FPM. Todas las rutas de la API entran por public/index.php.

# El destino va en una VARIABLE a proposito. Con un nombre literal, Nginx
# resuelve app:9000 una sola vez, al arrancar, y se queda con esa IP: al
# recrear el contenedor de la aplicacion —un despliegue, un reinicio— la IP
# cambia y Nginx responde 502 hasta que alguien lo reinicia tambien. Con
# variable resuelve por peticion contra el DNS interno de Docker y el
# despliegue no necesita parada (doc 02 §10.4).
set $kronoqr_app_upstream app:9000;
fastcgi_pass $kronoqr_app_upstream;
fastcgi_index index.php;

fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
fastcgi_param SCRIPT_NAME /index.php;
fastcgi_param DOCUMENT_ROOT /var/www/html/public;
include fastcgi_params;

# El navegador propaga `traceparent` (W3C) en cada `fetch` (tarea 3.1, decision
# 7); FastCGI ya reenvia TODAS las cabeceras de la peticion como variables
# HTTP_* sin necesidad de declararlas aqui, asi que esta linea es solo
# documentacion de que PHP la recibe con ese nombre. Antes decia
# HTTP_X_TRACE_ID: era la cabecera de un diseno anterior que ningun frontend
# llego a enviar, y dejarla habria hecho creer que ese es el nombre que
# correlaciona el fetch con la consulta SQL cuando el correcto es este.
fastcgi_param HTTP_TRACEPARENT $http_traceparent;

fastcgi_read_timeout 60s;
fastcgi_buffers 16 16k;
fastcgi_buffer_size 32k;
fastcgi_hide_header X-Powered-By;
