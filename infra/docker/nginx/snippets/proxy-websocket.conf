# Proxy con actualizacion a WebSocket. Lo usan Reverb (presencia en vivo) y,
# en desarrollo, el HMR de Vite.

proxy_http_version 1.1;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;
# nosemgrep: generic.nginx.security.request-host-used.request-host-used -- el Host tiene que llegar tal cual al upstream: Reverb comprueba el origen del WebSocket contra el y Vite (HMR, solo desarrollo) lo necesita para reconectar; ambos `server` de la plantilla son catch-all (`server_name _`), asi que no hay un nombre configurado con el que sustituirlo y quien decide que hosts acepta es la aplicacion (APP_URL)
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_read_timeout 3600s;
proxy_send_timeout 3600s;
proxy_buffering off;
