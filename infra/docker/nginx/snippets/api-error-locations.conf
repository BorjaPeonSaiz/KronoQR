# Cuerpos problem+json de los errores de nginx en la API (F4a-2, CH4).
# Se incluye UNA vez, dentro de `server`. Ver api-error-pages.conf.
#
# Reglas: cuerpo estatico con type/title/status (mismo formato que el esquema
# Problem de openapi.yaml); sin rutas internas, sin IP, sin version. ASCII, sin
# tildes. La cabecera de seguridad se repite porque un `add_header` en una
# location anula los del `server`; `always` para que salga tambien en errores.

location @kronoqr_api_404 {
  default_type application/problem+json;
  include /etc/nginx/snippets/security-headers.conf;
  add_header Cache-Control "no-store" always;
  return 404 '{"type":"urn:kronoqr:problem:not-found","title":"Not Found","status":404}';
}

location @kronoqr_api_405 {
  default_type application/problem+json;
  include /etc/nginx/snippets/security-headers.conf;
  add_header Cache-Control "no-store" always;
  return 405 '{"type":"urn:kronoqr:problem:method-not-allowed","title":"Method Not Allowed","status":405}';
}

location @kronoqr_api_413 {
  default_type application/problem+json;
  include /etc/nginx/snippets/security-headers.conf;
  add_header Cache-Control "no-store" always;
  return 413 '{"type":"urn:kronoqr:problem:payload-too-large","title":"Payload Too Large","status":413}';
}

location @kronoqr_api_429 {
  default_type application/problem+json;
  include /etc/nginx/snippets/security-headers.conf;
  add_header Cache-Control "no-store" always;
  add_header Retry-After "60" always;
  return 429 '{"type":"urn:kronoqr:problem:too-many-requests","title":"Too Many Requests","status":429}';
}

location @kronoqr_api_502 {
  default_type application/problem+json;
  include /etc/nginx/snippets/security-headers.conf;
  add_header Cache-Control "no-store" always;
  add_header Retry-After "30" always;
  return 502 '{"type":"urn:kronoqr:problem:bad-gateway","title":"Bad Gateway","status":502}';
}

location @kronoqr_api_503 {
