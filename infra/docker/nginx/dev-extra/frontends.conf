# Locations SOLO de desarrollo. compose.dev.yaml monta este directorio en
# /etc/nginx/extra; en produccion ese directorio esta vacio y los frontends se
# sirven ya construidos desde el sistema de ficheros.
#
# Los tres servidores de Vite llegan en la tarea 0.5. Hasta entonces estas
# rutas devuelven 502, que es la respuesta honesta: el upstream no existe.
#
# El destino va en variable por lo mismo que en php-fpm.conf: para que
# reiniciar un contenedor no deje a Nginx hablando con una IP que ya no existe.

location ^~ /kiosk/ {
  set $kronoqr_kiosk_upstream node-kiosk:5173;
  # nosemgrep: generic.nginx.security.dynamic-proxy-host.dynamic-proxy-host -- la variable la fija el `set` de la linea anterior con un literal, no viene de la peticion; y este fichero solo se monta en desarrollo
  proxy_pass http://$kronoqr_kiosk_upstream;
  include /etc/nginx/snippets/proxy-websocket.conf;
}

location ^~ /admin/ {
  set $kronoqr_admin_upstream node-admin:5173;
  # nosemgrep: generic.nginx.security.dynamic-proxy-host.dynamic-proxy-host -- literal fijado por el `set` anterior; solo desarrollo
  proxy_pass http://$kronoqr_admin_upstream;
  include /etc/nginx/snippets/proxy-websocket.conf;
}


# RF-ID-08: mismo candado que /api/v1/me/ en la plantilla principal
# ($kronoqr_portal_allowed, geo declarado ahi). En desarrollo el valor por
# defecto de PORTAL_INTERNAL_CIDR en .env.example cubre la red de Docker
# Compose para que abrir el portal desde el navegador del host siga
# funcionando sin tocar nada.
location ^~ /portal/ {
  if ($kronoqr_portal_allowed = 0) {
    return 403;
  }
  set $kronoqr_portal_upstream node-portal:5173;
  # nosemgrep: generic.nginx.security.dynamic-proxy-host.dynamic-proxy-host -- literal fijado por el `set` anterior; solo desarrollo
  proxy_pass http://$kronoqr_portal_upstream;
  include /etc/nginx/snippets/proxy-websocket.conf;
}
