# Las tres SPA de KronoQR, servidas ya construidas desde la propia imagen.
#
# POR QUE ESTE FICHERO ESTA EN /etc/nginx/extra Y NO EN LA PLANTILLA PRINCIPAL.
# En desarrollo, compose.dev.yaml monta `dev-extra/` encima de ese directorio y
# lo sustituye entero por los proxys a los tres servidores de Vite. Si estas
# `location` vivieran en kronoqr.conf.template, el entorno de desarrollo
# declararia `/admin/` dos veces y Nginx se negaria a arrancar con un
# "duplicate location". Al vivir aqui, cada entorno tiene exactamente una
# definicion de cada ruta y ninguna de las dos conoce a la otra.
#
# El prefijo de cada SPA no es cosmetico: se construyen con
# KRONOQR_BASE=/admin/, /kiosk/ y /portal/ (infra/docker/nginx/Dockerfile), de
# donde sale `import.meta.env.BASE_URL` y, en el quiosco, el `start_url` y el
# `scope` de la PWA. Cambiar una ruta aqui sin cambiar la del build deja la
# aplicacion pidiendo sus ficheros a una ruta que no existe.
#
# CADA `location` REPITE `include security-headers.conf`. No es redundancia:
# Nginx deja de heredar las cabeceras del `server` en cuanto una `location`
# anade su propio `add_header`, y aqui se anade `Cache-Control`. Sin esta linea,
# el HTML del quiosco se serviria SIN `Permissions-Policy: camera=(self)` y la
# camara dejaria de abrirse, con un sintoma que no apunta a este fichero.
#
# CADA `location` DECLARA `index index.html`, y sin eso las tres devuelven 403.
#
# El `server` de HTTPS declara `index index.php`, que es lo correcto para las
# rutas de la API, y la imagen borra el `default.conf` que traia el
# `index index.html` de fabrica. Para un `GET /admin/`, `try_files` casa `$uri/`
# con el directorio —que existe—, nginx busca alli su indice, no encuentra
# `index.php` y responde «directory index of "/var/www/spa/admin/" is
# forbidden» ANTES de llegar al respaldo `/admin/index.html`. En desarrollo no
# se ve, porque `dev-extra/` sustituye estas location por proxys a Vite.
#
# Es exactamente el tipo de 403 cuyo sintoma no apunta a su causa: no falta un
# permiso, falta una directiva.

#--- Panel de gestion ---------------------------------------------------------
location ^~ /admin/ {
  alias /var/www/spa/admin/;
  index index.html;
  # El respaldo es el index.html de ESTA aplicacion: una ruta interna del panel
  # recargada con F5 tiene que devolver la SPA, no un 404 ni la API.
  try_files $uri $uri/ /admin/index.html;
  include /etc/nginx/snippets/security-headers.conf;
  add_header Cache-Control $kronoqr_spa_cache always;
}

#--- Quiosco (PWA de la tablet) -----------------------------------------------
location ^~ /kiosk/ {
  alias /var/www/spa/kiosk/;
  index index.html;
  try_files $uri $uri/ /kiosk/index.html;
  include /etc/nginx/snippets/security-headers.conf;
  add_header Cache-Control $kronoqr_spa_cache always;
}

#--- Portal del empleado ------------------------------------------------------
# RF-ID-08: el mismo candado que su API (`location ^~ /api/v1/me/` en la
# plantilla principal). Sin el, el HTML del portal se serviria a cualquier
# origen aunque los datos de detras si estuvieran restringidos, y la pantalla
# de acceso con codigo y PIN quedaria expuesta a internet.
location ^~ /portal/ {
  if ($kronoqr_portal_allowed = 0) {
    return 403;
  }
  alias /var/www/spa/portal/;
  index index.html;
  try_files $uri $uri/ /portal/index.html;
  include /etc/nginx/snippets/security-headers.conf;
  add_header Cache-Control $kronoqr_spa_cache always;
}
