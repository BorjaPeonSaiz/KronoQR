; KronoQR — ajustes de PHP comunes a desarrollo y produccion.
; Lo que dependa del entorno se sobrescribe por variable, no aqui.

; Regla dura 3: el proceso vive en UTC. La zona del centro es dato de sites.
date.timezone = UTC

expose_php = Off
memory_limit = 256M
max_execution_time = 60
post_max_size = 12M
upload_max_filesize = 10M

; Los errores van a stderr, que es lo que recoge el stack de logs (§8.1).
; Nunca al navegador: un stack trace en la respuesta filtra rutas y consultas.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /proc/self/fd/2
error_reporting = E_ALL

; OPcache. En produccion, validate_timestamps=0 y el despliegue reinicia FPM.
opcache.enable = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0

; OPcache tambien en CLI, y con cache en disco. Las dos lineas son necesarias y
; por motivos distintos:
;
;   enable_cli   sin el, `php` compila de cero en cada invocacion.
;   file_cache   la memoria compartida de OPcache NO sobrevive al proceso, y
;                cada `php artisan test` es un proceso nuevo. Solo la cache en
;                disco persiste entre ejecuciones, que es lo que hace que la
;                segunda sea rapida.
;
; Sin esto, `make test-unit` compilaba los ~8.300 ficheros del autoload en cada
; ejecucion y tardaba ~4 s con tres pruebas triviales, incumpliendo el
; presupuesto de CLAUDE.md (suite unitaria por debajo de 2 s). El presupuesto
; existe para que el ciclo del dominio sea rapido en las tareas 1.1 y 1.2, que
; es donde se prueban DST y medianoche.
;
; validate_timestamps=1 sigue vigente: en desarrollo el codigo llega por bind
; mount y un fichero editado debe recompilarse, no servirse de la cache.
; El directorio lo crea el Dockerfile con propietario app. Si no existe, PHP
; descarta la cache en silencio y esto no sirve de nada: comprobar que
; /var/www/.opcache se llena, no dar por hecho que funciona.
opcache.enable_cli = 1
opcache.file_cache = /var/www/.opcache
opcache.file_cache_consistency_checks = 1

; Sesiones y cookies. Laravel lo gestiona, pero si algo se cuela por la via de
; PHP no debe salir sin estas dos.
session.cookie_httponly = On
session.cookie_samesite = Lax

realpath_cache_size = 4096k
realpath_cache_ttl = 600
