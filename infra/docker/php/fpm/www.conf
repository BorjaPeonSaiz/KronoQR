; KronoQR — pool de PHP-FPM.
;
; El proceso maestro corre como el usuario app (sin root), asi que este fichero
; no declara user/group: FPM los ignoraria y avisaria por cada arranque.
;
; Dimensionado: el pico del producto es el cambio de turno (RNF-P-06,
; 50 fichajes/s). pm.max_children se ajusta en la tarea 3.x con datos de carga
; reales; este valor sostiene el entorno de desarrollo sin comerse la memoria.

[www]
listen = 9000
listen.backlog = 511

pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500

; Sondas del propio FPM. /ping lo usa el healthcheck del contenedor: comprueba
; que el gestor de procesos responde, no solo que el proceso existe.
ping.path = /ping
ping.response = pong
pm.status_path = /fpm-status

; El log de acceso lo hace Nginx; duplicarlo aqui solo genera ruido.
access.log = /dev/null

; La salida de los workers va al stderr del contenedor, en crudo, para que el
; formateador JSON de Monolog (§8.1) sea el unico que da forma a los logs.
catch_workers_output = yes
decorate_workers_output = no

; Las variables de entorno del contenedor tienen que llegar a la aplicacion:
; toda la configuracion del producto viaja por ahi (ADR-017).
clear_env = no

php_admin_value[error_log] = /proc/self/fd/2
php_admin_flag[log_errors] = on
