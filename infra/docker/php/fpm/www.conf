; KronoQR — pool de PHP-FPM.
;
; El proceso maestro corre como el usuario app (sin root), asi que este fichero
; no declara user/group: FPM los ignoraria y avisaria por cada arranque.
;
; Dimensionado: el pico del producto es el cambio de turno (RNF-P-06,
; 50 fichajes/s). LOS CUATRO pm.* de abajo son el valor de ESTE fichero, que
; es lo que usan las pruebas y `php-fpm -t` sueltos sobre este pool -- pero
; NO son los que arrancan en un contenedor real: `entrypoint.sh`
; (render_fpm_pool, tarea 3.6) los REESCRIBE en un fichero aparte a partir de
; PHP_FPM_MAX_CHILDREN (.env.example) antes de arrancar php-fpm con `-y`.
; pm.start_servers/min_spare_servers/max_spare_servers se derivan de
; pm.max_children (20 %, 10 % y 30 %), asi que los cuatro valores de aqui
; abajo son solo el punto de partida sin la variable puesta (equivale a
; PHP_FPM_MAX_CHILDREN=20, el servidor minimo publicado en el doc 02 §11.6.2).

[www]
listen = 9000
listen.backlog = 511

pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500

; Sondas del propio FPM. /ping lo usa el healthcheck del contenedor: comprueba
; que el gestor de procesos responde, no solo que el proceso existe.
ping.path = /ping
ping.response = pong
pm.status_path = /fpm-status

; El log de acceso lo hace Nginx; duplicarlo aqui solo genera ruido.
access.log = /dev/null

; La salida de los workers va al stderr del contenedor, en crudo, para que el
; formateador JSON de Monolog (§8.1) sea el unico que da forma a los logs.
catch_workers_output = yes
decorate_workers_output = no

; Las variables de entorno del contenedor tienen que llegar a la aplicacion:
; toda la configuracion del producto viaja por ahi (ADR-017).
clear_env = no

php_admin_value[error_log] = /proc/self/fd/2
php_admin_flag[log_errors] = on
