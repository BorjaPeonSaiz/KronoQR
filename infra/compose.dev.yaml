#==============================================================================
# KronoQR — entorno de desarrollo. Los 15 servicios del doc 02 §3.4.
#
# Uso previsto:  make up      (desde la raiz del repositorio)
#
# Si lo invocas a mano, pasa el fichero de entorno explicitamente:
#   docker compose --env-file .env -f infra/compose.dev.yaml up -d
# El .env canonico vive en la raiz, junto a .env.example; este fichero esta en
# infra/, asi que Docker Compose no lo encuentra solo.
#
# Estado en la Fase 0: la aplicacion Laravel llega en la tarea 0.2 y los tres
# frontends en la 0.5. Los servicios que dependen de ellos arrancan, avisan por
# el log y quedan a la espera, en lugar de reiniciarse en bucle.
#==============================================================================

name: kronoqr

x-php-image: &php-image
  build:
    context: ..
    dockerfile: infra/docker/php/Dockerfile
    target: dev
  image: kronoqr/php:dev
  env_file:
    - ../.env
  volumes:
    - ../backend:/var/www/html
    # vendor/ NO viaja por el bind mount, y no es una optimizacion opcional.
    #
    # En una estacion Windows el codigo vive en NTFS y Docker lo expone a los
    # contenedores Linux cruzando esa frontera en cada lectura. Medido en esta
    # maquina: leer 2.000 ficheros desde el mount tarda 15.294 ms; los mismos
    # ficheros en el disco del contenedor, 30 ms. Son 500 veces mas lento, y
    # vendor/ son 16.919 de los 17.779 ficheros del backend.
    #
    # Efecto sobre la suite unitaria, misma suite y mismo contenedor:
    #   desde el bind mount .... 3,84 s   (incumple el presupuesto de CLAUDE.md)
    #   desde disco local ...... 0,10 s
    #
    # El codigo fuente sigue en bind mount, que es lo que hace que editar un
    # fichero se vea al instante. Lo que se saca del mount es lo que nadie
    # edita a mano y composer.lock gobierna.
    #
    # Consecuencia: las dependencias del contenedor viven en este volumen y se
    # instalan dentro (lo hace el entrypoint si el volumen esta vacio). El
    # backend/vendor del host queda solo para que el IDE resuelva el autoload,
    # que es para lo que el doc de entorno §B.3 puso Composer en el host.
    - backend-vendor:/var/www/html/vendor
    # La raiz del repositorio, de SOLO LECTURA.
    #
    # Los requisitos de la Fase 0 no describen comportamiento del producto:
    # describen que la cadena de calidad esta puesta. Comprobarlos exige leer
    # ficheros que viven fuera de backend/ —Makefile, .gitignore, .env.example,
    # .semgrep/, infra/docker/nginx/, los eslint.config.js— y el contenedor no
    # los veia. Sin este montaje, esas pruebas pasarian en la CI (que corre
    # sobre el arbol completo) y fallarian en local: una suite que da resultados
    # distintos segun donde se ejecute no verifica nada.
    #
    # Solo lectura y a proposito: desde aqui nada escribe en el repositorio.
    - ..:/var/www/repo:ro
    # El contrato de la API vive FUERA de backend/ y las pruebas de contrato se
    # ejecutan DENTRO del contenedor, asi que sin este montaje Spectator no
    # encuentra docs/api/openapi.yaml y las pruebas de la suite Contract fallan
    # con "missing or invalid spec".
    #
    # Se monta en /var/www/docs y no dentro de /var/www/html a proposito: asi la
    # ruta relativa desde la aplicacion es la misma dentro del contenedor
    # (base_path('../docs')) y en la CI, donde las herramientas corren sobre
    # backend/ en el disco del runner. Una ruta que solo funciona en un sitio
    # acaba en un `if (env('CI'))` dentro de la configuracion.
    #
    # Solo lectura: la aplicacion lee la documentacion, no la escribe. Se monta
    # docs/ entera y no docs/api porque `docs:consistency` (tarea 0.7) tiene que
    # leer tambien docs/adr/ y docs/requisitos.yaml.
    - ../docs:/var/www/docs:ro
    # Destino de las copias. En desarrollo es un volumen con nombre y en
    # produccion el disco del cliente (compose.prod.yaml): la ruta DENTRO del
    # contenedor es la misma en los dos sitios, que es lo que hace que
    # backup.sh no tenga que saber donde se ejecuta.
    - backup-data:${BACKUP_PATH:-/var/backups/fichaje}
  environment:
    # En desarrollo los scripts se leen del repositorio montado, no de los que
    # la imagen lleva dentro: editarlos y volver a lanzarlos no puede exigir
    # reconstruir la imagen. En produccion no se define y valen los de la
    # imagen (/opt/kronoqr/scripts), que son los de la version desplegada.
    BACKUP_SCRIPT_PATH: /var/www/repo/infra/scripts
    # Clave de cifrado de las copias. En desarrollo hay un valor de relleno
    # para que `php artisan backup:run` funcione recien clonado el repositorio;
    # en produccion NO hay valor por defecto: install.sh la genera en el
    # servidor del cliente y sin ella la copia se niega a empezar (RL-12).
    BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY:-kronoqr_local_dev_only_backup_key}
  networks:
    - app
  restart: unless-stopped

services:

  #--- 1 · API Laravel 13 sobre PHP 8.4-FPM -----------------------------------
  app:
    <<: *php-image
    container_name: kronoqr-app
    command: ["fpm"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # Comprueba que el gestor de procesos responde, no solo que el proceso
      # existe, y NO pasa por la aplicacion: `/ping` es de PHP-FPM.
      #
      # Sigue siendo la sonda correcta para este `healthcheck` aunque desde la
      # tarea 1.7 exista /api/v1/health: aquella pasa por Nginx, que es otro
      # contenedor, y lo que aqui se decide es si hay que reiniciar ESTE. Quien
      # quiera saber si la instalacion acepta trafico pregunta a /api/v1/ready.
      test: ["CMD-SHELL", "SCRIPT_NAME=/ping SCRIPT_FILENAME=/ping REQUEST_METHOD=GET cgi-fcgi -bind -connect 127.0.0.1:9000 | grep -q pong"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  #--- 2 · Borde HTTP: TLS, cabeceras, rate limiting --------------------------
  nginx:
    build:
      context: ..
      dockerfile: infra/docker/nginx/Dockerfile
    image: kronoqr/nginx:dev
    container_name: kronoqr-nginx
    env_file:
      - ../.env
    ports:
      - "80:8080"
      - "443:8443"
    volumes:
      # Solo lectura: el borde no escribe en el codigo.
      - ../backend:/var/www/html:ro
      - ./docker/nginx/dev-extra:/etc/nginx/extra:ro
      - nginx-certs:/etc/nginx/certs
    depends_on:
      - app
    networks:
      - app
      - observability
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://127.0.0.1:8080/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  #--- 3 · PostgreSQL 17 ------------------------------------------------------
  postgres:
    build:
      context: ..
      dockerfile: infra/docker/postgres/Dockerfile
    image: kronoqr/postgres:dev
    container_name: kronoqr-postgres
    environment:
      POSTGRES_DB: ${DB_DATABASE:-fichaje}
      # El rol de ARRANQUE es el de MIGRACION, no el de la aplicacion (tarea
      # 1.14, regla dura 6). POSTGRES_USER es superusuario del cluster, y un
      # GRANT o un REVOKE sobre un superusuario es decorativo: PostgreSQL ni
      # los mira. Mientras la aplicacion corrio con este rol, "sin UPDATE ni
      # DELETE sobre audit_log" era una frase, no una garantia.
      #
      # initdb/02-application-roles.sh crea a partir de aqui fichaje_app —el
      # DB_USERNAME del .env, sin DDL— y fichaje_maintenance.
      POSTGRES_USER: ${DB_MIGRATION_USERNAME:-fichaje_migrator}
      POSTGRES_PASSWORD: ${DB_MIGRATION_PASSWORD:-kronoqr_local_dev_only_migrator}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
      # Los lee el script de roles. Van aqui y no en el .env del contenedor de
      # la aplicacion porque es este servicio el que los provisiona.
      DB_APP_USERNAME: ${DB_USERNAME:-fichaje_app}
      DB_PASSWORD: ${DB_PASSWORD:-kronoqr_local_dev_only}
      DB_MAINTENANCE_USERNAME: ${DB_MAINTENANCE_USERNAME:-fichaje_maintenance}
      # Sin valor por defecto y a proposito (ADR-027): el rol de mantenimiento
      # se crea sin credencial utilizable. Se le asigna en el servidor del
      # cliente cuando la tarea 2.10 active la purga por retencion.
      DB_MAINTENANCE_PASSWORD: ${DB_MAINTENANCE_PASSWORD:-}
      TZ: UTC
      PGTZ: UTC
      # Destino del WAL archivado. Igual que en produccion para que el
      # simulacro de restauracion se pueda ensayar aqui (tarea 1.18).
      KRONOQR_WAL_ARCHIVE_DIR: ${BACKUP_PATH:-/var/backups/fichaje}/wal
      KRONOQR_WAL_RETENTION_DAYS: ${BACKUP_WAL_RETENTION_DAYS:-8}
    # Regla dura 3: UTC desde el primer arranque, tambien si alguien recrea el
    # volumen con otra configuracion regional en la maquina.
    #
    # Archivado de WAL activo tambien en desarrollo, con UNA diferencia
    # deliberada respecto a produccion: aqui no se fija `archive_timeout`. En
    # produccion vale 900 s y es lo que acota el RPO a 15 minutos (RNF-D-02);
    # en una maquina de desarrollo forzaria un segmento de 16 MiB cada cuarto
    # de hora para nada.
    command:
      - postgres
      - -c
      - timezone=UTC
      - -c
      - log_timezone=UTC
      - -c
      - hba_file=/etc/kronoqr/pg_hba.conf
      - -c
      - wal_level=replica
      - -c
      - archive_mode=on
      - -c
      - archive_command=/usr/local/bin/kronoqr-archive-wal %p %f
    ports:
      # Solo accesible desde la propia maquina de desarrollo.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Volumen propio y no el de copias: lo escribe el usuario postgres y lo
      # lee, en produccion, quien restaura. Ver docs/runbooks/restaurar-backup.md.
      - wal-archive:${BACKUP_PATH:-/var/backups/fichaje}/wal
    networks:
      - app
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  #--- 4 · Redis 7: colas, cache, rate limiting, sesiones ---------------------
  redis:
    image: redis:7-alpine
    container_name: kronoqr-redis
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  #--- 5 · Worker de colas ----------------------------------------------------
  horizon:
    <<: *php-image
    container_name: kronoqr-horizon
    command: ["horizon"]
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    # Sin healthcheck hasta la tarea 0.2: la sonda util es la lista de
    # supervisores de Horizon, y no existe sin aplicacion.

  #--- 6 · WebSocket de presencia en vivo -------------------------------------
  reverb:
    <<: *php-image
    container_name: kronoqr-reverb
    command: ["reverb"]
    expose:
      - "8080"
    depends_on:
      redis:
        condition: service_healthy

  #--- 7 · Reconciliacion, incidencias, retencion, copias ---------------------
  scheduler:
    <<: *php-image
    container_name: kronoqr-scheduler
    command: ["scheduler"]
    depends_on:
      postgres:
        condition: service_healthy

  #--- 8 · Vite del quiosco ---------------------------------------------------
  node-kiosk:
    build:
      context: ..
      dockerfile: infra/docker/node/Dockerfile
    image: kronoqr/node:dev
    container_name: kronoqr-node-kiosk
    environment:
      FRONTEND_NAME: kiosk
    volumes:
      - ../frontend-kiosk:/app
    ports:
      - "127.0.0.1:5173:5173"
    networks:
      - app
    restart: unless-stopped

  #--- 9 · Vite del panel de gestion ------------------------------------------
  node-admin:
    build:
      context: ..
      dockerfile: infra/docker/node/Dockerfile
    image: kronoqr/node:dev
    container_name: kronoqr-node-admin
    environment:
      FRONTEND_NAME: admin
    volumes:
      - ../frontend-admin:/app
    ports:
      - "127.0.0.1:5174:5173"
    networks:
      - app
    depends_on:
      - node-kiosk
    restart: unless-stopped

  #--- 10 · Vite del portal del empleado --------------------------------------
  node-portal:
    build:
      context: ..
      dockerfile: infra/docker/node/Dockerfile
    image: kronoqr/node:dev
    container_name: kronoqr-node-portal
    environment:
      FRONTEND_NAME: portal
    volumes:
      - ../frontend-portal:/app
    ports:
      - "127.0.0.1:5175:5173"
    networks:
      - app
    depends_on:
      - node-kiosk
    restart: unless-stopped

  #--- 11 · Correo de desarrollo ----------------------------------------------
  mailpit:
    image: axllent/mailpit:v1.21
    container_name: kronoqr-mailpit
    environment:
      MP_MAX_MESSAGES: "500"
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    ports:
      - "127.0.0.1:8025:8025"
    networks:
      - app
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://127.0.0.1:8025/readyz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  #--- 12 · Metricas ----------------------------------------------------------
  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: kronoqr-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --web.enable-lifecycle
    volumes:
      - ./observability/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    ports:
      # Nunca 0.0.0.0: Prometheus no se expone a internet.
      - "127.0.0.1:9090:9090"
    networks:
      observability:
        # IP fija dentro de METRICS_ALLOW_CIDR: es el unico origen autorizado a
        # leer /metrics en el borde.
        ipv4_address: 172.29.0.20
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://127.0.0.1:9090/-/healthy || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  #--- 13 · Cuadros de mando --------------------------------------------------
  grafana:
    image: grafana/grafana:11.5.1
    container_name: kronoqr-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-kronoqr_local_dev_only}
      # Grafana no se expone sin autenticacion, ni siquiera en desarrollo: el
      # habito se traslada al servidor del cliente.
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_DATE_FORMATS_DEFAULT_TIMEZONE: utc
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - observability
    depends_on:
      - prometheus
      - loki
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://127.0.0.1:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  #--- 14 · Logs estructurados ------------------------------------------------
  loki:
    image: grafana/loki:3.3.2
    container_name: kronoqr-loki
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ./observability/loki/loki.yaml:/etc/loki/loki.yaml:ro
      - loki-data:/loki
    networks:
      # Tambien en la red de la aplicacion: Monolog empuja los logs desde app,
      # horizon y scheduler (tarea 0.2).
      - app
      - observability
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://127.0.0.1:3100/ready || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  #--- 15 · Metricas de la copia de seguridad y del disco ---------------------
  #
  # node-exporter esta aqui por UNA razon concreta: publicar el resultado de la
  # copia diaria (tarea 1.18). Los scripts escriben ficheros .prom en
  # BACKUP_PATH/metrics y el colector textfile los sirve a Prometheus. Sin
  # esto, el resultado de la copia solo existiria en el log de un cron que no
  # lee nadie, que es exactamente como se descubre a fin de mes que no habia
  # copias.
  node-exporter:
    image: prom/node-exporter:v1.9.1
    container_name: kronoqr-node-exporter
    # Con el mismo uid que escribe las copias, y no como el `nobody` de la
    # imagen. El arbol de copias es 0750 —dentro hay datos personales
    # cifrados— y no se le abren permisos a todo el mundo para que un
    # exportador pueda leer un fichero de metricas: se le da el uid justo.
    user: "1000:1000"
    command:
      # Solo lo que se usa: el resto de colectores del anfitrion no aportan
      # nada dentro de un contenedor y son ruido en la base de metricas.
      - --collector.disable-defaults
      - --collector.textfile
      - --collector.textfile.directory=/var/backups/metrics
      - --web.listen-address=:9100
    volumes:
      # Solo lectura: quien publica las metricas es la copia, no el exportador.
      - backup-data:/var/backups:ro
    networks:
      - observability
    restart: unless-stopped
    # Sin puertos publicados: /metrics no se expone fuera de la red interna.

networks:
  app:
    name: kronoqr-app
    ipam:
      config:
        - subnet: 172.28.0.0/16
  observability:
    name: kronoqr-observability
    ipam:
      config:
        - subnet: 172.29.0.0/24

volumes:
  # Dependencias de PHP fuera del bind mount. El motivo, medido, esta junto al
  # montaje en x-php-image.
  backend-vendor:
  postgres-data:
  redis-data:
  prometheus-data:
  grafana-data:
  loki-data:
  nginx-certs:
  # Copias cifradas, sus metricas y los informes de restauracion. En produccion
  # esto es un disco del cliente montado en la misma ruta (regla dura 16: la
  # copia no sale de su infraestructura).
  backup-data:
  # WAL archivado. Separado del anterior porque lo escribe el usuario postgres
  # y porque su ciclo de vida es otro: se purga por dias, no por copias.
  wal-archive:
