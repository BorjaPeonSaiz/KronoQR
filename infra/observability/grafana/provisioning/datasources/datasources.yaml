# KronoQR — fuentes de datos de Grafana, provisionadas como codigo.
# Nadie las crea a mano en la interfaz: un cuadro de mando que depende de una
# fuente configurada a mano no sobrevive a una reinstalacion.

apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: kronoqr-prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      timeInterval: 15s
      httpMethod: POST

  - name: Loki
    type: loki
    uid: kronoqr-loki
    access: proxy
    url: http://loki:3100
    jsonData:
      maxLines: 1000
      # Enlaza el log con su traza: el trace_id viaja en el contexto de cada
      # linea JSON de Monolog (§8.1).
      # El enlace a la traza se completa en la tarea 3.1, cuando exista el
      # exportador OTLP y una fuente de datos de trazas a la que apuntar.
      derivedFields:
        - name: trace_id
          matcherRegex: '"trace_id":"([a-f0-9-]+)"'
