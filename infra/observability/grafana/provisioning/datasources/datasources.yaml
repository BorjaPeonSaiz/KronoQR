# KronoQR — fuentes de datos de Grafana, provisionadas como codigo.
# Nadie las crea a mano en la interfaz: un cuadro de mando que depende de una
# fuente configurada a mano no sobrevive a una reinstalacion.

apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: kronoqr-prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      timeInterval: 15s
      httpMethod: POST

  - name: Loki
    type: loki
    uid: kronoqr-loki
    access: proxy
    url: http://loki:3100
    jsonData:
      maxLines: 1000
      # Enlaza el log con su traza: el trace_id viaja en el contexto de cada
      # linea JSON de Monolog (§8.1). Con Tempo ya provisionado (tarea 3.1),
      # el enlace queda completo: desde una linea de log en Loki se puede
      # saltar directamente a la traza en Tempo que la produjo, que es lo que
      # permite responder a «el empleado dice que fichó a las 07:02» siguiendo
      # el scan_id por Loki y el trace_id por Tempo.
      derivedFields:
        - name: trace_id
          matcherRegex: '"trace_id":"([a-f0-9-]+)"'
          datasourceUid: kronoqr-tempo
          url: '$${__value.raw}'

  - name: Tempo
    type: tempo
    uid: kronoqr-tempo
    access: proxy
    url: http://tempo:3200
    jsonData:
      # De una traza hacia atras, a los logs que comparten su trace_id: el
      # camino inverso al derivedField de Loki de arriba.
      tracesToLogsV2:
        datasourceUid: kronoqr-loki
        spanStartTimeShift: -1m
        spanEndTimeShift: 1m
        filterByTraceID: true
        customQuery: false
      # Compatibilidad con paneles que todavia esperan el formato anterior.
      tracesToLogs:
        datasourceUid: kronoqr-loki
        spanStartTimeShift: -1m
        spanEndTimeShift: 1m
        filterByTraceID: true
