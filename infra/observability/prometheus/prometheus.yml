# KronoQR — configuracion base de Prometheus (doc 02 §8.1).
#
# El catalogo completo de alertas del doc 01 §9.3 es de la tarea 3.2. Lo que ya
# vive en rules/ son las de la copia de seguridad (tarea 1.18), porque la copia
# existe desde la Fase 1 y una copia que falla sin avisar es indistinguible de
# no tener copias.

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  # La etiqueta de instalacion (una por cliente, ADR-016) la anade la tarea 3.2
  # junto con el catalogo de alertas: sin reglas que la usen no aporta nada y
  # obligaria a activar una feature flag de Prometheus desde el primer dia.

rule_files:
  - /etc/prometheus/rules/*.yml

# Alertmanager, ya conectado: desde la tarea 1.18 hay reglas que encaminar.
#
# En desarrollo no existe el servicio 'alertmanager' (solo esta en
# compose.prod.yaml) y Prometheus lo dice en su log una vez cada intervalo. Es
# ruido conocido y aceptado: la alternativa —dos ficheros de configuracion, uno
# por entorno— acaba con reglas que solo se prueban en produccion.
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]

  # Metricas de la aplicacion (§8.2). Se leen a traves del borde, que restringe
  # /metrics a METRICS_ALLOW_CIDR: Prometheus es el unico origen autorizado.
  #
  # En la Fase 0 este objetivo aparece DOWN y es correcto: la aplicacion
  # Laravel que expone /metrics llega en la tarea 0.2 y la instrumentacion, en
  # la 3.1.
  - job_name: kronoqr-api
    metrics_path: /metrics
    scheme: http
    static_configs:
      - targets: ["nginx:8080"]
        labels:
          service: api

  # Resultado de la copia de seguridad, de su verificacion y del simulacro de
  # restauracion (tarea 1.18), mas el espacio en disco del servidor.
  #
  # Las escriben los scripts de infra/scripts en BACKUP_PATH/metrics y las sirve
  # el colector textfile de node-exporter. Se recogen cada minuto y no cada 15
  # segundos: son ficheros que cambian una vez al dia, y sondearlos mas a
  # menudo solo engorda la base de metricas.
  #
  # EL NOMBRE DEL TRABAJO SE HA QUEDADO CORTO Y ES DEUDA CONOCIDA. Desde la
  # tarea 2.4, el mismo colector textfile sirve tambien open_shifts_current y
  # websocket_connections_active (§8.2), que no tienen nada que ver con las
  # copias y aun asi heredan la etiqueta service="backup". Es cosmetico —ninguna
  # regla de alerta usa esa etiqueta, todas casan por nombre de metrica— pero
  # confunde en Grafana. Renombrarlo aqui exige tocar tests/Architecture/
  # BackupAndAlertingTest.php, que afirma `job_name: kronoqr-backup` como
  # garantia de la Fase 1: lo hace devops-observabilidad al montar el catalogo
  # de alertas de la tarea 3.2, no una tarea de panel.
  - job_name: kronoqr-backup
    scrape_interval: 60s
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          service: backup

  # Sonda de uptime (tarea 3.1, §8.1): comprueba desde FUERA del proceso que
  # el borde responde, en vez de confiar solo en que /metrics siga sirviendo
  # series. blackbox-exporter hace la peticion real por nosotros y publica
  # `probe_success` y `probe_duration_seconds`.
  #
  # POR TLS, CONTRA EL PUERTO 8443, NUNCA POR EL 8080. El 8080 lo publica el
  # host como HTTP_PORT (compose.prod.yaml) y no lleva `limit_req`: sondear
  # ahi habria dejado /api/v1/health y /api/v1/ready alcanzables sin cuota
  # desde cualquiera que llegue al puerto 80, justo lo que las reglas duras 15
  # y 19 prohiben. Sondeando por 8443 la peticion entra por `location ^~
  # /api/` del bloque 443 de kronoqr.conf.template y pasa por
  # `limit_req zone=api`, igual que cualquier otro cliente HTTPS.
  #
  # `insecure_skip_verify: true` (modulo `http_2xx_tls` de blackbox.yml) es
  # aceptable aqui: la peticion viaja dentro de la red de contenedores, el
  # certificado que sirve `nginx` es el del dominio del hotel (no el de
  # `nginx`), y lo que esta sonda comprueba es DISPONIBILIDAD (¿responde
  # 200?), no identidad del servidor.
  #
  # Relabelling estandar de blackbox: el objetivo de verdad (la URL a sondear)
  # va como parametro `target` de /probe, y el nombre visible en Grafana
  # (`instance`) pasa a ser esa URL y no la IP del propio blackbox-exporter.
  #
  # ES EL MISMO EXPORTADOR QUE USARA LA TAREA 3.2 para «certificado TLS
  # proximo a expirar» (`probe_ssl_earliest_cert_expiry`, modulo
  # `http_2xx_tls` de blackbox/blackbox.yml): al sondear ya por HTTPS, esa
  # metrica sale gratis de esta misma peticion — no hace falta levantar un
  # segundo contenedor ni anadir una sonda para esa alerta.
  - job_name: kronoqr-uptime
    metrics_path: /probe
    params:
      module: [http_2xx_tls]
    scrape_interval: 30s
    static_configs:
      - targets:
          - https://nginx:8443/api/v1/health
          - https://nginx:8443/api/v1/ready
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
