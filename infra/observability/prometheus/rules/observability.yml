# KronoQR — alertas de la propia pila de observabilidad (bloque 9 de la 2.3.0,
# V21-4-DV-4).
#
# LOKI. Su imagen (3.7) no trae shell ni `wget`, asi que su servicio no puede
# llevar `healthcheck` y `docker compose ps` no sabe decir si responde. Lo
# pregunta blackbox-exporter por la red interna (`/ready`, job `kronoqr-loki`,
# modulo `http_2xx_internal`) y esta regla convierte la respuesta en un aviso.
#
# QUE SE PIERDE SI LOKI CAE. Los registros tecnicos de `app`, `horizon` y
# `scheduler` (el empuje de Monolog falla en silencio, regla dura 15: el logging
# nunca bloquea el fichaje), y con ellos el rastro con el que se diagnostica
# todo lo demas. NO se pierde el fichaje, ni el registro horario ni la
# auditoria (`audit_log` es una tabla, no un log). Por eso `warning` y no
# `high`: es urgente porque cada hora caido es una hora sin diagnostico, no
# porque el hotel deje de funcionar.
#
# `component: host`: Loki se reinicia con `update.sh` y entra en la ventana de
# mantenimiento y en la inhibicion de `VentanaDeMantenimientoActiva` sin tocar
# ni el enrutado ni la lista de componentes silenciables.
#
# Si Prometheus mismo no estuviera, esta regla no existe: lo cubre
# `EnrutadoDeAlertasCaido` para Alertmanager y `doctor.sh` para el resto.
groups:
  - name: kronoqr-observability
    interval: 60s
    rules:
      - alert: LokiSinRespuesta
        expr: probe_success{job="kronoqr-loki"} == 0
        for: 10m
        labels:
          severity: warning
          destinatario: it-cliente
          component: host
        annotations:
          summary: "Loki no responde: los registros tecnicos no se estan guardando"
          description: >-
            La sonda interna de Loki (/ready) falla desde hace 10 min. Mientras
            tanto los registros de la aplicacion no llegan a ninguna parte y el
            rastro para diagnosticar un incidente se pierde. El fichaje, el
            registro horario y la auditoria no se ven afectados.
          runbook_url: docs/runbooks/loki-sin-respuesta.md
