# KronoQR — alertas de incidencias del registro horario (doc 01 §9.3, RF-PR-01).
#
# Fila del catalogo del doc 01 §9.3 que implementa este fichero:
#
#   | Turnos abiertos > 12 h | cualquiera | Media | RRHH | turno-abierto-prolongado.md |
#
# «Cualquiera» como umbral es literal: una sola persona con el turno sin cerrar
# es una jornada que no se puede pagar ni defender tal como esta. No es una
# tendencia que se vigile por percentiles.
#
# DESTINATARIO: RRHH, no el IT del cliente. Lo fija el criterio del doc 01 §9.3
# —«Media → RRHH. No es un fallo tecnico: es trabajo de gestion sobre el
# registro»— y la consecuencia practica es la que importa: el IT no puede
# resolver esto. La correccion la firma una persona con el mecanismo trazado de
# RF-PA-04, y el sistema NUNCA cierra el turno por su cuenta (RN-08).
#
# IMPACTO EN EL FICHAJE: NINGUNO. Quien tiene el turno abierto puede seguir
# fichando; de hecho, su proximo escaneo lo cerrara. La alerta no describe una
# averia, describe trabajo pendiente.
#
# Las metricas las escribe `php artisan compliance:incident-metrics` (cada cinco
# minutos) en BACKUP_PATH/metrics, y las sirve node-exporter por el colector
# textfile.
#
# DOS REGLAS MAS, DE LA TAREA 3.2 (deuda de la Fase 2: los comandos de
# madrugada fallaban sin que nada lo dijera mas alla del log del planificador).
# `DeteccionDeIncidenciasConFallos` vigila que `attendance:detect-incidents`
# no deje hallazgos sin convertir en incidencia; `DeteccionDeIncidenciasAusente`
# vigila que el comando se siga ejecutando — sin ella, la alerta de turnos
# abiertos de aqui arriba es CIEGA: si nadie detecta, nadie encuentra turnos
# que avisar.
#
# DOS REGLAS MAS, DE LA TAREA 3.11 (deteccion de patrones anomalos de uso de
# credencial, RF-PR-06/RN-16): `DeteccionDePatronesConFallos` y
# `DeteccionDePatronesAusente` son las mismas dos hermanas de arriba, calcadas,
# para `attendance:detect-patterns` (04:35 UTC, entre `detect-incidents` a las
# 04:30 y `compliance:incident-metrics` a las 04:45). IMPORTANTE, decision 9 de
# la ficha 3.11: los HALLAZGOS de patrones (`anomalous_patterns_detected_total`)
# NO llevan alerta a proposito. Un indicio de posible prestamo de credencial
# senala a dos personas concretas y se revisa en la bandeja de incidencias por
# quien conoce el turno (el responsable del departamento), no se enruta a un
# canal de guardia como si fuera una averia. Lo que SI es operacion, y por eso
# SI alerta, es que la pasada de anoche no corra o deje algo sin abrir: eso es
# indistinguible de "no hay ningun patron", y sin estas dos reglas nadie lo
# notaria hasta que alguien fuera a buscar un indicio a mano y no lo encontrara.

groups:
  - name: kronoqr-incidents
    interval: 60s
    rules:
      #------------------------------------------------------------------------
      # Hay al menos un turno abierto por encima del maximo configurado.
      #
      # `for: 15m` y no `0s`: el gauge se recalcula cada cinco minutos y una
      # incidencia recien abierta se resuelve muchas veces sola —la persona
      # ficha la salida y la correccion la cierra—. Quince minutos evitan
      # despertar a RRHH por algo que ya no esta.
      #------------------------------------------------------------------------
      - alert: TurnoAbiertoProlongado
        expr: incidents_open{type="open_shift_expired"} > 0
        for: 15m
        labels:
          severity: warning
          destinatario: rrhh
          component: incidents
        annotations:
          summary: "Hay {{ $value }} turno(s) abierto(s) por encima del maximo configurado"
          description: >-
            La revision diaria ha encontrado tramos que siguen abiertos despues
            de superar ATTENDANCE_MAX_SHIFT_HOURS. El sistema NO los cierra
            (RN-08): la salida real la fija una persona con una correccion
            trazada. El fichaje no esta afectado y nadie se ha quedado sin poder
            fichar.
          runbook_url: docs/runbooks/turno-abierto-prolongado.md

      #------------------------------------------------------------------------
      # Un incumplimiento del descanso minimo entre jornadas (RN-10, art. 34.3
      # ET). Severidad mas alta que la anterior y por un motivo concreto: es la
      # unica de las dos con consecuencia sancionadora, y ya ha ocurrido — no se
      # puede evitar, solo documentar y corregir la planificacion.
      #------------------------------------------------------------------------
      - alert: DescansoEntreJornadasInsuficiente
        expr: incidents_open{type="insufficient_rest"} > 0
        for: 15m
        labels:
          severity: warning
          destinatario: rrhh
          component: incidents
        annotations:
          summary: "Hay {{ $value }} jornada(s) con el descanso minimo por debajo del perfil"
          description: >-
            Entre el fin de una jornada y el inicio de la siguiente han mediado
            menos horas que el minimo del perfil de cumplimiento (RN-10). Es un
            hecho ya ocurrido: lo que se hace con el es revisar el cuadrante y
            dejar constancia, no cerrar la incidencia sin mirarla.
          runbook_url: docs/runbooks/turno-abierto-prolongado.md

      #------------------------------------------------------------------------
      # El silencio. Sin esta regla, apagar la tarea programada seria la forma
      # mas comoda de que las dos alertas de arriba no volvieran a sonar nunca.
      #------------------------------------------------------------------------
      - alert: MetricaDeIncidenciasAusente
        expr: >-
          absent(incidents_metrics_timestamp_seconds)
          or (time() - incidents_metrics_timestamp_seconds) > 1800
        for: 30m
        labels:
          severity: warning
          destinatario: it-cliente
          component: incidents
        annotations:
          summary: "El recuento de incidencias lleva mas de 30 minutos sin actualizarse"
          description: >-
            `compliance:incident-metrics` deberia reescribir el fichero del
            colector textfile cada cinco minutos. Si no lo hace, las alertas de
            incidencias estan ciegas: no distinguen «no hay ninguna» de «nadie
            esta contando». Esta si es para el IT del cliente, porque lo que
            falla es el planificador, no el registro.
          runbook_url: docs/runbooks/turno-abierto-prolongado.md

      #------------------------------------------------------------------------
      # Tarea 3.2, deuda de la Fase 2: `attendance:detect-incidents` puede
      # terminar con codigo distinto de cero cuando un hallazgo no se pudo
      # convertir en incidencia, y hasta ahora ese fallo no llegaba a ninguna
      # parte salvo al log del planificador. `incident_detection_last_failures`
      # es el gauge de la ULTIMA pasada (TextfileIncidentDetectionMetrics):
      # "¿la deteccion de anoche dejo algo sin hacer?", no un acumulado.
      #------------------------------------------------------------------------
      - alert: DeteccionDeIncidenciasConFallos
        expr: incident_detection_last_failures > 0
        for: 5m
        labels:
          severity: high
          destinatario: it-cliente
          component: incidents
        annotations:
          summary: "La deteccion de incidencias de anoche dejo {{ $value }} hallazgo(s) sin convertir"
          description: >-
            `attendance:detect-incidents` encontro al menos un hallazgo que
            no pudo convertir en incidencia. El fichaje no esta afectado; lo
            que esta en riesgo es que un turno abierto o un descanso
            insuficiente no llegue a generar la incidencia que RRHH tendria
            que revisar. El detalle esta en el log tecnico: una linea
            `scheduler.command_failed` con el codigo de salida y una
            `attendance.incident_not_opened` por hallazgo, con employee_uuid y
            la clase de la excepcion. NO esperes verlo en error_events: con
            runInBackground() el planificador no convierte el codigo de salida
            en excepcion; solo entra ahi si la propia pasada lanzo una. El
            runbook del historico explica como leer las dos cosas.
          runbook_url: docs/runbooks/errores-en-el-panel.md

      #------------------------------------------------------------------------
      # El silencio de la deteccion, no del recuento: sin esta regla, que el
      # planificador deje de ejecutar attendance:detect-incidents deja CIEGA
      # a TurnoAbiertoProlongado y a DescansoEntreJornadasInsuficiente, que
      # dependen de que algo haya detectado el hallazgo primero.
      #------------------------------------------------------------------------
      - alert: DeteccionDeIncidenciasAusente
        expr: >-
          absent(incident_detection_last_run_timestamp_seconds)
          or (time() - incident_detection_last_run_timestamp_seconds) > 93600
        for: 30m
        labels:
          severity: warning
          destinatario: it-cliente
          component: incidents
        annotations:
          summary: "Hace mas de 26 h que no se ejecuta la deteccion de incidencias"
          description: >-
            attendance:detect-incidents deberia correr a diario. Si no lo
            hace, las alertas de turnos abiertos y descanso insuficiente no
            ven nada nuevo aunque el problema exista: no distinguen «no hay
            ninguna incidencia» de «nadie la ha buscado todavia».
          runbook_url: docs/runbooks/turno-abierto-prolongado.md

      #------------------------------------------------------------------------
      # Tarea 3.11: `attendance:detect-patterns` (04:35 UTC) puede terminar con
      # codigo de salida distinto de cero cuando un hallazgo de patron
      # (kiosk_coincidence o impossible_sequence) no se pudo convertir en
      # incidencia `anomalous_pattern`. `pattern_detection_last_failures` es el
      # gauge de la ULTIMA pasada (mismo patron que
      # `incident_detection_last_failures`), publicado por textfile
      # (kronoqr_pattern_detection.prom).
      #
      # Esta alerta NO es sobre el hallazgo en si (eso no alerta, decision 9 de
      # la ficha 3.11): es sobre que la deteccion de anoche se quedo algo sin
      # abrir, que es operacion del IT del cliente, no revision de RRHH.
      #------------------------------------------------------------------------
      - alert: DeteccionDePatronesConFallos
        expr: pattern_detection_last_failures > 0
        for: 5m
        labels:
          severity: high
          destinatario: it-cliente
          component: incidents
        annotations:
          summary: "La deteccion de patrones anomalos de anoche dejo {{ $value }} hallazgo(s) sin convertir"
          description: >-
            attendance:detect-patterns encontro al menos un hallazgo
            (kiosk_coincidence o impossible_sequence) que no pudo convertir en
            incidencia anomalous_pattern. El fichaje no esta afectado; lo que
            esta en riesgo es que un indicio de posible prestamo de
            credencial no llegue a la bandeja para que el responsable lo
            revise. El detalle esta en el log tecnico
            (attendance.pattern_detection, con recuentos y nunca personas).
          runbook_url: docs/runbooks/patron-anomalo-credencial.md

      #------------------------------------------------------------------------
      # El silencio de la deteccion de patrones, no del recuento: sin esta
      # regla, que el planificador deje de ejecutar attendance:detect-patterns
      # es indistinguible de "no hay ningun patron anomalo que revisar", y esa
      # es exactamente la contrapartida que el descarte de la biometria
      # (ADR-009, regla dura 20) necesita para seguir siendo defendible.
      #------------------------------------------------------------------------
      - alert: DeteccionDePatronesAusente
        expr: >-
          absent(pattern_detection_last_run_timestamp_seconds)
          or (time() - pattern_detection_last_run_timestamp_seconds) > 93600
        for: 30m
        labels:
          severity: warning
          destinatario: it-cliente
          component: incidents
        annotations:
          summary: "Hace mas de 26 h que no se ejecuta la deteccion de patrones anomalos"
          description: >-
            attendance:detect-patterns deberia correr a diario. Si no lo hace,
            un posible prestamo de credencial (dos fichajes consecutivos en el
            mismo quiosco, coincidencias sistematicas entre dos personas,
            secuencias imposibles de RN-16) no llega a la bandeja aunque este
            ocurriendo: no se distingue «no hay ningun patron» de «nadie lo ha
            buscado todavia».
          runbook_url: docs/runbooks/patron-anomalo-credencial.md
