# KronoQR — plantilla: la tarea que aplica las bajas programadas (RN-14, ADR-062 §4).
#
# `workforce:apply-scheduled-offboardings` corre cada hora y aplica cada baja
# programada el dia civil siguiente a su cese, o como mucho al empezar el segundo
# (el tope del aplazamiento por un turno de noche o una pausa del ultimo dia). Al
# terminar cada pasada publica `kronoqr_scheduled_offboardings_overdue`: las bajas
# programadas cuyo cese paso hace mas de un dia y siguen sin aplicar. Con la tarea
# sana vale 0 siempre; en el tope puede valer mas durante la hora que tarda la
# pasada siguiente, y por eso la espera es de dos horas.
#
# NADIE FICHA DESPUES DEL CESE mientras tanto: la regla de las jornadas no depende
# de la tarea. Lo que queda a medias es lo que la tarea hace: las tarjetas siguen
# activas, el portal abierto y el asiento employee.offboarded sin escribir. Por eso
# es Media y va al IT: la causa es la tarea (que falla o no corre), no RRHH.
#
# La serie la sirve la aplicacion por /metrics (Redis), sin etiquetas que
# identifiquen a nadie. Con Redis caido desaparece en vez de saltar: lo vigila
# AlmacenDeMetricasCaido.

groups:
  - name: kronoqr-workforce
    interval: 60s
    rules:
      - alert: ScheduledOffboardingOverdue
        expr: kronoqr_scheduled_offboardings_overdue > 0
        for: 2h
        labels:
          severity: warning
          destinatario: it-cliente
          component: workforce
        annotations:
          summary: "Hay {{ $value }} baja(s) programada(s) sin aplicar mas de un dia despues de su cese"
          description: >-
            La tarea workforce:apply-scheduled-offboardings no ha podido hacer
            efectiva una baja programada pasado su tope. Nadie ha fichado despues
            del cese, pero sus tarjetas siguen activas y falta el asiento
            employee.offboarded. Busca workforce.scheduled_offboarding_failed en
            el log, lanza la tarea a mano (repetirla es seguro) y comprueba que el
            planificador esta en marcha.
          runbook_url: docs/runbooks/turno-abierto-prolongado.md
