# KronoQR — alertas de caducidad del certificado TLS (doc 01 §9.3, tarea 3.2).
#
# Fila del catalogo del doc 01 §9.3 que implementa este fichero:
#
#   | Certificado TLS proximo a expirar | < 21 dias | Alta |
#
# LA METRICA. `probe_ssl_earliest_cert_expiry` sale GRATIS de la sonda de
# uptime que ya existe desde la tarea 3.1 (`job: kronoqr-uptime`,
# `prometheus.yml`): blackbox-exporter sondea `/api/v1/health` y
# `/api/v1/ready` por HTTPS contra el puerto 8443 (modulo `http_2xx_tls`,
# `blackbox/blackbox.yml`) y, de paso, mide cuando caduca el certificado que
# sirve esa conexion. No hace falta un contenedor ni una sonda nueva: es la
# razon de que `blackbox.yml` ya avisara de esto en su cabecera desde la 3.1.
#
# `min(...)`: hay dos instancias sondeadas (`/health` y `/ready`), las dos
# contra el MISMO certificado del borde. Sin agregar, la misma caducidad
# produciria dos alertas identicas; con `min`, una — y si alguna vez el borde
# sirviera dos certificados distintos, la que caduca antes es la que importa.
#
# DESTINATARIO: IT del cliente. Es quien gestiona el certificado del servidor
# (autofirmado o de una CA, doc 02 §3.4) y quien puede renovarlo.
#
# IMPACTO EN EL FICHAJE SI NADIE ACTUA: TOTAL. Un certificado caducado hace
# que el navegador del quiosco (y cualquier cliente que valide la cadena)
# rechace la conexion HTTPS entera: no es un endpoint fallando, es el borde
# entero inalcanzable. 21 dias de aviso es deliberadamente largo para que
# renovar nunca sea una emergencia de madrugada.
groups:
  - name: kronoqr-tls
    interval: 1h
    rules:
      #------------------------------------------------------------------------
      # Aviso temprano: menos de 21 dias para la caducidad. `for: 1h` porque el
      # margen es de dias, no de minutos: no hace falta reaccionar a la
      # primera evaluacion, y evita que un scrape con el certificado a medio
      # leer dispare la alerta un ciclo antes de tiempo.
      #
      # `and ... >= 0` (decision 17h): sin esta segunda mitad, un certificado
      # YA CADUCADO (diferencia negativa) tambien es "< 21 dias" y esta alerta
      # sigue disparando A LA VEZ que `CertificadoTlsCaducado` -dos alertas de
      # severidad distinta por el mismo hecho, y la de "Alta" sonando junto a
      # la de "Critica" resta urgencia a la que de verdad la tiene-. Con el
      # `>= 0`, esta regla se apaga en el instante en que el certificado
      # caduca y `CertificadoTlsCaducado` toma el relevo en solitario.
      #------------------------------------------------------------------------
      - alert: CertificadoTlsProximoACaducar
        expr: >-
          min(probe_ssl_earliest_cert_expiry) - time() < 21 * 86400
          and min(probe_ssl_earliest_cert_expiry) - time() >= 0
        for: 1h
        labels:
          severity: high
          destinatario: it-cliente
          component: tls
        annotations:
          summary: "El certificado TLS del borde caduca en menos de 21 dias"
          description: >-
            La sonda de disponibilidad mide que el certificado que sirve
            /api/v1/health y /api/v1/ready caduca en menos de 21 dias. El
            fichaje sigue funcionando hoy con normalidad: esto es tiempo para
            renovarlo con calma, no una averia. Si caduca, el quiosco (y
            cualquier navegador) dejara de poder conectar por HTTPS.
          runbook_url: docs/runbooks/renovacion-certificado-tls.md

      #------------------------------------------------------------------------
      # El certificado YA ha caducado. Critica y con `for` corto: aqui si
      # importan los minutos.
      #------------------------------------------------------------------------
      - alert: CertificadoTlsCaducado
        expr: min(probe_ssl_earliest_cert_expiry) - time() < 0
        for: 5m
        labels:
          severity: critical
          destinatario: it-cliente
          component: tls
        annotations:
          summary: "El certificado TLS del borde ha caducado"
          description: >-
            El certificado que sirve el borde HTTPS ya no es valido. Los
            navegadores y las tablets del quiosco rechazaran la conexion:
            este es el escenario que la alerta de 21 dias existia para
            evitar. Renueva el certificado de inmediato.
          runbook_url: docs/runbooks/renovacion-certificado-tls.md

  #----------------------------------------------------------------------------
  # SEGUNDO GRUPO: LA VALIDEZ DEL CERTIFICADO, NO SU FECHA (tarea 3.8, hallazgo
  # H-05 de docs/seguridad/revision-interna-asvs-2026-09.md). Las dos reglas de
  # arriba viven de `probe_ssl_earliest_cert_expiry`, que sale de
  # `kronoqr-uptime` (modulo `http_2xx_tls`, `insecure_skip_verify: true`): esa
  # sonda mide FECHA, nunca IDENTIDAD, y a proposito — el nombre `nginx` nunca
  # coincide con el certificado del hotel. Una cadena incompleta, un
  # certificado sustituido por otro de emisor distinto, o un nombre que dejo
  # de coincidir con `APP_URL` tras un cambio de dominio, NO son "fecha": son
  # exactamente lo que esta regla vigila.
  #
  # LA METRICA: `probe_success{job="kronoqr-uptime-tls-verified"}`, del
  # segundo job de `prometheus.yml.template` (modulo `http_2xx_tls_verified`,
  # `insecure_skip_verify: false`, `blackbox/blackbox.yml`). Ese job SOLO
  # existe cuando la instalacion configuro `APP_URL` y NO declaro
  # `TLS_ALLOW_SELF_SIGNED=true` (`render-config.sh`): sin la serie, esta regla
  # no tiene nada que evaluar y no dispara — la forma en que se tolera el modo
  # autofirmado declarado a proposito sin fingir una verificacion que nunca
  # podria pasar (decision de la tarea 3.8; ver la cabecera de
  # `blackbox/blackbox.yml` para el razonamiento completo).
  #
  # POR QUE TRES CONDICIONES A LA VEZ, Y NO SOLO "el probe verificado fallo".
  # Sin las otras dos, esta alerta duplicaria las dos de arriba:
  #
  #   1. `min(probe_success{job="kronoqr-uptime-tls-verified"}) == 0` — la
  #      conexion CON verificacion de identidad activa ha fallado.
  #   2. `and on() min(probe_success{job="kronoqr-uptime"}) == 1` — el borde
  #      SI responde por HTTPS desde dentro de la red de contenedores. Sin
  #      esto, un servidor completamente caido (Nginx parado, red del hotel
  #      cortada) haria fallar TAMBIEN el probe verificado, y esta alerta
  #      sonaria a la vez que `SondaDelBordeFallida` por el mismo hecho: el
  #      borde caido, no un certificado no verificable.
  #   3. `and on() (min(probe_ssl_earliest_cert_expiry) - time() >= 0)` — el
  #      certificado, por fecha, TODAVIA no ha caducado. Un certificado
  #      caducado tambien falla la verificacion de cadena (Go trata la
  #      caducidad como un error de verificacion mas), asi que sin esta
  #      condicion un certificado caducado encenderia esta alerta A LA VEZ que
  #      `CertificadoTlsCaducado` — la misma emergencia contada dos veces, el
  #      mismo problema que la decision 17(h) ya resolvio entre las dos reglas
  #      de arriba.
  #
  # `and on()`: los tres lados son vectores de un solo elemento sin etiquetas
  # (tras `min(...)`), asi que `on()` los empareja sin comparar ninguna
  # etiqueta — lo que se necesita para combinar series de jobs distintos con
  # nombres de instancia distintos.
  #
  # DESTINATARIO: IT del cliente, igual que las dos alertas de arriba (doc 01
  # §9.3: gestiona el certificado del servidor). SEVERIDAD: critica, igual que
  # `CertificadoTlsCaducado` y no que la de "proximo a caducar": el impacto
  # para quien llega por `APP_URL` desde fuera es el mismo aviso de conexion
  # no segura del navegador, hoy, no dentro de 21 dias.
  #----------------------------------------------------------------------------
  - name: kronoqr-tls-verificado
    interval: 5m
    rules:
      - alert: CertificadoTlsNoVerificable
        expr: >-
          min(probe_success{job="kronoqr-uptime-tls-verified"}) == 0
          and on() min(probe_success{job="kronoqr-uptime"}) == 1
          and on() (min(probe_ssl_earliest_cert_expiry) - time() >= 0)
        for: 15m
        labels:
          severity: critical
          destinatario: it-cliente
          component: tls
        annotations:
          summary: "El certificado TLS del borde no verifica contra APP_URL (cadena, nombre o emisor)"
          description: >-
            La sonda que SI valida identidad (contra APP_URL, con
            insecure_skip_verify: false) no logra establecer una conexion de
            confianza, y no es por caducidad (esa la cubren las dos alertas
            de arriba) ni porque el borde este caido (responde por HTTPS
            desde dentro de la red de contenedores). Revisa la cadena
            completa del certificado (faltan los intermedios), quien lo
            emitio, y si el nombre (CN/SAN) sigue coincidiendo con APP_URL:
            un navegador real vera exactamente este mismo rechazo.
          runbook_url: docs/runbooks/renovacion-certificado-tls.md
