# KronoQR — alertas RED del endpoint de fichaje (doc 01 §9.3, tarea 3.2).
#
# Filas del catalogo del doc 01 §9.3 que implementa este fichero:
#
#   | Tasa de error 5xx en el endpoint de fichaje | > 1 % en 5 min  | Critica |
#   | Latencia p95 del endpoint de fichaje        | > 500 ms en 10m | Alta    |
#
# LAS METRICAS. `http_requests_total{route,method,status}` y
# `http_request_duration_seconds{route,method,status}` las escribe
# `RecordHttpMetrics` (regla dura 21: la etiqueta `route` es el NOMBRE de la
# ruta con nombre de Laravel, nunca la URI — cardinalidad de decenas, no de
# UUIDs). "El endpoint de fichaje" son TRES rutas con nombre —
# `attendance.scan`, `attendance.scan.batch`, `attendance.scan.pin`—: el
# escaneo simple, el envio en lote de la cola offline y el PIN de respaldo
# (RF-AT-11). Las tres comparten el mismo presupuesto de latencia (RNF-P-02) y
# el mismo impacto si fallan, asi que la expresion las agrupa con
# `route=~"attendance\\.scan(\\..*)?"` en vez de triplicar la regla.
#
# `for: 1m` y no `5m`: la ventana de agregacion (5 min para la tasa de error,
# 10 min para la latencia) ya suaviza el ruido de un solo scrape; el `for`
# solo evita que una evaluacion aislada con datos a medio escribir dispare la
# alerta un ciclo antes de que la ventana la habria descartado sola — el mismo
# criterio que `auth.yml` y `errors.yml` aplican a sus propias ventanas
# deslizantes.
#
# LA TERCERA REGLA, FUERA DEL CATALOGO Y JUSTIFICADA. `SondaDelBordeFallida`
# no esta en la tabla del §9.3, pero sin ella la regla de 5xx tiene un punto
# ciego: si NADA llega a PHP-FPM —Nginx caido, el borde sin certificado, la
# red del hotel cortada—, `http_requests_total` no crece, la proporcion de
# 5xx es 0/0 (indefinida, no dispara) y el fichaje puede estar completamente
# parado sin que ninguna alerta lo diga. `probe_success` viene de la sonda de
# uptime de la tarea 3.1 (blackbox-exporter contra `/api/v1/health` y
# `/api/v1/ready` POR TLS, `prometheus.yml`, job `kronoqr-uptime`): una
# peticion real desde fuera del proceso, que tambien suena cuando `/ready`
# dice que la base de datos o Redis no responden. Apunta al mismo runbook
# porque el sintoma que ve quien recibe la alerta es el mismo: "el fichaje va
# lento o no responde".
#
# DESTINATARIO: IT del cliente en las tres. Es quien opera el servidor, la
# base de datos y el borde; el runbook `errores-en-el-panel.md` ya las lista
# en su tabla de sintomas (tarea 5.12) y aqui es donde nacen las reglas.
#
# `SondaDelBordeFallida` SOLO MIRA `job="kronoqr-uptime"` (tarea 3.8, correccion
# necesaria para H-05). Desde que existe un segundo job de sonda
# (`kronoqr-uptime-tls-verified`, `prometheus.yml.template`, la sonda que SI
# verifica el certificado), `probe_success` sin filtrar por `job` tambien casa
# con ese segundo job: sin este filtro, un certificado simplemente no
# verificable (cadena incompleta, nombre distinto) habria disparado ADEMAS
# esta alerta —"el borde no responde"—, que describe un hecho distinto ("nada
# llega a PHP-FPM") del que de verdad esta pasando ("el borde responde, pero
# un cliente que valida identidad no confia en el"). Esa segunda situacion
# tiene su propia alerta, `CertificadoTlsNoVerificable` (rules/tls.yml).
#
# IMPACTO EN EL FICHAJE: DIRECTO. A diferencia de la mayoria de alertas de
# este catalogo —que vigilan proyecciones, auditoria o trabajo pendiente sin
# tocar el acto de fichar—, estas tres SI describen al fichaje fallando o
# yendo lento de verdad para quien esta delante del quiosco en ese momento.
# La cola offline (regla dura 19) absorbe el fallo desde el cliente, pero
# alguien tiene que arreglar el servidor para que deje de acumularse.
groups:
  - name: kronoqr-api
    interval: 60s
    rules:
      #------------------------------------------------------------------------
      # Proporcion de 5xx sobre el total, en las tres rutas de fichaje. Con
      # trafico cero la division es 0/0 (NaN) y Prometheus la descarta: no hay
      # falso positivo por falta de trafico, solo por errores de verdad.
      #------------------------------------------------------------------------
      - alert: ErroresDeServidorEnElFichaje
        expr: >-
          (
            sum(increase(http_requests_total{route=~"attendance\\.scan(\\..*)?", status=~"5.."}[5m]))
            /
            sum(increase(http_requests_total{route=~"attendance\\.scan(\\..*)?"}[5m]))
          ) > 0.01
        for: 1m
        labels:
          severity: critical
          destinatario: it-cliente
          component: api
        annotations:
          summary: "Mas del 1 % de las peticiones de fichaje han fallado en los ultimos 5 min"
          description: >-
            Las rutas attendance.scan, attendance.scan.batch y
            attendance.scan.pin estan devolviendo 5xx por encima del 1 % de
            sus peticiones. El quiosco encola y confirma localmente (regla
            dura 19: nunca bloquea al empleado), pero esos fichajes no llegan
            al servidor hasta que el fallo se resuelva. Revisa el estado de la
            base de datos, Redis y el ultimo despliegue.
          runbook_url: docs/runbooks/errores-en-el-panel.md

      #------------------------------------------------------------------------
      # p95 de latencia, UNA REGLA POR RUTA (bloque 9 de la 2.3.0, R4-DV-06).
      #
      # Hasta la 2.2.1 una sola regla agrupaba las tres rutas de fichaje con
      # `attendance\.scan(\..*)?`. Cada una tiene un coste distinto y un
      # presupuesto distinto, y mezclarlas daba dos fallos:
      #
      #   · el PIN paga un bcrypt de coste 12 a proposito (RNF-P-08, decision de
      #     15-10-2026) y tarda de 1 s a 1,5 s en una maquina lenta: con pocas
      #     peticiones por minuto dominaba el p95 conjunto y la alerta saltaba
      #     sin averia alguna (dos veces en la verificacion de la 2.2.0);
      #   · el lote procesa hasta `kiosk.batch_max_size` (50) fichajes en una
      #     sola peticion, asi que su latencia crece con el numero de elementos.
      #
      # Cada ruta tiene su umbral y un MINIMO DE PETICIONES en la ventana: el p95
      # de cinco peticiones es la mas lenta de las cinco, y de madrugada no dice
      # nada. Los umbrales NO son un requisito del producto, son el punto en el
      # que alguien delante de la tablet ya lo nota:
      #
      #   attendance.scan        500 ms  catalogo del §9.3 (RNF-P-02: p95 < 150 ms)
      #   attendance.scan.pin    3 s     ~7 veces RNF-P-08 (p95 < 400 ms, a confirmar)
      #   attendance.scan.batch  3 s     el ultimo cubo finito del histograma
      #
      # LOS CUBOS DEL HISTOGRAMA LIMITAN LO QUE SE PUEDE VIGILAR. `RecordHttpMetrics`
      # mide con cubos 0,025 0,05 0,1 0,15 0,3 0,4 1 3 y +Inf, y `histogram_quantile`
      # interpola dentro del cubo: con toda la masa a 1,2 s da 2,9 s, no 1,2 s. Un umbral
      # entre dos cubos (el PIN a 2 s) saltaria con un PIN de 1,2 s, justo el falso positivo
      # de R4-DV-06. Y un p95 por encima de 3 s cae en +Inf y devuelve 3, nunca mas: un
      # umbral del lote a 10 s seria inalcanzable. Por eso el PIN y el lote se vigilan como
      # «mas del 5 % de las peticiones tardan mas de 3 s» (= p95 > 3 s) sobre los cubos
      # `le="3.0"` y `le="+Inf"`, que SI son exactos, y por eso son menos finos que el QR: un
      # lote lleno tras un corte largo puede acercarse a esos 3 s (se compensa con
      # `for: 15m` y un minimo de 5 lotes). Medirlos mejor exige cubos nuevos (2 s, 10 s)
      # en el middleware, que cambian una serie existente: queda para el bloque de
      # instrumentacion.
      #
      # `LatenciaDelFichajeAlta` conserva su nombre y es la del catalogo (QR).
      #------------------------------------------------------------------------
      - alert: LatenciaDelFichajeAlta
        expr: >-
          histogram_quantile(
            0.95,
            sum(rate(http_request_duration_seconds_bucket{route="attendance.scan"}[10m])) by (le)
          ) > 0.5
          and on ()
          sum(increase(http_request_duration_seconds_count{route="attendance.scan"}[10m])) >= 20
        for: 1m
        labels:
          severity: high
          destinatario: it-cliente
          component: api
        annotations:
          summary: "El p95 de latencia del fichaje con tarjeta supera los 500 ms desde hace 10 min"
          description: >-
            RNF-P-02 fija p95 < 150 ms; esta alerta suena muy por encima, a
            500 ms, porque a partir de ahi el retraso ya lo nota quien esta
            fichando delante del quiosco. Con 500 personas en el cambio de
            turno, una cola de peticiones lentas en el servidor se traduce
            en gente esperando frente a la tablet. Solo mide el fichaje con
            tarjeta (attendance.scan), con al menos 20 peticiones en la
            ventana; el PIN y el lote tienen la suya.
          runbook_url: docs/runbooks/errores-en-el-panel.md

      - alert: LatenciaDelFichajePorPinAlta
        expr: >-
          (
            1
            -
            sum(rate(http_request_duration_seconds_bucket{route="attendance.scan.pin", le="3.0"}[10m]))
            /
            sum(rate(http_request_duration_seconds_bucket{route="attendance.scan.pin", le="+Inf"}[10m]))
          ) > 0.05
          and on ()
          sum(increase(http_request_duration_seconds_count{route="attendance.scan.pin"}[10m])) >= 20
        for: 5m
        labels:
          severity: warning
          destinatario: it-cliente
          component: api
        annotations:
          summary: "Mas del 5 % de los fichajes por PIN tardan mas de 3 s desde hace 10 min"
          description: >-
            El fichaje por PIN paga un hash bcrypt de coste 12 a proposito
            (RNF-P-08: p95 < 400 ms en el hardware de referencia). Por encima de
            3 s en mas de uno de cada veinte, el servidor va justo de CPU o la
            base de datos va lenta. El fichaje con tarjeta no se ve afectado salvo
            que la causa sea comun: compara con LatenciaDelFichajeAlta. Con al
            menos 20 peticiones por PIN en la ventana.
          runbook_url: docs/runbooks/errores-en-el-panel.md

      - alert: LatenciaDelFichajePorLoteAlta
        expr: >-
          (
            1
            -
            sum(rate(http_request_duration_seconds_bucket{route="attendance.scan.batch", le="3.0"}[10m]))
            /
            sum(rate(http_request_duration_seconds_bucket{route="attendance.scan.batch", le="+Inf"}[10m]))
          ) > 0.05
          and on ()
          sum(increase(http_request_duration_seconds_count{route="attendance.scan.batch"}[10m])) >= 5
        for: 15m
        labels:
          severity: warning
          destinatario: it-cliente
          component: api
        annotations:
          summary: "Mas del 5 % de los lotes de los quioscos tardan mas de 3 s desde hace 10 min"
          description: >-
            El envio de la cola offline de un quiosco (hasta 50 fichajes por
            lote) tarda mas de lo normal. Un lote lleno tras un corte largo puede
            rozar los 3 s sin que haya averia: si coincide con un quiosco que se
            esta vaciando, espera; si no, el servidor va lento. Los quioscos
            siguen aceptando fichajes y los reenviaran (regla dura 19). Con al
            menos 5 lotes en la ventana.
          runbook_url: docs/runbooks/errores-en-el-panel.md

      #------------------------------------------------------------------------
      # Fuera del catalogo (justificado en la cabecera): sin trafico que medir,
      # la regla de 5xx no puede sonar. Esta cubre ese hueco desde fuera del
      # proceso.
      #------------------------------------------------------------------------
      - alert: SondaDelBordeFallida
        expr: probe_success{job="kronoqr-uptime"} == 0
        for: 5m
        labels:
          severity: critical
          destinatario: it-cliente
          component: api
        annotations:
          summary: "La sonda de disponibilidad de {{ $labels.instance }} no responde"
          description: >-
            La comprobacion externa (fuera del proceso de la aplicacion, tarea
            3.1) contra /api/v1/health o /api/v1/ready ha fallado durante 5
            minutos. O nada llega al borde (Nginx caido, red del hotel
            cortada, certificado TLS invalido), o /ready dice que la base de
            datos o Redis no responden. El fichaje puede estar completamente
            parado en el servidor: el quiosco seguira encolando (regla dura
            19), pero nada llegara hasta que esto se resuelva.
          runbook_url: docs/runbooks/errores-en-el-panel.md

      #------------------------------------------------------------------------
      # 5xx FUERA DEL FICHAJE (bloque 9 de la 2.3.0, V21-4-DV-3). Hasta la 2.2.1
      # solo se vigilaban las tres rutas de fichaje: un panel de gestion o un
      # portal que devolvian 500 no avisaban a nadie (RRHH lo notaba antes que
      # IT). El nombre de la ruta (`route`) separa las tres familias:
      #
      #   fichaje  attendance.scan, attendance.scan.batch, attendance.scan.pin
      #   portal   portal.*
      #   gestion  todo lo demas salvo `health.*` y `unmatched`: el panel, la
      #            configuracion, la gestion de quioscos y sus rutas de
      #            padron, latido y emparejamiento.
      #
      # DOS CONDICIONES, y las dos importan. La proporcion (> 5 %) sola salta con
      # 1 error de 4 peticiones a las tres de la madrugada; el minimo de 3
      # errores en 10 min solo, con un hotel de mil peticiones, no dice que
      # algo falle. Juntas dicen «esta familia esta fallando de verdad».
      #
      # LA LIMITACION QUE NO SE PUEDE ARREGLAR AQUI. `http_requests_total` vive
      # en Redis. Con Redis caido estas rutas fallan, y es justo cuando NO
      # hay serie que evaluar: esa averia la cubren `AlmacenDeMetricasCaido` y
      # `SondaDelBordeFallida` (que sondea `/ready`, y `/ready` mira Redis), no
      # estas dos. Por eso su descripcion y la del almacen nombran las rutas.
      #------------------------------------------------------------------------
      - alert: ErroresDeServidorEnElPanel
        expr: >-
          (
            sum(increase(http_requests_total{route!~"attendance\\.scan(\\..*)?|portal\\..*|health\\..*|unmatched", status=~"5.."}[10m]))
            /
            sum(increase(http_requests_total{route!~"attendance\\.scan(\\..*)?|portal\\..*|health\\..*|unmatched"}[10m]))
          ) > 0.05
          and on ()
          sum(increase(http_requests_total{route!~"attendance\\.scan(\\..*)?|portal\\..*|health\\..*|unmatched", status=~"5.."}[10m])) >= 3
        for: 5m
        labels:
          severity: high
          destinatario: it-cliente
          component: api
        annotations:
          summary: "Mas del 5 % de las peticiones del panel de gestion han fallado en los ultimos 10 min"
          description: >-
            Las rutas de gestion (el panel, la configuracion, la gestion de
            quioscos y sus rutas de padron, latido y emparejamiento) estan
            devolviendo 5xx. El fichaje no se ve afectado: es otra familia de
            rutas, con su propia alerta. Mira el historico de errores del panel
            y product:doctor; la causa habitual es la base de datos, el disco o
            un despliegue reciente.
          runbook_url: docs/runbooks/errores-en-el-panel.md

      - alert: ErroresDeServidorEnElPortal
        expr: >-
          (
            sum(increase(http_requests_total{route=~"portal\\..*", status=~"5.."}[10m]))
            /
            sum(increase(http_requests_total{route=~"portal\\..*"}[10m]))
          ) > 0.05
          and on ()
          sum(increase(http_requests_total{route=~"portal\\..*", status=~"5.."}[10m])) >= 3
        for: 5m
        labels:
          severity: high
          destinatario: it-cliente
          component: api
        annotations:
          summary: "Mas del 5 % de las peticiones del portal del empleado han fallado en los ultimos 10 min"
          description: >-
            El portal del empleado (acceso con codigo y PIN, consulta de su
            registro y exportacion) esta devolviendo 5xx. El fichaje no se ve
            afectado, pero las personas no pueden consultar su registro ni
            ejercer su derecho de acceso. Mira el historico de errores del
            panel y product:doctor.
          runbook_url: docs/runbooks/errores-en-el-panel.md
