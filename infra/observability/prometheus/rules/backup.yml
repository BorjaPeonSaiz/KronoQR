# KronoQR — alertas de la copia de seguridad (doc 01 §9.3, doc 02 §8.4).
#
# Norma que gobierna este fichero: CADA alerta lleva umbral, severidad,
# destinatario y enlace a su runbook. Una alerta sin procedimiento asociado es
# ruido y se elimina. Las seis de aqui apuntan al mismo runbook porque se
# responden con el mismo procedimiento, cada una por su seccion:
# docs/runbooks/restaurar-backup.md.
#
# Fila del catalogo del doc 01 §9.3 que implementa este fichero:
#
#   | Copia de seguridad fallida o no verificada | cualquiera | Critica | IT del cliente | restaurar-backup.md |
#
# «Cualquiera» como umbral significa que no hay tolerancia: una copia fallida
# no es una tendencia que mirar. Lo que si hay es `for:`, para no despertar a
# nadie por un fichero de metricas escrito a medias.
#
# Las metricas las escriben infra/scripts/backup.sh, restore-drill.sh y wal-metrics.sh en
# BACKUP_PATH/metrics, y las sirve node-exporter (colector textfile).

groups:
  - name: kronoqr-backup
    interval: 60s
    rules:
      #------------------------------------------------------------------------
      # La copia ha fallado. Critica y sin margen.
      #------------------------------------------------------------------------
      - alert: CopiaDeSeguridadFallida
        expr: kronoqr_backup_last_result == 0
        for: 5m
        labels:
          severity: critical
          destinatario: it-cliente
          component: backup
        annotations:
          summary: "La ultima copia de seguridad ha fallado"
          description: >-
            El ultimo intento de copia ({{ $labels.type }}) termino en error. La
            instalacion sigue funcionando y el fichaje no esta afectado, pero
            desde ahora se esta acumulando trabajo sin respaldo diario.
          runbook_url: docs/runbooks/restaurar-backup.md

      #------------------------------------------------------------------------
      # La copia se escribio pero no supero la verificacion, o nadie la ha
      # verificado desde hace mas de un dia. Una copia no verificada no es una
      # copia: se trata igual que si hubiera fallado.
      #------------------------------------------------------------------------
      - alert: CopiaDeSeguridadSinVerificar
        expr: >-
          kronoqr_backup_last_verify_result == 0
          or (time() - kronoqr_backup_last_verified_timestamp_seconds) > 93600
        for: 15m
        labels:
          severity: critical
          destinatario: it-cliente
          component: backup
        annotations:
          summary: "No hay ninguna copia verificada de las ultimas 26 horas"
          description: >-
            O la verificacion dio error —la copia no se descifra o no la
            entiende pg_restore— o hace mas de 26 h que no se verifica ninguna.
            El umbral son 26 h y no 24 para que un retraso normal de la ventana
            nocturna no dispare la alerta.
          runbook_url: docs/runbooks/restaurar-backup.md

      #------------------------------------------------------------------------
      # El silencio es el peor de los fallos: si el cron no llega a ejecutarse,
      # ninguna metrica cambia y sin esta regla nadie se entera.
      #------------------------------------------------------------------------
      - alert: CopiaDeSeguridadAusente
        expr: >-
          absent(kronoqr_backup_last_success_timestamp_seconds)
          or absent(kronoqr_backup_last_verified_timestamp_seconds)
        for: 30m
        labels:
          severity: critical
          destinatario: it-cliente
          component: backup
        annotations:
          summary: "No llega ninguna metrica de copia de seguridad"
          description: >-
            Prometheus no ve la metrica de resultado de la copia. O nunca se ha
            ejecutado, o el destino de copias no esta montado, o node-exporter
            no lee BACKUP_PATH/metrics. Es indistinguible de no tener copias.
          runbook_url: docs/runbooks/restaurar-backup.md

      #------------------------------------------------------------------------
      # RPO (RNF-D-02, R5-DV-01, ADR-049). Las cuatro reglas leen la serie
      # CONTINUA `kronoqr_wal_*` que wal-metrics.sh publica cada minuto desde el
      # `scheduler`; hasta la 2.2.0 era una foto al terminar la copia nocturna y un
      # archivado parado a las 10:00 no se veia hasta las 03:15 del dia siguiente.
      #
      # `kronoqr_wal_unarchived_age_seconds` es la EXPOSICION REAL: cuanto lleva sin
      # protegerse el dato mas antiguo no archivado, INCLUIDO el segmento en curso.
      # 0 si no hay nada pendiente: en una madrugada sin escrituras PostgreSQL no
      # cierra segmentos y la edad del ultimo archivado crece sin problema alguno
      # (por eso no se usa).
      #------------------------------------------------------------------------
      - alert: ArchivadoDeWalDetenido
        expr: >-
          kronoqr_wal_unarchived_age_seconds > (kronoqr_wal_archive_timeout_seconds + 600)
          or kronoqr_wal_unarchived_segments >= 3
        for: 3m
        labels:
          severity: critical
          destinatario: it-cliente
          component: backup
        annotations:
          summary: "El archivado de WAL esta detenido o va muy atrasado"
          description: >-
            Hay datos escritos que llevan sin archivarse mas de archive_timeout
            (15 min) mas 10 min de margen, o hay 3 segmentos completos sin
            archivar. El RPO deja de ser 15 min (RNF-D-02) y, mientras dure,
            PostgreSQL conserva el WAL sin reciclar hasta llenar el disco de datos
            y pararse. La metrica no espera a la copia nocturna.
          runbook_url: docs/runbooks/restaurar-backup.md

      - alert: ArchivadoDeWalFallando
        expr: kronoqr_wal_archive_failing == 1
        for: 10m
        labels:
          severity: critical
          destinatario: it-cliente
          component: backup
        annotations:
          summary: "El ultimo intento de archivado de WAL ha fallado y no se ha recuperado"
          description: >-
            Un fallo suelto que se recupera no salta; este lleva mas de 10 min.
            Causas habituales: destino no montado o sin permisos, disco lleno, o
            falta la clave del WAL (BACKUP_WAL_KEY): el archivado nunca escribe un
            segmento en claro. El log de postgres dice cual.
          runbook_url: docs/runbooks/restaurar-backup.md

      #------------------------------------------------------------------------
      # Sin medida no se sabe si hay RPO. El latido del propio exportador: si el
      # `scheduler` muere (y con el, las copias) o wal-metrics.sh no puede leer
      # PostgreSQL, ninguna otra regla de este grupo cambia y nadie se entera.
      #------------------------------------------------------------------------
      - alert: MedicionDeWalAusente
        expr: >-
          (time() - kronoqr_wal_exporter_last_run_timestamp_seconds) > 300
          or absent(kronoqr_wal_exporter_last_run_timestamp_seconds)
        for: 5m
        labels:
          severity: critical
          destinatario: it-cliente
          component: backup
        annotations:
          summary: "No llega la medida del RPO"
          description: >-
            El exportador de wal-metrics.sh lleva mas de 5 min sin publicar, o
            nunca ha publicado. Casi siempre es el contenedor scheduler parado
            (que tambien hace las copias) o PostgreSQL inalcanzable con el rol de
            copias. Mientras no haya medida no se sabe si el RPO se cumple.
          runbook_url: docs/runbooks/restaurar-backup.md

      #------------------------------------------------------------------------
      # Deriva de configuracion. Sin archive_timeout, el RPO es «lo que tarde en
      # llenarse un segmento de 16 MB», no 15 minutos.
      #------------------------------------------------------------------------
      - alert: ArchiveTimeoutFueraDeRango
        expr: >-
          kronoqr_wal_archive_timeout_seconds == 0
          or kronoqr_wal_archive_timeout_seconds > 900
        for: 10m
        labels:
          severity: critical
          destinatario: it-cliente
          component: backup
        annotations:
          summary: "archive_timeout esta desactivado o por encima de 900 s"
          description: >-
            RNF-D-02 exige RPO de 15 min y eso solo lo sostiene archive_timeout=900.
            Lo fija infra/compose.prod.yaml: si alguien lo ha editado,
            restaurarlo y recrear postgres.
          runbook_url: docs/runbooks/restaurar-backup.md

      #------------------------------------------------------------------------
      # Slot de replicacion parado (A3-05, AUD-1). KronoQR no usa ningun slot,
      # asi que UNO es ya anomalo: o alguien con el rol de copias (que tiene
      # REPLICATION por pg_basebackup) lo ha creado, o una herramienta ajena lo
      # dejo. Retiene WAL sin limite y llena el disco de datos; PostgreSQL lo
      # acota con max_slot_wal_keep_size (DB_MAX_SLOT_WAL_KEEP_GB), pero un slot
      # inesperado tambien es una senal de seguridad, por eso es critica.
      # La metrica la escribe wal-metrics.sh cada minuto (antes, backup.sh en cada
      # copia diaria: un slot nuevo tardaba hasta 24 h en verse).
      #------------------------------------------------------------------------
      - alert: SlotDeReplicacionParado
        expr: kronoqr_wal_replication_slots_inactive > 0
        for: 15m
        labels:
          severity: critical
          destinatario: it-cliente
          component: backup
        annotations:
          summary: "Hay un slot de replicacion parado que retiene WAL"
          description: >-
            PostgreSQL tiene al menos un slot de replicacion sin consumidor.
            KronoQR no usa ninguno, asi que no es normal: retiene WAL y puede
            llenar el disco de datos, y quien lo creo tenia el rol de copias
            (REPLICATION) o el del superusuario. Retiralo y averigua como
            nacio.
          runbook_url: docs/runbooks/slot-replicacion-parado.md

      #------------------------------------------------------------------------
      # Espacio en el destino de copias. La alerta general de disco es del
      # catalogo (tarea 3.2, espacio-en-disco.md); esta mira SOLO el volumen de
      # copias, que puede llenarse sin que el disco del sistema se resienta y
      # cuyo sintoma es que la copia de mañana no cabe.
      #------------------------------------------------------------------------
      - alert: DiscoDeCopiasCasiLleno
        expr: kronoqr_backup_volume_free_ratio < 0.20
        for: 15m
        labels:
          severity: warning
          destinatario: it-cliente
          component: backup
        annotations:
          summary: "Queda menos del 20 % libre en el destino de copias"
          description: >-
            Con el destino lleno, la copia diaria falla y el archivado de WAL
            tambien. Se resuelve bajando BACKUP_RETENTION_DAYS o ampliando el
            almacenamiento; el runbook explica cual conviene en cada caso.
          runbook_url: docs/runbooks/restaurar-backup.md

      #------------------------------------------------------------------------
      # Simulacro trimestral (RNF-D-05, RQ-09). No es urgente a las 06:30, pero
      # si se deja pasar se descubre que la copia no restauraba el dia que hace
      # falta restaurarla.
      #
      # Son dos reglas y no una porque «nunca se ha hecho» y «hace mas de un
      # trimestre» se responden distinto, y la primera no la ve ninguna
      # comparacion de fechas: sin metrica no hay nada que comparar. La espera
      # de 24 h es para que una instalacion recien entregada no avise antes de
      # que a nadie le haya dado tiempo a ejecutar el primero.
      #------------------------------------------------------------------------
      - alert: SimulacroDeRestauracionNuncaEjecutado
        expr: absent(kronoqr_backup_restore_drill_last_success_timestamp_seconds)
        for: 24h
        labels:
          severity: warning
          destinatario: it-cliente
          component: backup
        annotations:
          summary: "Nunca se ha ejecutado un simulacro de restauracion"
          description: >-
            No consta ningun simulacro correcto en esta instalacion. Hasta que
            se ejecute uno, nadie ha comprobado que estas copias se puedan
            restaurar: solo que existen y que se descifran.
          runbook_url: docs/runbooks/restaurar-backup.md

      - alert: SimulacroDeRestauracionCaducado
        expr: >-
          kronoqr_backup_restore_drill_last_result == 0
          or (time() - kronoqr_backup_restore_drill_last_success_timestamp_seconds) > 8640000
        for: 1h
        labels:
          severity: warning
          destinatario: it-cliente
          component: backup
        annotations:
          summary: "El simulacro de restauracion fallo o lleva mas de 100 dias sin ejecutarse"
          description: >-
            RNF-D-05 exige una prueba de restauracion trimestral. El umbral son
            100 dias para dejar margen dentro del trimestre. Si el ultimo
            simulacro FALLO, la ultima copia no restaura: eso si es urgente.
          runbook_url: docs/runbooks/restaurar-backup.md
