# KronoQR — pruebas unitarias de infra/observability/prometheus/rules/work-record.yml
# (ADR-057 §4): la conciliacion entre el registro horario y su auditoria.
# Cada regla dispara al cruzar su umbral y NO dispara justo por debajo.
rule_files:
  - ../rules/work-record.yml

evaluation_interval: 1m

tests:
  #-----------------------------------------------------------------------------
  # DiscrepanciaEntreRegistroYAuditoria: «cualquiera», sumando los tipos de un
  # mismo alcance en una sola notificacion.
  #-----------------------------------------------------------------------------
  - name: discrepancia_dispara
    interval: 1m
    input_series:
      - series: 'work_record_reconciliation_discrepancies{scope="recent",kind="entry_without_audit"}'
        values: "1x10"
      - series: 'work_record_reconciliation_discrepancies{scope="recent",kind="audit_without_entry"}'
        values: "1x10"
      - series: 'work_record_reconciliation_discrepancies{scope="full",kind="entry_without_audit"}'
        values: "0x10"
    alert_rule_test:
      - eval_time: 1m
        alertname: DiscrepanciaEntreRegistroYAuditoria
        exp_alerts:
          - exp_labels:
              scope: recent
              severity: critical
              integrity: "true"
              destinatario: seguridad
              component: audit
            exp_annotations:
              summary: "El registro horario no cuadra con su auditoria (recent): 2 discrepancia(s)"
              description: >-
                La conciliacion ha encontrado discrepancias entre el registro
                horario y su auditoria en audit_log: un tramo sin asiento, una hora
                o una persona cambiadas, un tramo anulado sin correccion, un asiento
                cuyo tramo ya no existe, o una zona horaria del centro que no es la
                de su ultimo asiento o que cambio sin una correccion firmada.
                Alguien ha escrito en el registro horario por fuera de la
                aplicacion. El fichaje NO esta afectado y no hay que
                parar nada: preserva la evidencia antes de tocar ninguna fila y
                no generes exportaciones legales del periodo hasta aclararlo.
                Una purga no admisible que una persona ya ha dado por revisada
                (retention.purge_reviewed) no cuenta aqui: eso lo avisa
                PurgaFueraDeLimitesRevisada.
              runbook_url: docs/runbooks/discrepancia-registro-auditoria.md

  #-----------------------------------------------------------------------------
  # La zona del centro (RN-23, bloque 2 de la 2.3.0) es una clase mas: dispara
  # sola, con el mismo destinatario.
  #-----------------------------------------------------------------------------
  - name: discrepancia_zona_del_centro_dispara
    interval: 1m
    input_series:
      - series: 'work_record_reconciliation_discrepancies{scope="full",kind="site_timezone_differs_from_audit"}'
        values: "1x10"
      - series: 'work_record_reconciliation_discrepancies{scope="full",kind="entry_without_audit"}'
        values: "0x10"
    alert_rule_test:
      - eval_time: 1m
        alertname: DiscrepanciaEntreRegistroYAuditoria
        exp_alerts:
          - exp_labels:
              scope: full
              severity: critical
              integrity: "true"
              destinatario: seguridad
              component: audit
            exp_annotations:
              summary: "El registro horario no cuadra con su auditoria (full): 1 discrepancia(s)"
              description: >-
                La conciliacion ha encontrado discrepancias entre el registro
                horario y su auditoria en audit_log: un tramo sin asiento, una hora
                o una persona cambiadas, un tramo anulado sin correccion, un asiento
                cuyo tramo ya no existe, o una zona horaria del centro que no es la
                de su ultimo asiento o que cambio sin una correccion firmada.
                Alguien ha escrito en el registro horario por fuera de la
                aplicacion. El fichaje NO esta afectado y no hay que
                parar nada: preserva la evidencia antes de tocar ninguna fila y
                no generes exportaciones legales del periodo hasta aclararlo.
                Una purga no admisible que una persona ya ha dado por revisada
                (retention.purge_reviewed) no cuenta aqui: eso lo avisa
                PurgaFueraDeLimitesRevisada.
              runbook_url: docs/runbooks/discrepancia-registro-auditoria.md

  #-----------------------------------------------------------------------------
  # Justo por debajo: todo a cero en los dos alcances. Nunca dispara.
  #-----------------------------------------------------------------------------
  - name: discrepancia_boundary
    interval: 1m
    input_series:
      - series: 'work_record_reconciliation_discrepancies{scope="recent",kind="entry_without_audit"}'
        values: "0x30"
      - series: 'work_record_reconciliation_discrepancies{scope="full",kind="audit_without_entry"}'
        values: "0x30"
    alert_rule_test:
      - eval_time: 30m
        alertname: DiscrepanciaEntreRegistroYAuditoria
        exp_alerts: []

  #-----------------------------------------------------------------------------
  # El gauge de purgas revisadas NO es una discrepancia pendiente: con revisadas
  # y cero pendientes no dispara DiscrepanciaEntreRegistroYAuditoria.
  #-----------------------------------------------------------------------------
  - name: purga_revisada_no_es_discrepancia
    interval: 1m
    input_series:
      - series: 'work_record_reconciliation_reviewed_purges{scope="recent",explains_deletions="false"}'
        values: "2x30"
      - series: 'work_record_reconciliation_discrepancies{scope="recent",kind="purge_out_of_bounds"}'
        values: "0x30"
    alert_rule_test:
      - eval_time: 30m
        alertname: DiscrepanciaEntreRegistroYAuditoria
        exp_alerts: []

  #-----------------------------------------------------------------------------
  # PurgaFueraDeLimitesRevisada: el gauge sube respecto a hace un dia. Antes del
  # salto (1440 muestras a cero) no dispara; con la primera revision, dispara
  # (sin `for:`); y con el valor constante, un dia despues, se apaga sola.
  # 0x1440 son 1441 muestras (minutos 0..1440): el 1 empieza en el minuto 1441.
  #-----------------------------------------------------------------------------
  - name: purga_revisada_dispara_al_subir_y_se_apaga_sola
    interval: 1m
    input_series:
      - series: 'work_record_reconciliation_reviewed_purges{scope="recent",explains_deletions="false"}'
        values: "0x1440 1x1500"
      - series: 'work_record_reconciliation_reviewed_purges{scope="full",explains_deletions="false"}'
        values: "0x2940"
    alert_rule_test:
      - eval_time: 1440m
        alertname: PurgaFueraDeLimitesRevisada
        exp_alerts: []
      - eval_time: 1442m
        alertname: PurgaFueraDeLimitesRevisada
        exp_alerts:
          - exp_labels:
              severity: warning
              destinatario: seguridad
              component: audit
            exp_annotations:
              summary: "Se ha dado por revisada una purga no admisible del registro horario"
              description: >-
                El numero de purgas fuera de limites revisadas ha subido en el
                ultimo dia (1 en la ultima pasada diaria). No es una
                discrepancia pendiente: alguien ha ejecutado
                compliance:reconcile-work-record --acknowledge. Comprueba en
                audit_log el asiento retention.purge_reviewed (quien responde, el
                motivo) y que cuadra con un incidente ya investigado. Si nadie lo
                reconoce, es un posible uso de la credencial de la aplicacion:
                trata el caso como el de DiscrepanciaEntreRegistroYAuditoria.
              runbook_url: docs/runbooks/discrepancia-registro-auditoria.md
      # Un dia despues del salto el valor sigue en 1 pero ya no sube: se apaga.
      - eval_time: 2882m
        alertname: PurgaFueraDeLimitesRevisada
        exp_alerts: []

  #-----------------------------------------------------------------------------
  # Valor constante desde hace mas de un dia (la revision ya se aviso): nunca
  # dispara. Y a cero siempre, tampoco.
  #-----------------------------------------------------------------------------
  - name: purga_revisada_constante_no_dispara
    interval: 1m
    input_series:
      - series: 'work_record_reconciliation_reviewed_purges{scope="recent",explains_deletions="false"}'
        values: "3x2000"
    alert_rule_test:
      - eval_time: 1500m
        alertname: PurgaFueraDeLimitesRevisada
        exp_alerts: []

  - name: purga_revisada_a_cero_no_dispara
    interval: 1m
    input_series:
      - series: 'work_record_reconciliation_reviewed_purges{scope="recent",explains_deletions="false"}'
        values: "0x2000"
    alert_rule_test:
      - eval_time: 1500m
        alertname: PurgaFueraDeLimitesRevisada
        exp_alerts: []

  # Primera publicacion de la serie con un valor > 0 y sin historia de hace un
  # dia: tambien es una revision nueva y dispara.
  - name: purga_revisada_primera_aparicion_dispara
    interval: 1m
    input_series:
      - series: 'work_record_reconciliation_reviewed_purges{scope="recent",explains_deletions="false"}'
        values: "1x30"
    alert_rule_test:
      - eval_time: 10m
        alertname: PurgaFueraDeLimitesRevisada
        exp_alerts:
          - exp_labels:
              severity: warning
              destinatario: seguridad
              component: audit
            exp_annotations:
              summary: "Se ha dado por revisada una purga no admisible del registro horario"
              description: >-
                El numero de purgas fuera de limites revisadas ha subido en el
                ultimo dia (1 en la ultima pasada diaria). No es una
                discrepancia pendiente: alguien ha ejecutado
                compliance:reconcile-work-record --acknowledge. Comprueba en
                audit_log el asiento retention.purge_reviewed (quien responde, el
                motivo) y que cuadra con un incidente ya investigado. Si nadie lo
                reconoce, es un posible uso de la credencial de la aplicacion:
                trata el caso como el de DiscrepanciaEntreRegistroYAuditoria.
              runbook_url: docs/runbooks/discrepancia-registro-auditoria.md

  #-----------------------------------------------------------------------------
  # ConciliacionDelRegistroAusente, primera mitad: la serie diaria no llega
  # nunca. Dispara tras el `for: 30m`.
  #-----------------------------------------------------------------------------
  - name: conciliacion_diaria_ausente_por_absent
    interval: 1m
    input_series:
      - series: 'work_record_reconciliation_discrepancies{scope="full",kind="entry_without_audit"}'
        values: "0x40"
    alert_rule_test:
      - eval_time: 29m
        alertname: ConciliacionDelRegistroAusente
        exp_alerts: []
      - eval_time: 30m
        alertname: ConciliacionDelRegistroAusente
        exp_alerts:
          - exp_labels:
              scope: recent
              severity: critical
              destinatario: seguridad
              component: audit
            exp_annotations:
              summary: "Hace mas de 26 h que no se concilia el registro horario con su auditoria"
              description: >-
                Una edicion directa del registro horario solo se detecta al dia
                siguiente si la conciliacion diaria se ejecuta. O el scheduler
                esta parado, o compliance:reconcile-work-record falla antes de
                publicar la metrica, o el destino de metricas no esta montado.
              runbook_url: docs/runbooks/discrepancia-registro-auditoria.md

  #-----------------------------------------------------------------------------
  # ConciliacionDelRegistroAusente, segunda mitad: la serie llega pero lleva
  # mas de 93600 s (26 h) sin moverse. Cruza en el minuto 1561 y dispara 30 min
  # despues, en el 1591 (26 h 31 min). Mismo calculo que la de la cadena.
  #-----------------------------------------------------------------------------
  - name: conciliacion_diaria_ausente_por_antiguedad
    interval: 1m
    input_series:
      - series: 'work_record_reconciliation_last_run_timestamp_seconds{scope="recent"}'
        values: "0x1620"
    alert_rule_test:
      - eval_time: 26h
        alertname: ConciliacionDelRegistroAusente
        exp_alerts: []
      - eval_time: 26h31m
        alertname: ConciliacionDelRegistroAusente
        exp_alerts:
          - exp_labels:
              scope: recent
              severity: critical
              destinatario: seguridad
              component: audit
            exp_annotations:
              summary: "Hace mas de 26 h que no se concilia el registro horario con su auditoria"
              description: >-
                Una edicion directa del registro horario solo se detecta al dia
                siguiente si la conciliacion diaria se ejecuta. O el scheduler
                esta parado, o compliance:reconcile-work-record falla antes de
                publicar la metrica, o el destino de metricas no esta montado.
              runbook_url: docs/runbooks/discrepancia-registro-auditoria.md

  #-----------------------------------------------------------------------------
  # ConciliacionCompletaDelRegistroAusente por antiguedad: 691200 s (8 dias).
  # Cruza en el minuto 11521 y dispara 30 min despues (8 d 31 min).
  #-----------------------------------------------------------------------------
  - name: conciliacion_completa_ausente_por_antiguedad
    interval: 1m
    input_series:
      - series: 'work_record_reconciliation_last_run_timestamp_seconds{scope="full"}'
        values: "0x11600"
    alert_rule_test:
      - eval_time: 8d
        alertname: ConciliacionCompletaDelRegistroAusente
        exp_alerts: []
      - eval_time: 8d31m
        alertname: ConciliacionCompletaDelRegistroAusente
        exp_alerts:
          - exp_labels:
              scope: full
              severity: high
              destinatario: seguridad
              component: audit
            exp_annotations:
              summary: "Hace mas de 8 dias que no se concilia el registro horario completo"
              description: >-
                La pasada semanal (compliance:reconcile-work-record --full, los
                domingos) es la unica que detecta un borrado o una edicion de un
                tramo antiguo. O el scheduler estuvo parado el domingo, o el
                comando fallo antes de publicar la metrica.
              runbook_url: docs/runbooks/discrepancia-registro-auditoria.md

  #-----------------------------------------------------------------------------
  # Recien instalada o actualizada: la diaria publica desde hace tres dias y la
  # completa todavia no ha tenido su domingo. NO dispara.
  #-----------------------------------------------------------------------------
  - name: conciliacion_completa_ausente_recien_instalada
    interval: 1m
    input_series:
      - series: 'work_record_reconciliation_last_run_timestamp_seconds{scope="recent"}'
        values: "0x4400"
    alert_rule_test:
      - eval_time: 3d
        alertname: ConciliacionCompletaDelRegistroAusente
        exp_alerts: []

  #-----------------------------------------------------------------------------
  # La diaria lleva mas de siete dias publicandose y la completa sigue sin
  # aparecer: tenia que haber corrido un domingo. Dispara. A las 6 d 23 h,
  # justo por debajo, todavia no.
  #-----------------------------------------------------------------------------
  - name: conciliacion_completa_ausente_tras_una_semana
    interval: 1m
    input_series:
      - series: 'work_record_reconciliation_last_run_timestamp_seconds{scope="recent"}'
        values: "0x10300"
    alert_rule_test:
      - eval_time: 6d23h
        alertname: ConciliacionCompletaDelRegistroAusente
        exp_alerts: []
      - eval_time: 7d2h
        alertname: ConciliacionCompletaDelRegistroAusente
        exp_alerts:
          - exp_labels:
              scope: full
              severity: high
              destinatario: seguridad
              component: audit
            exp_annotations:
              summary: "Hace mas de 8 dias que no se concilia el registro horario completo"
              description: >-
                La pasada semanal (compliance:reconcile-work-record --full, los
                domingos) es la unica que detecta un borrado o una edicion de un
                tramo antiguo. O el scheduler estuvo parado el domingo, o el
                comando fallo antes de publicar la metrica.
              runbook_url: docs/runbooks/discrepancia-registro-auditoria.md

  #-----------------------------------------------------------------------------
  # PurgaRevisadaQueExplicaBorrados: la serie explains_deletions="true" sube.
  # Es critica e integrity; y la de "false" subiendo NO la dispara (solo el aviso).
  #-----------------------------------------------------------------------------
  - name: revision_que_explica_borrados_es_critica
    interval: 1m
    input_series:
      - series: 'work_record_reconciliation_reviewed_purges{scope="recent",explains_deletions="true"}'
        values: "0x1440 1x1500"
      - series: 'work_record_reconciliation_reviewed_purges{scope="recent",explains_deletions="false"}'
        values: "0x2940"
    alert_rule_test:
      - eval_time: 1440m
        alertname: PurgaRevisadaQueExplicaBorrados
        exp_alerts: []
      - eval_time: 1442m
        alertname: PurgaRevisadaQueExplicaBorrados
        exp_alerts:
          - exp_labels:
              severity: critical
              integrity: "true"
              destinatario: seguridad
              component: audit
            exp_annotations:
              summary: "Una revision de purga ha pasado a explicar borrados del registro horario"
              description: >-
                Alguien ha ejecutado compliance:reconcile-work-record --acknowledge
                sobre una purga cuyo asiento, desde ahora, explica el borrado de
                tramos (1 en la ultima pasada diaria): esos tramos ya no
                salen como audit_without_entry. Verifica HOY con la persona que
                firma (responsible) que lo hizo ella, y contrasta quien tenia
                acceso por shell al servidor. Comprueba que existe un informe de
                incidente o de retencion que cuadra y que se restauraron o se
                documentaron los tramos. Si nadie lo reconoce, es un par purga +
                revision escrito con la credencial de la aplicacion para tapar un
                borrado: trata el caso como un incidente de integridad.
              runbook_url: docs/runbooks/discrepancia-registro-auditoria.md
      # La serie "false" no ha subido: el aviso no salta.
      - eval_time: 1442m
        alertname: PurgaFueraDeLimitesRevisada
        exp_alerts: []
      - eval_time: 2882m
        alertname: PurgaRevisadaQueExplicaBorrados
        exp_alerts: []

  # Una revision que no explica borrados NO dispara la critica.
  - name: revision_que_no_explica_no_es_critica
    interval: 1m
    input_series:
      - series: 'work_record_reconciliation_reviewed_purges{scope="recent",explains_deletions="true"}'
        values: "0x2940"
      - series: 'work_record_reconciliation_reviewed_purges{scope="recent",explains_deletions="false"}'
        values: "0x1440 1x1500"
    alert_rule_test:
      - eval_time: 1442m
        alertname: PurgaRevisadaQueExplicaBorrados
        exp_alerts: []

  #-----------------------------------------------------------------------------
  # Revisiones de la zona del centro (RN-23, bloque 2 de la 2.3.0): como la
  # purga revisada, disparan cuando el gauge sube respecto a hace un dia y se
  # apagan solas. `target="change"` (una fila de la traza) es critica y de
  # integridad; `target="audit"` (un asiento sin firma), aviso. Ninguna cuenta
  # como discrepancia pendiente.
  #-----------------------------------------------------------------------------
  - name: cambio_de_zona_revisado_es_critico
    interval: 1m
    input_series:
      - series: 'work_record_reconciliation_reviewed_site_timezone_discrepancies{scope="recent",target="change"}'
        values: "0x1440 1x1500"
      - series: 'work_record_reconciliation_reviewed_site_timezone_discrepancies{scope="recent",target="audit"}'
        values: "0x2940"
      - series: 'work_record_reconciliation_discrepancies{scope="recent",kind="site_timezone_differs_from_audit"}'
        values: "0x2940"
    alert_rule_test:
      - eval_time: 1440m
        alertname: CambioDeZonaRevisado
        exp_alerts: []
      - eval_time: 1442m
        alertname: CambioDeZonaRevisado
        exp_alerts:
          - exp_labels:
              severity: critical
              integrity: "true"
              destinatario: seguridad
              component: audit
            exp_annotations:
              summary: "Se ha dado por revisado un cambio de la zona del centro hecho por fuera de la orden"
              description: >-
                Alguien ha ejecutado compliance:reconcile-work-record
                --acknowledge-site-change sobre una fila de site_timezone_changes
                sin asiento firmado (1 en la ultima pasada diaria): un
                cambio de la zona del centro que ocurrio por fuera de la orden de
                consola deja de contarse como discrepancia. Verifica HOY con la
                persona que firma (responsible) que lo hizo ella, contrasta quien
                tenia acceso por shell al servidor y que la zona actual es la
                correcta. Si nadie lo reconoce, es un cambio de zona tapado con
                una revision escrita con la credencial de la aplicacion: trata el
                caso como un incidente de integridad.
              runbook_url: docs/runbooks/discrepancia-registro-auditoria.md
      - eval_time: 1442m
        alertname: DiscrepanciaDeZonaRevisada
        exp_alerts: []
      - eval_time: 1442m
        alertname: DiscrepanciaEntreRegistroYAuditoria
        exp_alerts: []
      - eval_time: 2882m
        alertname: CambioDeZonaRevisado
        exp_alerts: []

  - name: asiento_de_zona_revisado_es_aviso
    interval: 1m
    input_series:
      - series: 'work_record_reconciliation_reviewed_site_timezone_discrepancies{scope="recent",target="audit"}'
        values: "0x1440 1x1500"
      - series: 'work_record_reconciliation_reviewed_site_timezone_discrepancies{scope="recent",target="change"}'
        values: "0x2940"
    alert_rule_test:
      - eval_time: 1442m
        alertname: DiscrepanciaDeZonaRevisada
        exp_alerts:
          - exp_labels:
              severity: warning
              destinatario: seguridad
              component: audit
            exp_annotations:
              summary: "Se ha dado por revisada una discrepancia de la zona del centro"
              description: >-
                El numero de asientos site.updated sin firma dados por revisados ha
                subido en el ultimo dia (1 en la ultima pasada diaria).
                No es una discrepancia pendiente: alguien ha ejecutado
                compliance:reconcile-work-record --acknowledge-site-change.
                Comprueba en audit_log el asiento
                site.timezone_discrepancy_reviewed (quien responde, el motivo) y
                que cuadra con un incidente ya investigado. Si nadie lo reconoce,
                es un posible uso de la credencial de la aplicacion: trata el caso
                como el de DiscrepanciaEntreRegistroYAuditoria.
              runbook_url: docs/runbooks/discrepancia-registro-auditoria.md
      - eval_time: 1442m
        alertname: CambioDeZonaRevisado
        exp_alerts: []
      - eval_time: 2882m
        alertname: DiscrepanciaDeZonaRevisada
        exp_alerts: []

  #-----------------------------------------------------------------------------
  # ZonaDelCentroNoVerificable: informativa, solo cuando la cifra (suma de los
  # dos tipos) sube respecto a hace un dia. Constante, nunca.
  #-----------------------------------------------------------------------------
  - name: zona_no_verificable_informa_al_subir
    interval: 1m
    input_series:
      - series: 'work_record_reconciliation_unverifiable{scope="full",subject="site_timezone"}'
        values: "1x2940"
      - series: 'work_record_reconciliation_unverifiable{scope="full",subject="site_timezone_change"}'
        values: "0x1440 2x1500"
    alert_rule_test:
      - eval_time: 1440m
        alertname: ZonaDelCentroNoVerificable
        exp_alerts: []
      - eval_time: 1442m
        alertname: ZonaDelCentroNoVerificable
        exp_alerts:
          - exp_labels:
              severity: info
              destinatario: seguridad
              component: audit
            exp_annotations:
              summary: "Parte de la historia de la zona del centro no se puede verificar"
              description: >-
                La conciliacion completa no ha podido cotejar con la auditoria
                3 elemento(s) de la zona horaria del centro, mas que
                hace un dia: un centro sin asiento site.*, cambios sin firma
                anteriores a la linea base de la 2.3.0 o cambios de un año cuya
                auditoria ya se purgo. No es una discrepancia ni hay nada que
                hacer: es informativo.
              runbook_url: docs/runbooks/discrepancia-registro-auditoria.md
      - eval_time: 2882m
        alertname: ZonaDelCentroNoVerificable
        exp_alerts: []

  - name: zona_no_verificable_constante_o_a_cero_no_informa
    interval: 1m
    input_series:
      - series: 'work_record_reconciliation_unverifiable{scope="full",subject="site_timezone_change"}'
        values: "4x2940"
      - series: 'work_record_reconciliation_unverifiable{scope="recent",subject="site_timezone"}'
        values: "0x1440 3x1500"
    alert_rule_test:
      - eval_time: 1442m
        alertname: ZonaDelCentroNoVerificable
        exp_alerts: []
      - eval_time: 2882m
        alertname: ZonaDelCentroNoVerificable
        exp_alerts: []
