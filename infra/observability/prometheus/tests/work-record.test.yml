# KronoQR — pruebas unitarias de infra/observability/prometheus/rules/work-record.yml
# (ADR-057 §4): la conciliacion entre el registro horario y su auditoria.
# Cada regla dispara al cruzar su umbral y NO dispara justo por debajo.
rule_files:
  - ../rules/work-record.yml

evaluation_interval: 1m

tests:
  #-----------------------------------------------------------------------------
  # DiscrepanciaEntreRegistroYAuditoria: «cualquiera», sumando los tipos de un
  # mismo alcance en una sola notificacion.
  #-----------------------------------------------------------------------------
  - name: discrepancia_dispara
    interval: 1m
    input_series:
      - series: 'work_record_reconciliation_discrepancies{scope="recent",kind="entry_without_audit"}'
        values: "1x10"
      - series: 'work_record_reconciliation_discrepancies{scope="recent",kind="audit_without_entry"}'
        values: "1x10"
      - series: 'work_record_reconciliation_discrepancies{scope="full",kind="entry_without_audit"}'
        values: "0x10"
    alert_rule_test:
      - eval_time: 1m
        alertname: DiscrepanciaEntreRegistroYAuditoria
        exp_alerts:
          - exp_labels:
              scope: recent
              severity: critical
              integrity: "true"
              destinatario: seguridad
              component: audit
            exp_annotations:
              summary: "El registro horario no cuadra con su auditoria (recent): 2 tramo(s)"
              description: >-
                La conciliacion ha encontrado tramos de shift_entries que no
                coinciden con el ultimo asiento que la aplicacion escribio sobre
                ellos en audit_log: un tramo sin asiento, una hora o una persona
                cambiadas, un tramo anulado sin correccion o un asiento cuyo
                tramo ya no existe. Alguien ha escrito en el registro horario por
                fuera de la aplicacion. El fichaje NO esta afectado y no hay que
                parar nada: preserva la evidencia antes de tocar ninguna fila y
                no generes exportaciones legales del periodo hasta aclararlo.
              runbook_url: docs/runbooks/discrepancia-registro-auditoria.md

  #-----------------------------------------------------------------------------
  # Justo por debajo: todo a cero en los dos alcances. Nunca dispara.
  #-----------------------------------------------------------------------------
  - name: discrepancia_boundary
    interval: 1m
    input_series:
      - series: 'work_record_reconciliation_discrepancies{scope="recent",kind="entry_without_audit"}'
        values: "0x30"
      - series: 'work_record_reconciliation_discrepancies{scope="full",kind="audit_without_entry"}'
        values: "0x30"
    alert_rule_test:
      - eval_time: 30m
        alertname: DiscrepanciaEntreRegistroYAuditoria
        exp_alerts: []

  #-----------------------------------------------------------------------------
  # ConciliacionDelRegistroAusente, primera mitad: la serie diaria no llega
  # nunca. Dispara tras el `for: 30m`.
  #-----------------------------------------------------------------------------
  - name: conciliacion_diaria_ausente_por_absent
    interval: 1m
    input_series:
      - series: 'work_record_reconciliation_discrepancies{scope="full",kind="entry_without_audit"}'
        values: "0x40"
    alert_rule_test:
      - eval_time: 29m
        alertname: ConciliacionDelRegistroAusente
        exp_alerts: []
      - eval_time: 30m
        alertname: ConciliacionDelRegistroAusente
        exp_alerts:
          - exp_labels:
              scope: recent
              severity: critical
              destinatario: seguridad
              component: audit
            exp_annotations:
              summary: "Hace mas de 26 h que no se concilia el registro horario con su auditoria"
              description: >-
                Una edicion directa del registro horario solo se detecta al dia
                siguiente si la conciliacion diaria se ejecuta. O el scheduler
                esta parado, o compliance:reconcile-work-record falla antes de
                publicar la metrica, o el destino de metricas no esta montado.
              runbook_url: docs/runbooks/discrepancia-registro-auditoria.md

  #-----------------------------------------------------------------------------
  # ConciliacionDelRegistroAusente, segunda mitad: la serie llega pero lleva
  # mas de 93600 s (26 h) sin moverse. Cruza en el minuto 1561 y dispara 30 min
  # despues, en el 1591 (26 h 31 min). Mismo calculo que la de la cadena.
  #-----------------------------------------------------------------------------
  - name: conciliacion_diaria_ausente_por_antiguedad
    interval: 1m
    input_series:
      - series: 'work_record_reconciliation_last_run_timestamp_seconds{scope="recent"}'
        values: "0x1620"
    alert_rule_test:
      - eval_time: 26h
        alertname: ConciliacionDelRegistroAusente
        exp_alerts: []
      - eval_time: 26h31m
        alertname: ConciliacionDelRegistroAusente
        exp_alerts:
          - exp_labels:
              scope: recent
              severity: critical
              destinatario: seguridad
              component: audit
            exp_annotations:
              summary: "Hace mas de 26 h que no se concilia el registro horario con su auditoria"
              description: >-
                Una edicion directa del registro horario solo se detecta al dia
                siguiente si la conciliacion diaria se ejecuta. O el scheduler
                esta parado, o compliance:reconcile-work-record falla antes de
                publicar la metrica, o el destino de metricas no esta montado.
              runbook_url: docs/runbooks/discrepancia-registro-auditoria.md

  #-----------------------------------------------------------------------------
  # ConciliacionCompletaDelRegistroAusente por antiguedad: 691200 s (8 dias).
  # Cruza en el minuto 11521 y dispara 30 min despues (8 d 31 min).
  #-----------------------------------------------------------------------------
  - name: conciliacion_completa_ausente_por_antiguedad
    interval: 1m
    input_series:
      - series: 'work_record_reconciliation_last_run_timestamp_seconds{scope="full"}'
        values: "0x11600"
    alert_rule_test:
      - eval_time: 8d
        alertname: ConciliacionCompletaDelRegistroAusente
        exp_alerts: []
      - eval_time: 8d31m
        alertname: ConciliacionCompletaDelRegistroAusente
        exp_alerts:
          - exp_labels:
              scope: full
              severity: high
              destinatario: seguridad
              component: audit
            exp_annotations:
              summary: "Hace mas de 8 dias que no se concilia el registro horario completo"
              description: >-
                La pasada semanal (compliance:reconcile-work-record --full, los
                domingos) es la unica que detecta un borrado o una edicion de un
                tramo antiguo. O el scheduler estuvo parado el domingo, o el
                comando fallo antes de publicar la metrica.
              runbook_url: docs/runbooks/discrepancia-registro-auditoria.md

  #-----------------------------------------------------------------------------
  # Recien instalada o actualizada: la diaria publica desde hace tres dias y la
  # completa todavia no ha tenido su domingo. NO dispara.
  #-----------------------------------------------------------------------------
  - name: conciliacion_completa_ausente_recien_instalada
    interval: 1m
    input_series:
      - series: 'work_record_reconciliation_last_run_timestamp_seconds{scope="recent"}'
        values: "0x4400"
    alert_rule_test:
      - eval_time: 3d
        alertname: ConciliacionCompletaDelRegistroAusente
        exp_alerts: []

  #-----------------------------------------------------------------------------
  # La diaria lleva mas de siete dias publicandose y la completa sigue sin
  # aparecer: tenia que haber corrido un domingo. Dispara. A las 6 d 23 h,
  # justo por debajo, todavia no.
  #-----------------------------------------------------------------------------
  - name: conciliacion_completa_ausente_tras_una_semana
    interval: 1m
    input_series:
      - series: 'work_record_reconciliation_last_run_timestamp_seconds{scope="recent"}'
        values: "0x10300"
    alert_rule_test:
      - eval_time: 6d23h
        alertname: ConciliacionCompletaDelRegistroAusente
        exp_alerts: []
      - eval_time: 7d2h
        alertname: ConciliacionCompletaDelRegistroAusente
        exp_alerts:
          - exp_labels:
              scope: full
              severity: high
              destinatario: seguridad
              component: audit
            exp_annotations:
              summary: "Hace mas de 8 dias que no se concilia el registro horario completo"
              description: >-
                La pasada semanal (compliance:reconcile-work-record --full, los
                domingos) es la unica que detecta un borrado o una edicion de un
                tramo antiguo. O el scheduler estuvo parado el domingo, o el
                comando fallo antes de publicar la metrica.
              runbook_url: docs/runbooks/discrepancia-registro-auditoria.md
