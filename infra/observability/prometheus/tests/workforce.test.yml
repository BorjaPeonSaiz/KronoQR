# KronoQR — pruebas unitarias de rules/workforce.yml (RN-14, ADR-062 §4).
rule_files:
  - ../rules/workforce.yml

evaluation_interval: 1m

tests:

  #-----------------------------------------------------------------------------
  # ScheduledOffboardingOverdue: > 0 sostenido dos horas dispara; justo antes,
  # no; con 0, nunca; y un pico de una pasada que se resuelve, tampoco.
  #-----------------------------------------------------------------------------
  - name: overdue_sostenido_dispara
    interval: 1m
    input_series:
      - series: 'kronoqr_scheduled_offboardings_overdue'
        values: "1x200"
    alert_rule_test:
      - eval_time: 119m
        alertname: ScheduledOffboardingOverdue
        exp_alerts: []
      - eval_time: 121m
        alertname: ScheduledOffboardingOverdue
        exp_alerts:
          - exp_labels:
              severity: warning
              destinatario: it-cliente
              component: workforce
            exp_annotations:
              summary: "Hay 1 baja(s) programada(s) sin aplicar mas de un dia despues de su cese"
              description: >-
                La tarea workforce:apply-scheduled-offboardings no ha podido hacer
                efectiva una baja programada pasado su tope. Nadie ha fichado despues
                del cese, pero sus tarjetas siguen activas y falta el asiento
                employee.offboarded. Busca workforce.scheduled_offboarding_failed en
                el log, lanza la tarea a mano (repetirla es seguro) y comprueba que el
                planificador esta en marcha.
              runbook_url: docs/runbooks/turno-abierto-prolongado.md

  - name: overdue_cero_no_dispara
    interval: 1m
    input_series:
      - series: 'kronoqr_scheduled_offboardings_overdue'
        values: "0x300"
    alert_rule_test:
      - eval_time: 300m
        alertname: ScheduledOffboardingOverdue
        exp_alerts: []

  - name: overdue_de_una_pasada_no_dispara
    interval: 1m
    input_series:
      # El tope: vale 1 durante la hora hasta la pasada siguiente, que la aplica.
      - series: 'kronoqr_scheduled_offboardings_overdue'
        values: "0x10 1x60 0x200"
    alert_rule_test:
      - eval_time: 200m
        alertname: ScheduledOffboardingOverdue
        exp_alerts: []
