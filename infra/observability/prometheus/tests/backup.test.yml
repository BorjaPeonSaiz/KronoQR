# KronoQR — pruebas unitarias de infra/observability/prometheus/rules/
# backup.yml (tarea 3.2, decision 2). Las siete reglas, desde la tarea 1.18,
# no tenian ninguna prueba: las ganan aqui.
#
# `interval: 1m` en todos los grupos, tambien los de `for` largo (24 h, 26 h):
# es lo que evita que una serie parezca "ausente" entre muestras por superar
# el lookback delta de 5 min de Prometheus, y lo que hace exacto el instante
# en que el `for` se cumple.
rule_files:
  - ../rules/backup.yml

evaluation_interval: 1m

tests:
  #-----------------------------------------------------------------------------
  # CopiaDeSeguridadFallida: la ultima copia fallo.
  #-----------------------------------------------------------------------------
  - name: fallida_dispara
    interval: 1m
    input_series:
      - series: 'kronoqr_backup_last_result{type="dump"}'
        values: "0x10"
    alert_rule_test:
      - eval_time: 4m
        alertname: CopiaDeSeguridadFallida
        exp_alerts: []
      - eval_time: 5m
        alertname: CopiaDeSeguridadFallida
        exp_alerts:
          - exp_labels:
              severity: critical
              destinatario: it-cliente
              component: backup
              type: dump
            exp_annotations:
              summary: "La ultima copia de seguridad ha fallado"
              description: >-
                El ultimo intento de copia (dump) termino en error. La
                instalacion sigue funcionando y el fichaje no esta afectado,
                pero desde ahora se esta acumulando trabajo sin respaldo
                diario.
              runbook_url: docs/runbooks/restaurar-backup.md

  #-----------------------------------------------------------------------------
  # Valor limite: la copia tuvo exito. Nunca dispara.
  #-----------------------------------------------------------------------------
  - name: fallida_boundary
    interval: 1m
    input_series:
      - series: 'kronoqr_backup_last_result{type="dump"}'
        values: "1x30"
    alert_rule_test:
      - eval_time: 30m
        alertname: CopiaDeSeguridadFallida
        exp_alerts: []

  #-----------------------------------------------------------------------------
  # CopiaDeSeguridadSinVerificar: la verificacion dio error.
  #-----------------------------------------------------------------------------
  - name: sin_verificar_dispara
    interval: 1m
    input_series:
      - series: 'kronoqr_backup_last_verify_result{type="dump"}'
        values: "0x20"
      # Fresca (sigue el reloj): con esto se aisla la primera mitad de la
      # condicion, que es la que se esta probando.
      - series: 'kronoqr_backup_last_verified_timestamp_seconds{type="dump"}'
        values: "0+60x20"
    alert_rule_test:
      - eval_time: 14m
        alertname: CopiaDeSeguridadSinVerificar
        exp_alerts: []
      - eval_time: 15m
        alertname: CopiaDeSeguridadSinVerificar
        exp_alerts:
          - exp_labels:
              severity: critical
              destinatario: it-cliente
              component: backup
              type: dump
            exp_annotations:
              summary: "No hay ninguna copia verificada de las ultimas 26 horas"
              description: >-
                O la verificacion dio error —la copia no se descifra o no la
                entiende pg_restore— o hace mas de 26 h que no se verifica
                ninguna. El umbral son 26 h y no 24 para que un retraso
                normal de la ventana nocturna no dispare la alerta.
              runbook_url: docs/runbooks/restaurar-backup.md

  #-----------------------------------------------------------------------------
  # Valor limite: verificacion correcta y reciente. Nunca dispara.
  #-----------------------------------------------------------------------------
  - name: sin_verificar_boundary
    interval: 1m
    input_series:
      - series: 'kronoqr_backup_last_verify_result{type="dump"}'
        values: "1x30"
      - series: 'kronoqr_backup_last_verified_timestamp_seconds{type="dump"}'
        values: "0+60x30"
    alert_rule_test:
      - eval_time: 30m
        alertname: CopiaDeSeguridadSinVerificar
        exp_alerts: []

  #-----------------------------------------------------------------------------
  # CopiaDeSeguridadAusente: ninguna de las dos series llega nunca.
  #-----------------------------------------------------------------------------
  - name: ausente_dispara
    interval: 1m
    input_series:
      # Otra serie del mismo fichero, para que el grupo se evalue con datos.
      - series: 'kronoqr_backup_last_result{type="dump"}'
        values: "1x40"
    alert_rule_test:
      - eval_time: 29m
        alertname: CopiaDeSeguridadAusente
        exp_alerts: []
      - eval_time: 30m
        alertname: CopiaDeSeguridadAusente
        exp_alerts:
          - exp_labels:
              severity: critical
              destinatario: it-cliente
              component: backup
            exp_annotations:
              summary: "No llega ninguna metrica de copia de seguridad"
              description: >-
                Prometheus no ve la metrica de resultado de la copia. O
                nunca se ha ejecutado, o el destino de copias no esta
                montado, o node-exporter no lee BACKUP_PATH/metrics. Es
                indistinguible de no tener copias.
              runbook_url: docs/runbooks/restaurar-backup.md

  #-----------------------------------------------------------------------------
  # Valor limite: las dos series llegan. Nunca dispara.
  #-----------------------------------------------------------------------------
  - name: ausente_boundary
    interval: 1m
    input_series:
      - series: 'kronoqr_backup_last_success_timestamp_seconds{type="dump"}'
        values: "0+60x40"
      - series: 'kronoqr_backup_last_verified_timestamp_seconds{type="dump"}'
        values: "0+60x40"
    alert_rule_test:
      - eval_time: 40m
        alertname: CopiaDeSeguridadAusente
        exp_alerts: []

  #-----------------------------------------------------------------------------
  # ArchivadoDeWalDetenido (R5-DV-01, ADR-049). Umbral: archive_timeout (900) + 600
  # = 1500 s de exposicion, con `for: 3m`. La serie es la que publica
  # wal-metrics.sh cada minuto.
  #
  # Parada del archivado a las 10:00: la exposicion crece 60 s por minuto desde
  # 0. Supera 1500 en el minuto 26 (1560) y, con el `for`, salta en el 29. Hasta
  # la 2.2.0 esto no se veia hasta la copia de las 03:15 del dia siguiente.
  #-----------------------------------------------------------------------------
  - name: wal_detenido_dispara
    interval: 1m
    input_series:
      - series: kronoqr_wal_unarchived_age_seconds
        values: "0+60x40"
      - series: kronoqr_wal_unarchived_segments
        values: "0x40"
      - series: kronoqr_wal_archive_timeout_seconds
        values: "900x40"
    alert_rule_test:
      - eval_time: 28m
        alertname: ArchivadoDeWalDetenido
        exp_alerts: []
      - eval_time: 29m
        alertname: ArchivadoDeWalDetenido
        exp_alerts:
          - exp_labels:
              severity: critical
              destinatario: it-cliente
              component: backup
            exp_annotations:
              summary: "El archivado de WAL esta detenido o va muy atrasado"
              description: >-
                Hay datos escritos que llevan sin archivarse mas de
                archive_timeout (15 min) mas 10 min de margen, o hay 3
                segmentos completos sin archivar. El RPO deja de ser 15 min
                (RNF-D-02) y, mientras dure, PostgreSQL conserva el WAL sin
                reciclar hasta llenar el disco de datos y pararse. La metrica
                no espera a la copia nocturna.
              runbook_url: docs/runbooks/restaurar-backup.md

  #-----------------------------------------------------------------------------
  # CICLO SANO: servidor con escrituras continuas. La exposicion sube hasta ~840 s
  # y vuelve a 0 cada vez que archive_timeout cierra y archiva el segmento. Durante
  # dos horas NUNCA dispara. (Es el caso que una regla sobre «edad del ultimo
  # archivado» no distingue de una averia.)
  #-----------------------------------------------------------------------------
  - name: wal_ciclo_sano_no_dispara
    interval: 1m
    input_series:
      - series: kronoqr_wal_unarchived_age_seconds
        values: "0+60x14 0+60x14 0+60x14 0+60x14 0+60x14 0+60x14 0+60x14 0+60x14 0+60x14"
      - series: kronoqr_wal_unarchived_segments
        values: "0x126"
      - series: kronoqr_wal_archive_timeout_seconds
        values: "900x126"
    alert_rule_test:
      - eval_time: 60m
        alertname: ArchivadoDeWalDetenido
        exp_alerts: []
      - eval_time: 120m
        alertname: ArchivadoDeWalDetenido
        exp_alerts: []

  #-----------------------------------------------------------------------------
  # INACTIVIDAD (una madrugada sin fichajes): no hay dato pendiente, la exposicion
  # es 0, aunque el ultimo segmento se archivara hace cuatro horas. Es el falso
  # positivo de la regla antigua y NO debe disparar.
  #-----------------------------------------------------------------------------
  - name: wal_inactividad_no_dispara
    interval: 1m
    input_series:
      - series: kronoqr_wal_unarchived_age_seconds
        values: "0x120"
      - series: kronoqr_wal_last_archived_age_seconds
        values: "14400+60x120"
      - series: kronoqr_wal_unarchived_segments
        values: "0x120"
      - series: kronoqr_wal_archive_timeout_seconds
        values: "900x120"
    alert_rule_test:
      - eval_time: 120m
        alertname: ArchivadoDeWalDetenido
        exp_alerts: []

  #-----------------------------------------------------------------------------
  # Valor limite: exactamente 1500 s (archive_timeout + 600), para siempre. No
  # dispara; 1501 si.
  #-----------------------------------------------------------------------------
  - name: wal_detenido_boundary
    interval: 1m
    input_series:
      - series: kronoqr_wal_unarchived_age_seconds
        values: "1500x40"
      - series: kronoqr_wal_unarchived_segments
        values: "0x40"
      - series: kronoqr_wal_archive_timeout_seconds
        values: "900x40"
    alert_rule_test:
      - eval_time: 40m
        alertname: ArchivadoDeWalDetenido
        exp_alerts: []

  - name: wal_detenido_un_segundo_mas
    interval: 1m
    input_series:
      - series: kronoqr_wal_unarchived_age_seconds
        values: "1501x40"
      - series: kronoqr_wal_unarchived_segments
        values: "0x40"
      - series: kronoqr_wal_archive_timeout_seconds
        values: "900x40"
    alert_rule_test:
      - eval_time: 3m
        alertname: ArchivadoDeWalDetenido
        exp_alerts:
          - exp_labels:
              severity: critical
              destinatario: it-cliente
              component: backup
            exp_annotations:
              summary: "El archivado de WAL esta detenido o va muy atrasado"
              description: >-
                Hay datos escritos que llevan sin archivarse mas de
                archive_timeout (15 min) mas 10 min de margen, o hay 3
                segmentos completos sin archivar. El RPO deja de ser 15 min
                (RNF-D-02) y, mientras dure, PostgreSQL conserva el WAL sin
                reciclar hasta llenar el disco de datos y pararse. La metrica
                no espera a la copia nocturna.
              runbook_url: docs/runbooks/restaurar-backup.md

  #-----------------------------------------------------------------------------
  # Atasco que AVANZA: el archivado va, pero atrasado, asi que la exposicion se
  # reinicia en cada segmento y la regla de la edad no lo ve. Tres segmentos
  # completos sin archivar disparan (a los 3 min); dos, no.
  #-----------------------------------------------------------------------------
  - name: wal_atrasado_dispara
    interval: 1m
    input_series:
      - series: kronoqr_wal_unarchived_age_seconds
        values: "0x20"
      - series: kronoqr_wal_unarchived_segments
        values: "3x20"
      - series: kronoqr_wal_archive_timeout_seconds
        values: "900x20"
    alert_rule_test:
      - eval_time: 2m
        alertname: ArchivadoDeWalDetenido
        exp_alerts: []
      - eval_time: 3m
        alertname: ArchivadoDeWalDetenido
        exp_alerts:
          - exp_labels:
              severity: critical
              destinatario: it-cliente
              component: backup
            exp_annotations:
              summary: "El archivado de WAL esta detenido o va muy atrasado"
              description: >-
                Hay datos escritos que llevan sin archivarse mas de
                archive_timeout (15 min) mas 10 min de margen, o hay 3
                segmentos completos sin archivar. El RPO deja de ser 15 min
                (RNF-D-02) y, mientras dure, PostgreSQL conserva el WAL sin
                reciclar hasta llenar el disco de datos y pararse. La metrica
                no espera a la copia nocturna.
              runbook_url: docs/runbooks/restaurar-backup.md

  - name: wal_dos_segmentos_no_dispara
    interval: 1m
    input_series:
      - series: kronoqr_wal_unarchived_age_seconds
        values: "0x20"
      - series: kronoqr_wal_unarchived_segments
        values: "2x20"
      - series: kronoqr_wal_archive_timeout_seconds
        values: "900x20"
    alert_rule_test:
      - eval_time: 20m
        alertname: ArchivadoDeWalDetenido
        exp_alerts: []

  #-----------------------------------------------------------------------------
  # ArchivadoDeWalFallando: el ultimo intento fallo y no se ha recuperado. A los
  # 10 min (9 no).
  #-----------------------------------------------------------------------------
  - name: wal_fallando_dispara
    interval: 1m
    input_series:
      - series: kronoqr_wal_archive_failing
        values: "1x20"
    alert_rule_test:
      - eval_time: 9m
        alertname: ArchivadoDeWalFallando
        exp_alerts: []
      - eval_time: 10m
        alertname: ArchivadoDeWalFallando
        exp_alerts:
          - exp_labels:
              severity: critical
              destinatario: it-cliente
              component: backup
            exp_annotations:
              summary: "El ultimo intento de archivado de WAL ha fallado y no se ha recuperado"
              description: >-
                Un fallo suelto que se recupera no salta; este lleva mas de
                10 min. Causas habituales: destino no montado o sin permisos,
                disco lleno, o falta la clave del WAL (BACKUP_WAL_KEY): el
                archivado nunca escribe un segmento en claro. El log de
                postgres dice cual.
              runbook_url: docs/runbooks/restaurar-backup.md

  # Un fallo que se recupera antes de 10 min NO despierta a nadie.
  - name: wal_fallo_transitorio_no_dispara
    interval: 1m
    input_series:
      - series: kronoqr_wal_archive_failing
        values: "0x5 1x8 0x20"
    alert_rule_test:
      - eval_time: 30m
        alertname: ArchivadoDeWalFallando
        exp_alerts: []

  #-----------------------------------------------------------------------------
  # MedicionDeWalAusente: sin la serie (el scheduler no ha publicado nunca)
  # dispara a los 5 min; con ella al dia, no; y si se detiene, dispara cuando el
  # latido tiene mas de 5 min y han pasado 5 min mas.
  #-----------------------------------------------------------------------------
  - name: wal_medicion_ausente_dispara
    interval: 1m
    input_series:
      - series: kronoqr_wal_archive_timeout_seconds
        values: "900x30"
    alert_rule_test:
      - eval_time: 4m
        alertname: MedicionDeWalAusente
        exp_alerts: []
      - eval_time: 5m
        alertname: MedicionDeWalAusente
        exp_alerts:
          - exp_labels:
              severity: critical
              destinatario: it-cliente
              component: backup
            exp_annotations:
              summary: "No llega la medida del RPO"
              description: >-
                El exportador de wal-metrics.sh lleva mas de 5 min sin
                publicar, o nunca ha publicado. Casi siempre es el contenedor
                scheduler parado (que tambien hace las copias) o PostgreSQL
                inalcanzable con el rol de copias. Mientras no haya medida no
                se sabe si el RPO se cumple.
              runbook_url: docs/runbooks/restaurar-backup.md

  - name: wal_medicion_al_dia_no_dispara
    interval: 1m
    input_series:
      - series: kronoqr_wal_exporter_last_run_timestamp_seconds
        values: "0+60x60"
    alert_rule_test:
      - eval_time: 60m
        alertname: MedicionDeWalAusente
        exp_alerts: []

  #-----------------------------------------------------------------------------
  # ArchiveTimeoutFueraDeRango: 0 (desactivado) o por encima de 900 dispara a los
  # 10 min; 900 no.
  #-----------------------------------------------------------------------------
  - name: wal_timeout_desactivado_dispara
    interval: 1m
    input_series:
      - series: kronoqr_wal_archive_timeout_seconds
        values: "0x20"
    alert_rule_test:
      - eval_time: 9m
        alertname: ArchiveTimeoutFueraDeRango
        exp_alerts: []
      - eval_time: 10m
        alertname: ArchiveTimeoutFueraDeRango
        exp_alerts:
          - exp_labels:
              severity: critical
              destinatario: it-cliente
              component: backup
            exp_annotations:
              summary: "archive_timeout esta desactivado o por encima de 900 s"
              description: >-
                RNF-D-02 exige RPO de 15 min y eso solo lo sostiene
                archive_timeout=900. Lo fija infra/compose.prod.yaml: si
                alguien lo ha editado, restaurarlo y recrear postgres.
              runbook_url: docs/runbooks/restaurar-backup.md

  - name: wal_timeout_demasiado_alto_dispara
    interval: 1m
    input_series:
      - series: kronoqr_wal_archive_timeout_seconds
        values: "1800x20"
    alert_rule_test:
      - eval_time: 10m
        alertname: ArchiveTimeoutFueraDeRango
        exp_alerts:
          - exp_labels:
              severity: critical
              destinatario: it-cliente
              component: backup
            exp_annotations:
              summary: "archive_timeout esta desactivado o por encima de 900 s"
              description: >-
                RNF-D-02 exige RPO de 15 min y eso solo lo sostiene
                archive_timeout=900. Lo fija infra/compose.prod.yaml: si
                alguien lo ha editado, restaurarlo y recrear postgres.
              runbook_url: docs/runbooks/restaurar-backup.md

  - name: wal_timeout_900_no_dispara
    interval: 1m
    input_series:
      - series: kronoqr_wal_archive_timeout_seconds
        values: "900x60"
    alert_rule_test:
      - eval_time: 60m
        alertname: ArchiveTimeoutFueraDeRango
        exp_alerts: []

  #-----------------------------------------------------------------------------
  # SlotDeReplicacionParado (A3-05): un slot sin consumidor. Dispara a los 15 min.
  #-----------------------------------------------------------------------------
  - name: slot_parado_dispara
    interval: 1m
    input_series:
      - series: kronoqr_wal_replication_slots_inactive
        values: "1x30"
    alert_rule_test:
      - eval_time: 14m
        alertname: SlotDeReplicacionParado
        exp_alerts: []
      - eval_time: 15m
        alertname: SlotDeReplicacionParado
        exp_alerts:
          - exp_labels:
              severity: critical
              destinatario: it-cliente
              component: backup
            exp_annotations:
              summary: "Hay un slot de replicacion parado que retiene WAL"
              description: >-
                PostgreSQL tiene al menos un slot de replicacion sin
                consumidor. KronoQR no usa ninguno, asi que no es normal:
                retiene WAL y puede llenar el disco de datos, y quien lo creo
                tenia el rol de copias (REPLICATION) o el del superusuario.
                Retiralo y averigua como nacio.
              runbook_url: docs/runbooks/slot-replicacion-parado.md

  #-----------------------------------------------------------------------------
  # Valor limite: cero slots parados (lo normal), para siempre. Nunca dispara.
  #-----------------------------------------------------------------------------
  - name: slot_parado_boundary
    interval: 1m
    input_series:
      - series: kronoqr_wal_replication_slots_inactive
        values: "0x60"
    alert_rule_test:
      - eval_time: 60m
        alertname: SlotDeReplicacionParado
        exp_alerts: []

  #-----------------------------------------------------------------------------
  # Se retira el slot (el exportador publica 0 al minuto siguiente): la alerta se apaga.
  #-----------------------------------------------------------------------------
  - name: slot_parado_se_resuelve
    interval: 1m
    input_series:
      - series: kronoqr_wal_replication_slots_inactive
        values: "1x20 0x20"
    alert_rule_test:
      - eval_time: 25m
        alertname: SlotDeReplicacionParado
        exp_alerts: []

  #-----------------------------------------------------------------------------
  # DiscoDeCopiasCasiLleno: 10 % libre, por debajo del 20 %.
  #-----------------------------------------------------------------------------
  - name: disco_copias_dispara
    interval: 1m
    input_series:
      - series: kronoqr_backup_volume_free_ratio
        values: "0.10x20"
    alert_rule_test:
      - eval_time: 14m
        alertname: DiscoDeCopiasCasiLleno
        exp_alerts: []
      - eval_time: 15m
        alertname: DiscoDeCopiasCasiLleno
        exp_alerts:
          - exp_labels:
              severity: warning
              destinatario: it-cliente
              component: backup
            exp_annotations:
              summary: "Queda menos del 20 % libre en el destino de copias"
              description: >-
                Con el destino lleno, la copia diaria falla y el archivado
                de WAL tambien. Se resuelve bajando BACKUP_RETENTION_DAYS o
                ampliando el almacenamiento; el runbook explica cual
                conviene en cada caso.
              runbook_url: docs/runbooks/restaurar-backup.md

  #-----------------------------------------------------------------------------
  # Valor limite justo por debajo: exactamente 20 % libre, para siempre.
  # Nunca dispara.
  #-----------------------------------------------------------------------------
  - name: disco_copias_boundary
    interval: 1m
    input_series:
      - series: kronoqr_backup_volume_free_ratio
        values: "0.20x30"
    alert_rule_test:
      - eval_time: 30m
        alertname: DiscoDeCopiasCasiLleno
        exp_alerts: []

  #-----------------------------------------------------------------------------
  # SimulacroDeRestauracionNuncaEjecutado: la metrica no llega nunca.
  #-----------------------------------------------------------------------------
  - name: simulacro_nunca_dispara
    interval: 1m
    input_series:
      - series: kronoqr_backup_last_result{type="dump"}
        values: "1x1500"
    alert_rule_test:
      - eval_time: 23h59m
        alertname: SimulacroDeRestauracionNuncaEjecutado
        exp_alerts: []
      - eval_time: 24h
        alertname: SimulacroDeRestauracionNuncaEjecutado
        exp_alerts:
          - exp_labels:
              severity: warning
              destinatario: it-cliente
              component: backup
            exp_annotations:
              summary: "Nunca se ha ejecutado un simulacro de restauracion"
              description: >-
                No consta ningun simulacro correcto en esta instalacion.
                Hasta que se ejecute uno, nadie ha comprobado que estas
                copias se puedan restaurar: solo que existen y que se
                descifran.
              runbook_url: docs/runbooks/restaurar-backup.md

  #-----------------------------------------------------------------------------
  # Valor limite: el simulacro SI dejo su marca de tiempo. Nunca dispara.
  #-----------------------------------------------------------------------------
  - name: simulacro_nunca_boundary
    interval: 1m
    input_series:
      - series: kronoqr_backup_restore_drill_last_success_timestamp_seconds
        values: "0+60x1500"
    alert_rule_test:
      - eval_time: 24h
        alertname: SimulacroDeRestauracionNuncaEjecutado
        exp_alerts: []

  #-----------------------------------------------------------------------------
  # SimulacroDeRestauracionCaducado: el ultimo simulacro fallo.
  #-----------------------------------------------------------------------------
  - name: simulacro_caducado_dispara
    interval: 1m
    input_series:
      - series: kronoqr_backup_restore_drill_last_result
        values: "0x70"
      # Fresca: aisla la primera mitad de la condicion.
      - series: kronoqr_backup_restore_drill_last_success_timestamp_seconds
        values: "0+60x70"
    alert_rule_test:
      - eval_time: 59m
        alertname: SimulacroDeRestauracionCaducado
        exp_alerts: []
      - eval_time: 1h
        alertname: SimulacroDeRestauracionCaducado
        exp_alerts:
          - exp_labels:
              severity: warning
              destinatario: it-cliente
              component: backup
            exp_annotations:
              summary: "El simulacro de restauracion fallo o lleva mas de 100 dias sin ejecutarse"
              description: >-
                RNF-D-05 exige una prueba de restauracion trimestral. El
                umbral son 100 dias para dejar margen dentro del trimestre.
                Si el ultimo simulacro FALLO, la ultima copia no restaura:
                eso si es urgente.
              runbook_url: docs/runbooks/restaurar-backup.md

  #-----------------------------------------------------------------------------
  # Valor limite: simulacro correcto y reciente. Nunca dispara.
  #-----------------------------------------------------------------------------
  - name: simulacro_caducado_boundary
    interval: 1m
    input_series:
      - series: kronoqr_backup_restore_drill_last_result
        values: "1x70"
      - series: kronoqr_backup_restore_drill_last_success_timestamp_seconds
        values: "0+60x70"
    alert_rule_test:
