# KronoQR — pruebas unitarias de infra/observability/prometheus/rules/observability.yml
# (bloque 9 de la 2.3.0: V21-4-DV-4).
rule_files:
  - ../rules/observability.yml

evaluation_interval: 1m

tests:
  # Loki deja de responder en el minuto 5: dispara a los 10 min de persistir.
  - interval: 1m
    input_series:
      - series: 'probe_success{job="kronoqr-loki",instance="http://loki:3100/ready"}'
        values: "1x5 0x30"
    alert_rule_test:
      - eval_time: 14m
        alertname: LokiSinRespuesta
        exp_alerts: []
      - eval_time: 16m
        alertname: LokiSinRespuesta
        exp_alerts:
          - exp_labels:
              severity: warning
              destinatario: it-cliente
              component: host
              job: kronoqr-loki
              instance: "http://loki:3100/ready"
            exp_annotations:
              summary: "Loki no responde: los registros tecnicos no se estan guardando"
              description: >-
                La sonda interna de Loki (/ready) falla desde hace 10 min. Mientras
                tanto los registros de la aplicacion no llegan a ninguna parte y el
                rastro para diagnosticar un incidente se pierde. El fichaje, el
                registro horario y la auditoria no se ven afectados.
              runbook_url: docs/runbooks/loki-sin-respuesta.md

  # Un reinicio de 5 minutos (update.sh) no despierta a nadie.
  - interval: 1m
    input_series:
      - series: 'probe_success{job="kronoqr-loki",instance="http://loki:3100/ready"}'
        values: "1x5 0x5 1x30"
    alert_rule_test:
      - eval_time: 30m
        alertname: LokiSinRespuesta
        exp_alerts: []

  # Otro job de sonda caido (el borde) no es Loki.
  - interval: 1m
    input_series:
      - series: 'probe_success{job="kronoqr-uptime",instance="https://nginx:8443/api/v1/health"}'
        values: "0x40"
    alert_rule_test:
      - eval_time: 40m
        alertname: LokiSinRespuesta
        exp_alerts: []

  # blackbox-exporter cae: Prometheus no puede leer ninguna sonda (up == 0 en los tres
  # jobs). Dispara una por job a los 5 min; la sonda de otro job (la tarea de aplicacion)
  # no cuenta.
  - interval: 1m
    input_series:
      - series: 'up{job="kronoqr-uptime", instance="https://nginx:8443/api/v1/health"}'
        values: "1x5 0x30"
      - series: 'up{job="kronoqr-loki", instance="http://loki:3100/ready"}'
        values: "1x5 0x30"
      - series: 'up{job="kronoqr-api", instance="nginx:8080"}'
        values: "0x35"
    alert_rule_test:
      - eval_time: 9m
        alertname: SondasDeBlackboxSinRespuesta
        exp_alerts: []
      - eval_time: 12m
        alertname: SondasDeBlackboxSinRespuesta
        exp_alerts:
          - exp_labels:
              severity: high
              destinatario: it-cliente
              component: host
              job: kronoqr-uptime
              instance: "https://nginx:8443/api/v1/health"
            exp_annotations:
              summary: "Prometheus no consigue leer la sonda kronoqr-uptime: blackbox-exporter no responde"
              description: >-
                blackbox-exporter hace las comprobaciones desde fuera (el borde, el
                certificado, Loki). Si no responde, esas alertas se quedan SIN SERIE y
                callan: el servidor puede estar caido sin que nada lo diga. Recrea
                blackbox-exporter y comprueba que su configuracion (observability/blackbox/
                blackbox.yml) es valida.
              runbook_url: docs/runbooks/blackbox-sin-respuesta.md
          - exp_labels:
              severity: high
              destinatario: it-cliente
              component: host
              job: kronoqr-loki
              instance: "http://loki:3100/ready"
            exp_annotations:
              summary: "Prometheus no consigue leer la sonda kronoqr-loki: blackbox-exporter no responde"
              description: >-
                blackbox-exporter hace las comprobaciones desde fuera (el borde, el
                certificado, Loki). Si no responde, esas alertas se quedan SIN SERIE y
                callan: el servidor puede estar caido sin que nada lo diga. Recrea
                blackbox-exporter y comprueba que su configuracion (observability/blackbox/
                blackbox.yml) es valida.
              runbook_url: docs/runbooks/blackbox-sin-respuesta.md

  # Todo sano: nunca.
  - interval: 1m
    input_series:
      - series: 'up{job="kronoqr-uptime", instance="https://nginx:8443/api/v1/health"}'
        values: "1x40"
      - series: 'up{job="kronoqr-loki", instance="http://loki:3100/ready"}'
        values: "1x40"
    alert_rule_test:
      - eval_time: 40m
        alertname: SondasDeBlackboxSinRespuesta
        exp_alerts: []
