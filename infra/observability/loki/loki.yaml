# KronoQR — configuracion base de Loki (doc 02 §8.1).
#
# Loki guarda el LOG TECNICO, que no es la auditoria ni error_events (§8.2.1):
# retencion de 90 dias, sin valor probatorio, y jamas con nombres de empleado
# (regla dura 21). El registro con valor legal vive en PostgreSQL.
#
# Instalacion de un solo nodo sobre sistema de ficheros: el producto se
# despliega en el servidor de un cliente, no en un cluster.

auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: "2024-01-01"
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # 90 dias de serie (2160 h), igual que error_events y que lo que exige RL-11.
  #
  # El plazo es LOG_RETENTION_HOURS del .env (horas; 2160 si no esta), que el
  # servicio recibe por entorno y Loki expande al leer el fichero
  # (`-config.expand-env=true` en el compose; `:-` aplica el valor de serie tambien
  # si la variable esta VACIA). Asi el cliente NO edita este fichero, que esta
  # protegido en las actualizaciones (update.sh). `infra/observability/tempo/tempo.yaml`
  # usa la MISMA variable en `compactor.compaction.block_retention`: un solo
  # numero para las dos retenciones. Una prueba de arquitectura ata el valor de
  # serie a TECHNICAL_LOG_RETENTION_DAYS x 24.
  retention_period: ${LOG_RETENTION_HOURS:-2160}h
  # Los quioscos pueden sincronizar cola offline con horas de retraso: si Loki
  # rechazara muestras antiguas, perderiamos justo los logs del incidente.
  reject_old_samples: false
  max_query_lookback: ${LOG_RETENTION_HOURS:-2160}h

compactor:
  working_directory: /loki/compactor
  delete_request_store: filesystem
  retention_enabled: true
  compaction_interval: 10m

ruler:
  storage:
    type: local
    local:
      directory: /loki/rules
  # Las alertas por log (infra/observability/loki/rules/fake/) salen por el mismo
  # Alertmanager que las de Prometheus: mismo enrutado por `destinatario`.
  alertmanager_url: http://alertmanager:9093
  rule_path: /loki/rules-temp
  evaluation_interval: 1m

analytics:
  reporting_enabled: false
