services:

  app:
    <<: *app-image
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["fpm"]
    environment:
      <<: *runtime-env
      # Solo `app` (entrypoint.sh los valida y renderiza el pool de PHP-FPM).
      PHP_FPM_MAX_CHILDREN:
      DB_LOCK_TIMEOUT:
      DB_IDLE_IN_TRANSACTION_TIMEOUT:
      # PGOPTIONS (tarea 3.6, RNF-P-06, RNF-D-01) SOLO en `app`, el servicio
      # que sirve peticiones (fichaje, panel, portal); las migraciones ya
      # no van por aqui sino por el servicio `migrate`, que lleva su propio
      # `lock_timeout` (AUD-1). NO en `horizon` ni
      # `scheduler`: `idle_in_transaction_session_timeout=60s` puede abortar
      # el `pg_dump` de `backup.sh` con un destino de red lento, y
      # `lock_timeout=5s` rendiria una tarea de mantenimiento larga ante un
      # `VACUUM` en curso (hallazgo de la revision de seguridad de esta
      # tarea). NI en `reverb`: no hace consultas de escritura en el camino
      # critico. lo lee libpq del entorno del PROPIO PROCESO al abrir la
      # conexion, no algo que configure Laravel; `DB_LOCK_TIMEOUT`/
      # `DB_IDLE_IN_TRANSACTION_TIMEOUT` son variables de COMPOSE (las
      # resuelve `docker compose` desde el .env del cliente).
      PGOPTIONS: "-c lock_timeout=${DB_LOCK_TIMEOUT:-5s} -c idle_in_transaction_session_timeout=${DB_IDLE_IN_TRANSACTION_TIMEOUT:-60s}"
    healthcheck:
      test: ["CMD-SHELL", "SCRIPT_NAME=/ping SCRIPT_FILENAME=/ping REQUEST_METHOD=GET cgi-fcgi -bind -connect 127.0.0.1:9000 | grep -q pong"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  nginx:
    image: ${IMAGE_REGISTRY:-ghcr.io/kronoqr}/nginx:${IMAGE_TAG:?falta IMAGE_TAG. En produccion no hay etiqueta por defecto y `latest` esta prohibido (doc 02 §11.6.1). install.sh la fija desde el fichero VERSION del paquete; si ejecutas Compose a mano, pon IMAGE_TAG=<version> en el .env}
    # Solo lo que el borde usa (plantilla kronoqr.conf.template y entrypoint.d).
    # Ni una credencial: PIN-10, mismo criterio que el resto de AUD-1.
    environment:
      # Obligatorias. Sin valor por defecto a proposito: 04-kronoqr-required-env.sh
      # las exige y explica por que.
      KIOSK_VLAN_CIDR:
      PORTAL_INTERNAL_CIDR:
      METRICS_ALLOW_CIDR:
      # Opcionales. Sin valor por defecto de Compose: si no estan, la imagen y
      # 03-kronoqr-tls-paths.envsh ponen las suyas.
      # PP-03: proxies de confianza (vacia = sin proxy). 04-kronoqr-required-env.sh
      # valida su sintaxis y 06-kronoqr-real-ip.envsh la rinde como set_real_ip_from.
      TRUSTED_PROXY_CIDR:
      TLS_ALLOW_SELF_SIGNED:
      TLS_CERT_FILE:
      TLS_KEY_FILE:
      # Con el defecto de la imagen (8m) tambien aqui: vacia, la directiva
      # `client_max_body_size` es invalida y nginx no arranca.
      NGINX_CLIENT_MAX_BODY_SIZE: ${NGINX_CLIENT_MAX_BODY_SIZE:-8m}
    ports:
      - "${HTTP_PORT:-80}:8080"
      - "${HTTPS_PORT:-443}:8443"
    volumes:
      # El certificado del cliente. Si falta, el contenedor se para y dice
      # donde colocarlo: un autofirmado en produccion acaba con alguien
      # desactivando la comprobacion en los quioscos.
      - ${TLS_CERT_DIR:-./certs}:/etc/nginx/certs:ro
      #
      # LOS TRES FRONTENDS VAN DENTRO DE ESTA IMAGEN, no en un volumen.
      #
      # Un volumen compartido con los ficheros construidos se queda congelado en
      # la version que lo inicializo: Docker copia el contenido de la imagen a un
      # volumen VACIO y no vuelve a tocarlo nunca mas. La primera actualizacion
      # dejaria un panel de la 1.2 hablando con una API de la 1.6, con errores de
      # contrato que no se parecen a su causa. Al vivir en la imagen, la etiqueta
      # inmutable de arriba fija a la vez el backend y las tres SPA.
    depends_on:
      app:
        condition: service_healthy
    networks:
      - app
      - observability
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  postgres:
    image: ${IMAGE_REGISTRY:-ghcr.io/kronoqr}/postgres:${IMAGE_TAG:?falta IMAGE_TAG. En produccion no hay etiqueta por defecto y `latest` esta prohibido (doc 02 §11.6.1). install.sh la fija desde el fichero VERSION del paquete; si ejecutas Compose a mano, pon IMAGE_TAG=<version> en el .env}
    environment:
      POSTGRES_DB: ${DB_DATABASE:-fichaje}
      # El rol de ARRANQUE es el de MIGRACION, no el de la aplicacion (tarea
      # 1.14, regla dura 6). POSTGRES_USER es superusuario del cluster y sobre
      # un superusuario los GRANT y los REVOKE no se comprueban: con la
      # aplicacion corriendo con este rol, "sin UPDATE ni DELETE sobre
      # audit_log" no era una garantia, era una intencion.
      #
      # initdb/02-application-roles.sh crea a partir de aqui fichaje_app —el
      # DB_USERNAME del .env, sin DDL— y fichaje_maintenance (ADR-027).
      POSTGRES_USER: ${DB_MIGRATION_USERNAME:-fichaje_migrator}
      POSTGRES_PASSWORD: ${DB_MIGRATION_PASSWORD:?define DB_MIGRATION_PASSWORD en el .env; install.sh lo genera}
      DB_APP_USERNAME: ${DB_USERNAME:-fichaje_app}
      DB_PASSWORD: ${DB_PASSWORD:?define DB_PASSWORD en el .env; install.sh lo genera}
      DB_MAINTENANCE_USERNAME: ${DB_MAINTENANCE_USERNAME:-fichaje_maintenance}
      # Sin valor por defecto y a proposito (ADR-027): el rol de mantenimiento
      # nace sin credencial utilizable y no aparece en el .env de la
      # aplicacion. Se le asigna cuando la tarea 2.10 active la purga.
      DB_MAINTENANCE_PASSWORD: ${DB_MAINTENANCE_PASSWORD:-}
      # Rol de las COPIAS (AUD-1): solo lectura, lo crea initdb/03-backup-role.sh.
      # Si el .env aun trae BACKUP_DB_USERNAME=fichaje_migrator (2.1.0), el script
      # se niega a tocar el migrador y no hace nada.
      DB_BACKUP_USERNAME: ${BACKUP_DB_USERNAME:-fichaje_backup}
      DB_BACKUP_PASSWORD: ${BACKUP_DB_PASSWORD:-}
      TZ: UTC
      PGTZ: UTC
      KRONOQR_WAL_ARCHIVE_DIR: ${BACKUP_PATH:-/var/backups/fichaje}/wal
      KRONOQR_WAL_RETENTION_DAYS: ${BACKUP_WAL_RETENTION_DAYS:-8}
    # Regla dura 3. Y archivado de WAL, que es lo que sostiene el RPO de 15 min
    # (RNF-D-02).
    #
    # `archive_timeout=900` es la linea de la que depende el RPO: obliga a
    # cerrar y archivar un segmento cada 15 minutos aunque no haya trafico. Sin
    # ella, un hotel tranquilo de madrugada puede tener horas de escrituras sin
    # archivar y el RPO seria "lo que tarde en llenarse un segmento".
    #
    # El archivado NO es un `cp` en una linea: lo hace kronoqr-archive-wal, que
    # comprime, escribe de forma atomica, se niega a sobrescribir un segmento
    # distinto y purga los caducados. `archive_command` solo debe devolver 0 si
    # el segmento esta de verdad a salvo, porque PostgreSQL borra el original
    # en cuanto lo dice.
    command:
      - postgres
      - -c
      - timezone=UTC
      - -c
      - log_timezone=UTC
      - -c
      - hba_file=/etc/kronoqr/pg_hba.conf
      - -c
      - wal_level=replica
      - -c
      - archive_mode=on
      - -c
      - archive_timeout=900
      - -c
      - archive_command=/usr/local/bin/kronoqr-archive-wal %p %f
      # A3-05. `fichaje_backup` tiene REPLICATION (lo exige pg_basebackup) y con
      # ese atributo puede crear un slot de replicacion, que retiene WAL sin
      # limite mientras nadie lo consuma y acaba llenando el disco de datos.
      # KronoQR no usa ningun slot: este tope hace que un slot huerfano se
      # INVALIDE (deja de retener) en cuanto el WAL retenido supera el limite,
      # en vez de parar PostgreSQL. La alerta SlotDeReplicacionParado
      # (infra/observability/prometheus/rules/backup.yml) avisa mucho antes.
      - -c
      - max_slot_wal_keep_size=${DB_MAX_SLOT_WAL_KEEP_GB:-5}GB
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # install.sh crea este directorio y se lo asigna al uid de postgres antes
      # del primer arranque (tarea 5.4): `install -d -o 70 -g 70 -m 0750`, que
      # es el uid/gid de `postgres` en la imagen Alpine. Nadie mas lo va a
      # corregir: la imagen arranca como `postgres`, no como root
      # (infra/docker/postgres/Dockerfile), y el entrypoint oficial nunca
      # ajusto otro directorio que PGDATA. Si no puede escribir, el archivado
      # falla, el WAL se acumula en el volumen de datos hasta llenar el disco y
      # PostgreSQL acaba parandose: por eso la alerta de archivado detenido
      # (infra/observability/prometheus/rules/backup.yml) es de las criticas.
      - ${BACKUP_PATH:-/var/backups/fichaje}/wal:${BACKUP_PATH:-/var/backups/fichaje}/wal
    # Sin puertos publicados: a la base de datos se llega desde la red interna
    # de Docker, nunca desde la red del hotel.
    networks:
      - app
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - redis-data:/data
    networks:
      - app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  horizon:
    <<: *app-image
    command: ["horizon"]
    environment:
      <<: *runtime-env
    depends_on:
      redis:
        condition: service_healthy

  reverb:
    <<: *app-image
    command: ["reverb"]
    # Sin volúmenes: `reverb` solo habla WebSocket con Redis y no lee ni escribe
    # ni las copias (BACKUP_PATH) ni el logotipo de la marca que monta el ancla.
    # La clave explícita gana sobre la del ancla en la fusión de YAML.
    volumes: []
    environment:
      <<: *reverb-env
    expose:
      - "8080"
    depends_on:
      redis:
        condition: service_healthy

  scheduler:
    <<: *app-image
    command: ["scheduler"]
    environment:
      <<: *runtime-env
      # LO UNICO QUE EL PLANIFICADOR TIENE Y EL RESTO NO (AUD-1, ADR-042): lanza
      # `backup:run` y las copias necesitan la clave de cifrado y un rol de
      # PostgreSQL. BACKUP_DB_* es `fichaje_backup`, de SOLO LECTURA
      # (pg_read_all_data + REPLICATION): no puede escribir una fila. La contrasena
      # del migrador (superusuario) no esta aqui ni en ningun runtime.
      BACKUP_ENCRYPTION_KEY:
      BACKUP_DB_USERNAME:
      BACKUP_DB_PASSWORD:
    depends_on:
      postgres:
        condition: service_healthy

  #----------------------------------------------------------------------------
  # TAREAS PUNTUALES CON CREDENCIALES PRIVILEGIADAS (AUD-1, ADR-033, regla dura 6)
  #
  # `migrate` y `restore` son los UNICOS servicios que reciben la contraseña del
  # rol de migracion (`fichaje_migrator`, superusuario del cluster). No arrancan
  # con `up -d`: el perfil `tools` los deja fuera, y `docker compose run --rm
  # migrate ...` los lanza sin activar el perfil (comprobado con Compose v5).
  # Nacen, hacen una cosa y mueren (`restart: "no"`).
  #
  # SIN `env_file`, y sin heredar `x-app-image`: sus volumenes y su entorno son
  # los que ellos nombran. Las variables van SIN valor (`X:`): Compose las
  # resuelve desde el .env del cliente y, si la clave no existe, la variable NO
  # llega al contenedor. Con `X: ${X:-}` llegaria vacia y anularia el valor por
  # defecto que `env('X', ...)` lleva en config/.
  #
  # Uso:
  #   docker compose run --rm --no-deps -T migrate php artisan migrate --force --database=pgsql_migrator
  #   docker compose run --rm --no-deps -T restore bash /opt/kronoqr/scripts/restore.sh ...
  #
  # `--no-deps` porque quien las llama (install.sh, update.sh) ya ha esperado a
  # que postgres este sano y no quiere que Compose arranque nada mas.
  #----------------------------------------------------------------------------
  migrate:
    profiles: [tools]
    image: *php-image
    restart: "no"
    command: ["php", "artisan", "migrate", "--database=pgsql_migrator", "--force"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app
    environment:
      # Arranque de la aplicacion (ProductionSafetyGuard lee APP_ENV/APP_DEBUG).
      APP_NAME:
      APP_ENV:
      APP_DEBUG:
      APP_KEY:
      APP_TIMEZONE:
      LOG_CHANNEL:
      LOG_STACK:
      LOG_LEVEL:
      # Conexion. DB_USERNAME es el NOMBRE del rol de aplicacion: las migraciones
      # le escriben los GRANT (AuditLogSchema). Su contraseña no hace falta.
      DB_CONNECTION:
      DB_HOST:
      DB_PORT:
      DB_DATABASE:
      DB_SSLMODE:
      DB_USERNAME:
      DB_MIGRATION_USERNAME:
      DB_MIGRATION_PASSWORD:
      DB_MAINTENANCE_USERNAME:
      # Como en `app` (RNF-D-01): una migracion que espera un candado mas de 5 s
      # aborta en vez de bloquear el fichaje. Sin idle_in_transaction: una
      # migracion larga no debe morir por eso.
      PGOPTIONS: "-c lock_timeout=${DB_LOCK_TIMEOUT:-5s}"

  restore:
    profiles: [tools]
    image: *php-image
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app
    volumes:
      # La misma ruta dentro y fuera, como en `app`: restore.sh lee de aqui las
      # copias y escribe aqui su informe.
      - ${BACKUP_PATH:-/var/backups/fichaje}:${BACKUP_PATH:-/var/backups/fichaje}
    environment:
      # Arranque de artisan para el asiento de auditoria de la restauracion (PR1):
      # restore.sh escribe `system.restored_from_backup` con el rol de migracion
      # que este servicio YA tiene (PGUSER/PGPASSWORD, mas abajo); estas variables
      # no son credenciales de base de datos nuevas. Son las mismas que `migrate`.
      APP_NAME:
      APP_ENV:
      APP_DEBUG:
      APP_KEY:
      APP_TIMEZONE:
      LOG_CHANNEL:
      LOG_STACK:
      LOG_LEVEL:
      DB_SSLMODE:
      # restore.sh y restore-drill.sh --mode database toman PGUSER/PGPASSWORD
      # antes que BACKUP_DB_* (lib/backup-common.sh): restaurar exige CREATEDB y
      # renombrar bases, cosa que el rol de copia (solo lectura) no puede.
      PGUSER: ${DB_MIGRATION_USERNAME:-fichaje_migrator}
      PGPASSWORD: ${DB_MIGRATION_PASSWORD:?define DB_MIGRATION_PASSWORD en el .env; install.sh lo genera}
      DB_HOST:
      DB_PORT:
      DB_DATABASE:
      DB_USERNAME:
      DB_MAINTENANCE_USERNAME:
      BACKUP_PATH:
      BACKUP_ENCRYPTION_KEY:
      BACKUP_RETENTION_DAYS:
      BACKUP_MIN_COPIES:

  # ENTRYPOINT DE RENDERIZADO (tarea 3.8, hallazgo H-05). Mismo mecanismo que
  # Alertmanager (ver el comentario de ese servicio, mas abajo, para el
  # porque): `APP_URL` es especifica de esta instalacion (regla dura 13) y
  # Prometheus no expande variables de entorno en `scrape_configs`, asi que
  # `/etc/prometheus/prometheus.yml.template` se resuelve contra el entorno
  # ANTES de que el binario arranque y el resultado se escribe en
  # `/prometheus/prometheus.yml` — el volumen de datos, nunca la plantilla de
  # solo lectura. Sin `APP_URL`, o con `TLS_ALLOW_SELF_SIGNED=true`, el job de
  # la sonda TLS verificada se omite (target condicionado): Prometheus arranca
  # igual, solo que sin esa serie.
  prometheus:
    profiles: [observability]
    image: prom/prometheus:v3.1.0
    entrypoint: ["/etc/prometheus/render-config.sh"]
    command:
      - --config.file=/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=90d
    environment:
      APP_URL: ${APP_URL:-}
      TLS_ALLOW_SELF_SIGNED: ${TLS_ALLOW_SELF_SIGNED:-false}
    volumes:
      - ./observability/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    networks:
      observability:
        ipv4_address: 172.29.0.20
    restart: unless-stopped

  # Publica a Prometheus el resultado de la copia diaria, de su verificacion y
  # del simulacro de restauracion: los scripts de infra/scripts escriben
  # ficheros .prom en BACKUP_PATH/metrics y este servicio los sirve. Es lo que
  # convierte "el cron fallo" en una alerta y no en un hallazgo de fin de mes.
  node-exporter:
    profiles: [observability]
    image: prom/node-exporter:v1.9.1
    # El uid que escribe las copias (el mismo del contenedor de aplicacion).
    # El arbol de copias es 0750 y contiene datos personales cifrados: se le da
    # el uid justo en lugar de relajar los permisos del directorio.
    user: "1000:1000"
    command:
      - --collector.disable-defaults
      - --collector.textfile
      - --collector.textfile.directory=/var/backups/metrics
      - --collector.filesystem
      - --path.rootfs=/host
      - --web.listen-address=:9100
    volumes:
      - ${BACKUP_PATH:-/var/backups/fichaje}:/var/backups:ro
      # Espacio en disco del servidor, de solo lectura. Sin esto no se puede
      # avisar del disco lleno, que es el modo de fallo mas frecuente de una
      # instalacion con archivado de WAL.
      - /:/host:ro,rslave
    networks:
      - observability
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  # ENTRYPOINT DE RENDERIZADO (tarea 3.2, decision 5). Alertmanager no expande
  # variables de entorno en su configuracion, asi que lo que viaja montado en
  # /etc/alertmanager es una PLANTILLA (`alertmanager.yml.template`) y un
  # script POSIX (`render-config.sh`) que la resuelve contra las variables
  # ALERT_* y MAIL_* del entorno del contenedor ANTES de que el binario
  # arranque. El resultado se escribe en /alertmanager/alertmanager.yml -el
  # volumen de datos, de lectura y escritura, nunca el `.template`, que es de
  # solo lectura- y `--config.file` apunta ahi. La contraseña SMTP y cada
  # webhook (decision 17g) nunca entran en el YAML: se leen de ficheros aparte
  # con permisos 0600 que el propio script escribe.
  #
  # `environment:` CON LAS QUINCE VARIABLES UNA A UNA, Y NO `env_file: .env`
  # (correccion de la revision de seguridad, decision 17a): vease el
  # comentario equivalente en compose.dev.yaml para el porque completo. En
  # resumen, `env_file: .env` metia el `.env` ENTERO -claves de firma,
  # secretos de sellado, contraseña de base de datos, clave de licencia- en el
  # entorno de un binario de terceros que solo necesita quince variables.
  alertmanager:
    profiles: [observability]
    image: prom/alertmanager:v0.28.0
    entrypoint: ["/etc/alertmanager/render-config.sh"]
    command:
      - --config.file=/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    environment:
      ALERT_EMAIL_IT: ${ALERT_EMAIL_IT:-}
      ALERT_EMAIL_RRHH: ${ALERT_EMAIL_RRHH:-}
      ALERT_EMAIL_SEGURIDAD: ${ALERT_EMAIL_SEGURIDAD:-}
      ALERT_WEBHOOK_IT: ${ALERT_WEBHOOK_IT:-}
      ALERT_WEBHOOK_RRHH: ${ALERT_WEBHOOK_RRHH:-}
      ALERT_WEBHOOK_SEGURIDAD: ${ALERT_WEBHOOK_SEGURIDAD:-}
      ALERT_MAINTENANCE_WEEKDAY: ${ALERT_MAINTENANCE_WEEKDAY:-sunday}
      ALERT_MAINTENANCE_START: ${ALERT_MAINTENANCE_START:-02:00}
      ALERT_MAINTENANCE_END: ${ALERT_MAINTENANCE_END:-04:00}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-}
      MAIL_SCHEME: ${MAIL_SCHEME:-}
    volumes:
      - ./observability/alertmanager:/etc/alertmanager:ro
      - alertmanager-data:/alertmanager
    networks:
      - observability
    restart: unless-stopped
    # Decision 17(c): sin esto, nadie vigilaba que Alertmanager siguiera vivo.
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://127.0.0.1:9093/-/healthy || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  grafana:
    profiles: [observability]
    image: grafana/grafana:11.5.1
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?define GRAFANA_ADMIN_PASSWORD en el .env; install.sh lo genera}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_DATE_FORMATS_DEFAULT_TIMEZONE: utc
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      # Solo loopback del servidor. Grafana NUNCA se publica a internet.
      - "127.0.0.1:3000:3000"
    networks:
      - observability
    restart: unless-stopped

  loki:
    profiles: [observability]
    image: grafana/loki:3.3.2
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ./observability/loki/loki.yaml:/etc/loki/loki.yaml:ro
      - loki-data:/loki
    networks:
      - app
      - observability
    restart: unless-stopped

  # Destino de las trazas OTLP (tarea 3.1, §8.1). En produccion NO arranca
  # sola: OTEL_EXPORTER_OTLP_ENDPOINT viene vacia de serie en .env.example y
  # el cliente la pone a http://tempo:4318 cuando quiere trazas ademas de este
  # perfil encendido (regla dura 15: sin destino configurado, el SDK del
  # backend ni arranca, y el fichaje no depende de que este contenedor viva).
  tempo:
    profiles: [observability]
    image: grafana/tempo:2.7.1
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./observability/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    networks:
      # 'app': la aplicacion exporta aqui. 'observability': Grafana lo usa
      # como fuente de datos. Sin puertos publicados al host: se consulta
      # solo desde Grafana, nunca directamente desde fuera del servidor.
      - app
      - observability
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  # Sonda de uptime sobre /api/v1/health y /api/v1/ready (tarea 3.1, §8.1), y
  # el mismo exportador que la tarea 3.2 usa para la caducidad del certificado
  # TLS: un solo contenedor para las dos sondas HTTP.
  blackbox-exporter:
    profiles: [observability]
    image: prom/blackbox-exporter:v0.25.0
    command:
      - --config.file=/etc/blackbox_exporter/blackbox.yml
      - --web.listen-address=:9115
    volumes:
      - ./observability/blackbox/blackbox.yml:/etc/blackbox_exporter/blackbox.yml:ro
    networks:
      # 'app': tiene que alcanzar `nginx:8080`. 'observability': Prometheus lo
      # scrapea via /probe.
      - app
      - observability
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

networks:
  app:
    name: kronoqr-app
  observability:
    name: kronoqr-observability
    ipam:
      config:
        - subnet: 172.29.0.0/24

volumes:
  postgres-data:
  redis-data:
  prometheus-data:
  alertmanager-data:
  grafana-data:
  loki-data:
  tempo-data:
