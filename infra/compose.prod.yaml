#==============================================================================
# KronoQR — despliegue en el servidor del cliente.
#
# ESTE FICHERO ES IDENTICO PARA TODOS LOS CLIENTES (ADR-017, regla dura 13).
# Todo lo que difiere entre instalaciones —dominio, certificado, rango de la
# VLAN de quioscos, umbrales, marca, licencia— vive en el .env que genera
# install.sh en el servidor del cliente. Si algo obliga a editar este fichero
# para vender a un cliente nuevo, esta mal disenado.
#
# Se entrega junto al .env, en el mismo directorio, asi que aqui Docker Compose
# si encuentra el .env sin banderas adicionales.
#
# Uso:  docker compose -f compose.prod.yaml up -d
#       (normalmente a traves de install.sh o update.sh, tareas 5.4 y 5.7)
#
# Diferencias deliberadas frente a desarrollo:
#   · imagenes publicadas y etiquetadas, nunca build local
#   · sin Mailpit, sin servidores de Vite, sin puertos de base de datos
#     publicados
#   · Alertmanager presente
#   · Grafana escuchando solo en loopback: se llega por tunel o por el propio
#     servidor, jamas expuesto a internet
#   · reinicio automatico y rotacion de logs
#==============================================================================

name: kronoqr

x-app-image: &app-image
  image: ${IMAGE_REGISTRY:-ghcr.io/kronoqr}/php:${IMAGE_TAG:-latest}
  env_file:
    - .env
  volumes:
    # Destino de las copias, en el disco del cliente y montado en la MISMA ruta
    # dentro del contenedor. Asi `php artisan backup:run` escribe donde dice el
    # .env sin que backup.sh tenga que saber si corre dentro o fuera de Docker.
    #
    # La copia se queda aqui: el fabricante no la recibe ni la custodia (regla
    # dura 16, RL-14). Si BACKUP_PATH apunta a un recurso de red, debe estar
    # montado antes de levantar el servicio.
    - ${BACKUP_PATH:-/var/backups/fichaje}:${BACKUP_PATH:-/var/backups/fichaje}
  networks:
    - app
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "20m"
      max-file: "5"

services:

  app:
    <<: *app-image
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["fpm"]
    healthcheck:
      test: ["CMD-SHELL", "SCRIPT_NAME=/ping SCRIPT_FILENAME=/ping REQUEST_METHOD=GET cgi-fcgi -bind -connect 127.0.0.1:9000 | grep -q pong"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  nginx:
    image: ${IMAGE_REGISTRY:-ghcr.io/kronoqr}/nginx:${IMAGE_TAG:-latest}
    env_file:
      - .env
    ports:
      - "${HTTP_PORT:-80}:8080"
      - "${HTTPS_PORT:-443}:8443"
    volumes:
      # El certificado del cliente. Si falta, el contenedor se para y dice
      # donde colocarlo: un autofirmado en produccion acaba con alguien
      # desactivando la comprobacion en los quioscos.
      - ${TLS_CERT_DIR:-./certs}:/etc/nginx/certs:ro
      # Nginx sirve la API y proxya el WebSocket. La entrega de los ficheros
      # construidos de los tres frontends se define en el paquete de entrega
      # (tarea 5.4): hasta entonces no se inventa aqui un volumen compartido
      # que quedaria congelado en la primera version instalada.
    depends_on:
      - app
    networks:
      - app
      - observability
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  postgres:
    image: ${IMAGE_REGISTRY:-ghcr.io/kronoqr}/postgres:${IMAGE_TAG:-latest}
    environment:
      POSTGRES_DB: ${DB_DATABASE:-fichaje}
      # El rol de ARRANQUE es el de MIGRACION, no el de la aplicacion (tarea
      # 1.14, regla dura 6). POSTGRES_USER es superusuario del cluster y sobre
      # un superusuario los GRANT y los REVOKE no se comprueban: con la
      # aplicacion corriendo con este rol, "sin UPDATE ni DELETE sobre
      # audit_log" no era una garantia, era una intencion.
      #
      # initdb/02-application-roles.sh crea a partir de aqui fichaje_app —el
      # DB_USERNAME del .env, sin DDL— y fichaje_maintenance (ADR-027).
      POSTGRES_USER: ${DB_MIGRATION_USERNAME:-fichaje_migrator}
      POSTGRES_PASSWORD: ${DB_MIGRATION_PASSWORD:?define DB_MIGRATION_PASSWORD en el .env; install.sh lo genera}
      DB_APP_USERNAME: ${DB_USERNAME:-fichaje_app}
      DB_PASSWORD: ${DB_PASSWORD:?define DB_PASSWORD en el .env; install.sh lo genera}
      DB_MAINTENANCE_USERNAME: ${DB_MAINTENANCE_USERNAME:-fichaje_maintenance}
      # Sin valor por defecto y a proposito (ADR-027): el rol de mantenimiento
      # nace sin credencial utilizable y no aparece en el .env de la
      # aplicacion. Se le asigna cuando la tarea 2.10 active la purga.
      DB_MAINTENANCE_PASSWORD: ${DB_MAINTENANCE_PASSWORD:-}
      TZ: UTC
      PGTZ: UTC
      KRONOQR_WAL_ARCHIVE_DIR: ${BACKUP_PATH:-/var/backups/fichaje}/wal
      KRONOQR_WAL_RETENTION_DAYS: ${BACKUP_WAL_RETENTION_DAYS:-8}
    # Regla dura 3. Y archivado de WAL, que es lo que sostiene el RPO de 15 min
    # (RNF-D-02).
    #
    # `archive_timeout=900` es la linea de la que depende el RPO: obliga a
    # cerrar y archivar un segmento cada 15 minutos aunque no haya trafico. Sin
    # ella, un hotel tranquilo de madrugada puede tener horas de escrituras sin
    # archivar y el RPO seria "lo que tarde en llenarse un segmento".
    #
    # El archivado NO es un `cp` en una linea: lo hace kronoqr-archive-wal, que
    # comprime, escribe de forma atomica, se niega a sobrescribir un segmento
    # distinto y purga los caducados. `archive_command` solo debe devolver 0 si
    # el segmento esta de verdad a salvo, porque PostgreSQL borra el original
    # en cuanto lo dice.
    command:
      - postgres
      - -c
      - timezone=UTC
      - -c
      - log_timezone=UTC
      - -c
      - hba_file=/etc/kronoqr/pg_hba.conf
      - -c
      - wal_level=replica
      - -c
      - archive_mode=on
      - -c
      - archive_timeout=900
      - -c
      - archive_command=/usr/local/bin/kronoqr-archive-wal %p %f
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # install.sh crea este directorio y se lo asigna al uid de postgres antes
      # del primer arranque (tarea 5.4): `install -d -o 70 -g 70 -m 0750`, que
      # es el uid/gid de `postgres` en la imagen Alpine. Nadie mas lo va a
      # corregir: la imagen arranca como `postgres`, no como root
      # (infra/docker/postgres/Dockerfile), y el entrypoint oficial nunca
      # ajusto otro directorio que PGDATA. Si no puede escribir, el archivado
      # falla, el WAL se acumula en el volumen de datos hasta llenar el disco y
      # PostgreSQL acaba parandose: por eso la alerta de archivado detenido
      # (infra/observability/prometheus/rules/backup.yml) es de las criticas.
      - ${BACKUP_PATH:-/var/backups/fichaje}/wal:${BACKUP_PATH:-/var/backups/fichaje}/wal
    # Sin puertos publicados: a la base de datos se llega desde la red interna
    # de Docker, nunca desde la red del hotel.
    networks:
      - app
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - redis-data:/data
    networks:
      - app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  horizon:
    <<: *app-image
    command: ["horizon"]
    depends_on:
      redis:
        condition: service_healthy

  reverb:
    <<: *app-image
    command: ["reverb"]
    expose:
      - "8080"
    depends_on:
      redis:
        condition: service_healthy

  scheduler:
    <<: *app-image
    command: ["scheduler"]
    depends_on:
      postgres:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v3.1.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=90d
    volumes:
      - ./observability/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    networks:
      observability:
        ipv4_address: 172.29.0.20
    restart: unless-stopped

  # Publica a Prometheus el resultado de la copia diaria, de su verificacion y
  # del simulacro de restauracion: los scripts de infra/scripts escriben
  # ficheros .prom en BACKUP_PATH/metrics y este servicio los sirve. Es lo que
  # convierte "el cron fallo" en una alerta y no en un hallazgo de fin de mes.
  node-exporter:
    image: prom/node-exporter:v1.9.1
    # El uid que escribe las copias (el mismo del contenedor de aplicacion).
    # El arbol de copias es 0750 y contiene datos personales cifrados: se le da
    # el uid justo en lugar de relajar los permisos del directorio.
    user: "1000:1000"
    command:
      - --collector.disable-defaults
      - --collector.textfile
      - --collector.textfile.directory=/var/backups/metrics
      - --collector.filesystem
      - --path.rootfs=/host
      - --web.listen-address=:9100
    volumes:
      - ${BACKUP_PATH:-/var/backups/fichaje}:/var/backups:ro
      # Espacio en disco del servidor, de solo lectura. Sin esto no se puede
      # avisar del disco lleno, que es el modo de fallo mas frecuente de una
      # instalacion con archivado de WAL.
      - /:/host:ro,rslave
    networks:
      - observability
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  alertmanager:
    image: prom/alertmanager:v0.28.0
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    env_file:
      - .env
    volumes:
      - ./observability/alertmanager:/etc/alertmanager:ro
      - alertmanager-data:/alertmanager
    networks:
      - observability
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.5.1
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?define GRAFANA_ADMIN_PASSWORD en el .env; install.sh lo genera}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_DATE_FORMATS_DEFAULT_TIMEZONE: utc
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      # Solo loopback del servidor. Grafana NUNCA se publica a internet.
      - "127.0.0.1:3000:3000"
    networks:
      - observability
    restart: unless-stopped

  loki:
    image: grafana/loki:3.3.2
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ./observability/loki/loki.yaml:/etc/loki/loki.yaml:ro
      - loki-data:/loki
    networks:
      - app
      - observability
    restart: unless-stopped

networks:
  app:
    name: kronoqr-app
  observability:
    name: kronoqr-observability
    ipam:
      config:
        - subnet: 172.29.0.0/24

volumes:
  postgres-data:
  redis-data:
  prometheus-data:
  alertmanager-data:
  grafana-data:
  loki-data:
