#==============================================================================
# KronoQR — despliegue en el servidor del cliente.
#
# ESTE FICHERO ES IDENTICO PARA TODOS LOS CLIENTES (ADR-017, regla dura 13).
# Todo lo que difiere entre instalaciones —dominio, certificado, rango de la
# VLAN de quioscos, umbrales, marca, licencia— vive en el .env que genera
# install.sh en el servidor del cliente. Si algo obliga a editar este fichero
# para vender a un cliente nuevo, esta mal disenado.
#
# Se entrega junto al .env, en el mismo directorio, asi que aqui Docker Compose
# si encuentra el .env sin banderas adicionales.
#
# Uso:  docker compose -f compose.prod.yaml up -d
#       (normalmente a traves de install.sh o update.sh, tareas 5.4 y 5.7)
#
# Diferencias deliberadas frente a desarrollo:
#   · imagenes publicadas y etiquetadas, nunca build local
#   · sin Mailpit, sin servidores de Vite, sin puertos de base de datos
#     publicados
#   · Alertmanager presente
#   · Grafana escuchando solo en loopback: se llega por tunel o por el propio
#     servidor, jamas expuesto a internet
#   · reinicio automatico y rotacion de logs
#
#------------------------------------------------------------------------------
# NADA DE `latest` EN PRODUCCION (doc 02 §11.6.1)
#------------------------------------------------------------------------------
# IMAGE_TAG no tiene valor por defecto y no lo tendra. `latest` es una etiqueta
# MOVIL: dos `docker compose up -d` con el mismo fichero, el mismo .env y un mes
# de diferencia levantarian codigo distinto, y la instalacion no sabria decir
# que version corre. Eso rompe tres cosas a la vez: el diagnostico (RF-PD-15
# correlaciona un error con una version), la matriz de versiones soportadas
# (§11.6.5) y la vuelta atras de update.sh, que necesita nombrar la version
# anterior.
#
# Quien la fija es install.sh, desde el fichero VERSION del paquete de entrega.
# Si falta, Compose se para con el mensaje de abajo antes de crear nada.
#
#------------------------------------------------------------------------------
# PERFIL `observability` (prometheus, node-exporter, alertmanager, grafana,
# loki, tempo, blackbox-exporter)
#------------------------------------------------------------------------------
# Van en un perfil, y el perfil viene ENCENDIDO de serie: .env.example trae
# COMPOSE_PROFILES=observability. El valor por defecto es el producto, y el
# producto incluye que alguien avise de que la copia de anoche fallo o de que
# el archivado de WAL se ha parado — que son los dos fallos que convierten una
# instalacion sana en una perdida de datos, y ninguno de los dos se nota
# mirando la pantalla.
#
# Se puede apagar (COMPOSE_PROFILES= vacio) y es una configuracion soportada:
# libera unos 700 MiB en un servidor que este justo en el minimo publicado de
# 4 GB. Lo que se pierde esta escrito en docs/cliente/operacion.md, y es
# concreto: sin este perfil NADIE avisa de una copia fallida, y verificarla
# pasa a ser una tarea manual semanal del IT.
#
# Va en el .env y no en la linea de ordenes a proposito: si install.sh pasara
# `--profile`, el siguiente `docker compose up -d` que teclee el IT del hotel
# apagaria la observabilidad sin decir nada.
#==============================================================================

name: kronoqr

x-app-image: &app-image
  image: &php-image ${IMAGE_REGISTRY:-ghcr.io/kronoqr}/php:${IMAGE_TAG:?falta IMAGE_TAG. En produccion no hay etiqueta por defecto y `latest` esta prohibido (doc 02 §11.6.1). install.sh la fija desde el fichero VERSION del paquete; si ejecutas Compose a mano, pon IMAGE_TAG=<version> en el .env}
  volumes:
    # Destino de las copias, en el disco del cliente y montado en la MISMA ruta
    # dentro del contenedor. Asi `php artisan backup:run` escribe donde dice el
    # .env sin que backup.sh tenga que saber si corre dentro o fuera de Docker.
    #
    # La copia se queda aqui: el fabricante no la recibe ni la custodia (regla
    # dura 16, RL-14). Si BACKUP_PATH apunta a un recurso de red, debe estar
    # montado antes de levantar el servicio.
    - ${BACKUP_PATH:-/var/backups/fichaje}:${BACKUP_PATH:-/var/backups/fichaje}
    #
    # Directorio de marca: el logotipo del cliente, en SU disco (RF-PD-08).
    #
    # SOLO LECTURA. La aplicacion nunca escribe aqui: el fichero lo deja el IT
    # del hotel con scp o con el gestor de ficheros que use, y la unica ruta que
    # se puede configurar desde el panel tiene que caer dentro de este
    # directorio. Ese confinamiento es lo que permite que
    # `GET /api/v1/branding/logo` sea publico sin convertirse en una lectura de
    # cualquier fichero del servidor.
    #
    # La ruta de dentro es FIJA y la de fuera configurable: `BRANDING_LOGO_ROOT`
    # del .env vale `/var/kronoqr/branding` y es lo que la aplicacion comprueba,
    # asi que la ruta que se escribe en el panel no cambia aunque el cliente
    # tenga su carpeta en otro sitio del servidor.
    #
    # No hace falta reiniciar para cambiar el logotipo: se sustituye el fichero y
    # la peticion siguiente ya lo sirve, con huella nueva en la URL.
    - ${BRANDING_PATH:-./branding}:/var/kronoqr/branding:ro
  networks:
    - app
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "20m"
      max-file: "5"

#------------------------------------------------------------------------------
# ENTORNO DE LOS SERVICIOS DE RUNTIME (AUD-1, ADR-042, regla dura 6)
#
# NINGUN contenedor de runtime recibe `env_file: .env`. Antes (hasta la 2.1.0)
# `app`, `horizon`, `reverb`, `scheduler` y `nginx` recibian el .env ENTERO, con
# la contrasena del superusuario de PostgreSQL (`DB_MIGRATION_PASSWORD`), la de
# las copias y las claves de firma del QR: quien ejecutara codigo en PHP podia
# reescribir `shift_entries` y `audit_log` y recalcular la cadena de hash.
#
# Ahora cada servicio nombra, una a una, las variables que necesita, SIN VALOR
# (`X:`): Compose las resuelve desde el .env del cliente y, si la clave no
# existe en el, la variable NO llega al contenedor y `env('X', defecto)` de
# config/ conserva su valor por defecto. NO se escribe `X: ${X:-}`: llegaria
# VACIA y anularia ese defecto. Solo se pone un valor cuando se quiere el
# defecto de Compose (`NGINX_CLIENT_MAX_BODY_SIZE`).
#
# COMO SE MANTIENE. Una variable nueva de config/ o de un SettingKey que no
# figure aqui NO llega a la aplicacion: la prueba de arquitectura de completitud
# (RuntimeEnvironmentTest) cruza .env.example, `env()` de backend/config y de los
# config/ de paquetes y las SettingKey con estas listas, y solo admite las
# exclusiones explicitas de esa prueba (cada una con su motivo).
#
# LO QUE NO ESTA AQUI, A PROPOSITO: DB_MIGRATION_PASSWORD y DB_MAINTENANCE_PASSWORD
# (solo `migrate`, `restore` y `postgres`), BACKUP_ENCRYPTION_KEY y BACKUP_DB_*
# (solo `scheduler`, que lanza las copias con el rol de SOLO LECTURA), los
# DB_*_URL y DB_*_CONNECTION (llevarian credenciales o reapuntarian el runtime
# a otro rol), y todo lo de nginx, Grafana y Alertmanager.
