# Configuracion de umbrales para `zap-baseline.py -c` (doc 07 §6, «Sin DAST»).
#
# Formato exigido por ZAP: tres columnas separadas por TABULADOR,
# `<id-regla>\t<accion>\t<descripcion>`. Con menos de tres columnas
# zap-baseline.py se niega a arrancar («Unexpected number of tokens on
# line»); verificado contra el binario real, no de memoria. Accion en
# IGNORE|INFO|WARN|FAIL. Una regla sin fila aqui se queda en su accion por
# defecto (WARN para casi todas).
#
# CADA IGNORE DE ESTE FICHERO LLEVA SU MOTIVO Y NO SE AÑADE A CIEGAS, mismo
# principio que `.semgrep/` (regla dura 2) y
# `docs/runbooks/triaje-hallazgos-seguridad.md`. El triaje completo de la
# primera ejecucion real —incluidas las reglas que NO se ignoran, con su
# hallazgo, severidad y a quien le toca cerrarlo— vive en
# docs/seguridad/evidencia/dast-2026-09-24.md.

# Ruido de cacheo, no un control de seguridad: dispara tanto sobre las 404 de
# `application/problem+json` (nunca deberian cachearse: bien) como sobre
# `/api` y `/robots.txt`, que SI son cacheables y no llevan nada sensible. La
# API ya fuerza `no-cache, private` en toda respuesta con datos (ver 10015).
10049	IGNORE	Non-Storable Content / Storable and Cacheable Content: ruido de cacheo sobre respuestas sin datos sensibles

# Advertencia informativa de que `no-cache, private` podria ser `no-cache,
# no-store, must-revalidate`: mas estricto no hace daño, pero esto no es una
# fuga - la API ya no permite que un proxy compartido guarde la respuesta
# (`private`), que es la parte que importa para datos por persona.
10015	IGNORE	Re-examine Cache-control Directives: ya es `no-cache, private`, que basta para no compartir por proxy

# CSP `connect-src` (CFG-2, 2.3.0): ya NO lleva `wss:`, solo 'self' (doc 02 §7.2), asi que la
# regla 10055 «Wildcard Directive» no tiene nada que avisar y ya no se ignora. Si vuelve a
# aparecer, alguien ha reabierto el WebSocket a cualquier host: es un hallazgo, no ruido.
# `QualityGatesTest (Architecture)` (RS-09) lo vigila.
#
# COEP (V2-DV-04, 2.3.0): las tres SPA y la API envian `Cross-Origin-Embedder-Policy:
# credentialless` (`security-headers-common.conf`), asi que la regla 90004 pasa y TAMPOCO
# tiene fila aqui. Aplica: todo es del mismo origen, y el valor `credentialless` no rompe
# ningun recurso (razonamiento en doc 02 §7.2). Si 90004 reaparece, la cabecera se ha perdido.
