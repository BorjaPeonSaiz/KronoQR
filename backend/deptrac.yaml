# Fronteras entre modulos y entre capas — doc 02 §1.6 y §3.5, reglas duras 1 y 2
# de CLAUDE.md, ADR-021 y ADR-025. Umbral del §9.2: 0 violaciones de frontera.
#
# Como leerlo. Deptrac es una lista blanca: una capa solo puede depender de lo
# que su entrada del `ruleset` enumera, mas de si misma. Todo lo demas es
# violacion. Por eso lo que NO aparece es tan importante como lo que aparece:
# que `AttendanceDomain` no nombre a `Laravel` es la regla dura 1.
#
# Las capas son disjuntas: cada clase cae en una y solo una. Si aparece un
# fichero en un sitio que no estaba previsto —un `Modules/X/Service/` o un
# noveno modulo— cae en `ModuleUnclassified`, que no puede depender de nada, y
# Deptrac falla en vez de dejarlo sin vigilar. Fallar cerrado es deliberado.
#
# Sin `skip_violations`. ADR-021 y ADR-025 lo exigen por escrito: si hiciera
# falta una excepcion, la ubicacion del fichero seria la equivocada. Las tres
# aristas de ADR-025 estan expresadas como reglas —con su capa de origen y su
# capa de destino—, no como agujeros.
#
# El emisor `use` esta activado a proposito: sin el, un `use` de un facade que
# todavia no se usa en el cuerpo no se ve, y esa es exactamente la forma en la
# que una dependencia prohibida entra en un fichero de dominio.

parameters:
  paths:
    - app

  # Las clases internas de PHP (DateTimeImmutable, JsonSerializable...) no
  # pertenecen a ninguna capa y no deben contarse como no cubiertas.
  ignore_uncovered_internal_classes: true

  analyser:
    # Sin marcado `internal`. Declarado de forma explicita porque Deptrac 4.7
    # emite un warning de PHP si la clave no aparece.
    internal_tag: ~
    types:
      - class
      - use
      - function

  layers:

    # ---------------------------------------------------------------
    # Codigo ajeno. Solo aparece como destino: nunca se analiza como origen.
    # ---------------------------------------------------------------

    # Capa propia y no parte de `Laravel` porque el §3.5 la prohibe en dos capas
    # mas (Domain y Application) que el resto del framework.
    - name: LaravelFacade
      collectors:
        - type: classNameRegex
          value: '#^Illuminate\\Support\\Facades\\#'
    # Regla dura 1: el ORM no entra en Domain ni en Application.
    - name: Eloquent
      collectors:
        - type: classNameRegex
          value: '#^Illuminate\\Database\\Eloquent\\#'
    # El resto del framework: contratos, colecciones, cola, HTTP.
    - name: Laravel
      collectors:
        - type: classNameRegex
          value: '#^(Illuminate\\(?!Support\\Facades\\|Database\\Eloquent\\)|Laravel\\)#'

    # Cualquier otra libreria de terceros: Carbon, Symfony, Psr, Ramsey,
    # Spatie, OpenTelemetry... El `must_not` de php_internal deja fuera las
    # clases internas de PHP, que no son una dependencia de infraestructura.
    - name: ExternalCode
      collectors:
        - type: bool
          must:
            - type: classNameRegex
              value: '#^(?!App\\|Tests\\|Database\\|Illuminate\\|Laravel\\)#'
          must_not:
            - type: php_internal
              value: '.*'

    # ---------------------------------------------------------------
    # Codigo de la aplicacion fuera de los modulos.
    # ---------------------------------------------------------------

    # El directorio por defecto de Laravel. En KronoQR los modelos viven en
    # Modules/*/Infrastructure/Persistence; esta capa existe para que la fila
    # «*/Domain no puede depender de App\Models\*» sea una regla y no un acuerdo.
    - name: AppEloquentModels
      collectors:
        - type: classNameRegex
          value: '#^App\\Models\\#'
    # App\Providers, App\Http\Controllers\Controller, App\Console. No puede
    # alcanzar ningun modulo: el arranque de la aplicacion no es una puerta trasera.
    - name: AppFramework
      collectors:
        - type: classNameRegex
          value: '#^App\\(?!Modules\\|Models\\)#'

    # Red de seguridad: cualquier clase bajo App\Modules\ que no encaje en
    # ninguna capa conocida —una capa inventada, un modulo nuevo sin declarar—
    # cae aqui, y aqui no se puede depender de nada.
    - name: ModuleUnclassified
      collectors:
        - type: bool
          must:
            - type: classNameRegex
              value: '#^App\\Modules\\#'
          must_not:
            - type: classNameRegex
              value: '#^App\\Modules\\(Attendance|Compliance|Workforce|Identity|Reporting|Kiosk|Product|Shared)\\(Domain|Application|Infrastructure|Http)\\#'
            - type: classNameRegex
              value: '#^App\\Modules\\(Attendance|Compliance|Workforce|Identity|Reporting|Kiosk|Product|Shared)\\[A-Za-z]+ServiceProvider$#'

    # ---------------------------------------------------------------
    # Modulo Attendance.
    # ---------------------------------------------------------------

    - name: AttendanceDomain
      collectors:
        - type: classNameRegex
          value: '#^App\\Modules\\Attendance\\Domain\\(?!Event\\)#'
    - name: AttendanceDomainEvent
      collectors:
        - type: classNameRegex
          value: '#^App\\Modules\\Attendance\\Domain\\Event\\#'
    - name: AttendanceApplicationPort
      collectors:
        - type: classNameRegex
          value: '#^App\\Modules\\Attendance\\Application\\Port\\#'
    - name: AttendanceApplication
      collectors:
        - type: classNameRegex
          value: '#^App\\Modules\\Attendance\\Application\\(?!Port\\)#'
    - name: AttendancePersistence
      collectors:
        - type: classNameRegex
          value: '#^App\\Modules\\Attendance\\Infrastructure\\Persistence\\#'
    - name: AttendanceInfrastructure
      collectors:
        - type: classNameRegex
          value: '#^App\\Modules\\Attendance\\Infrastructure\\(?!Persistence\\)#'
    - name: AttendanceHttp
      collectors:
        - type: classNameRegex
          value: '#^App\\Modules\\Attendance\\Http\\#'
    - name: AttendanceProvider
      collectors:
        - type: classNameRegex
          value: '#^App\\Modules\\Attendance\\[A-Za-z]+ServiceProvider$#'

    # ---------------------------------------------------------------
    # Modulo Compliance.
    # ---------------------------------------------------------------

    - name: ComplianceDomain
      collectors:
        - type: classNameRegex
          value: '#^App\\Modules\\Compliance\\Domain\\(?!Event\\)#'
    - name: ComplianceDomainEvent
      collectors:
        - type: classNameRegex
          value: '#^App\\Modules\\Compliance\\Domain\\Event\\#'
    - name: ComplianceApplicationPort
      collectors:
        - type: classNameRegex
          value: '#^App\\Modules\\Compliance\\Application\\Port\\#'
    - name: ComplianceApplication
      collectors:
        - type: classNameRegex
          value: '#^App\\Modules\\Compliance\\Application\\(?!Port\\)#'
    - name: CompliancePersistence
      collectors:
        - type: classNameRegex
          value: '#^App\\Modules\\Compliance\\Infrastructure\\Persistence\\#'
    - name: ComplianceInfrastructure
      collectors:
        - type: classNameRegex
          value: '#^App\\Modules\\Compliance\\Infrastructure\\(?!Persistence\\)#'
    - name: ComplianceHttp
      collectors:
        - type: classNameRegex
          value: '#^App\\Modules\\Compliance\\Http\\#'
    - name: ComplianceProvider
      collectors:
        - type: classNameRegex
          value: '#^App\\Modules\\Compliance\\[A-Za-z]+ServiceProvider$#'

    # ---------------------------------------------------------------
    # Modulo Workforce.
    # ---------------------------------------------------------------

    - name: WorkforceDomain
      collectors:
        - type: classNameRegex
          value: '#^App\\Modules\\Workforce\\Domain\\(?!Event\\)#'
    - name: WorkforceDomainEvent
      collectors:
        - type: classNameRegex
          value: '#^App\\Modules\\Workforce\\Domain\\Event\\#'
    - name: WorkforceApplicationPort
      collectors:
        - type: classNameRegex
          value: '#^App\\Modules\\Workforce\\Application\\Port\\#'
    - name: WorkforceApplication
      collectors:
        - type: classNameRegex
          value: '#^App\\Modules\\Workforce\\Application\\(?!Port\\)#'
    - name: WorkforcePersistence
      collectors:
        - type: classNameRegex
          value: '#^App\\Modules\\Workforce\\Infrastructure\\Persistence\\#'
    - name: WorkforceInfrastructure
      collectors:
        - type: classNameRegex
          value: '#^App\\Modules\\Workforce\\Infrastructure\\(?!Persistence\\)#'
    - name: WorkforceHttp
      collectors:
        - type: classNameRegex
          value: '#^App\\Modules\\Workforce\\Http\\#'
    - name: WorkforceProvider
      collectors:
        - type: classNameRegex
          value: '#^App\\Modules\\Workforce\\[A-Za-z]+ServiceProvider$#'

    # ---------------------------------------------------------------
    # Modulo Identity.
    # ---------------------------------------------------------------

    - name: IdentityDomain
      collectors:
        - type: classNameRegex
          value: '#^App\\Modules\\Identity\\Domain\\(?!Event\\)#'
    - name: IdentityDomainEvent
      collectors:
        - type: classNameRegex
          value: '#^App\\Modules\\Identity\\Domain\\Event\\#'
    - name: IdentityApplicationPort
      collectors:
        - type: classNameRegex
          value: '#^App\\Modules\\Identity\\Application\\Port\\#'
    - name: IdentityApplication
      collectors:
        - type: classNameRegex
          value: '#^App\\Modules\\Identity\\Application\\(?!Port\\)#'
    - name: IdentityPersistence
      collectors:
        - type: classNameRegex
          value: '#^App\\Modules\\Identity\\Infrastructure\\Persistence\\#'
    - name: IdentityInfrastructure
      collectors:
        - type: classNameRegex
          value: '#^App\\Modules\\Identity\\Infrastructure\\(?!Persistence\\)#'
    - name: IdentityHttp
      collectors:
        - type: classNameRegex
          value: '#^App\\Modules\\Identity\\Http\\#'
    - name: IdentityProvider
      collectors:
        - type: classNameRegex
          value: '#^App\\Modules\\Identity\\[A-Za-z]+ServiceProvider$#'

    # ---------------------------------------------------------------
    # Modulo Reporting.
    # ---------------------------------------------------------------

    - name: ReportingDomain
      collectors:
        - type: classNameRegex
          value: '#^App\\Modules\\Reporting\\Domain\\(?!Event\\)#'
    - name: ReportingDomainEvent
      collectors:
        - type: classNameRegex
          value: '#^App\\Modules\\Reporting\\Domain\\Event\\#'
    - name: ReportingApplicationPort
      collectors:
        - type: classNameRegex
          value: '#^App\\Modules\\Reporting\\Application\\Port\\#'
    - name: ReportingApplication
      collectors:
        - type: classNameRegex
          value: '#^App\\Modules\\Reporting\\Application\\(?!Port\\)#'
    - name: ReportingPersistence
      collectors:
        - type: classNameRegex
          value: '#^App\\Modules\\Reporting\\Infrastructure\\Persistence\\#'
    - name: ReportingInfrastructure
      collectors:
        - type: classNameRegex
          value: '#^App\\Modules\\Reporting\\Infrastructure\\(?!Persistence\\)#'
    - name: ReportingHttp
      collectors:
        - type: classNameRegex
          value: '#^App\\Modules\\Reporting\\Http\\#'
    - name: ReportingProvider
      collectors:
        - type: classNameRegex
          value: '#^App\\Modules\\Reporting\\[A-Za-z]+ServiceProvider$#'

    # ---------------------------------------------------------------
    # Modulo Kiosk.
    # ---------------------------------------------------------------

    - name: KioskDomain
      collectors:
        - type: classNameRegex
          value: '#^App\\Modules\\Kiosk\\Domain\\(?!Event\\)#'
    - name: KioskDomainEvent
      collectors:
        - type: classNameRegex
          value: '#^App\\Modules\\Kiosk\\Domain\\Event\\#'
    - name: KioskApplicationPort
      collectors:
        - type: classNameRegex
          value: '#^App\\Modules\\Kiosk\\Application\\Port\\#'
    - name: KioskApplication
      collectors:
        - type: classNameRegex
          value: '#^App\\Modules\\Kiosk\\Application\\(?!Port\\)#'
    - name: KioskPersistence
      collectors:
        - type: classNameRegex
          value: '#^App\\Modules\\Kiosk\\Infrastructure\\Persistence\\#'
    - name: KioskInfrastructure
      collectors:
        - type: classNameRegex
          value: '#^App\\Modules\\Kiosk\\Infrastructure\\(?!Persistence\\)#'
    - name: KioskHttp
      collectors:
        - type: classNameRegex
          value: '#^App\\Modules\\Kiosk\\Http\\#'
    - name: KioskProvider
      collectors:
        - type: classNameRegex
          value: '#^App\\Modules\\Kiosk\\[A-Za-z]+ServiceProvider$#'

    # ---------------------------------------------------------------
    # Modulo Product.
    # ---------------------------------------------------------------

    - name: ProductDomain
      collectors:
        - type: classNameRegex
          value: '#^App\\Modules\\Product\\Domain\\(?!Event\\)#'
    - name: ProductDomainEvent
      collectors:
        - type: classNameRegex
          value: '#^App\\Modules\\Product\\Domain\\Event\\#'
    - name: ProductApplicationPort
      collectors:
        - type: classNameRegex
          value: '#^App\\Modules\\Product\\Application\\Port\\#'
    - name: ProductApplication
      collectors:
        - type: classNameRegex
          value: '#^App\\Modules\\Product\\Application\\(?!Port\\)#'
    - name: ProductPersistence
      collectors:
        - type: classNameRegex
          value: '#^App\\Modules\\Product\\Infrastructure\\Persistence\\#'
    - name: ProductInfrastructure
      collectors:
        - type: classNameRegex
          value: '#^App\\Modules\\Product\\Infrastructure\\(?!Persistence\\)#'
    - name: ProductHttp
      collectors:
        - type: classNameRegex
          value: '#^App\\Modules\\Product\\Http\\#'
    - name: ProductProvider
      collectors:
        - type: classNameRegex
          value: '#^App\\Modules\\Product\\[A-Za-z]+ServiceProvider$#'

    # ---------------------------------------------------------------
    # Modulo Shared.
    # ---------------------------------------------------------------

    - name: SharedDomain
      collectors:
        - type: classNameRegex
          value: '#^App\\Modules\\Shared\\Domain\\(?!Event\\)#'
    - name: SharedDomainEvent
      collectors:
        - type: classNameRegex
          value: '#^App\\Modules\\Shared\\Domain\\Event\\#'
    - name: SharedApplicationPort
      collectors:
        - type: classNameRegex
          value: '#^App\\Modules\\Shared\\Application\\Port\\#'
    - name: SharedApplication
      collectors:
        - type: classNameRegex
          value: '#^App\\Modules\\Shared\\Application\\(?!Port\\)#'
    # Todo Shared/Infrastructure MENOS Export. La exclusion no es cosmetica: en
    # esta capa viven adaptadores (SystemClock, CachePinAttempts...) que ninguna
    # capa Http debe poder alcanzar, y el dialecto CSV si. Separarlos es lo que
    # permite conceder lo segundo sin conceder lo primero.
    - name: SharedInfrastructure
      collectors:
        - type: classNameRegex
          value: '#^App\\Modules\\Shared\\Infrastructure\\(?!Export\\)#'

    # Las decisiones de codificacion del CSV del producto (CsvDialect). No es un
    # adaptador de ningun puerto: es la forma de un fichero que el producto
    # entrega por dos caminos —la exportacion legal de Compliance y la descarga
    # del portal, que sirve Reporting/Http— y que tiene que ser la misma por los
    # dos. Se declara como capa propia, con sus dos aristas nombradas una a una,
    # en lugar de abrir SharedInfrastructure entera a Http.
    - name: SharedExport
      collectors:
        - type: classNameRegex
          value: '#^App\\Modules\\Shared\\Infrastructure\\Export\\#'
    - name: SharedHttp
      collectors:
        - type: classNameRegex
          value: '#^App\\Modules\\Shared\\Http\\#'
    - name: SharedProvider
      collectors:
        - type: classNameRegex
          value: '#^App\\Modules\\Shared\\[A-Za-z]+ServiceProvider$#'

  ruleset:

    # --------------------------------------------------------------- Attendance

    # Regla dura 1. Ni framework, ni ORM, ni libreria de terceros, ni otro
    # modulo, ni las capas de arriba de este. Solo objetos de valor de Shared.
    AttendanceDomain:
      - AttendanceDomainEvent
      - SharedDomain
      - SharedDomainEvent

    AttendanceDomainEvent:
      - AttendanceDomain
      - SharedDomain
      - SharedDomainEvent

    # Los puertos hablan en tipos del dominio propio, de Shared o escalares
    # (ADR-025, restriccion 2): sin Laravel y sin tipos de otro modulo.
    AttendanceApplicationPort:
      - AttendanceDomain
      - AttendanceDomainEvent
      - SharedDomain
      - SharedDomainEvent
      - SharedApplicationPort

    # Sin LaravelFacade y sin Eloquent (§3.5, fila «Facades»): la persistencia
    # entra por un puerto. Http nunca aparece: las dependencias van hacia dentro.
    AttendanceApplication:
      - AttendanceDomain
      - AttendanceDomainEvent
      - AttendanceApplicationPort
      - SharedDomain
      - SharedDomainEvent
      - SharedApplication
      - SharedApplicationPort
      - Laravel
      - ExternalCode

    AttendancePersistence:
      - AttendanceDomain
      - AttendanceDomainEvent
      - AttendanceApplicationPort
      - AttendanceApplication
      - SharedDomain
      - SharedDomainEvent
      - SharedApplication
      - SharedApplicationPort
      - SharedInfrastructure
      - Laravel
      - LaravelFacade
      - Eloquent
      - ExternalCode

    AttendanceInfrastructure:
      - AttendanceDomain
      - AttendanceDomainEvent
      - AttendanceApplicationPort
      - AttendanceApplication
      - SharedDomain
      - SharedDomainEvent
      - SharedApplication
      - SharedApplicationPort
      - SharedInfrastructure
      - Laravel
      - LaravelFacade
      - Eloquent
      - ExternalCode
      - AttendancePersistence

    # Http entra por Application. Alcanza Persistence solo por los idiomas de
    # Laravel que lo necesitan (route-model binding y Resources), nunca
    # Infrastructure: un controlador no conoce adaptadores.
    AttendanceHttp:
      - AttendanceDomain
      - AttendanceDomainEvent
      - AttendanceApplicationPort
      - AttendanceApplication
      - AttendancePersistence
      - SharedDomain
      - SharedDomainEvent
      - SharedApplication
      - SharedApplicationPort
      - Laravel
      - LaravelFacade
      - Eloquent
      - ExternalCode
      - AppFramework

    # El proveedor es la raiz de composicion del modulo: enlaza puerto con
    # adaptador y registra rutas, listeners y comandos.
    AttendanceProvider:
      - AttendanceDomain
      - AttendanceDomainEvent
      - AttendanceApplicationPort
      - AttendanceApplication
      - AttendancePersistence
      - AttendanceInfrastructure
      - AttendanceHttp
      - SharedDomain
      - SharedDomainEvent
      - SharedApplication
      - SharedApplicationPort
      - SharedInfrastructure
      - Laravel
      - LaravelFacade
      - Eloquent
      - ExternalCode
      - AppFramework

    # --------------------------------------------------------------- Compliance

    # Regla dura 1. Ni framework, ni ORM, ni libreria de terceros, ni otro
    # modulo, ni las capas de arriba de este. Solo objetos de valor de Shared.
    ComplianceDomain:
      - ComplianceDomainEvent
      - SharedDomain
      - SharedDomainEvent

    ComplianceDomainEvent:
      - ComplianceDomain
      - SharedDomain
      - SharedDomainEvent

    # Los puertos hablan en tipos del dominio propio, de Shared o escalares
    # (ADR-025, restriccion 2): sin Laravel y sin tipos de otro modulo.
    ComplianceApplicationPort:
      - ComplianceDomain
      - ComplianceDomainEvent
      - SharedDomain
      - SharedDomainEvent
      - SharedApplicationPort

    # Sin LaravelFacade y sin Eloquent (§3.5, fila «Facades»): la persistencia
    # entra por un puerto. Http nunca aparece: las dependencias van hacia dentro.
    # Doc 02 §1.6: Compliance escucha los eventos de dominio de Attendance.
    ComplianceApplication:
      - ComplianceDomain
      - ComplianceDomainEvent
      - ComplianceApplicationPort
      - SharedDomain
      - SharedDomainEvent
      - SharedApplication
      - SharedApplicationPort
      - Laravel
      - ExternalCode
      - AttendanceDomainEvent

    CompliancePersistence:
      - ComplianceDomain
      - ComplianceDomainEvent
      - ComplianceApplicationPort
      - ComplianceApplication
      - SharedDomain
      - SharedDomainEvent
      - SharedApplication
      - SharedApplicationPort
      - SharedInfrastructure
      - Laravel
      - LaravelFacade
      - Eloquent
      - ExternalCode

    # Doc 02 §1.6: los listeners de los eventos de otros modulos viven aqui.
    #
    # `IdentityDomainEvent` entra con la tarea 1.5 y no amplia la frontera: la
    # via era ya la concedida —evento de dominio recogido por un listener de
    # Compliance/Infrastructure— y el propio puerto `AuditTrail` la nombra por
    # escrito («los de credencial y dispositivo, con la 1.13 y la 1.5»). La
    # alternativa habria sido que `Identity` importara `Compliance`, que es la
    # arista que el §1.6 no concede en ningun caso. La dependencia sigue siendo
    # de solo lectura y solo sobre EVENTOS: ni Domain, ni Application, ni
    # Persistence de Identity aparecen aqui.
    ComplianceInfrastructure:
      - ComplianceDomain
      - ComplianceDomainEvent
      - ComplianceApplicationPort
      - ComplianceApplication
      - SharedDomain
      - SharedDomainEvent
      - SharedApplication
      - SharedApplicationPort
      - SharedInfrastructure
      - Laravel
      - LaravelFacade
      - Eloquent
      - ExternalCode
      - CompliancePersistence
      # CsvLegalExportWriter escribe el fichero de la Inspeccion con el mismo
      # dialecto que el CSV del portal. Ver la capa SharedExport.
      - SharedExport
      - AttendanceDomainEvent
      - IdentityDomainEvent
      # `WorkforceDomainEvent` entra con la tarea 1.13 y por la misma via y el
      # mismo motivo que `IdentityDomainEvent`: RF-ID-09 exige que la emision, la
      # entrega y el restablecimiento del PIN queden en `audit_log`, y `Workforce`
      # no puede importar `Compliance`. Sigue siendo de solo lectura y solo sobre
      # EVENTOS.
      - WorkforceDomainEvent

    # Http entra por Application. Alcanza Persistence solo por los idiomas de
    # Laravel que lo necesitan (route-model binding y Resources), nunca
    # Infrastructure: un controlador no conoce adaptadores.
    ComplianceHttp:
      - ComplianceDomain
      - ComplianceDomainEvent
      - ComplianceApplicationPort
      - ComplianceApplication
      - CompliancePersistence
      - SharedDomain
      - SharedDomainEvent
      - SharedApplication
      - SharedApplicationPort
      - Laravel
      - LaravelFacade
      - Eloquent
      - ExternalCode
      - AppFramework

    # El proveedor es la raiz de composicion del modulo: enlaza puerto con
    # adaptador y registra rutas, listeners y comandos.
    # Doc 02 §1.6: el mapa evento -> listener nombra las clases de evento.
    ComplianceProvider:
      - ComplianceDomain
      - ComplianceDomainEvent
      - ComplianceApplicationPort
      - ComplianceApplication
      - CompliancePersistence
      - ComplianceInfrastructure
      - ComplianceHttp
      - SharedDomain
      - SharedDomainEvent
      - SharedApplication
      - SharedApplicationPort
      - SharedInfrastructure
      - Laravel
      - LaravelFacade
      - Eloquent
      - ExternalCode
      - AppFramework
      - AttendanceDomainEvent
      - IdentityDomainEvent
      # Tarea 1.13: el mapa evento -> listener del PIN nombra sus dos eventos.
      - WorkforceDomainEvent

    # --------------------------------------------------------------- Workforce

    # Regla dura 1. Ni framework, ni ORM, ni libreria de terceros, ni otro
    # modulo, ni las capas de arriba de este. Solo objetos de valor de Shared.
    WorkforceDomain:
      - WorkforceDomainEvent
      - SharedDomain
      - SharedDomainEvent

    WorkforceDomainEvent:
      - WorkforceDomain
      - SharedDomain
      - SharedDomainEvent

    # Los puertos hablan en tipos del dominio propio, de Shared o escalares
    # (ADR-025, restriccion 2): sin Laravel y sin tipos de otro modulo.
    WorkforceApplicationPort:
      - WorkforceDomain
      - WorkforceDomainEvent
      - SharedDomain
      - SharedDomainEvent
      - SharedApplicationPort

    # Sin LaravelFacade y sin Eloquent (§3.5, fila «Facades»): la persistencia
    # entra por un puerto. Http nunca aparece: las dependencias van hacia dentro.
    WorkforceApplication:
      - WorkforceDomain
      - WorkforceDomainEvent
      - WorkforceApplicationPort
      - SharedDomain
      - SharedDomainEvent
      - SharedApplication
      - SharedApplicationPort
      - Laravel
      - ExternalCode

    WorkforcePersistence:
      - WorkforceDomain
      - WorkforceDomainEvent
      - WorkforceApplicationPort
      - WorkforceApplication
      - SharedDomain
      - SharedDomainEvent
      - SharedApplication
      - SharedApplicationPort
      - SharedInfrastructure
      - Laravel
      - LaravelFacade
      - Eloquent
      - ExternalCode

    # ADR-025: Workforce/Infrastructure implementa puertos declarados por el
    # nucleo. La arista llega a Application/Port y para ahi: ni Domain, ni
    # casos de uso, ni Persistence de Attendance.
    WorkforceInfrastructure:
      - WorkforceDomain
      - WorkforceDomainEvent
      - WorkforceApplicationPort
      - WorkforceApplication
      - SharedDomain
      - SharedDomainEvent
      - SharedApplication
      - SharedApplicationPort
      - SharedInfrastructure
      - Laravel
      - LaravelFacade
      - Eloquent
      - ExternalCode
      - WorkforcePersistence
      - AttendanceApplicationPort

    # Http entra por Application. Alcanza Persistence solo por los idiomas de
    # Laravel que lo necesitan (route-model binding y Resources), nunca
    # Infrastructure: un controlador no conoce adaptadores.
    WorkforceHttp:
      - WorkforceDomain
      - WorkforceDomainEvent
      - WorkforceApplicationPort
      - WorkforceApplication
      - WorkforcePersistence
      - SharedDomain
      - SharedDomainEvent
      - SharedApplication
      - SharedApplicationPort
      - Laravel
      - LaravelFacade
      - Eloquent
      - ExternalCode
      - AppFramework

    # El proveedor es la raiz de composicion del modulo: enlaza puerto con
    # adaptador y registra rutas, listeners y comandos.
    # ADR-025, restriccion 3: el enlace puerto -> adaptador se declara en el
    # ServiceProvider del satelite, que por eso nombra el puerto del nucleo.
    WorkforceProvider:
      - WorkforceDomain
      - WorkforceDomainEvent
      - WorkforceApplicationPort
      - WorkforceApplication
      - WorkforcePersistence
      - WorkforceInfrastructure
      - WorkforceHttp
      - SharedDomain
      - SharedDomainEvent
      - SharedApplication
      - SharedApplicationPort
      - SharedInfrastructure
      - Laravel
      - LaravelFacade
      - Eloquent
      - ExternalCode
      - AppFramework
      - AttendanceApplicationPort

    # --------------------------------------------------------------- Identity

    # Regla dura 1. Ni framework, ni ORM, ni libreria de terceros, ni otro
    # modulo, ni las capas de arriba de este. Solo objetos de valor de Shared.
    IdentityDomain:
      - IdentityDomainEvent
