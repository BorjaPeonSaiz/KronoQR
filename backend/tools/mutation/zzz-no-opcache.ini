; Configuracion de PHP para la MUTACION, y solo para ella (RQ-10, doc 02 §9.2).
;
; Pest aplica cada mutante interceptando el protocolo `file://` con un stream
; wrapper: el fichero de dominio sigue igual en disco y lo que cambia es lo que
; PHP lee al compilarlo. OPcache guarda el bytecode del fichero ORIGINAL
; indexado por su ruta —y este contenedor tiene ademas `opcache.file_cache`, que
; lo conserva entre procesos—, asi que el mutante se compila una vez y a partir
; de ahi se sirve el original. La prueba pasa, el mutante figura como
; superviviente y el MSI baja sin que nadie haya escrito una linea peor.
;
; Medido en este repositorio, sobre TimeRange.php y las mismas pruebas:
;
;     con OPcache      6 de 27 mutantes muertos   -> MSI 22,2 %
;     sin OPcache     27 de 27 mutantes muertos   -> MSI 100 %
;
; El sintoma enganaba dos veces: el numero era distinto en cada ejecucion —segun
; lo que hubiera ya en la cache— y los mismos mutantes, lanzados de uno en uno,
; SI morian. Un umbral que depende del contenido de una cache no es un umbral.
;
; Se carga solo desde `make mutate`, con PHP_INI_SCAN_DIR aditivo, para no
; penalizar al resto del entorno: OPcache sigue encendido para todo lo demas.
opcache.enable_cli=0
