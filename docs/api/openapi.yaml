  /api/v1/employees/{uuid}/offboard:
    parameters:
      - $ref: '#/components/parameters/EmployeeUuid'
    post:
      operationId: offboardEmployee
      summary: Baja de empleado
      description: |
        Da de baja a una persona: `status` pasa a `terminated` y se registra la
        fecha de cese (RF-GP-03).

        **Es una desactivacion logica y nunca un borrado** (regla dura 5). La
        ficha, sus tramos y sus jornadas siguen ahi: el registro horario se
        conserva cuatro años (RL-02) y una inspeccion puede pedir el de alguien
        que ya no trabaja en el hotel.

        A partir de la baja, el empleado no ficha (RN-14) y su credencial queda
        revocada.
      tags: [Workforce]
      security:
        - managementToken: ['employees:*']
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OffboardEmployeeRequest'
            examples:
              cese:
