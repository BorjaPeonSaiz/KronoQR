  /api/v1/credentials:
    post:
      operationId: issueCredential
      summary: Emision de credencial
      description: |
        Emite la tarjeta QR de un empleado y la deja **pendiente de imprimir**
        (RF-QR-01, RF-QR-03).

        **Esta respuesta no contiene ningun QR, y ninguna otra de esta API lo
        contiene tampoco** ([ADR-034](../adr/ADR-034-el-token-nace-al-imprimir-no-al-emitir.md)).
        Emitir crea el derecho a una tarjeta; el token, su firma y su hash se
        acuñan **al imprimir**, dentro del mismo acto que dibuja el PDF
        (`POST /credentials/{uuid}/print`), que es el unico canal por el que el
        payload sale del servidor. Por eso `key_id` es `null` aqui: hasta que no
        se firma no hay clave con la que se haya firmado, y elegirla al imprimir
        es lo que permite que una tarjeta emitida antes de una rotacion salga con
        la clave nueva (doc 02 §5.3).

        **Mientras este pendiente de imprimir, la credencial no puede fichar.**
        No tiene hash por el que resolverla, asi que ningun escaneo la alcanza.
        Es exactamente lo que cuenta el panel de estado de RF-QR-08 y la metrica
        `credentials_pending_print`.

        **Una credencial activa por empleado** (doc 01 §5.2). Emitir cuando ya
        hay una devuelve `409`; para sustituirla se envia `reissue: true` con su
        `reason`, y entonces la anterior se revoca y la nueva se emite en la
        misma transaccion. Ese es el primer paso del flujo de tarjeta perdida:
        revocar y reemitir aqui, imprimir despues.
      tags: [Identity]
      security:
        - managementToken: ['credentials:*']
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueCredentialRequest'
            examples:
              primera-emision:
                summary: Primera tarjeta de una persona
                value:
                  employee_uuid: 0199f0c2-1f4a-7c3e-9b21-4d5e6f7a8b90
              reemision-por-perdida:
                summary: Reemision, que revoca la anterior en el mismo acto
                value:
                  employee_uuid: 0199f0c2-1f4a-7c3e-9b21-4d5e6f7a8b90
                  reissue: true
                  reason: Tarjeta extraviada en el turno de noche
      responses:
        '201':
          description: |
            Credencial emitida y **pendiente de imprimir**. Todavia no puede
            fichar con ella nadie.
          headers:
            Cache-Control:
              description: |
                Incluye siempre `no-store`. No lleva ningun secreto, pero es
                gestion de credenciales de personas identificadas y no tiene por
                que quedarse en la cache de un proxy.
              schema:
                type: string
                examples: ['no-store, private']
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssuedCredential'
              examples:
                emitida:
                  value:
                    uuid: 0199f0d1-2a5b-7d4f-8c32-5e6f7a8b9c01
                    employee_uuid: 0199f0c2-1f4a-7c3e-9b21-4d5e6f7a8b90
                    key_id: null
                    issued_at: '2026-08-19T06:02:31.000000Z'
                    printed_at: null
                    delivered_at: null
                    revoked_at: null
                    revoked_reason: null
                    status: active
                    reissue: false
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/credentials/{uuid}/revoke:
    parameters:
      - $ref: '#/components/parameters/CredentialUuid'
    post:
      operationId: revokeCredential
      summary: Revocacion de credencial
      description: |
        Retira una tarjeta: perdida, robo, deterioro, sustitucion o baja
        (RF-QR-03).

        **`reason` es obligatorio.** Es lo que distingue «se perdio antes de
        entregarla» de «el empleado la perdio», y lo que explica meses despues
        por que una persona no pudo fichar un martes. Acompana al asiento de
        `audit_log`. **No se escriben nombres ahi**: el titular ya viaja como
        `employee_uuid`.

        **No borra nada** (regla dura 5): la fila conserva su historia y sus
        escaneos. Por eso es un `POST` con nombre propio y no un `DELETE` — no
        hay ningun `DELETE` en esta API.

        **No es idempotente**: revocar una credencial ya revocada devuelve `409`.
        Sobrescribir la primera revocacion cambiaria el motivo y el momento que
        ya constan en la auditoria.

        A partir de aqui, el siguiente escaneo de esa tarjeta se rechaza. Desde
        el quiosco, de forma **indistinguible** de cualquier otro rechazo
        (RS-03).
      tags: [Identity]
      security:
        - managementToken: ['credentials:*']
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RevokeCredentialRequest'
            examples:
              perdida:
                value:
                  reason: Tarjeta extraviada en el turno de noche
      responses:
        '200':
          description: Credencial revocada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Credential'
              examples:
                revocada:
                  value:
                    uuid: 0199f0d1-2a5b-7d4f-8c32-5e6f7a8b9c01
                    employee_uuid: 0199f0c2-1f4a-7c3e-9b21-4d5e6f7a8b90
                    key_id: a3
                    issued_at: '2026-08-19T06:02:31.000000Z'
                    printed_at: null
                    delivered_at: null
                    revoked_at: '2026-08-20T21:14:02.000000Z'
                    revoked_reason: Tarjeta extraviada en el turno de noche
                    status: revoked
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/v1/credentials/status:
    get:
      operationId: credentialStatusBoard
      summary: Panel de estado de credenciales
      description: |
        **Quien no puede fichar todavia** (RF-QR-08).

        El doc 02 §5.5 dice para que existe: *«RF-QR-08 existe para que RRHH vea
        de un vistazo quien no puede fichar todavia. Sin el, el problema se
        descubre delante del quiosco a las 06:00.»*

        **La fila es del empleado, no de la credencial.** Es la decision que hace
        util al panel: quien no puede fichar porque nunca se le emitio nada no
        tiene ninguna credencial que listar, y un panel de credenciales dejaria
        fuera precisamente a esas personas.

        **Los cinco estados son derivados y no hay ninguna columna `status`** en
        la base de datos: se calculan de `printed_at`, `delivered_at` y
        `revoked_at`. Un estado almacenado y otro derivado acaban discrepando, y
        aqui discrepar significa dar por entregada una tarjeta que nadie tiene.

        **`pending` no filtra el `summary`.** Aunque `pending=true` deje tres
        filas, el resumen sigue diciendo «3 de 60»: el numero que importa es
        cuanta gente falta *de la que hay*. Es tambien lo que se publica como
        `employees_without_delivered_credential{site}` y
        `credentials_pending_print{site}` (doc 02 §8.2). **`employee_uuid` si lo
        acota** — ver su descripcion.

        **`employee_uuid` sirve a la ficha de empleado**, que muestra la fila de
        estado de la tarjeta de esa persona con sus acciones. Sin el, la unica
        forma seria pedir el tablero entero y quedarse con una fila, lo que
        divulga —y audita como divulgada— toda la plantilla cada vez que
        alguien abre una ficha (ADR-037, RS-05).

        **Solo aparece la plantilla de alta.** Quien esta de baja o suspendido no
        sale de este panel, ni en el `summary` ni con `employee_uuid`: el panel
        responde a «quien no puede fichar todavia» y la metrica que lo acompaña
        cuenta a quien hay que darle una tarjeta. Pedir la fila de una persona no
        activa devuelve `data: []` con `200`.

        **Esta lectura queda registrada** (RS-05, RL-15) porque reparte un
        conjunto de personas — **salvo** cuando se acota con `employee_uuid`, que
        es la lectura de una sola persona y no deja asiento, igual que
        `GET /employees/{uuid}` ([ADR-037](../adr/ADR-037-que-lecturas-de-datos-personales-dejan-asiento.md)).

        Sin paginacion a proposito: la respuesta es la plantilla de la instalacion
        —decenas o pocos cientos de filas— y es una tabla que se ordena y se
        filtra entera en el panel. Paginar obligaria a pedir todas las paginas
        para poder contar, que es lo que este endpoint viene a evitar.
      tags: [Identity]
      security:
        - managementToken: ['credentials:*']
      parameters:
        - name: employee_uuid
          in: query
          required: false
          description: |
            Acota el tablero a **una sola persona** —la ficha de empleado del
            panel—, de modo que `data` traiga 0 o 1 filas.

            Se combina con `pending` mediante **Y logico**: una persona que ya
            tiene su tarjeta en la mano cuando se pide `pending=true` devuelve
            `data: []`.

            **`summary` se acota con la persona**, al contrario que con
            `pending`: cuenta **solo la fila devuelta** —`employees` vale 1, o 0
            si no hay fila—. No es la cobertura de la plantilla: calcularla
            obliga a recorrerla entera, que es justo lo que este filtro evita.
            Quien necesite «faltan 3 de 60» pide el tablero sin `employee_uuid`.

            Un UUID con forma valida que no corresponde a ningun empleado **de
            alta** —porque no existe, o porque esa persona esta de baja o
            suspendida— devuelve `data: []` y un `summary` a cero con `200`, **no
            `404`**: este tablero no es un recurso por persona, es una consulta
            acotada. Una forma invalida si es `422`. Se acepta en mayusculas o en
            minusculas: la comparacion es sobre el tipo `uuid`, que no distingue.

            **Acotado a una persona, la lectura no deja asiento en el trail**
            (ADR-037): es una sola persona y no un conjunto, el mismo criterio
            que `GET /employees/{uuid}`.
          schema:
            type: string
            format: uuid
          example: 0199f0c2-1f4a-7c3e-9b21-4d5e6f7a8b90
        - name: pending
          in: query
          required: false
          description: |
            Solo quien **todavia no tiene la tarjeta en la mano**: sin
            credencial, pendiente de imprimir, pendiente de entregar y revocada.
            Con la lista completa de un hotel de trescientas personas delante,
            las cuatro que faltan no se ven.
          schema:
            type: boolean
            default: false
        - name: key_id
          in: query
          required: false
          description: |
            **A quien le falta reimprimir durante una rotacion de clave**
            (RF-QR-07, doc 02 §5.3): solo las personas cuya tarjeta **en uso**
            sigue firmada con ese `key_id`.

            Es lo que hace practicable la reimpresion progresiva. Durante el
            solape conviven dos claves: la tarjeta vieja sigue fichando y la
            reemision espera turno de impresora. Este filtro dice cuantas quedan
            por relevar, y **cuando devuelve `data: []` la clave anterior se
            puede retirar** — que es literalmente el procedimiento del §5.3.

            **Filtra las filas y no el `summary`**, igual que `pending`: el
            denominador sigue siendo la plantilla. El propio `summary` ya trae
            `retiring_key_id` y `pending_reprint`, asi que el panel sabe si hay
            una rotacion abierta sin tener que preguntarlo.

            Solo cuentan las credenciales **activas**: una revocada firmada con
            esa clave ya no impide retirarla y no aparece.

            Un `key_id` con forma valida que no conoce nadie devuelve `data: []`
            con `200`, **no `404`** ni `422`: no es un error del cliente y
            comprobarlo contra el llavero convertiria el parametro en un oraculo
            de que claves tiene configuradas la instalacion. Una forma invalida
            —mas de dos caracteres, o no alfanumerica— si es `422`.

            La rotacion **no tiene endpoint** y no lo tendra: se ejecuta con
            `php artisan credentials:rotate-key`. Rotar la clave es un acto
            operativo con semanas de logistica de reimpresion detras, no un boton
            de panel. Aqui solo se **lee**.
          schema:
            type: string
            pattern: '^[A-Za-z0-9]{2}$'
          example: a3
      responses:
        '200':
          description: Estado de las credenciales de la plantilla de alta.
          headers:
            Cache-Control:
              description: |
                Incluye siempre `no-store`. Es una lista nominal de la plantilla
                y no tiene por que quedarse en la cache de un proxy.
              schema:
                type: string
                examples: ['no-store, private']
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialStatusBoard'
              examples:
                pendientes:
                  summary: Dos personas todavia sin tarjeta
                  value:
                    data:
                      - employee_uuid: 0199f0c2-1f4a-7c3e-9b21-4d5e6f7a8b90
                        employee_code: E7K2M9QX4B
                        full_name: Lucia Martinez Prieto
                        department_name: Recepcion
                        status: pending_print
                        credential:
                          uuid: 0199f0d1-2a5b-7d4f-8c32-5e6f7a8b9c01
                          employee_uuid: 0199f0c2-1f4a-7c3e-9b21-4d5e6f7a8b90
                          key_id: null
                          issued_at: '2026-08-19T06:02:31.000000Z'
                          printed_at: null
                          delivered_at: null
                          revoked_at: null
                          revoked_reason: null
                          status: active
                      - employee_uuid: 0199f0c2-1f4a-7c3e-9b21-4d5e6f7a8b91
                        employee_code: E3D8N1PZ7C
                        full_name: Youssef Amrani
                        department_name: null
                        status: no_credential
                        credential: null
                    summary:
                      employees: 60
                      pending_print: 1
                      without_delivered_credential: 2
                      retiring_key_id: null
                      pending_reprint: 0
                      active_unknown_key: 0
                rotacion:
                  summary: Rotacion de clave a medias — a doce les falta la tarjeta nueva
                  value:
                    data:
                      - employee_uuid: 0199f0c2-1f4a-7c3e-9b21-4d5e6f7a8b90
