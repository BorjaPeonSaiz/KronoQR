  /api/v1/employees/{uuid}/pin/reset:
    parameters:
      - $ref: '#/components/parameters/EmployeeUuid'
    post:
      operationId: resetEmployeePin
      summary: Restablecimiento del PIN
      description: |
        Genera un PIN nuevo de 6 digitos, invalida el anterior sustituyendo su
        hash y **reinicia el contador de bloqueo por intentos** (RF-ID-09,
        RF-ID-06, RF-AT-11). Quien pide un PIN nuevo tiene que poder usarlo en
        el momento, aunque estuviera bloqueado.

        **El PIN viaja una sola vez y solo en esta respuesta.** No se almacena
        en claro —solo `employees.pin_hash`—, no aparece en `GET
        /employees/{uuid}`, no se escribe en `audit_log` ni en ningun log, y no
        hay ningun endpoint que lo devuelva despues. Si se pierde, se
        restablece.

        **La entrega es presencial** (regla dura 12, ADR-015). Ningun camino de
        este producto envia un PIN por correo electronico, ni por enlace de
        recuperacion, ni por invitacion: el correo del empleado es opcional y
        nada puede depender de el.

        **No dice si el empleado existe.** Un `uuid` desconocido y uno fuera del
        alcance de quien pregunta responden lo mismo, `404` (regla dura 17).
      tags: [Workforce]
      security:
        - managementToken: ['employees:*']
      responses:
        '200':
          description: |
            PIN restablecido. **Es la unica vez que se muestra**: quien lo
            recibe lo anota o lo entrega en ese momento.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssuedPin'
              examples:
                restablecido:
                  value:
                    employee_uuid: 0199f0c2-1f4a-7c3e-9b21-4d5e6f7a8b90
                    pin: '483920'
                    issued_at: '2026-08-20T09:14:03.512Z'
                    pin_status: issued
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/v1/employees/{uuid}/pin/deliver:
    parameters:
      - $ref: '#/components/parameters/EmployeeUuid'
    post:
      operationId: recordEmployeePinDelivery
      summary: Registro de la entrega del PIN
      description: |
        Anota que el PIN se ha entregado en mano: a quien, cuando y quien lo
        entrego (RF-ID-09), igual que la entrega de la tarjeta (RF-QR-06). La
        hoja de instrucciones del empleado se entrega en el mismo acto: es un
        unico momento presencial.

        **No devuelve ningun PIN**, ni el que se entrego ni ningun otro: solo el
        acuse. El PIN solo existe en claro en la respuesta que lo emitio.

        Registrar la entrega de un PIN que no se ha emitido es un `409`: no se
        puede entregar lo que no existe. Repetir la entrega tambien lo es, por
        lo mismo que la revocacion de una credencial —sobrescribirla cambiaria
        el momento y el responsable que ya constan en `audit_log`—.
      tags: [Workforce]
      security:
        - managementToken: ['employees:*']
      responses:
        '200':
          description: Entrega registrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PinDeliveryReceipt'
              examples:
                entregado:
                  value:
                    employee_uuid: 0199f0c2-1f4a-7c3e-9b21-4d5e6f7a8b90
                    delivered_at: '2026-08-20T09:20:41.004Z'
                    delivered_by: 0199f0aa-1111-7000-8000-0123456789ab
                    pin_status: delivered
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/v1/employees/{uuid}/contracts:
    parameters:
      - $ref: '#/components/parameters/EmployeeUuid'
    get:
      operationId: listEmploymentContracts
      summary: Contratos de un empleado
      description: |
        La serie historica de contratos de una persona, del mas antiguo al mas
        reciente (RF-GP-02, documento 01 §5.5).

        **Es historico y no un campo de la ficha.** Las horas contratadas cambian
        —de 20 h a 40 h en temporada alta, una reduccion de jornada— y el informe
        de `GET /api/v1/reports/period` compara cada dia contra lo que estaba
        pactado **ese dia**. Con las horas en la ficha, firmar un anexo en julio
        cambiaria retroactivamente el informe de marzo.

        **`valid_to` nulo significa vigente.** Como mucho hay un contrato abierto,
        y en ningun caso dos vigencias se solapan: lo garantiza una restriccion de
        exclusion en PostgreSQL, no una convencion. Registrar uno nuevo cierra el
        anterior el dia anterior, de modo que la serie no tiene ni huecos ni
        solapes.

        **Sin paginacion**, a proposito: una persona tiene unos pocos contratos y
        la serie solo se entiende entera. Paginarla partiria la cadena de
        vigencias justo donde se ve si tiene huecos.

        **`rrhh+`.** El `responsable_departamento` no llega: le falta el ambito
        `employees:*` (documento 02 §7.3) y la policy tampoco lo admite. Las
        condiciones laborales pactadas no son suyas.
      tags: [Workforce]
      security:
        - managementToken: ['employees:*']
      responses:
        '200':
          description: |
            Los contratos de esa persona. Una sin ninguno devuelve `data` vacio,
            no un `404`: no tener contrato registrado es una respuesta, y ademas
            es la que explica los dias que el informe cuenta como «sin contrato».
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmploymentContractCollection'
              examples:
                cambio-de-jornada:
                  summary: Un contrato cerrado y el vigente
                  value:
                    data:
                      - id: 41
                        employee_uuid: 0199f0c2-1f4a-7c3e-9b21-4d5e6f7a8b90
                        weekly_hours: 20
                        annual_hours: 1040
                        schedule_type: turnos
                        valid_from: '2026-01-01'
                        valid_to: '2026-03-15'
                        is_current: false
                      - id: 58
                        employee_uuid: 0199f0c2-1f4a-7c3e-9b21-4d5e6f7a8b90
                        weekly_hours: 40
                        annual_hours: 1780
                        schedule_type: turnos
                        valid_from: '2026-03-16'
                        valid_to: null
                        is_current: true
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    post:
      operationId: registerEmploymentContract
      summary: Registrar el contrato de un empleado
      description: |
        Registra un contrato **abierto** y cierra el anterior el dia anterior a su
        inicio, en la misma transaccion (RF-GP-02).

        **No admite `valid_to`, y es deliberado.** Dejar escribir la fecha de fin
        permitiria crear un hueco de dias sin contrato vigente sin que nada
        avisara, y el informe de periodo los contaria como «sin contrato» sin que
        nadie entienda por que. Cuando la relacion laboral termina, lo que hay es
        una baja: `POST /api/v1/employees/{uuid}/offboard`.

        **No hay `PATCH` ni `DELETE`.** Un contrato no se edita: se registra otro
        y el anterior queda cerrado con su fecha (regla dura 5).

        **Queda auditado** con la accion `employment_contract.registered`:
        `weekly_hours` es la cifra contra la que se mide la jornada de una
        persona, asi que cambiarla mueve su desviacion y sus horas de exceso sin
        tocar un solo fichaje.
      tags: [Workforce]
      security:
        - managementToken: ['employees:*']
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEmploymentContractRequest'
            examples:
              jornada-completa:
                value:
                  weekly_hours: 40
                  annual_hours: 1780
                  schedule_type: turnos
                  valid_from: '2026-03-16'
      responses:
        '201':
          description: |
            El contrato registrado, ya vigente. Se devuelve entero para que el
            panel sustituya la fila sin volver a pedir la lista.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmploymentContract'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            Ya hay un contrato vigente en esa fecha. El cuerpo es correcto; lo que
            no encaja es el estado, asi que la accion siguiente es releer los
            contratos de esa persona, no reescribir el formulario.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/v1/attendance/live:
    get:
      operationId: listLivePresence
      summary: Presencia en tiempo real
      description: |
        Quien esta fichado **ahora mismo** y quien no, con la hora de entrada, el
        quiosco de origen y el departamento (RF-PA-01). Es la fotografia inicial
        del panel de presencia; a partir de ahi la vista se mantiene al dia por
        WebSocket, y si el canal no se establece, por sondeo (ADR-011).

        **Es funcionalidad accesoria** en el sentido de ADR-023 y este endpoint
        es su suelo: con la licencia caducada el tiempo real degrada a sondeo
        —`meta.realtime.enabled` pasa a `false`— y esta consulta **sigue
        respondiendo**. El registro legal no se degrada nunca (ADR-019, regla
        dura 15), y esta vista es ademas la que permite que el panel no se quede
        en blanco cuando el WebSocket no llega.

        **Solo lee.** Nada de lo que devuelve cambia el registro horario:
        rectificarlo es `PATCH /api/v1/shift-entries/{uuid}`, con el ambito
        `attendance:correct`, que este endpoint no exige ni concede.

        **Sin paginacion, y es una decision.** Una instalacion es un hotel
        (ADR-040) con una decena de departamentos y hasta 500 empleados
        (documento 02, Anexo A): la respuesta completa es una fila por persona
        del alcance y el panel la virtualiza (RNF-P-04). Paginar obligaria al
        panel a reconciliar cada mensaje del WebSocket contra una pagina que
        quiza no contiene a esa persona, que es como una vista en vivo empieza a
        mostrar a alguien dos veces. `status=present`, que es el valor por
        omision, ademas se resuelve sobre el indice parcial de turnos abiertos y
        devuelve como mucho tantas filas como gente haya dentro del hotel.

        **El alcance por departamento se aplica en la consulta** (RF-ID-03), no
        despues: un `responsable_departamento` recibe a la gente de los
        departamentos que dirige, y los recuentos de `meta` describen **eso
        mismo** y no la plantilla entera. Un responsable sin ningun departamento
        asignado recibe `data` vacio y los recuentos a cero, no un `403`: el
        listado no deniega, acota.

        **`department_id` fuera del alcance no es un `403`, es un resultado
        vacio.** Igual que en `GET /api/v1/employees`: un filtro es una peticion
        de acotar, y responder `403` convertiria el desplegable de departamentos
        del panel en un generador de errores. El `403` con asiento en `audit_log`
        se reserva para cuando se pide un recurso concreto de otra persona.

        **Todos los instantes salen en UTC** (regla dura 3) y la zona del centro
        viaja en `meta.time_zone`: la conversion la hace el panel, no el
        servidor. **El tiempo transcurrido se calcula contra
        `meta.generated_at`**, no contra el reloj del navegador: una tablet o un
        portatil con el reloj desfasado mostraria minutos trabajados que nadie ha
        trabajado.

        **`device` es el quiosco donde esa persona ficho la entrada**, resuelto
        por el `scan_events` que abrio el tramo. Es `null` cuando no hay ninguno,
        que es exactamente el caso de un tramo dado de alta o corregido a mano
        desde el panel (`origin: manual_admin`) y el de una carga inicial
        (`import`).

        **Es un acceso a datos personales de terceros y queda registrado en
        `audit_log`** (RS-05), con el alcance —cuantas filas, que filtros— y
        nunca con lo divulgado (regla dura 21). Los asientos de esta vista se
        **agrupan por cuenta en una ventana**: el panel sondea cada 15 s y un
        asiento por sondeo llenaria la tabla de cuatro años de retencion con la
        misma lectura repetida, ademas de meter miles de escrituras diarias bajo
        el candado global de ADR-010 —el mismo por el que pasa cada fichaje—. El
        primer asiento de cada ventana se escribe siempre y lleva cuantas
        lecturas representa.
      tags: [Reporting]
      security:
        - managementToken: ['attendance:read']
      parameters:
        - $ref: '#/components/parameters/DepartmentFilter'
        - $ref: '#/components/parameters/PresenceStatusFilter'
        - $ref: '#/components/parameters/EmployeeSearch'
      responses:
        '200':
          description: |
            La foto de la presencia en el instante `meta.generated_at`, ordenada
            por apellidos y nombre. El orden es estable —el UUID desempata— para
            que una fila no salte de sitio entre dos sondeos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LivePresenceBoard'
              examples:
                cambio-de-turno:
                  value:
                    data:
                      - employee_uuid: 0199f0c2-1f4a-7c3e-9b21-4d5e6f7a8b90
                        full_name: Youssef Amrani
                        department:
                          id: 3
                          name: Cocina
                        status: present
                        shift_entry_uuid: 0199f2c1-8a10-7b40-9c50-6d7e8f9a0b11
                        clocked_in_at: '2026-03-14T05:00:00.000000Z'
                        origin: qr_kiosk
                        device:
                          uuid: 0199f0d3-3c71-7e52-9a13-6f7a8b9c0d12
                          name: Entrada de personal
                    meta:
                      generated_at: '2026-03-14T09:12:03.418000Z'
                      time_zone: Europe/Madrid
                      present_count: 1
                      absent_count: 0
                      total: 1
                      realtime:
                        enabled: true
                        key: kronoqr
                        path: /app
                        auth_endpoint: /api/v1/broadcasting/auth
                        event: presence.updated
                        channels: ['presence.all']
                        poll_interval_seconds: 15
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/v1/employees/{uuid}/workdays:
    parameters:
      - $ref: '#/components/parameters/EmployeeUuid'
    get:
      operationId: listEmployeeWorkDays
      summary: Jornadas de un empleado
      description: |
        El registro horario de una persona, jornada a jornada, con sus tramos
        vigentes, el total del dia y el historico completo de correcciones
        (RF-PA-03, Anexo B del documento 01). Es lo que pinta el detalle de
        jornada del panel.

        **Solo lee.** Ninguna respuesta de este endpoint cambia nada: rectificar
        es `PATCH /api/v1/shift-entries/{uuid}`, que exige el ambito
        `attendance:correct` y no este.

        **La suma cuadra, y no por convenio.** `total_minutes` de cada jornada es
        exactamente la suma de `duration_minutes` de los tramos que vienen en
        `shift_entries` —un tramo abierto todavia no aporta minutos y cuenta como
        cero—. No hay redondeo por medio: los minutos son enteros desde el
        esquema (RN-06, ADR-007, regla dura 7).

        **Un turno nocturno es UN tramo** (RN-05, ADR-006, regla dura 4). Un
        22:00 → 06:00 aparece una sola vez, en la jornada de su hora de inicio, y
        no partido entre dos dias. Filtrar por `from`/`to` filtra por `work_date`,
        no por la hora de las marcas: pedir el dia 15 no devuelve el tramo que
        empezo el 14 a las 22:00.

        **Las dos marcas de cada fichaje** (regla dura 9). `clocked_in_at` es
        cuando la persona ficho —lo que vale para el registro legal— y
        `clocked_in_recorded_at` cuando el servidor lo recibio: si el fichaje
        llego por la cola offline del quiosco, se diferencian en horas. El
        `recorded_at` de la fila dice cuando se escribio **esa version** del
        tramo, que en una correccion es el momento de la correccion y no el del
        fichaje.

        **Todos los instantes salen en UTC** (regla dura 3) y ademas con su
        equivalente en la zona del centro (`*_local`, con el desplazamiento
        escrito). La zona viaja en la respuesta —por jornada y por tramo— para
        que el cliente no tenga que adivinarla ni usar la del navegador.

        **Nada se oculta y nada se borra** (regla dura 5). `shift_entries` trae
        solo las versiones **vigentes**, pero `corrections` trae la cadena
        entera: quien la firmo, cuando, con que motivo y con las marcas de antes
        y de despues. Un dia cuyos tramos se anularon todos sigue apareciendo,
        con la lista de tramos vacia y su historico intacto.

        **Es un acceso a datos personales de un tercero** y queda registrado en
        `audit_log` con su alcance —cuantas jornadas, que rango— y nunca con lo
        divulgado (RS-05).

        **Alcance por departamento** (RF-ID-03). Un `responsable_departamento`
        lee el registro de la gente de sus departamentos y recibe `403` para
        cualquier otra persona, con el intento anotado en `audit_log`.

        **El propio empleado no entra por aqui.** El `self` del Anexo B se sirve
        en `GET /api/v1/me/workdays`, con ambito `self:read` y sesion de portal
        (ADR-015): esta ruta es la de gestion y exige una cuenta de panel.
      tags: [Reporting]
      security:
        - managementToken: ['attendance:read']
      parameters:
        - $ref: '#/components/parameters/WorkDateFrom'
        - $ref: '#/components/parameters/WorkDateTo'
      responses:
        '200':
          description: |
            Las jornadas del rango, de la mas antigua a la mas reciente. Un
            empleado sin jornadas en el rango devuelve `data` vacio, no un `404`:
            no haber trabajado esos dias es una respuesta.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeWorkDays'
              examples:
                jornada-con-correccion:
                  value:
                    employee_uuid: 0199f0c2-1f4a-7c3e-9b21-4d5e6f7a8b90
                    time_zone: Europe/Madrid
                    from: '2026-03-14'
                    to: '2026-03-14'
                    data:
                      - work_date: '2026-03-14'
                        time_zone: Europe/Madrid
                        total_minutes: 485
                        shift_count: 1
                        has_open_shift: false
                        has_incident: false
                        recalculated_at: '2026-03-14T15:22:41.900000Z'
                        shift_entries:
                          - uuid: 0199f2c1-8a10-7b40-9c50-6d7e8f9a0b11
                            version: 2
                            status: closed
                            time_zone: Europe/Madrid
                            clocked_in_at: '2026-03-14T05:00:00.000000Z'
                            clocked_in_at_local: '2026-03-14T06:00:00.000000+01:00'
                            clocked_in_recorded_at: '2026-03-14T05:00:02.113000Z'
                            clock_in_source: qr_kiosk
                            clocked_out_at: '2026-03-14T13:05:00.000000Z'
                            clocked_out_at_local: '2026-03-14T14:05:00.000000+01:00'
                            clocked_out_recorded_at: null
                            clock_out_source: manual_admin
                            duration_minutes: 485
                            recorded_at: '2026-03-14T15:22:41.900000Z'
                        corrections:
                          - shift_entry_uuid: 0199f2c1-8a10-7b40-9c50-6d7e8f9a0b11
                            action: closed
                            performed_at: '2026-03-14T15:22:41.900000Z'
                            performed_at_local: '2026-03-14T16:22:41.900000+01:00'
                            performed_by:
                              uuid: 0199f0aa-1111-7000-8000-0123456789ab
                              name: Cuenta de RRHH
                            reason_code: OLVIDO_FICHAJE_SALIDA
