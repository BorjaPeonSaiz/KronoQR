          $ref: '#/components/responses/TooManyRequests'

  /api/v1/credentials/print-batch:
    post:
      operationId: printCredentialBatch
      summary: Impresion masiva en A4
      description: |
        Devuelve **un solo PDF** en A4 con todas las credenciales **pendientes de
        imprimir** del centro indicado (RF-QR-04).

        El doc 02 §5.5 dice para que existe: *«La hoja A4 con varias tarjetas por
        pagina es lo que hace viable dar de alta a 40 personas de temporada en
        una tarde.»*

        **Este es el acto que acuña los QR**
        ([ADR-034](../adr/ADR-034-el-token-nace-al-imprimir-no-al-emitir.md)). Cada
        tarjeta del lote recibe aqui su token, firmado con la clave **vigente en
        este momento** —no con la de la emision, que nunca existio—, y a partir
        del `200` esas credenciales pueden fichar.

        **Un solo documento con N tarjetas, no N documentos.** Una sola llamada
        cubre los sesenta empleados de un centro.

        **`--pending` es la unica seleccion posible: no hay reimpresion.** No
        existe ningun parametro que incluya las ya impresas. La idempotencia del
        lote es esa: **la segunda llamada no encuentra nada pendiente y devuelve
        `204`**. Es lo que impide que dos ejecuciones del mismo lote produzcan dos
        juegos de tarjetas con QR distinto de los que solo el ultimo vale.

        **Todo o nada.** Si entre la seleccion y la escritura alguien imprime una
        de ellas, la operacion entera se deshace con `409` y no sale ninguna
        tarjeta. Un lote a medias es peor que ninguno: nadie sabria cuales de las
        sesenta de la hoja valen.

        **El PDF es un instrumento al portador.** No se guarda en el servidor, no
        viaja por correo y no se cachea (`Cache-Control: no-store`). Quien lo
        tenga puede fabricar la tarjeta de otra persona y fichar por ella.

        **Riesgo residual aceptado:** si esta respuesta se pierde despues de
        confirmarse la escritura, los tokens son irrecuperables y esas
        credenciales quedan impresas sin que nadie tenga la tarjeta. Se resuelve
        revocando con motivo «impresion fallida» y reemitiendo — el runbook
        `tarjeta-perdida-o-rota.md` lo describe. Lo que distingue ese caso de «el
        empleado la perdio» es que `delivered_at` sigue vacio.
      tags: [Identity]
      security:
        - managementToken: ['credentials:*']
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrintCredentialBatchRequest'
            examples:
              todas-las-pendientes:
                summary: Todas las pendientes de la instalacion
                value: {}
      responses:
        '200':
          description: |
            El PDF del lote. Las credenciales que lleva dentro constan ya como
            impresas.
          headers:
            Cache-Control:
              description: 'Siempre `no-store`: el cuerpo permite fichar en nombre de otras personas.'
              schema:
                type: string
                examples: ['no-store, private']
            Content-Disposition:
              description: Adjunto, con un nombre de fichero que no lleva ningun nombre de persona.
              schema:
                type: string
                examples: ['attachment; filename="credenciales.pdf"']
            X-Kronoqr-Printed-Count:
              description: |
                Cuantas tarjetas lleva el documento. Va en cabecera porque el
                cuerpo es binario y el panel necesita poder decir «se han impreso
                40» sin abrir el PDF.
              schema:
                type: integer
                minimum: 1
              example: 40
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '204':
          description: |
            **No habia nada pendiente de imprimir.** No es un error: es la forma
            que toma la idempotencia del lote (ADR-034). La segunda pasada del
            mismo lote llega siempre aqui.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/credentials/{uuid}/print:
    parameters:
      - $ref: '#/components/parameters/CredentialUuid'
    post:
      operationId: printCredential
      summary: Generar el PDF de una tarjeta
      description: |
        Devuelve el PDF de **una** tarjeta, en formato tarjeta de credito
        (85,6 × 54 mm), y **acuña su QR en el mismo acto** (RF-QR-04, RF-QR-05,
        [ADR-034](../adr/ADR-034-el-token-nace-al-imprimir-no-al-emitir.md)).

        Antes de esta llamada la credencial existia como derecho administrativo y
        **ningun escaneo la alcanzaba**: no habia hash por el que resolverla. A
        partir del `200` puede fichar.

        **El QR se genera con correccion de errores nivel Q** (RF-QR-05). El
        doc 02 §5.1 justifica el margen: *«es lo que permite que una tarjeta
        sobreviva una temporada de uso diario en una cocina, con roces, grasa y
        dobleces»*.

        **Es un `POST` y no un `GET` aunque devuelva un documento**, y esa es la
        parte que importa: esta llamada **cambia el estado del sistema de forma
        irreversible**. Un `GET` invitaria a que un navegador la repitiera al
        recargar, a que un proxy la cachease y a que alguien la pusiera en un
        enlace.

        **No hay reimpresion y no existe ningun parametro que la habilite.** Una
        credencial ya impresa devuelve `409`. «Reimprimir» solo puede significar
        acuñar otro token, y eso mata la tarjeta que quiza ya esta en un bolsillo.
        Reponer una tarjeta perdida es **revocar → reemitir
        (`POST /credentials` con `reissue`) → imprimir la nueva**: tres actos y
        tres asientos de auditoria.

        **El PDF es un instrumento al portador.** No se guarda en el servidor, no
        viaja por correo y no se cachea. **Es el unico canal por el que el payload
        del QR sale de este sistema**; ninguna respuesta JSON de esta API lo
        contiene.

        **Riesgo residual aceptado:** si esta respuesta se pierde despues de
        confirmarse la escritura, el token es irrecuperable y la credencial queda
        impresa sin que nadie tenga la tarjeta. Se resuelve revocando con motivo
        «impresion fallida» y reemitiendo (runbook `tarjeta-perdida-o-rota.md`).
      tags: [Identity]
      security:
        - managementToken: ['credentials:*']
      responses:
        '200':
          description: El PDF de la tarjeta. La credencial consta ya como impresa.
          headers:
            Cache-Control:
              description: 'Siempre `no-store`: el cuerpo permite fichar en nombre de otra persona.'
              schema:
                type: string
                examples: ['no-store, private']
            Content-Disposition:
              description: Adjunto, con un nombre de fichero que no lleva ningun nombre de persona.
              schema:
                type: string
                examples: ['attachment; filename="credencial.pdf"']
            X-Kronoqr-Printed-Count:
              description: Siempre `1` en este endpoint. Se declara para que el cliente lo trate igual que el lote.
              schema:
                type: integer
                enum: [1]
              example: 1
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            La credencial **ya se imprimio** o esta revocada. No hay reimpresion
            (ADR-034). Tambien llega aqui la carrera: alguien la imprimio entre
            la lectura y la escritura.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                ya-impresa:
                  value:
                    type: 'urn:kronoqr:problem:conflict'
                    title: Conflicto con el estado actual
                    status: 409
                    detail: 'La credencial 0199f0d1-2a5b-7d4f-8c32-5e6f7a8b9c01 ya se imprimio: su token no se puede volver a acuñar.'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/credentials/{uuid}/deliver:
    parameters:
      - $ref: '#/components/parameters/CredentialUuid'
    post:
      operationId: deliverCredential
      summary: Registrar la entrega de una tarjeta
      description: |
        Registra que la tarjeta llego a manos de su titular, **con fecha y
        responsable** (RF-QR-06).

        **No es burocracia.** El doc 02 §5.5: *«es lo que distingue "la tarjeta se
        perdio antes de darsela" de "el empleado la perdio", que son incidencias
        distintas»*. Sin este dato las dos se ven igual desde la base de datos, y
        la segunda tiene consecuencias para una persona que la primera no tiene.

        **El responsable es quien tiene la sesion abierta.** No se acepta en el
        cuerpo: dejar que se declare permitiria firmar una entrega a nombre de un
        companero. Por consola —donde no hay sesion— se declara con `--by=`, y el
        actor del asiento de auditoria queda como `system`.

        **La entrega es un solo acto presencial y arrastra tres cosas**: la
        tarjeta, el PIN del portal y la hoja de instrucciones. El runbook
        `alta-nuevo-empleado.md` describe el acto completo; partirlo en tres
        momentos garantiza que dos de los tres no ocurran.

        **No es idempotente**: marcar dos veces la misma entrega devuelve `409`.
        Sobrescribirla cambiaria el responsable y el momento que ya constan en la
        auditoria.

        Una credencial **sin imprimir** tambien devuelve `409`: antes de imprimir
        no hay tarjeta que entregar.
      tags: [Identity]
      security:
        - managementToken: ['credentials:*']
      responses:
        '200':
          description: Entrega registrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Credential'
              examples:
                entregada:
                  value:
                    uuid: 0199f0d1-2a5b-7d4f-8c32-5e6f7a8b9c01
                    employee_uuid: 0199f0c2-1f4a-7c3e-9b21-4d5e6f7a8b90
                    key_id: a3
                    issued_at: '2026-08-19T06:02:31.000000Z'
                    printed_at: '2026-08-20T07:11:02.000000Z'
                    delivered_at: '2026-08-21T06:40:15.000000Z'
                    revoked_at: null
                    revoked_reason: null
                    status: active
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            Ya estaba entregada, todavia no se ha impreso, o esta revocada.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                sin-imprimir:
                  value:
                    type: 'urn:kronoqr:problem:conflict'
                    title: Conflicto con el estado actual
                    status: 409
                    detail: 'La credencial 0199f0d1-2a5b-7d4f-8c32-5e6f7a8b9c01 no se ha impreso todavia: no hay tarjeta que entregar.'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/v1/shift-entries:
    post:
      operationId: addShiftEntry
      summary: Alta manual de un tramo
      description: |
        Da de alta un tramo que **nunca se ficho** (RF-PA-04, accion `created`):
        el olvido de fichaje de entrada, el dia sin tarjeta entregada y las
        jornadas anteriores a la puesta en marcha (`ALTA_RETROACTIVA`).

        Un tramo escrito a mano vale para la nomina exactamente igual que uno
        escaneado: pasa por las mismas invariantes —RN-01 un solo turno abierto,
        RN-02 sin solapes, RN-03 salida posterior a entrada— y solo se distingue
        por su origen `manual_admin` y por la fila de `shift_corrections` que lo
        explica, con autor, momento y motivo (RN-13, RL-04).

        **La jornada se declara, no se deduce.** `work_date` es obligatoria
        porque derivarla de la fecha civil de la entrada mandaria la vuelta de
        una pausa de madrugada al dia siguiente y partiria el turno de noche
        (RN-05, ADR-006, ADR-024).
      tags: [Attendance]
      security:
        - managementToken: ['attendance:correct']
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddShiftEntryRequest'
            examples:
              olvido-de-entrada:
                value:
                  employee_uuid: 0199f0c2-1f4a-7c3e-9b21-4d5e6f7a8b90
                  work_date: '2026-08-14'
                  clocked_in_at: '2026-08-14T06:00:00Z'
                  clocked_out_at: '2026-08-14T14:00:00Z'
                  reason_code: OLVIDO_FICHAJE_ENTRADA
                  reason_text: null
      responses:
        '201':
          description: Tramo dado de alta, con el total del dia recalculado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CorrectedShiftEntry'
              examples:
                alta:
                  value:
                    employee_uuid: 0199f0c2-1f4a-7c3e-9b21-4d5e6f7a8b90
                    work_date: '2026-08-14'
                    action: created
                    shift_entry_uuid: 0199f2c1-8a10-7b40-9c50-6d7e8f9a0b11
                    superseded_shift_entry_uuid: null
                    version: 1
                    status: closed
                    clocked_in_at: '2026-08-14T06:00:00.000000Z'
                    clocked_out_at: '2026-08-14T14:00:00.000000Z'
                    daily_total_minutes: 480
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/v1/shift-entries/{uuid}:
    parameters:
      - $ref: '#/components/parameters/ShiftEntryUuid'
    patch:
      operationId: correctShiftEntry
      summary: Corregir las marcas de un tramo
      description: |
        Rectifica la hora de entrada, la de salida o las dos (RF-PA-04, RN-13).
        Cubre tambien el **cierre de un turno que quedo abierto**: desde fuera es
        la misma peticion, y cual de las dos acciones fue lo decide el servidor
        mirando el estado anterior, no quien llama.

        **Nada se sobrescribe** (regla dura 5). La version anterior se conserva
        en `superseded` con sus marcas, su origen y su motivo, y la corregida
        nace con `version + 1`.

        **La respuesta trae un `uuid` distinto del que enviaste** (ADR-035):
        cada version es una fila y `shift_entries.uuid` es unico. Por eso van los
        dos —`shift_entry_uuid`, el vigente, y `superseded_shift_entry_uuid`, el
        que acaba de dejar de serlo— y por eso repetir el `PATCH` sobre el
        identificador viejo responde `409` y no `404`: ese tramo existio y ya no
        es la version vigente.

        **Un campo ausente significa «no lo toques»**, nunca «vacialo». No hay
        forma de retirar una salida ya registrada: un tramo que no debio cerrarse
        se anula y se vuelve a dar de alta, y asi consta lo que paso.

        **Corregir la entrada que abre la jornada cruzando la medianoche local se
        rechaza con `422`** (ADR-035, RN-05): mover horas de un dia a otro son dos
        actos separados y auditados —anular en origen, dar de alta en destino—, no
        un efecto lateral de un `PATCH`.
      tags: [Attendance]
      security:
        - managementToken: ['attendance:correct']
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CorrectShiftEntryRequest'
            examples:
              cierre-de-turno-olvidado:
                value:
                  clocked_out_at: '2026-08-14T14:05:00Z'
                  reason_code: OLVIDO_FICHAJE_SALIDA
                  reason_text: null
      responses:
        '200':
          description: |
            Tramo corregido. `shift_entry_uuid` es la version **nueva** y
            `superseded_shift_entry_uuid` la que queda como historico.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CorrectedShiftEntry'
              examples:
                cerrado:
                  value:
                    employee_uuid: 0199f0c2-1f4a-7c3e-9b21-4d5e6f7a8b90
                    work_date: '2026-08-14'
                    action: closed
                    shift_entry_uuid: 0199f2c1-8a10-7b40-9c50-6d7e8f9a0b11
                    superseded_shift_entry_uuid: 0199f0c2-9b30-7a21-8d40-1e2f3a4b5c60
                    version: 2
                    status: closed
                    clocked_in_at: '2026-08-14T06:00:00.000000Z'
                    clocked_out_at: '2026-08-14T14:05:00.000000Z'
                    daily_total_minutes: 485
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            Ese tramo ya no es la version vigente —lo corrigio o lo anulo alguien
            antes— o la correccion dejaria dos turnos abiertos o dos tramos
            solapados (RN-01, RN-02, ADR-026). Vuelve a leer la jornada.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                ya-sustituido:
                  value:
                    type: 'urn:kronoqr:problem:conflict'
                    title: Conflicto con el estado actual
                    status: 409
                    detail: Ese tramo ya no es la version vigente. Vuelve a cargar la jornada antes de corregir.
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/v1/shift-entries/{uuid}/void:
    parameters:
      - $ref: '#/components/parameters/ShiftEntryUuid'
    post:
      operationId: voidShiftEntry
      summary: Anular un tramo
      description: |
        Declara que **este tramo no ocurrio** (RF-PA-04, accion `voided`,
        ADR-026). El caso tipico es el doble escaneo que produjo dos tramos donde
        solo hubo uno.

        **No se borra nada** (regla dura 5): la fila se queda en la tabla con sus
        marcas, su autor y su motivo, y lo unico que cambia es que sale del
        conjunto vigente. Con eso deja de contar para el total del dia (RN-06),
        libera el hueco de RN-02 y, si estaba abierto, deja al empleado sin turno
        abierto (RN-01).

        **No crea version nueva**, y esa es toda la diferencia con corregir: no
        hay una version posterior de un hecho que no paso. Por eso
        `superseded_shift_entry_uuid` viene a `null`.

        Es `POST` y no `DELETE` porque en esta API no hay ningun `DELETE`: anular
        es un hecho con nombre propio y con asiento en `audit_log`.

        **Reservado a RRHH**, mientras corregir la hora es de manager+: anular
        quita horas del registro de una persona y no es la misma
        responsabilidad que ajustar diez minutos.
      tags: [Attendance]
      security:
        - managementToken: ['attendance:correct']
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VoidShiftEntryRequest'
            examples:
              doble-escaneo:
                value:
                  reason_code: ERROR_DE_ESCANEO_DUPLICADO
                  reason_text: null
      responses:
        '200':
          description: Tramo anulado, con el total del dia recalculado a la baja.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CorrectedShiftEntry'
              examples:
                anulado:
                  value:
                    employee_uuid: 0199f0c2-1f4a-7c3e-9b21-4d5e6f7a8b90
                    work_date: '2026-08-14'
                    action: voided
                    shift_entry_uuid: 0199f0c2-9b30-7a21-8d40-1e2f3a4b5c60
                    superseded_shift_entry_uuid: null
                    version: 1
                    status: voided
                    clocked_in_at: '2026-08-14T06:00:00.000000Z'
                    clocked_out_at: '2026-08-14T14:00:00.000000Z'
                    daily_total_minutes: 0
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            Ese tramo ya estaba anulado o ya fue sustituido por una version
            posterior (ADR-026). Vuelve a leer la jornada.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                ya-anulado:
                  value:
                    type: 'urn:kronoqr:problem:conflict'
                    title: Conflicto con el estado actual
                    status: 409
                    detail: Ese tramo ya no es la version vigente. Vuelve a cargar la jornada antes de anular.
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/v1/reports/period:
    get:
      operationId: generatePeriodReport
      summary: Informe de horas por periodo
      description: |
        Horas trabajadas por periodo, con granularidad diaria, semanal, mensual o
        de rango libre; agregadas por empleado, departamento o centro; y
        comparadas con las horas contratadas de cada dia (RF-IN-01, RF-IN-02,
        RF-IN-03).

        ## Los criterios de inclusion vienen **en la respuesta**

        `meta.criteria` trae, en el idioma de la peticion, exactamente que se ha
        contado y que no. Un informe de horas sin esa lista es una tabla de
        numeros que cada persona interpreta a su manera, y esa interpretacion
        acaba discutiendose en una reunion de nomina. En resumen:

        - **Los totales salen de la proyeccion de jornadas ya consolidada**, no se
          recalculan aqui (RN-06, ADR-007, regla dura 7).
        - **Cada turno cuenta entero en la jornada en la que empezo** (RN-05,
          regla dura 4): un 22:00 → 06:00 suma en el dia de entrada. La
          agrupacion es por jornada, nunca por la hora de las marcas en UTC.
        - **Los tramos anulados y las versiones sustituidas no cuentan**: solo la
          version vigente de cada tramo (ADR-026).
        - **Una incidencia sin resolver no descuenta horas**: se cuenta en
          `incident_days` y se deja a la vista (RN-08: detectar no corrige).
        - **Los dias sin actividad aparecen con cero y no se omiten.** Para un
          informe de absentismo, omitirlos es un error.
          `days_with_activity + days_without_activity` es siempre
          `days_in_period`.
        - **Los dias con un turno todavia abierto no aportan minutos** salvo que
          se pida `include_open_shifts`; en los dos casos cuentan como dia con
          actividad y salen en `open_shift_days`.

        ## Las horas, dos veces

        `*_minutes` es un entero para quien calcula y `worked`, `contracted`,
        `deviation` y `overtime` son `HH:MM` para quien lee. **Nunca una hora
        decimal**: «7,75 horas» obliga a interpretar y ademas cambia de sentido
        segun el separador decimal del programa que abra el fichero.

        ## Lo contratado (RF-IN-03)

        Se prorratea por **dia natural** de vigencia del contrato:
        `dias de vigencia × horas semanales ÷ 7`, redondeado una sola vez al
        final. Se reparte por dia natural y no por dia laborable porque el
        producto no modela el cuadrante teorico de nadie: repartir entre cinco
        dias inventaria un descanso en fin de semana que en un hotel no existe.

        Los dias sin contrato vigente **no suman y se informan**:
        `meta.contract_coverage` dice cuantos son y a cuantas personas afectan. No
        se supone ningun contrato por omision — seria inventar un dato de nomina.

        ## Quien entra

        Toda la plantilla del alcance, **incluida la que causo baja durante el
        periodo** (RN-14, RF-GP-03): un informe de marzo que se olvidara de quien
        se fue el dia 20 daria un total que no cuadra con ninguna nomina.

        ## Alcance y auditoria

        El alcance por departamento se aplica **dentro de la consulta**, agregados
        incluidos (RF-ID-03): un total por centro servido a quien alcanza un solo
        departamento seria una fuga por agregacion. `department_id` y
        `employee_uuid` son **filtros**: uno fuera del alcance devuelve un informe
        vacio, no un `403`.

        Generarlo es un acceso a datos personales de terceros y **queda registrado
        en `audit_log`** con su alcance —periodo, granularidad, cuantas personas—
        y nunca con lo divulgado (RS-05).

        ## Sincrono, con techo

        Se entrega en el acto por debajo del presupuesto de RNF-P-05. Por encima
        —mas de tres meses de rango, demasiadas filas o una consulta que agota su
        tiempo— responde `422` remitiendo a la generacion en diferido de RF-IN-06,
        en vez de intentarlo y acabar en un `504` con la base de datos del fichaje
        ocupada.

        **`reports:*`, no `reports:legal`.** El `auditor` lleva el estrecho y se
        queda fuera: lo suyo es `GET /api/v1/reports/legal-export`. El
        `responsable_departamento` tampoco llega: el documento 02 §7.3 no le da
        ningun ambito de informes.
      tags: [Reporting]
      security:
        - managementToken: ['reports:*']
      parameters:
        - $ref: '#/components/parameters/PeriodReportFrom'
        - $ref: '#/components/parameters/PeriodReportTo'
        - $ref: '#/components/parameters/ReportGranularityParam'
        - $ref: '#/components/parameters/ReportGroupByParam'
        - $ref: '#/components/parameters/ReportDepartmentId'
        - $ref: '#/components/parameters/ReportEmployeeUuid'
        - $ref: '#/components/parameters/ReportIncludeOpenShifts'
      responses:
        '200':
          description: |
            Las filas del informe, ordenadas por sujeto y despues por periodo, con
            los criterios con los que se calcularon.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PeriodReport'
              examples:
                mes-por-empleado:
                  summary: Marzo por empleado, con cambio de contrato a mitad de mes
                  value:
                    from: '2026-03-01'
                    to: '2026-03-31'
                    granularity: month
                    group_by: employee
                    data:
                      - period:
                          from: '2026-03-01'
                          to: '2026-03-31'
                        subject:
                          kind: employee
                          employee_uuid: 0199f0c2-1f4a-7c3e-9b21-4d5e6f7a8b90
                          employee_code: '739104'
                          full_name: Lucía Amrani
                          department_id: 3
                          label: Lucía Amrani
                        worked_minutes: 9720
                        worked: '162:00'
                        shift_count: 21
                        days_in_period: 31
                        days_with_activity: 21
                        days_without_activity: 10
                        open_shift_days: 0
                        incident_days: 1
                        contracted_minutes: 9257
                        contracted: '154:17'
                        deviation_minutes: 463
                        deviation: '07:43'
                        overtime_minutes: 463
                        overtime: '07:43'
                        days_without_contract: 0
                    meta:
                      time_zone: Europe/Madrid
                      generated_at: '2026-04-01T07:12:03.114000Z'
                      row_count: 1
                      criteria:
                        - Los totales salen del registro horario ya consolidado (proyección de jornadas), no se recalculan para este informe.
                        - 'Cada turno se atribuye entero a la jornada en la que empezó, en la zona horaria del centro: un turno de 22:00 a 06:00 cuenta en el día de entrada y no se parte a medianoche.'
                        - 'No se cuentan los tramos anulados ni las versiones sustituidas por una corrección: solo la versión vigente de cada tramo.'
                        - Una incidencia sin resolver no descuenta horas. Los días con incidencia se cuentan aparte, en la columna correspondiente, para que se revisen.
                        - Los días sin actividad aparecen con cero y no se omiten. En los agregados por departamento o centro, los contadores de días son días-persona.
                        - 'Las horas contratadas del periodo se prorratean por día natural de vigencia del contrato: días de vigencia × horas semanales ÷ 7. Los días sin contrato vigente no suman y se informan aparte.'
                        - El informe solo incluye a las personas que están dentro del alcance de quien lo pide, incluidas las que causaron baja durante el periodo.
