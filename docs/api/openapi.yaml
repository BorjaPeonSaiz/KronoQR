# KronoQR — contrato de la API.
#
# ESTE FICHERO ES LA FUENTE DE VERDAD DE LA API (ADR-013, CLAUDE.md orden de
# autoridad 2). Se modifica ANTES que el codigo, nunca despues: de aqui se
# generan los clientes TypeScript de los tres frontends (`npm run api:generate`)
# y contra este esquema se validan las respuestas en las pruebas de contrato
# (Spectator, backend/tests/Contract, RQ-06).
#
# Que hay hoy y por que no hay mas. El Anexo B del documento 01 enumera unos 50
# endpoints como CONTRATO DE REFERENCIA: son el mapa, no el contrato. Aqui solo
# se describen los endpoints cuya tarea existe, porque describir la forma de un
# endpoint cuyo caso de uso todavia no se ha diseñado es inventarla, y en este
# fichero inventar sale caro: lo que entra en v1 no se puede quitar ni cambiar
# de tipo sin v2 (ADR-012). Cada tarea que implemente un endpoint lo añade aqui
# primero.
#
#   Descritos      GET  /api/v1/health   ·  GET /api/v1/ready  ·  POST /api/v1/scan
#                  POST /api/v1/auth/login · /logout · GET /api/v1/auth/me
#                  CRUD /api/v1/employees · /departments · GET/PATCH /api/v1/site  (tarea 1.6, ADR-040)
#   Implementados  los de gestion de la tarea 1.6. El endpoint de fichaje y las
#                  sondas llegan con la tarea 1.7.
#
# Como se comprueba este fichero:
#   make api-lint      @redocly/cli sobre docs/api/redocly.yaml (0 problemas)
#   make test          las pruebas de backend/tests/Contract lo cargan con Spectator
#   npm run api:generate   en los tres frontends
#
openapi: 3.1.1

info:
  title: KronoQR — API de control de presencia
  version: 1.0.0
  summary: Registro horario con valor legal para hoteles, con fichaje por QR en quiosco.
  description: |
    API del sistema KronoQR. Sirve a tres aplicaciones cliente —quiosco, panel de
    gestion y portal del empleado— y a las sondas de la infraestructura del cliente.

    **Version en la ruta.** Toda ruta cuelga de `/api/v1` (ADR-012). Dentro de v1
    solo caben cambios aditivos: campos nuevos opcionales, valores nuevos en un
    enum de respuesta y endpoints nuevos. Quitar un campo, cambiar su tipo o
    endurecer una validacion exige `/api/v2`, porque hay quioscos con la cola
    offline llena que llevan dias sin conectar.

    **Tiempo.** Todo instante viaja y se almacena en UTC, con sufijo `Z`
    (regla dura 3). La conversion a la zona del centro ocurre en la capa de
    presentacion, nunca en el transporte.

    **Errores.** Todas las respuestas de error usan `application/problem+json`
    (RFC 9457). El miembro `type` es un URN estable de KronoQR: es lo que el
    cliente debe interpretar, no el texto de `title` ni el de `detail`.

    **Idempotencia.** Las escrituras del quiosco llevan `Idempotency-Key` y son
    idempotentes por `scan_id` (regla dura 8): un reenvio devuelve la respuesta
    original, nunca un error ni un duplicado.
  contact:
    name: Soporte de KronoQR
    url: https://example.invalid/kronoqr/soporte
  license:
    name: Licencia comercial de KronoQR
    url: https://example.invalid/kronoqr/licencia

servers:
  - url: https://{host}
    description: |
      Instalacion del cliente. KronoQR se despliega en el servidor de cada cliente
      (ADR-016): no hay servidor central ni entorno compartido, asi que el host es
      siempre un parametro de instalacion.
    variables:
      host:
        default: localhost
        description: Nombre del servidor donde esta instalado KronoQR.

tags:
  - name: Health
    description: |
      Sondas de salud del Anexo B. Las consume la infraestructura —Docker, Nginx,
      Prometheus y el actualizador de la tarea 5.7—, no las aplicaciones cliente.
  - name: Attendance
    description: |
      Camino de fichaje. Es el nucleo del producto y el unico que nunca puede
      degradarse: ni la caducidad de la licencia (ADR-019) ni la falta de red
      pueden impedir que un empleado fiche.

      Aqui viven tambien las **correcciones trazadas** de `/shift-entries`
      (RF-PA-04, RN-13): son el mismo registro horario visto desde el panel, y
      la unica via por la que una persona autorizada puede cambiar lo que hay
      escrito. Nada se sobrescribe: cada correccion crea una version nueva y
      conserva la anterior con su autor, su momento y su motivo (RL-04).
  - name: Kiosk
    description: |
      Lo que la tablet necesita **ademas** de fichar: el padron minimo con el que
      resuelve una tarjeta sin red (RF-KI-03) y el latido con el que se sabe si
      sigue viva (RF-PA-07).

      Se separa de `Attendance` porque no es el camino de fichaje: si estos dos
      endpoints fallan, el quiosco sigue fichando —encola y confirma en local
      (regla dura 19)—; lo unico que pierde es el nombre en la pantalla y la
      visibilidad en el panel de salud.
  - name: Identity
    description: |
      Acceso al panel de gestion: quien entra, con que rol y con que ambito
      (RF-ID-01, RF-ID-02).

      **Con segundo factor obligatorio** (RS-06). Los roles con alcance sobre
      toda la plantilla —`admin`, `rrhh` y `auditor`— no obtienen sesion con
      solo la contrasena: `POST /api/v1/auth/login` responde `202` con una sesion
      **pendiente**, y la sesion real se emite en `POST /api/v1/auth/2fa/verify`.

      **El alta del segundo factor tambien vive aqui**, y no en un correo de
      invitacion: `POST /api/v1/auth/2fa/enrol` entrega el secreto y su URI
      `otpauth://` para el QR del autenticador, y `POST /api/v1/auth/2fa/confirm`
      lo activa con un codigo. Las dos se llaman con la sesion pendiente, que es
      lo unico que tiene quien todavia no puede entrar. La credencial del
      **empleado** sigue siendo una tarjeta fisica y no hay TOTP para el (regla
      dura 11, ADR-014): esto es solo de las cuentas de gestion.
  - name: Reporting
    description: |
      Consultas de lectura sobre el registro horario ya escrito **hacia dentro de
      la organizacion**: el detalle de jornada del panel (RF-PA-03) y la
      presencia en tiempo real (RF-PA-01, RF-PA-02).

      Aqui vive tambien el unico mensaje que el servidor **origina** en vez de
      responder: el `presence.updated` del WebSocket (ADR-011), descrito en
      `webhooks`. Es una vista y nada del registro legal viaja por el.

      Se separa de `Attendance` porque **no escribe nada y no puede**. Aqui no
      hay ningun verbo que cambie el registro: corregirlo es `PATCH
      /shift-entries/{uuid}`, que vive en `Attendance` y exige otro ambito de
      token. La separacion es la que permite que un rol de solo lectura tenga
      acceso a estas rutas sin tenerlo a aquellas.

      Lo que se entrega **fuera** —la exportacion para la Inspeccion— no esta
      aqui: vive en `Compliance`, porque no es una consulta del panel sino un
      documento que se defiende en un expediente.

  - name: Portal
    description: |
      El portal personal del empleado: acceso con codigo y PIN, consulta del
      **propio** registro de jornada y descarga del **propio** historico
      (RF-ID-05..08, RL-05).

      **Existe por obligacion legal.** El art. 34.9 del Estatuto de los
      Trabajadores exige que la persona trabajadora pueda acceder a su registro
      de jornada, y RL-03 añade que debe poder entregarse de inmediato. No es una
      funcionalidad opcional: si el portal no funciona, el cliente incumple.

      **Se separa de `Identity` y de `Reporting` a proposito.** De `Identity`
      porque quien entra aqui no es personal de gestion y no tiene por que tener
      correo (ADR-015, regla dura 12): entra con su codigo de empleado y su PIN
      de seis digitos. De `Reporting` porque aquella agrupa las consultas de
      gestion —el registro horario **de otra persona**— y estas solo alcanzan el
      propio: el `uuid` no viaja en la URL, lo resuelve el token.

      **Todo lo de aqui es de solo lectura y de ambito `self:read`** (RF-ID-07).
      Ninguna ruta de esta seccion cambia nada del registro horario, y ninguna
      admite un identificador de empleado: no hay URL que manipular.
  - name: Workforce
    description: |
      Plantilla: empleados, departamentos y centros (RF-GP-01, RF-GP-03).

      **Nada se borra** (regla dura 5). La baja de un empleado es un cambio de
      estado con fecha —`POST /employees/{uuid}/offboard`—, su historial se
      conserva, y por eso no hay ningun `DELETE` en esta seccion.
  - name: Compliance
    description: |
      Lo que se entrega **fuera** de la organizacion: la exportacion normalizada
      para la Inspeccion de Trabajo (RF-IN-05, RL-03, RL-06).

      Se separa de `Reporting` porque no es el registro horario, es su
      **presentacion ante un tercero con potestad**: formato tabular no
      propietario, criterios de inclusion escritos en el propio fichero, horas
      en la zona del centro y en UTC, y las correcciones a la vista con su autor
      y su motivo. Lo que aqui se exporta se defiende en un expediente, asi que
      generarlo deja siempre asiento en `audit_log`.

paths:
  /api/v1/health:
    get:
      operationId: getHealth
      summary: Sonda de vida
      description: |
        Indica que el proceso responde y **con que version esta desplegado**
        (documento 02 §10.5): es lo que permite correlacionar una incidencia con
        una version concreta cuando el cliente llama por telefono.

        No consulta base de datos, ni Redis, ni disco. Una sonda de vida que toca
        dependencias reinicia el contenedor cuando lo que esta caido es PostgreSQL,
        que es exactamente el fallo que no se quiere. Para eso esta `/api/v1/ready`.

        **Publica y sin autenticacion**, como toda sonda de vida: el orquestador la
        consulta antes de que exista sesion alguna. Exponerla fuera de la red del
        cliente es una decision de Nginx, no de la aplicacion.
      tags: [Health]
      security: []
      responses:
        '200':
          description: El proceso responde.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              examples:
                vivo:
                  summary: Instalacion en la version 1.4.2
                  value:
                    status: ok
                    version: 1.4.2

  /api/v1/ready:
    get:
      operationId: getReadiness
      summary: Sonda de disponibilidad
      description: |
        Indica si la instancia puede aceptar trafico: comprueba las dependencias de
        las que depende una peticion real. Es la sonda que gobierna el despliegue
        sin parada (RNF-D-04) y la comprobacion posterior a una actualizacion
        (RF-PD-10).

        **No detalla que dependencia ha fallado.** El diagnostico por componente
        vive en el paquete de diagnostico y en la comprobacion de salud
        posinstalacion (RF-PD-09, RF-PD-13), que son acciones autenticadas del
        administrador. Una sonda publica que enumera los servicios caidos es un
        mapa gratuito de la instalacion.
      tags: [Health]
      security: []
      responses:
        '200':
          description: La instancia acepta trafico.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'
              examples:
                lista:
                  value:
                    status: ready
        '503':
          description: |
            La instancia todavia no acepta trafico. El orquestador debe reintentar y
            no enviarle peticiones mientras tanto.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                arrancando:
                  value:
                    type: 'urn:kronoqr:problem:not-ready'
                    title: Servicio no disponible
                    status: 503
                    detail: La instancia todavia no esta lista para recibir trafico.

  /api/v1/scan:
    post:
      operationId: recordScan
      summary: Registrar un escaneo de credencial en el quiosco
      description: |
        Registra el escaneo de una tarjeta QR en un quiosco autenticado (RF-AT-01) y
        devuelve al empleado lo que el quiosco tiene que enseñarle: nombre, accion,
        hora y acumulado de la jornada (RF-AT-05).

        **Que decide el servidor.** Si el empleado no tiene turno abierto, el escaneo
        abre uno; si lo tiene, lo cierra (RF-AT-02, RF-AT-03). El cliente no decide la
        accion: la deduce el agregado `WorkDay`. Lo unico que el cliente puede aportar
        es la **intencion** (`intent`), porque con la pausa modelada como dos tramos
        (ADR-024) un `break_start` y un `clock_out` son indistinguibles para el
        servidor, y sin ese dato la jornada a la que se atribuye el tramo siguiente
        se calcula mal cuando la pausa cruza medianoche.

        **Idempotencia (regla dura 8, RF-AT-07).** El `scan_id` lo genera el cliente
        (UUID v7) y es la clave de idempotencia. Reenviar el mismo `scan_id` devuelve
        la respuesta original —el mismo cuerpo y el mismo codigo—, nunca un duplicado
        ni un error. Es lo que hace segura la sincronizacion de la cola offline.

        **Dos marcas de tiempo (regla dura 9, RF-AT-09).** `occurred_at` es el momento
        real del escaneo y puede venir de la cola offline con dias de retraso; el
        servidor añade `recorded_at`, el momento de recepcion. **El registro legal usa
        `occurred_at`.**

        **Rechazos indistinguibles (regla dura 17, RS-03, RF-QR-02).** Un escaneo que
        no se puede registrar devuelve SIEMPRE la misma respuesta —`422` con
        `urn:kronoqr:problem:scan-rejected`— y consume el mismo tiempo, ya sea porque
        el prefijo no es `FH1`, porque la clave de firma es desconocida, porque la
        firma no valida, porque la credencial esta revocada o porque el empleado no
        esta activo. La causa concreta solo existe en `scan_events.result` y en el log
        del servidor. Por eso `qr_payload` **no declara `pattern`**: un patron en el
        contrato convertiria «formato invalido» en un `400` distinguible de un `422`,
        que es la misma fuga que el codigo se cuida de no cometer.

        **El quiosco no espera a esta respuesta** (regla dura 19, documento 02 §6).
        Confirma al empleado en local en menos de 300 ms y encola; esta llamada
        sincroniza. Un fallo de red no puede impedir fichar.
      tags: [Attendance]
      security:
        - kioskToken: ['scan:write']
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScanRequest'
            examples:
              entrada-en-linea:
                summary: Escaneo con red, el servidor decide que es una entrada
                value:
                  scan_id: 0199f0c2-1f4a-7c3e-9b21-4d5e6f7a8b90
                  occurred_at: '2026-08-14T05:58:31Z'
                  qr_payload: FH1.a3.7QK2mXpR9vLdN4tZbYcF1w.k9Xm2pQrT5vN8wLa
                  intent: auto
              inicio-de-pausa:
                summary: |
                  Pausa declarada por el empleado. Sin `intent`, el servidor no puede
                  distinguir este escaneo de un fin de turno (ADR-024).
                value:
                  scan_id: 0199f0d4-88b1-7a55-8c07-2f9e1a7c4d31
                  occurred_at: '2026-08-14T09:30:02Z'
                  qr_payload: FH1.a3.7QK2mXpR9vLdN4tZbYcF1w.k9Xm2pQrT5vN8wLa
                  intent: break_start
              cola-offline:
                summary: |
                  Escaneo generado sin red y sincronizado once horas despues. El
                  registro legal usa `occurred_at`, no la hora de llegada.
                value:
                  scan_id: 0199efb0-0000-7def-b123-aa11bb22cc33
                  occurred_at: '2026-08-13T22:04:57Z'
                  qr_payload: FH1.a3.Wp7Lm2Qx8ZrT4vNc9YbK1e.3Bq7Rt9WzX2mK6pL
      responses:
        '200':
          description: |
            Escaneo procesado. **Dos desenlaces**, discriminados por `action`
            (ADR-031):

            - `clock_in`, `clock_out`, `break_start`, `break_end` → se creo o cerro
              un tramo. Esquema `ScanAccepted`.
            - `debounced` → el escaneo se procesado y **deliberadamente no cambio
              nada**, porque cae dentro del periodo de gracia anti-rebote
              (RF-AT-06). Esquema `ScanDebounced`.

            Es tambien la respuesta de un **reenvio con el mismo `scan_id`**:
            identica a la original, incluida su `action`. Reenvio e anti-rebote no
            son lo mismo y no se confunden: el primero es el mismo escaneo que
            vuelve —reintento de red o sincronizacion de la cola—, el segundo es un
            escaneo NUEVO, con otro `scan_id`, porque la persona paso la tarjeta dos
            veces. Un reenvio de un `clock_in` devuelve `clock_in`, nunca
            `debounced`.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ScanAccepted'
                  - $ref: '#/components/schemas/ScanDebounced'
                discriminator:
                  propertyName: action
                  mapping:
                    clock_in: '#/components/schemas/ScanAccepted'
                    clock_out: '#/components/schemas/ScanAccepted'
                    break_start: '#/components/schemas/ScanAccepted'
                    break_end: '#/components/schemas/ScanAccepted'
                    debounced: '#/components/schemas/ScanDebounced'
              examples:
                entrada:
                  summary: Apertura de turno
                  value:
                    scan_id: 0199f0c2-1f4a-7c3e-9b21-4d5e6f7a8b90
                    action: clock_in
                    employee_display_name: Maria G.
                    work_date: '2026-08-14'
                    occurred_at: '2026-08-14T05:58:31Z'
                    recorded_at: '2026-08-14T05:58:31.412Z'
                    worked_minutes: 0
                anti-rebote:
                  summary: |
                    Segundo escaneo 20 s despues del que si registro la entrada
                    (RF-AT-06, ADR-031). No se crea ni se cierra ningun tramo, el
                    acumulado no varia, y `last_accepted_at` es lo que permite al
                    quiosco decir «Ya has fichado hace unos segundos».

                    Es un `200` a proposito: la cola offline reintenta ante fallo, y
                    un `4xx` la dejaria reintentando contra una ventana ya pasada.
                  value:
                    scan_id: 0199f0c2-2a5b-7d4f-8c32-5e6f7a8b9c01
                    action: debounced
                    employee_display_name: Maria G.
                    occurred_at: '2026-08-14T05:58:51Z'
                    recorded_at: '2026-08-14T05:58:51.208Z'
                    worked_minutes: 0
                    last_accepted_at: '2026-08-14T05:58:31Z'
                salida-de-turno-nocturno:
                  summary: |
                    Cierre a las 06:02 UTC de un turno que empezo a las 22:00 del dia
                    anterior. `work_date` es el 13, no el 14: el turno no se parte a
                    medianoche y se atribuye a la jornada de su hora de inicio
                    (RN-05, ADR-006).
                  value:
                    scan_id: 0199f13a-7c22-7b41-9e88-0c4d5e6f7a81
                    action: clock_out
                    employee_display_name: Juan P.
                    work_date: '2026-08-13'
                    occurred_at: '2026-08-14T06:02:10Z'
                    recorded_at: '2026-08-14T06:02:10.688Z'
                    worked_minutes: 482
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          description: |
            **Escaneo rechazado.** Respuesta unica, generica y de tiempo constante
            para toda causa de rechazo (regla dura 17, RS-03, documento 02 §5.2).
            El cuerpo esta fijado campo a campo en el esquema y no admite miembros
            adicionales: el contrato hace **imposible** describir la causa, que es
            el unico modo de garantizar que nadie la filtre por descuido.

            El quiosco muestra su propio texto de i18n a partir de `type`. Nunca
            debe mostrar `title` ni `detail`, que son texto para quien depura.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ScanRejected'
              examples:
                rechazado:
                  summary: La unica respuesta de rechazo que existe
                  value:
                    type: 'urn:kronoqr:problem:scan-rejected'
                    title: Escaneo no valido
                    status: 422
                    detail: El escaneo no se ha podido registrar.
                    scan_id: 0199f0c2-1f4a-7c3e-9b21-4d5e6f7a8b90
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/v1/scan/batch:
    post:
      operationId: syncScanBatch
      summary: Sincronizar la cola offline del quiosco
      description: |
        Entrega de una vez los escaneos que el quiosco acumulo sin red (RF-KI-03,
        RF-KI-04, documento 02 §6). Es el mismo registro que `POST /api/v1/scan`
        repetido, con las mismas garantias, y **no un camino distinto**: quien decide
        cada escaneo es el mismo caso de uso, y cada elemento abre su propia
        transaccion.

        **Se procesa en orden de `occurred_at`, no en orden de llegada.** Es lo mas
        importante de este endpoint. Una entrada y una salida encoladas y enviadas del
        reves crearian una salida sin turno abierto seguida de una entrada, es decir,
        una jornada inventada. El servidor ordena el lote antes de tocar nada y
        **devuelve los resultados en ese mismo orden**, para que lo que hizo sea
        observable y no haya que creerselo.

        **Un elemento fallido no invalida el lote** (regla dura 19). La respuesta es
        `207 Multi-Status` y cada elemento lleva su propio desenlace: uno rechazado no
        impide registrar los demas, y una jornada no se pierde porque otra tarjeta
        estuviera revocada.

        **Idempotencia por `scan_id`, elemento a elemento** (regla dura 8). Reenviar
        el mismo lote —o un lote que solape con otro ya enviado— devuelve para cada
        `scan_id` la respuesta original, sin duplicar ni un tramo. La cabecera
        `Idempotency-Key` de esta peticion identifica el **lote** y sirve para
        correlacionar el envio en los registros; la garantia real la da el UNIQUE de
        `scan_events.scan_id`.

        **`occurred_at` puede tener dias de retraso** y el registro legal lo usa tal
        cual (regla dura 9, RF-AT-09). El retraso se mide y se publica como
        `sync_delay_seconds`; en la Fase 2 abrira una incidencia de revision humana
        (RN-15). En ningun caso se descarta un fichaje por llegar tarde.

        **El lote es de 50 como maximo.** Es el tamano que usa el quiosco al drenar
        (§6) y el techo existe para que un lote no monopolice un trabajador de PHP
        durante el pico del cambio de turno.
      tags: [Attendance]
      security:
        - kioskToken: ['scan:write']
      parameters:
        - $ref: '#/components/parameters/BatchIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScanBatchRequest'
            examples:
              cola-desordenada:
                summary: |
                  Salida y entrada encoladas sin red y enviadas del reves. El servidor
                  las ordena por `occurred_at` antes de procesarlas.
                value:
                  scans:
                    - scan_id: 0199f13a-7c22-7b41-9e88-0c4d5e6f7a81
                      occurred_at: '2026-08-14T14:03:12Z'
                      qr_payload: FH1.a3.7QK2mXpR9vLdN4tZbYcF1w.k9Xm2pQrT5vN8wLa
                    - scan_id: 0199f0c2-1f4a-7c3e-9b21-4d5e6f7a8b90
                      occurred_at: '2026-08-14T05:58:31Z'
