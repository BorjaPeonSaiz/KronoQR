  /api/v1/scan/pin:
    post:
      operationId: recordPinScan
      summary: Fichaje de respaldo por PIN en el quiosco
      description: |
        Registra un fichaje cuando el empleado **no puede presentar su tarjeta**
        (RF-AT-11): se identifica con su codigo de empleado y su PIN de seis digitos,
        los mismos con los que entra al portal personal (ADR-015, regla dura 12).

        **No es un extra.** El documento 01 §3.1 lo dice literalmente: *«es lo que
        impide que una tarjeta olvidada se convierta en una jornada sin registro y en
        una correccion manual»*.

        **Misma traza que el escaneo de tarjeta.** El servidor decide si abre o cierra
        turno igual que en `/scan`, la jornada se atribuye igual (RN-05), `daily_totals`
        se recalcula igual (RN-06) y el fichaje queda en `audit_log` igual, con su
        origen. La respuesta es **la misma** y a proposito: el empleado ha fichado, y su
        pantalla de confirmacion no tiene por que ser distinta.

        **Queda marcado para revision del responsable** (RF-AT-11, documento 02 §7.5).
        Esa marca vive en `scan_events.flagged_for_review` y no sale por esta respuesta.
        **Marcar no es rechazar** (regla dura 19): el fichaje se registra siempre, y lo
        que se revisa despues es el patron, no la persona que llega sin tarjeta.

        **El PIN viaja cerrado, tambien con red.** Ver `pin_sealed`: el quiosco lo sella
        con la clave publica de la instalacion en el momento de teclearlo, para poder
        encolarlo sin red sin dejar en la tablet nada que sirva para suplantar a nadie
        (RL-12, RS-04). No existe una variante en claro de este endpoint.

        **Idempotencia (regla dura 8, RF-AT-07).** Identica a `/scan`: el `scan_id` lo
        genera el cliente y reenviarlo devuelve la respuesta original, el mismo cuerpo y
        el mismo codigo. Es lo que hace segura la sincronizacion de la cola offline.

        **Rechazos indistinguibles (regla dura 17, RS-03).** Un fichaje por PIN que no
        se puede registrar devuelve SIEMPRE la misma respuesta —`422` con
        `urn:kronoqr:problem:scan-rejected`— y consume el mismo tiempo, ya sea porque el
        codigo de empleado no existe, porque el PIN no es correcto, porque el sobre no
        abre, porque el empleado no esta activo o porque **el bloqueo por intentos esta
        activo** (RS-12). La causa concreta solo existe en `scan_events.result` y en el
        log del servidor.

        **Bloqueo creciente por intentos** (RS-12, documento 02 §7.5): 3 fallos bloquean
        5 minutos, 5 fallos 15 minutos y 10 fallos 60 minutos, **por empleado y por
        origen** —el contador del quiosco y el del portal son distintos, para que sondear
        una puerta no cierre la otra—, y el contador se reinicia tras 24 h sin fallos.
        Restablecer el PIN desbloquea inmediatamente (RF-ID-09). Los umbrales son
        configuracion de la instalacion. **Un bloqueo activo no deja a nadie sin fichar**:
        la tarjeta sigue funcionando, y esta via es la alternativa a la tarjeta, no al
        reves.
      tags: [Attendance]
      security:
        - kioskToken: ['scan:write']
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PinScanRequest'
            examples:
              tarjeta-olvidada:
                summary: |
                  El escenario del documento 01 §11: alguien llega al centro sin su
                  tarjeta y ficha con su PIN.
                value:
                  scan_id: 0199f2a1-3b7c-7e12-9f04-6a1b2c3d4e5f
                  occurred_at: '2026-08-14T05:59:02Z'
                  employee_code: E7QK2MXPR
                  pin_sealed: 1JqPZ0m8Vx3sYQe7Lr2NtB9wKcAj4Fd6HgUiOpZmXsQvTbNyRl0EcWaHkJdFgSuI
                  intent: auto
      responses:
        '200':
          description: |
            Fichaje procesado. **Los mismos dos desenlaces que `/scan`**, discriminados
            por `action` (ADR-031), y con el mismo cuerpo: un campo que dijera «esto fue
            por PIN» le contaria al cliente algo que solo le incumbe al responsable que
            revisa la bandeja.

            Es tambien la respuesta de un **reenvio con el mismo `scan_id`**.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ScanAccepted'
                  - $ref: '#/components/schemas/ScanDebounced'
                discriminator:
                  propertyName: action
                  mapping:
                    clock_in: '#/components/schemas/ScanAccepted'
                    clock_out: '#/components/schemas/ScanAccepted'
                    break_start: '#/components/schemas/ScanAccepted'
                    break_end: '#/components/schemas/ScanAccepted'
                    debounced: '#/components/schemas/ScanDebounced'
              examples:
                entrada-por-pin:
                  summary: Apertura de turno sin tarjeta
                  value:
                    scan_id: 0199f2a1-3b7c-7e12-9f04-6a1b2c3d4e5f
                    action: clock_in
                    employee_display_name: Maria G.
                    work_date: '2026-08-14'
                    occurred_at: '2026-08-14T05:59:02Z'
                    recorded_at: '2026-08-14T05:59:02.517Z'
                    worked_minutes: 0
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          description: |
            **Fichaje rechazado.** Exactamente la misma respuesta que la de `/scan`, y no
            una propia: si este endpoint tuviera su tipo de problema, distinguir «PIN» de
            «tarjeta» seria distinguir por que fallo el intento (regla dura 17, RS-03).

            El cuerpo esta fijado campo a campo en el esquema y no admite miembros
            adicionales: el contrato hace **imposible** describir la causa, incluida la
            de «tu PIN esta bloqueado durante 15 minutos», que es la que mas tienta.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ScanRejected'
              examples:
                rechazado:
                  summary: La unica respuesta de rechazo que existe
                  value:
                    type: 'urn:kronoqr:problem:scan-rejected'
                    title: Escaneo no valido
                    status: 422
                    detail: El escaneo no se ha podido registrar.
                    scan_id: 0199f2a1-3b7c-7e12-9f04-6a1b2c3d4e5f
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/v1/kiosk/roster:
    get:
      operationId: getKioskRoster
      summary: Padron minimo cacheable del centro del quiosco
      description: |
        Lo imprescindible para que el quiosco reconozca una tarjeta **sin red** y
        pueda saludar por su nombre a quien acaba de fichar (RF-KI-03, RF-AT-05).

        **Es el minimo del §7.3 y nada mas: hash del token y nombre en su forma
        minima** —nombre de pila e inicial del primer apellido—. No hay UUID, ni
        codigo de empleado, ni departamento, ni situacion laboral, ni fechas. Un
        token de quiosco vive en una tablet colgada de una pared: su compromiso no
        puede reconstruir la plantilla del hotel (RS-04).

        **El hash no es la tarjeta.** Es `SHA-256` del token impreso, y con el no se
        puede fabricar ninguna credencial valida: el token son 128 bits aleatorios y
        el payload va firmado con una clave que no sale del servidor (§5.1, §5.2).
        Sirve para lo unico que el quiosco necesita offline —«¿de quien es esta
        tarjeta?»— y para nada mas.

        **Solo del centro al que esta vinculado el dispositivo.** El centro no es un
        parametro: sale del token. Un quiosco no puede pedir el padron de otro hotel
        de la cadena aunque lo intente.

        **Solo quien puede fichar.** Quien esta de baja no aparece (RN-14), y quien
        aun no tiene tarjeta impresa tampoco: sin `secret_hash` no hay nada que
        resolver (ADR-034).

        **El quiosco lo guarda cifrado** (RL-12) y lo purga al desvincularse. Esta
        respuesta es datos personales de terceros y **su entrega queda registrada en
        `audit_log`** (RS-05).

        **Trae ademas la clave publica del PIN** (`pin_sealing_public_key`), que no es
        un dato de nadie y sirve para lo mismo que el resto de esta respuesta: que la
        tablet pueda funcionar sin red. Con ella cierra el PIN que teclea el empleado
        antes de encolarlo (RF-AT-11, RL-12), y una rotacion de clave le llega en el
        mismo ciclo en que se refresca el padron.
      tags: [Kiosk]
      security:
        - kioskToken: ['roster:read']
      responses:
        '200':
          description: Padron minimo del centro del dispositivo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KioskRoster'
              examples:
                padron:
                  value:
                    generated_at: '2026-08-14T04:00:11.318Z'
                    entries:
                      - token_hash: 6b86b273ff34fce19d6b804eff5a3f5747ada4eaa22f1d49c01e52ddb7875b4b
                        display_name: Maria G.
                      - token_hash: d4735e3a265e16eee03f59718b9b5d03019c07d8b6c51f90da3a666eec13ab35
                        display_name: Juan P.
                    pin_sealing_public_key: 7cXt0m5rXf8mB2mHnV1kQe0k0f5T2xY3rZq8w9AbCdE=
                sin-fichaje-por-pin:
                  summary: |
                    Instalacion que no ofrece la segunda via (ADR-017). El quiosco
                    oculta el teclado numerico en vez de ofrecer una puerta que
                    rechaza siempre.
                  value:
                    generated_at: '2026-08-14T04:00:11.318Z'
                    entries:
                      - token_hash: 6b86b273ff34fce19d6b804eff5a3f5747ada4eaa22f1d49c01e52ddb7875b4b
                        display_name: Maria G.
                    pin_sealing_public_key: null
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/v1/kiosk/heartbeat:
    post:
      operationId: recordKioskHeartbeat
      summary: Latido y telemetria del quiosco
      description: |
        El quiosco dice que sigue vivo, con que version corre y cuantos fichajes
        tiene sin sincronizar (documento 01 §5.5, RF-PA-07).

        **Es lo que hace visible un quiosco averiado antes de que alguien reclame una
        jornada.** Alimenta `devices.last_seen_at`, `devices.app_version` y
        `devices.pending_queue_size`, y con ellos las metricas
        `kiosk_last_seen_seconds` y `kiosk_offline_queue_size` (§8.2). La alerta
        «quiosco sin latido > 10 min» del documento 01 §9.3 se construye sobre la
        primera y llega en la tarea 3.2; la metrica nace aqui.

        **Informacion, no autoridad.** `pending_queue_size` lo declara el propio
        dispositivo y nadie lo comprueba: sirve para operar, no para decidir nada
        sobre el registro horario. Un quiosco que mienta sobre su cola no cambia ni
        un fichaje.

        **La respuesta lleva la hora del servidor** para que la tablet pueda medir su
        propio desfase de reloj y avisar (RF-AT-10). Nunca se le impide fichar por
        tenerlo mal: el desfase se registra en cada escaneo y se corrige despues
        (regla dura 19).

        **Sin datos personales, en ninguna direccion.** Ni el latido los envia ni la
        respuesta los devuelve: el dispositivo se identifica por su token.
      tags: [Kiosk]
      security:
        - kioskToken: ['heartbeat:write']
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KioskHeartbeatRequest'
            examples:
              al-dia:
                summary: Quiosco con red y sin cola pendiente
                value:
                  app_version: 1.4.2
                  pending_queue_size: 0
              con-cola:
                summary: |
                  Quiosco que lleva tres horas sin poder sincronizar. El
                  `oldest_pending_at` es lo que convierte «hay 37 pendientes» en
                  «el mas antiguo es de hace tres horas».
                value:
                  app_version: 1.4.2
                  pending_queue_size: 37
                  oldest_pending_at: '2026-08-14T05:58:31Z'
      responses:
        '200':
          description: Latido registrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KioskHeartbeat'
              examples:
                latido:
                  value:
                    server_time: '2026-08-14T09:00:03.114Z'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/v1/auth/login:
    post:
      operationId: logIn
      summary: Acceso al panel de gestion
      description: |
        Autentica a una persona de gestion —administracion, RRHH, responsable de
        departamento o auditoria— y devuelve el token con el que hablara el
        panel (RF-ID-01).

        **Correo y contrasena, y solo aqui.** El empleado NO entra por este
        endpoint: su portal usa codigo de empleado y PIN (`POST /api/v1/me/login`,
        ADR-015), porque el producto no puede exigir correo electronico a toda la
        plantilla (regla dura 12).

        **Ambitos en el token.** Las *abilities* del token son los permisos del
        rol (documento 02 §7.3) y viajan en la respuesta para que el panel sepa
        que puede pintar. El ambito dice **que** se puede hacer; la policy de
        cada endpoint decide **sobre que datos** (regla dura 18).

        **Respuesta unica ante el fallo.** Contrasena incorrecta, correo que no
        existe y cuenta desactivada devuelven el mismo `401`: distinguirlos
        convertiria este endpoint en un comprobador de cuentas.

        **Bloqueo por intentos** (RF-ID-01). Superado el umbral de fallos para
        una misma cuenta u origen, el endpoint responde `429` con `Retry-After`
        durante el periodo de bloqueo, aunque la contrasena sea correcta.

        **Segundo factor obligatorio para los roles de alcance global**
        (RS-06: `admin`, `rrhh` y `auditor`) y para cualquier cuenta que ya haya
        activado su TOTP. Para ellas este endpoint **no** devuelve una sesion:
        devuelve `202` con un `TwoFactorChallenge`, y la sesion se emite en
        `POST /api/v1/auth/2fa/verify`.

        **`200` y `202` no comparten forma, y es deliberado.** Con un `oneOf`
        sobre `200`, un cliente que leyera `token` sin mirar nada mas guardaria
        el token pendiente como si fuera una sesion —y ese token no autoriza
        nada, asi que el sintoma seria un `403` en cada pantalla—. Con dos
        codigos y dos nombres distintos, `token` y `challenge_token`, esa
        confusion no cabe. Es ademas aditivo sobre la v1 (ADR-012): un cliente
        anterior que solo contemple `200` deja de funcionar solo para las
        cuentas que activen 2FA, nunca en silencio.
      tags: [Identity]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            examples:
              rrhh:
                summary: Acceso de una persona de RRHH
                value:
                  email: rrhh@hotel.example
                  password: 'una-contrasena-larga-y-propia'
                  device_name: Panel de gestion
      responses:
        '200':
          description: Sesion iniciada. El token viaja como `Bearer` en cada peticion posterior.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
              examples:
                sesion:
                  value:
                    token: 17|GhK2mXpR9vLdN4tZbYcF1wQ8sE3rT6uI0oP5aS7d
                    token_type: Bearer
                    expires_at: '2026-08-14T18:00:00Z'
                    user:
                      uuid: 0199f0c2-1f4a-7c3e-9b21-4d5e6f7a8b90
                      name: Direccion RRHH
                      email: rrhh@hotel.example
                      locale: es
                      roles: [rrhh]
                      abilities: ['attendance:read', 'employees:read', 'employees:*']
                      scope:
                        kind: all
                        department_ids: []
        '202':
          description: |
            Contrasena correcta y **sesion todavia no emitida**: falta el segundo
            factor (RS-06). El token que viaja aqui solo sirve para los tres
            endpoints de `/auth/2fa/*`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TwoFactorChallenge'
              examples:
                con-totp-activo:
                  summary: La cuenta ya tiene su segundo factor activo
                  value:
                    challenge_token: 41|Kd2pQ9vLmN4tZbYcF1wQ8sE3rT6uI0oP5aS7dXyZ
                    token_type: Bearer
                    expires_at: '2026-08-14T06:10:00Z'
                    enrolment_required: false
                sin-totp-todavia:
                  summary: Primera vez, hay que dar de alta el segundo factor
                  value:
                    challenge_token: 42|Ld3qR0wMnO5uAcZdG2xR9tF4sU7vJ1pQ6bT8eYzA
                    token_type: Bearer
                    expires_at: '2026-08-14T06:10:00Z'
                    enrolment_required: true
        '401':
          $ref: '#/components/responses/InvalidCredentials'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/v1/auth/2fa/verify:
    post:
      operationId: verifyTwoFactor
      summary: Segundo factor TOTP
      description: |
        Completa el acceso de una sesion pendiente (RF-ID-01, RS-06) y devuelve
        la sesion de verdad, con los ambitos del rol.

        **Se llama con el `challenge_token`** que devolvio el `202` de
        `/auth/login`, en la cabecera `Authorization`. Ese token lleva un unico
        ambito, `2fa:pending`, y no alcanza ningun otro endpoint del producto:
        ni la plantilla, ni el registro horario, ni siquiera `GET /auth/me`.

        **Un codigo TOTP vale una sola vez.** Reenviar el mismo codigo, aunque
        siga dentro de su ventana de treinta segundos, se rechaza igual que uno
        equivocado: sin ello, un codigo interceptado serviria durante el minuto
        siguiente.

        **Rechazo unico y bloqueo por intentos.** Codigo incorrecto, codigo ya
        usado y sesion pendiente sin segundo factor activo devuelven el mismo
        `401`. Superado el umbral de fallos, `429` con `Retry-After`.

        La sesion pendiente se consume: al emitir la sesion real, el
        `challenge_token` deja de valer.
      tags: [Identity]
      security:
        - managementToken: ['2fa:pending']
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TwoFactorCode'
            examples:
              codigo:
                value:
                  code: '492013'
      responses:
        '200':
          description: Sesion iniciada, ya con los ambitos del rol.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
          $ref: '#/components/responses/InvalidCredentials'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/v1/auth/2fa/enrol:
    post:
      operationId: enrolTwoFactor
      summary: Alta del segundo factor
      description: |
        Genera el secreto TOTP de la cuenta y lo devuelve **una sola vez**, junto
        con la URI `otpauth://` con la que el panel dibuja el QR que se escanea
        con el autenticador.

        **Por que existe si el Anexo B no lo listaba.** El Anexo B enumera
        `login`, `2fa/verify`, `logout` y `me`, y con esos cuatro RS-06 es
        inaplicable: una cuenta nueva de `rrhh` no tendria ninguna forma de
        obtener su segundo factor, y por tanto ninguna forma de entrar. La
        alternativa —repartir secretos por consola— obligaria al cliente a usar
        SSH para dar de alta a una persona. Se anaden dos endpoints y no uno
        porque generar el secreto y activarlo son dos hechos distintos: entre los
        dos, la cuenta tiene un secreto **sin confirmar** que no autoriza nada, y
        si alguien se equivoca al escanear el QR basta con repetir el alta.

        **Se llama con el `challenge_token`.** Es lo unico que tiene quien
        todavia no puede entrar. Si la cuenta ya tiene un segundo factor
        confirmado, este endpoint responde `409`: reemplazarlo es un acto de
        administracion y no algo que se haga con la sesion pendiente de alguien
        que acaba de teclear una contrasena.

        **El secreto sale del servidor exactamente una vez** y se guarda cifrado
        con `APP_KEY`. No aparece en ningun log, ni en la traza, ni en
        `audit_log`: lo que se audita es que se activo un segundo factor, no
        cual.
      tags: [Identity]
      security:
        - managementToken: ['2fa:pending']
      responses:
        '200':
          description: Secreto emitido y pendiente de confirmar.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TwoFactorEnrolment'
              examples:
                alta:
                  value:
                    secret: JBSWY3DPEHPK3PXP
                    otpauth_uri: 'otpauth://totp/KronoQR:rrhh%40hotel.example?secret=JBSWY3DPEHPK3PXP&issuer=KronoQR&algorithm=SHA1&digits=6&period=30'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/v1/auth/2fa/confirm:
    post:
      operationId: confirmTwoFactor
      summary: Activacion del segundo factor
      description: |
        Comprueba el primer codigo del autenticador, deja el segundo factor
        **activo** y emite ya la sesion con los ambitos del rol: quien acaba de
        darlo de alta no tiene que volver a teclear su contrasena.

        **Confirmar no es verificar.** `2fa/confirm` activa un secreto que
        todavia no autorizaba nada; `2fa/verify` usa uno ya activo. Son dos
        acciones con dos asientos distintos en `audit_log` —una es el ciclo de
        vida de una credencial, la otra un acceso— y por eso son dos endpoints.

        Si el codigo no cuadra, el secreto sigue **sin confirmar** y se puede
        repetir: la cuenta no queda a medias ni bloqueada.
      tags: [Identity]
      security:
        - managementToken: ['2fa:pending']
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TwoFactorCode'
            examples:
              primer-codigo:
                value:
                  code: '492013'
      responses:
        '200':
          description: Segundo factor activo y sesion iniciada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
          $ref: '#/components/responses/InvalidCredentials'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/v1/auth/logout:
    post:
      operationId: logOut
      summary: Cierre de sesion
      description: |
        Revoca **el token con el que se hace la llamada** y solo ese: cerrar
        sesion en el portatil no puede echar a la misma persona de la tablet de
        recepcion donde estaba revisando incidencias.

        Es idempotente en la practica: repetir la llamada con un token ya
        revocado devuelve `401`, que es lo que el cliente debe interpretar como
        «ya no hay sesion».
      tags: [Identity]
      security:
        - managementToken: []
      responses:
        '204':
          description: Sesion cerrada. El token deja de ser valido de inmediato.
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /api/v1/auth/me:
    get:
      operationId: getCurrentUser
      summary: Usuario, rol y ambito de la sesion en curso
      description: |
        Lo que el panel necesita para decidir que menus enseña: quien es, que
        roles tiene y que ambitos lleva su token (Anexo B del documento 01).

        **No es autorizacion.** Ocultar un boton no protege nada: cada endpoint
        comprueba su ambito y su policy en el servidor (regla dura 18). Esta
        respuesta existe para que la interfaz no ofrezca lo que despues seria un
        `403`.

        **`scope` es el alcance por departamento de RF-ID-03**, y sirve para lo
        mismo que `abilities`: para que el panel no ofrezca lo que el servidor va
        a denegar. Un `responsable_departamento` sin ningun departamento asignado
        recibe `kind: departments` con la lista vacia, que significa exactamente
        lo que parece —no alcanza a nadie— y nunca «alcanza a todos».

        **Una sesion pendiente de segundo factor no llega aqui.** Su token solo
        lleva `2fa:pending` y este endpoint exige una sesion completa: mientras
        el segundo factor no se verifique, no hay nada que contar sobre nadie.
      tags: [Identity]
      security:
        - managementToken: []
      responses:
        '200':
          description: Sesion en curso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagementUser'
              examples:
                rrhh:
                  value:
                    uuid: 0199f0c2-1f4a-7c3e-9b21-4d5e6f7a8b90
                    name: Direccion RRHH
                    email: rrhh@hotel.example
                    locale: es
                    roles: [rrhh]
                    abilities: ['attendance:read', 'employees:read', 'employees:*']
                    scope:
                      kind: all
                      department_ids: []
                responsable:
                  summary: Responsable de departamento, con alcance acotado (RF-ID-03)
                  value:
                    uuid: 0199f0c2-1f4a-7c3e-9b21-4d5e6f7a8b91
                    name: Jefatura de Cocina
                    email: cocina@hotel.example
                    locale: es
                    roles: [responsable_departamento]
                    abilities: ['attendance:read', 'attendance:correct', 'employees:read', 'incidents:*']
                    scope:
                      kind: departments
                      department_ids: [3]
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /api/v1/me/login:
    post:
      operationId: logInToPortal
      summary: Acceso del empleado a su portal personal
      description: |
        Abre la sesion del portal personal con **codigo de empleado y PIN**
        (RF-ID-06, ADR-015). Devuelve un token de ambito `self:read` que solo
        alcanza los datos de quien lo pidio.

        **Ni correo ni contrasena, y no es una simplificacion.** El producto no
        puede exigir correo electronico a toda la plantilla (regla dura 12), y el
        PIN ya existe como respaldo de fichaje en el quiosco (RF-AT-11): reusarlo
        elimina una credencial que emitir, entregar y restablecer. Recuperar el
        acceso es que RRHH restablezca el PIN —`POST
        /api/v1/employees/{uuid}/pin/reset`—, nunca un correo de recuperacion.

        **El PIN viaja en claro sobre TLS, y aqui eso es lo correcto.** No es el
        camino de la cola offline del quiosco, donde el PIN va sellado con
        `crypto_box_seal` porque puede quedarse horas en IndexedDB antes de
        salir. Este es un acceso sincrono con red: si no hay red, no hay sesion
        que abrir. Un sobre aqui solo añadiria una clave publica que distribuir
        sin proteger de nada que TLS no proteja ya.

        **Una sola respuesta para todos los rechazos** (RS-03, regla dura 17).
        Codigo inexistente, PIN incorrecto, PIN nunca emitido, empleado de baja
        y **bloqueo por intentos activo** devuelven el mismo `401` y en tiempo
        constante. El bloqueo tampoco se anuncia: decir «estas bloqueado»
        confirmaria que ese codigo de empleado existe, y ademas convertiria el
        propio bloqueo en un oraculo. Quien necesite saber por que no entra
        pregunta a RRHH, que es quien puede restablecer el PIN.

        **Bloqueo creciente por empleado y por origen** (RS-12, §7.5): 3 fallos
        bloquean 5 min, 5 fallos 15 min y 10 fallos 60 min, con la cuenta a cero
        tras 24 h sin fallar. El contador del portal es **distinto** del del
        quiosco: sondear una puerta no puede dejar a nadie sin poder fichar por
        la otra (regla dura 19). Acertar, o que RRHH restablezca el PIN, limpia
        los dos.

        **Y un limite de peticiones por origen que no lo sustituye** (§7.1, 10
        r/m): uno frena a quien prueba muchos PIN de una persona y el otro a
        quien prueba un PIN de mucha gente. Ninguno ve lo que ve el otro.
      tags: [Portal]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PortalLoginRequest'
            examples:
              acceso:
                summary: Acceso con codigo y PIN
                value:
                  employee_code: E7K2M9XQ4
                  pin: '284016'
      responses:
        '200':
          description: |
            Sesion abierta. El token viaja como `Bearer` en las dos rutas
            restantes del portal y en ninguna mas: no alcanza ningun endpoint de
            gestion, porque su unico ambito es `self:read`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortalSession'
              examples:
                sesion:
                  value:
                    token: 41|Zt6QpX1nR8vKcLm3bYdF9wS2eT5rU7iO0aP4sD8h
                    token_type: Bearer
                    expires_at: '2026-08-14T08:00:00Z'
                    employee:
                      uuid: 0199f0c2-1f4a-7c3e-9b21-4d5e6f7a8b90
                      display_name: Lucia Gomez Ruiz
                      employee_code: E7K2M9XQ4
                      locale: es
                      time_zone: Europe/Madrid
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/PortalAccessDenied'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/v1/me/workdays:
    get:
      operationId: listMyWorkDays
      summary: Mi propio registro de jornada
      description: |
        El registro horario **de quien pregunta**, jornada a jornada, con sus
        tramos vigentes, el total de cada dia y el historico de correcciones
        (RF-ID-05, RL-05, art. 34.9 ET).

        **Es la misma forma de respuesta que `GET
        /api/v1/employees/{uuid}/workdays`** —el esquema `EmployeeWorkDays`— y es
        deliberado: lo que cambia entre las dos rutas es **quien puede pedirlas y
        sobre quien**, no lo que devuelven. Una segunda forma para el mismo dato
        seria una segunda oportunidad de que los dos totales dejaran de cuadrar.

        **No hay `uuid` en la URL, y esa ausencia es la autorizacion** (RF-ID-07,
        regla dura 18). El empleado se resuelve del token de portal, que es lo
        unico que el cliente no puede falsificar. Con un identificador en la ruta
        habria que confiar en que una policy lo comparase bien en todas las
        peticiones; sin el, no hay nada que manipular.

        **Todos los instantes salen en UTC y ademas en la zona del centro**
        (regla dura 3), nunca en la del navegador: quien consulte desde otro pais
        —o desde un movil con la zona mal puesta— tiene que ver las horas que
        vivio, que son las que constan en su contrato.

        **Un turno de noche es un solo tramo** (RN-05, regla dura 4) y **las
        correcciones no se ocultan** (RN-13, regla dura 5): si alguien cambio una
        hora, aparece con su autor, su momento y su motivo. Es justo lo que la
        persona trabajadora tiene derecho a poder mirar.

        **No queda asiento en `audit_log`.** RS-05 registra el acceso a datos
        personales **de terceros**, y aqui no hay tercero: es su propio registro.
        Un apunte por cada consulta convertiria un derecho en una traza de uso de
        ese derecho, con cuatro años de retencion.
      tags: [Portal]
      security:
        - employeeToken: ['self:read']
      parameters:
        - $ref: '#/components/parameters/WorkDateFrom'
        - $ref: '#/components/parameters/WorkDateTo'
      responses:
        '200':
          description: |
            Las jornadas del rango, de la mas antigua a la mas reciente. Sin
            jornadas en el rango, `data` viene vacio: no haber trabajado esos
            dias es una respuesta.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeWorkDays'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/v1/me/export:
    get:
      operationId: exportMyWorkDays
      summary: Descarga de mi propio historico
      description: |
        Descarga el registro horario **propio** como fichero (RF-ID-05, RL-05).
        Es la mitad de «capacidad de entrega inmediata» de RL-03 que mira al
        trabajador, y tambien lo que cubre la portabilidad del articulo 20 del
        RGPD sin ninguna maquinaria adicional.

        **CSV en esta version, PDF en la siguiente.** `format` solo admite `csv`
        hoy; el PDF —que es lo que una persona presenta ante un tercero— llega
        con la maquinaria de exportacion de la tarea 2.9 y sera un valor mas del
        mismo enumerado, es decir un cambio aditivo (ADR-012). **Sin XLSX**: no
        aporta nada sobre CSV para el historico de una sola persona, y es un
        formato propietario.

        **No es la exportacion legal de `GET /api/v1/reports/legal-export`.**
        Aquella la genera RRHH o auditoria ante un requerimiento, abarca a
        terceros y queda auditada como tal. Esta la genera la persona sobre sus
        propios datos: mismo rigor en las horas —`HH:MM`, nunca decimal— y otro
        destinatario.

        **El fichero no lleva ningun dato de nadie mas**, ni siquiera en el
        nombre: el alcance de este endpoint es exactamente el del token que lo
        pide.
      tags: [Portal]
      security:
        - employeeToken: ['self:read']
      parameters:
        - $ref: '#/components/parameters/WorkDateFrom'
        - $ref: '#/components/parameters/WorkDateTo'
        - name: format
          in: query
          required: false
          description: |
            Formato del fichero. `csv` es el unico disponible en esta version y
            es el valor por omision; `pdf` llega con la tarea 2.9.
          schema:
            type: string
            enum: [csv]
            default: csv
          example: csv
      responses:
        '200':
          description: |
            El fichero con el historico propio. Puede no tener ninguna fila de
            datos —un periodo sin jornadas es una respuesta valida— y aun asi
            lleva su cabecera de criterios.
          headers:
            Content-Disposition:
              description: Adjunto, con un nombre de fichero que no lleva ningun nombre de persona.
              schema:
                type: string
                examples: ['attachment; filename=mi-registro-horario-2026-03-01_2026-03-31.csv']
            Cache-Control:
              description: 'Siempre `no-store`: el cuerpo es el registro horario de una persona.'
              schema:
                type: string
                examples: ['no-store, private']
          content:
            text/csv:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/v1/employees:
    get:
      operationId: listEmployees
      summary: Listado de la plantilla
      description: |
        Plantilla del centro o del departamento indicados, paginada (RF-GP-01).

        **Incluye a quien esta de baja**, salvo que se filtre por `status`: el
        historico se conserva cuatro años (RF-GP-03, RL-02) y un listado que
        escondiera a los cesados haria invisible justo lo que una inspeccion
        viene a mirar.

        **El alcance por departamento de RF-ID-03 se aplica en la consulta**, no
        despues: un `responsable_departamento` recibe una pagina que solo
        contiene a la gente de los departamentos que dirige —`meta.total`
        incluido—, y `admin`, `rrhh` y `auditor` la ven entera. Filtrar despues
        de contar daria un `meta.total` que describe a personas que quien
        pregunta no puede ver, que es una fuga por si misma.

        Un responsable **sin ningun departamento asignado** recibe una pagina
        vacia, no la plantilla entera. El caso existe: un departamento puede
        quedarse sin responsable, y `departments.manager_user_id` es nullable.

        **`q` busca por nombre, apellidos, nombre completo y codigo de
        empleado**, sin distinguir mayusculas ni acentos y por subcadena. Se
        combina con `AND` con los demas filtros y se pagina igual que ellos.

        **Todos los filtros actuan sobre la plantilla entera**, no sobre la
        pagina devuelta —tambien `pin_status`, que se deriva en SQL con la misma
        regla con la que se calcula el campo `pin_status` de cada ficha—. Un
        filtro que se resolviera en el navegador daria un `meta.total` que
        describe otra cosa y una paginacion que no cuadra.
      tags: [Workforce]
      security:
        - managementToken: ['employees:read']
      parameters:
        - $ref: '#/components/parameters/EmployeeSearch'
        - $ref: '#/components/parameters/DepartmentFilter'
        - $ref: '#/components/parameters/EmploymentStatusFilter'
        - $ref: '#/components/parameters/PinStatusFilter'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Pagina de la plantilla.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeCollection'
              examples:
                primera-pagina:
                  value:
                    data:
                      - uuid: 0199f0c2-1f4a-7c3e-9b21-4d5e6f7a8b90
                        employee_code: E7QK2MXPR
                        first_name: Youssef
                        last_name: Amrani
                        email: null
                        department_id: 3
                        status: active
                        hired_at: '2026-08-14'
                        terminated_at: null
                        locale: es
                        pin_status: delivered
                    meta:
                      page: 1
                      per_page: 25
                      total: 1
                      total_pages: 1
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    post:
      operationId: createEmployee
      summary: Alta de empleado
      description: |
        Da de alta a una persona en la plantilla (RF-GP-01).

        **El correo es opcional y ninguna funcionalidad lo exige** (regla dura
        12, ADR-015): el alta se completa sin el, y el acceso al portal personal
        se resuelve con codigo de empleado y PIN.

        **El `employee_code` lo genera el servidor**, opaco y aleatorio, y no se
        acepta del cliente. Es la mitad publica de la credencial del portal
        (RF-ID-06) y va impreso en una tarjeta: uno secuencial revelaria cuanta
        gente hay y en que orden entro, y uno derivado del nombre seria un dato
        personal impreso.

        **El documento de identidad no se almacena** (RL-08). `national_id`
        entra en la peticion, se convierte en digest dentro de la misma
        transaccion y nunca se escribe en claro, ni en la tabla, ni en un log,
        ni en una respuesta: no hay ningun campo por el que pueda salir.

        **El alta emite el PIN en la misma transaccion** (RF-ID-09). Un empleado
        sin PIN no puede fichar por respaldo (RF-AT-11) ni entrar al portal
        (RL-05), y ese estado no debe poder existir. El PIN viaja **una sola
        vez**, en esta respuesta: despues solo se restablece.
      tags: [Workforce]
      security:
        - managementToken: ['employees:*']
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEmployeeRequest'
            examples:
              sin-correo:
                summary: Alta sin direccion de correo, que es el caso normal
                value:
                  department_id: 3
                  first_name: Youssef
                  last_name: Amrani
                  hired_at: '2026-08-14'
              con-correo-y-documento:
                summary: Alta con correo y documento de identidad
                value:
                  department_id: 3
                  first_name: Lucia
                  last_name: Ferrer
                  email: lucia.ferrer@hotel.example
                  national_id: '00000000T'
                  hired_at: '2026-08-14'
                  locale: es
      responses:
        '201':
          description: |
            Empleado dado de alta, con el PIN que se acaba de emitir. **El PIN
            solo aparece aqui**: no vuelve en ninguna consulta posterior.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeProvisioned'
              examples:
                alta:
                  value:
                    employee:
                      uuid: 0199f0c2-1f4a-7c3e-9b21-4d5e6f7a8b90
                      employee_code: E7QK2MXPR
                      first_name: Youssef
                      last_name: Amrani
                      email: null
                      department_id: 3
                      status: active
                      hired_at: '2026-08-14'
                      terminated_at: null
                      locale: es
                      pin_status: issued
                    pin:
                      employee_uuid: 0199f0c2-1f4a-7c3e-9b21-4d5e6f7a8b90
                      pin: '483920'
                      issued_at: '2026-08-14T08:02:11.907Z'
                      pin_status: issued
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/v1/employees/{uuid}:
    parameters:
      - $ref: '#/components/parameters/EmployeeUuid'
    get:
      operationId: getEmployee
      summary: Ficha de un empleado
      tags: [Workforce]
      description: |
        Datos identificativos, adscripcion y situacion laboral de una persona
        (RF-GP-01). El documento de identidad no aparece: solo existe su digest
        (RL-08).

        **Alcance por departamento** (RF-ID-03). Un `responsable_departamento`
        que pide la ficha de alguien de otro departamento recibe `403` —no
        `404`: la persona existe y el problema es de autorizacion— y el intento
        queda en `audit_log` con el `employee_uuid` del recurso y nunca con su
        nombre (RS-05, regla dura 21).
      security:
        - managementToken: ['employees:read']
      responses:
        '200':
          description: Ficha del empleado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Employee'
              examples:
                ficha:
                  value:
                    uuid: 0199f0c2-1f4a-7c3e-9b21-4d5e6f7a8b90
                    employee_code: E7QK2MXPR
                    first_name: Youssef
                    last_name: Amrani
                    email: null
                    department_id: 3
                    status: active
                    hired_at: '2026-08-14'
                    terminated_at: null
                    locale: es
                    pin_status: delivered
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    patch:
      operationId: updateEmployee
      summary: Modificacion de la ficha de un empleado
      description: |
        Cambia los datos que pueden cambiar: nombre, correo, idioma y
        adscripcion a centro y departamento (RF-GP-01).

        **La baja no se hace por aqui.** Pasar a `terminated` es una operacion
        con consecuencias —revoca la credencial y cierra el computo (RN-14)— y
        tiene su propio endpoint, `POST /employees/{uuid}/offboard`. Este
        `PATCH` solo alterna entre `active` y `suspended`.
      tags: [Workforce]
      security:
        - managementToken: ['employees:*']
      requestBody:
        required: true
