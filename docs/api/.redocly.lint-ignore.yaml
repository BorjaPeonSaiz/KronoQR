# Excepciones de `make api-lint`. Una por linea, con motivo, y ninguna generica.
#
# `operation-4xx-response` esta elevada a ERROR en redocly.yaml: todo endpoint
# tiene que documentar como falla, porque un contrato que solo describe el camino
# feliz obliga al cliente a adivinar el otro. Las dos sondas de salud son la
# excepcion legitima:
#
#   /api/v1/health  sonda de VIDA. Si el proceso no puede responder, no responde:
#                   no hay 4xx que documentar. Devolver un 4xx desde una sonda de
#                   vida haria que el orquestador reiniciara el contenedor por un
#                   fallo que no es suyo.
#   /api/v1/ready   sonda de DISPONIBILIDAD. Su unico fallo posible es 503, que es
#                   5xx: el orquestador reintenta, no es un error del cliente.
#
# Este fichero NO se regenera con `--generate-ignore-file` sin leer lo de arriba.
# Si una entrada nueva aparece aqui sin explicacion, es una regla que alguien ha
# apagado en vez de cumplir.
#
# `no-unused-components` avisa de los dos esquemas de seguridad que todavia no
# usa ningun endpoint. Estan declarados a proposito: el §7.3 fija los ambitos de
# TODOS los clientes —quiosco, portal y gestion— y declararlos de una vez es lo
# que impide que cada tarea se invente el suyo. Las dos entradas se BORRAN, no se
# amplian, en cuanto exista el primer endpoint que los use:
#
#   employeeToken     lo estrena `POST /api/v1/me/login` (tarea 1.11)
#   managementToken   lo estrena `POST /api/v1/auth/login` (tarea 1.10)
openapi.yaml:
  operation-4xx-response:
    - '#/paths/~1api~1v1~1health/get/responses'
    - '#/paths/~1api~1v1~1ready/get/responses'
  no-unused-components:
    - '#/components/securitySchemes/employeeToken'
    - '#/components/securitySchemes/managementToken'
