# Requisitos de KronoQR — fuente legible por maquina del Anexo A del documento 01.
#
# GENERADO. No se edita a mano:
#
#     php artisan qa:requisitos           (o el script de la tarea 0.7)
#
# Existe porque el Anexo A es una tabla en prosa, con rangos (`RF-ID-04..09`),
# anotaciones entre parentesis y entradas en negrita. `qa:traceability --check`
# necesita leer su alcance de algo que no haya que interpretar.
#
# El modo de fallo que este fichero evita no es que el comando reviente: es que
# de VERDE por no saber expandir un rango. Asi fue como RF-ID-09 paso
# desapercibido y se quedo sin tarea que lo construyera hasta que lo encontro
# una auditoria manual. Una prueba comprueba que el conjunto de identificadores
# y sus fases no divergen del Anexo A, y otra que el expansor convierte
# RF-ID-04..09 en SEIS identificadores.
#
# `fase` es la del Anexo A. El orden REAL de ejecucion es 0 -> 1 -> 2 -> 5 -> 3
# -> 4, y lo aplica config/quality.php: aqui solo se registra a que fase
# pertenece cada requisito, no cual va antes.

# --- Fase 0 -------------------------------------------- (14 requisitos)
- { id: RNF-M-01,  fase: 0, titulo: "Cobertura de pruebas: ≥ 90 % en la capa de dominio, ≥ 75 % global" }
- { id: RNF-M-02,  fase: 0, titulo: "Análisis estático en nivel máximo (PHPStan/Larastan nivel 9) sin errores suprimidos sin justificar" }
- { id: RNF-M-03,  fase: 0, titulo: "Las dependencias entre módulos se verifican automáticamente" }
- { id: RNF-M-04,  fase: 0, titulo: "Toda decisión arquitectónica relevante queda registrada como ADR versionado en el repositorio" }
- { id: RNF-M-05,  fase: 0, titulo: "Deuda técnica visible: presupuesto máximo del 15 % de cada iteración dedicado a su reducción", verificacion: revision }
- { id: RNF-M-06,  fase: 0, titulo: "El código sigue las convenciones publicadas de cada stack (documento 02, §3.5): PSR-12/PER para PHP, convenciones de Laravel, guía de estilo oficia..." }
- { id: RNF-P-07,  fase: 0, titulo: "Presupuesto de bundle del quiosco" }
- { id: RQ-06,     fase: 0, titulo: "La API está descrita por un contrato OpenAPI y las respuestas se validan contra el esquema en las pruebas" }
- { id: RQ-12,     fase: 0, titulo: "Ninguna funcionalidad se considera terminada sin cumplir la Definición de Terminado del documento 02, §10.3", verificacion: revision }
- { id: RQ-13,     fase: 0, titulo: "Trazabilidad requisito ↔ prueba, verificada por la CI. Cada prueba declara qué requisitos cubre mediante una etiqueta (RF-, RN-, RL-, RS-)" }
- { id: RQ-14,     fase: 0, titulo: "Cobertura por niveles obligatoria según la naturaleza de la funcionalidad, no a criterio de quien la implementa" }
- { id: RS-08,     fase: 0, titulo: "Gestión de secretos fuera del repositorio, con rotación documentada" }
- { id: RS-09,     fase: 0, titulo: "Cabeceras de seguridad completas (HSTS, CSP estricta, X-Content-Type-Options, Referrer-Policy, Permissions-Policy limitando cámara al origen propio)" }
- { id: RS-10,     fase: 0, titulo: "Análisis de dependencias y de código en cada pull request; ninguna vulnerabilidad crítica o alta puede llegar a una versión publicada" }

